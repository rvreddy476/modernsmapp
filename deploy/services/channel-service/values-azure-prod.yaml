# GENERATED by scripts/gen-azure-values.sh from values-prod.yaml — DO NOT hand-edit.
# Azure (prod) overlay of the service 'channel-service': ACR image, nginx ingress,
# azure-key-vault ClusterSecretStore. Re-run the script after editing the AWS values.
service:
  name: channel-service
  port: 8106
image:
  repository: atpostprod454350.azurecr.io/atpost/channel-service
  tag: latest
replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi
externalSecret:
  enabled: true
  remoteKey: atpost-prod-channel-service
  data:
  - secretKey: INTERNAL_SERVICE_KEY
    remoteRef: internal_service_key
  - secretKey: JWT_SECRET
    remoteRef: jwt_secret
  - secretKey: JWT_KID
    remoteRef: jwt_kid
  - secretKey: JWT_SECRET_PREVIOUS
    remoteRef: jwt_secret_previous
  - secretKey: JWT_KID_PREVIOUS
    remoteRef: jwt_kid_previous
    # Admin console: channel-service verifies admin-service's service tokens on
    # /v1/broadcast-channels/internal/admin/*. NOT enabled yet: without it the console's
    # Chat channels routes are refused (401). To enable, in this order:
    #   1. the founder generates admin-service's ed25519 key (one key for
    #      every product): the private half (base64 32-byte seed) and kid go
    #      to admin-service's secret store (admin_service_token_key /
    #      admin_service_token_kid); the public half and the same kid go here
    #      as caller_admin_pubkey / caller_admin_kid;
    #   2. uncomment the two lines below AND the SERVICE_CALLERS lines under env;
    #   3. enable admin-service's two lines (its values file).
    # Setting SERVICE_CALLERS before the key exists refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }
  secretStoreName: azure-key-vault
env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Admin console (see externalSecret above for the order): uncomment
  # together with SERVICE_CALLER_ADMIN_SERVICE_PUBKEY / _KID.
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'chat:stats.read,chat:reports.read,chat:reports.act,chat:channels.moderate'
ingress:
  enabled: false
pdb:
  enabled: true
  minAvailable: 2
