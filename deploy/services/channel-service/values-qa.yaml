# channel-service overrides for QA (AWS ap-south-1, the QA account).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `channel-service`. Secrets by reference only (atpost/qa/channel-service).
# __TF_*__ placeholders come from Terraform outputs.
#
# Communities / broadcast channels are an INVITE-ONLY PILOT behind a named
# moderation owner (plan §3): the allowlists below are EMPTY, which admits
# nobody, and the gateway keeps /v1/communities closed. Fill both lists
# deliberately when the owner exists.
#
# QA (contract 3 Oct 2026): this file is values-prod.yaml with QA DATA only —
# hosts (qa., api-qa., ws-qa., admin-qa., media-qa.cleestudio.com), secret
# atpost/qa/<svc>, IRSA role atpost-qa-<svc>-irsa, ALB groups atpost-qa-*,
# Scylla atpost-qa-client, the QA VPC CIDR, QA JWT issuer/audience, and the
# QA size (one replica, HPA 1..2, no PDB, smaller requests; limits as prod).
# ENV / APP_ENV / DEPLOY_ENV are the PRODUCTION values on purpose: QA runs
# with production semantics (ENV audit, 3 Oct 2026); any other value turns
# on development rules or refuses to boot. Launch switches are prod's.

service:
  name: channel-service
  port: 8106

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/channel-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-qa-channel-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/qa/channel-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Admin console (Chat channels): NOT enabled yet (401 until then). To
    # enable: the founder's ONE admin key (admin-service values, step 1):
    # public half → caller_admin_pubkey, kid → caller_admin_kid; uncomment
    # the two lines below AND the SERVICE_CALLERS lines under env; enable
    # admin-service's two lines. Setting SERVICE_CALLERS first refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  # Invite-only pilot (founder, 2026-09-12): empty admits nobody.
  COMMUNITIES_ALLOWED_CREATORS: ""
  COMMUNITIES_ALLOWED_PARTICIPANTS: ""
  # Admin console (see externalSecret above for the order).
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'chat:stats.read,chat:reports.read,chat:reports.act,chat:channels.moderate'

ingress:
  enabled: false

pdb:
  enabled: false # QA runs one replica: any PDB would block node drains
