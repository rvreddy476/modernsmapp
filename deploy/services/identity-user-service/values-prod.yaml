# identity-user-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `identity-user`. Secrets by reference only (atpost/prod/identity-user-
# service). __TF_*__ placeholders come from Terraform outputs.
#
# PORT 8110 (W4): the Helm values said 8082, which is the APP user-service's
# port; compose, the gateway's privacy-settings route, feed-service and the
# chat policy client all use 8110. Every *_SERVICE_URL that names this
# service now says 8110.

service:
  name: identity-user-service
  port: 8110

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/identity-user-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-identity-user-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/identity-user-service
  data:
    # Aurora `identity_db`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    # Must match auth-service (HS256 verification of its tokens).
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Gates /v1/users/* (the gateway injects this key).
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  # No SCHEMA_MIGRATIONS_* knobs: this service applies its additive setup.sql
  # and then VERIFIES the shared identity base tables (schemaguard), which
  # identity-auth-service provisions. Deploy auth first (plan §6 step 4).

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1
