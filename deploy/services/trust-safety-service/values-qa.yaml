# trust-safety-service overrides for QA (AWS ap-south-1, the QA account).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `trust-safety-service`. Secrets by reference only (atpost/qa/trust-
# safety-service). __TF_*__ placeholders come from Terraform outputs.
#
# QA (contract 3 Oct 2026): this file is values-prod.yaml with QA DATA only —
# hosts (qa., api-qa., ws-qa., admin-qa., media-qa.cleestudio.com), secret
# atpost/qa/<svc>, IRSA role atpost-qa-<svc>-irsa, ALB groups atpost-qa-*,
# Scylla atpost-qa-client, the QA VPC CIDR, QA JWT issuer/audience, and the
# QA size (one replica, HPA 1..2, no PDB, smaller requests; limits as prod).
# ENV / APP_ENV / DEPLOY_ENV are the PRODUCTION values on purpose: QA runs
# with production semantics (ENV audit, 3 Oct 2026); any other value turns
# on development rules or refuses to boot. Launch switches are prod's.

service:
  name: trust-safety-service
  port: 8091

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/trust-safety-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-qa-trust-safety-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/qa/trust-safety-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Moderation capability keys: ISSUED here, VERIFIED by post-service —
    # byte-identical to post-service's secret (the seeder writes one value
    # to both). POST_RESTRICTION_HMAC_KEY: case-specific holds (phase 3).
    - { secretKey: STORY_MODERATION_HMAC_KEY, remoteRef: story_moderation_hmac_key }
    - { secretKey: STORY_MODERATION_BLOCKLIST, remoteRef: story_moderation_blocklist }
    - { secretKey: POST_MODERATION_HMAC_KEY, remoteRef: post_moderation_hmac_key }
    - { secretKey: POST_RESTRICTION_HMAC_KEY, remoteRef: post_restriction_hmac_key }
    # trust-safety's OWN ed25519 service token (calls post-service's
    # restrictions route); the public half is registered with post-service.
    - { secretKey: TRUST_SAFETY_SERVICE_TOKEN_KEY, remoteRef: trust_safety_service_token_key }
    - { secretKey: TRUST_SAFETY_SERVICE_TOKEN_KID, remoteRef: trust_safety_service_token_kid }
    # post-service's PUBLIC key (publication standing, P-5).
    - { secretKey: SERVICE_CALLER_POST_SERVICE_PUBKEY, remoteRef: caller_post_pubkey }
    - { secretKey: SERVICE_CALLER_POST_SERVICE_KID, remoteRef: caller_post_kid }
    # Admin console (Trust & safety): NOT enabled yet (401 until then). To
    # enable: the founder's ONE admin key (admin-service values, step 1):
    # public half → caller_admin_pubkey, kid → caller_admin_kid; uncomment
    # the two lines below AND add admin-service to SERVICE_CALLERS with its
    # OPS line; enable admin-service's two lines.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  STORY_MODERATION_POLICY_VERSION: story-keyword-v1
  POST_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  # Callers whose service tokens trust-safety verifies.
  SERVICE_CALLERS: 'post-service'
  SERVICE_CALLER_POST_SERVICE_OPS: 'trust_safety:standing.read'
  # Admin console (see externalSecret above): then SERVICE_CALLERS becomes
  # 'post-service,admin-service' and this OPS line is uncommented.
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'trust_safety:stats.read,trust_safety:reports.read,trust_safety:reports.act,trust_safety:appeals.read,trust_safety:appeals.act,trust_safety:grievances.read,trust_safety:grievances.act,trust_safety:strikes.read,trust_safety:strikes.manage,trust_safety:verification.review,trust_safety:media_labels.read,trust_safety:keyword_filters.read,trust_safety:audit.read,trust_safety:copyright.act'
  # Block/relationship facts (default is the compose name).
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083

ingress:
  enabled: false

pdb:
  enabled: false # QA runs one replica: any PDB would block node drains
