# payments-service overrides for the staging environment.
#
# The atpost-service chart owns Deployment / Service / SA / ESO /
# HPA / PDB / ServiceMonitor. Anything not listed here inherits the
# chart default. CI rewrites image.tag on every push to main; never
# hand-edit it.

service:
  name: payments-service
  port: 8102

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/payments-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-staging-payments-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/staging/payments-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }

    # Commerce P0 M-10. The placeholder comment that used to sit here is
    # exactly what the review found: the service cannot boot without these,
    # so the payment path had never run in a deployed environment.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }

    # PSP credentials. Staging uses Razorpay TEST keys — still real
    # credentials, still belong in Secrets Manager.
    - { secretKey: RAZORPAY_KEY_ID, remoteRef: razorpay_key_id }
    - { secretKey: RAZORPAY_KEY_SECRET, remoteRef: razorpay_key_secret }
    - { secretKey: RAZORPAY_WEBHOOK_SECRET, remoteRef: razorpay_webhook_secret }

    # A2 caller allowlist — public keys only.
    - { secretKey: SERVICE_CALLER_COMMERCE_SERVICE_PUBKEY, remoteRef: caller_commerce_pubkey }
    - { secretKey: SERVICE_CALLER_COMMERCE_SERVICE_KID, remoteRef: caller_commerce_kid }
    - { secretKey: SERVICE_CALLER_FOOD_SERVICE_PUBKEY, remoteRef: caller_food_pubkey }
    - { secretKey: SERVICE_CALLER_FOOD_SERVICE_KID, remoteRef: caller_food_kid }
    # dating-service (migration 011) is NOT enabled yet. Enable in this order:
    # store caller_dating_pubkey / caller_dating_kid in Secrets Manager,
    # uncomment the two lines below, then add dating-service to SERVICE_CALLERS.
    # Enabling first fails the secret sync and the boot refuses, taking commerce
    # and food payments down too.
    # - { secretKey: SERVICE_CALLER_DATING_SERVICE_PUBKEY, remoteRef: caller_dating_pubkey }
    # - { secretKey: SERVICE_CALLER_DATING_SERVICE_KID, remoteRef: caller_dating_kid }
    # rider-service (Mopedu, migration 012) is NOT enabled yet. Same order as
    # dating-service: store caller_rider_pubkey / caller_rider_kid in Secrets
    # Manager, uncomment the two lines below, then add rider-service to
    # SERVICE_CALLERS. Enabling first fails the secret sync and the boot refuses.
    # - { secretKey: SERVICE_CALLER_RIDER_SERVICE_PUBKEY, remoteRef: caller_rider_pubkey }
    # - { secretKey: SERVICE_CALLER_RIDER_SERVICE_KID, remoteRef: caller_rider_kid }
    # admin-service (admin console, /v1/payments/internal/admin/* only) is NOT
    # enabled yet: the console's Payments routes are refused (401). It holds
    # admin permissions only, no REFTYPES and no APPLICATIONS; the money routes
    # refuse its tokens whatever it holds. To enable, in this order:
    #   1. the founder generates admin-service's ed25519 key (one key for every
    #      product): the private half and kid go to admin-service's secret
    #      store (admin_service_token_key / admin_service_token_kid); the public
    #      half and the same kid go here as caller_admin_pubkey / caller_admin_kid;
    #   2. uncomment the two lines below AND SERVICE_CALLER_ADMIN_SERVICE_OPS
    #      under env;
    #   3. add admin-service to SERVICE_CALLERS under env;
    #   4. enable admin-service's two lines (its values file).
    # WARNING: adding admin-service to SERVICE_CALLERS before its secrets exist
    # fails the secret sync and main.go refuses to boot a caller with no KID or
    # PUBKEY — taking commerce and food payments down too.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: staging
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

  # A2. Staging carries the SAME allowlist as production, deliberately: the
  # authorization boundary is one of the things staging exists to exercise,
  # and a looser staging teaches the wrong lesson.
  # dating-service joins this list only after its secrets exist (see above).
  SERVICE_CALLERS: 'commerce-service,food-service'
  SERVICE_CALLER_COMMERCE_SERVICE_OPS: 'payments:intent.create,payments:intent.read,payments:refund.create,payments:payment.fetch'
  SERVICE_CALLER_COMMERCE_SERVICE_REFTYPES: 'order'
  SERVICE_CALLER_FOOD_SERVICE_OPS: 'payments:intent.create,payments:intent.read,payments:refund.create'
  SERVICE_CALLER_FOOD_SERVICE_REFTYPES: 'food_order'
  SERVICE_CALLER_DATING_SERVICE_OPS: 'payments:intent.create,payments:intent.read,payments:refund.create'
  SERVICE_CALLER_DATING_SERVICE_REFTYPES: 'dating_premium'
  # Migration 010 — the applications (products) each caller may open payments for.
  SERVICE_CALLER_COMMERCE_SERVICE_APPLICATIONS: 'mstore'
  SERVICE_CALLER_FOOD_SERVICE_APPLICATIONS: 'feast'
  SERVICE_CALLER_DATING_SERVICE_APPLICATIONS: 'dating'
  # rider-service (Mopedu, migration 012; see externalSecret above for the
  # order). Uncomment with its secrets, then add rider-service to
  # SERVICE_CALLERS. `mopedu` is seeded by 012.
  # SERVICE_CALLER_RIDER_SERVICE_OPS: 'payments:intent.create,payments:intent.read,payments:refund.create'
  # SERVICE_CALLER_RIDER_SERVICE_REFTYPES: 'mopedu_ride'
  # SERVICE_CALLER_RIDER_SERVICE_APPLICATIONS: 'mopedu'
  # admin-service (see externalSecret above for the order). SERVICE_CALLERS
  # above stays unchanged until step 3: then it becomes
  # 'commerce-service,food-service,admin-service' (plus dating-service and
  # rider-service if enabled).
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'payments:stats.read,payments:refunds.read,payments:refund.issue,payments:intents.read,payments:reconciliation.read,payments:applications.read,payments:applications.manage,payments:audit.read'

  PAYMENTS_RECONCILE_INTERVAL_SEC: '60'
  PAYMENTS_PENDING_AGE_SEC: '300'
  # Add per-service inter-service URLs here. Common ones:
  #   USER_SERVICE_URL:  http://user-service.atpost.svc.cluster.local:8082
  #   GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  #   POST_SERVICE_URL:  http://post-service.atpost.svc.cluster.local:8084
  #   MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087

# Internal-only — api-gateway is the external surface.
ingress:
  enabled: false
