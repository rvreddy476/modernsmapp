# post-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `post-service`. Secrets by reference only (atpost/prod/post-service).
# __TF_*__ placeholders come from Terraform outputs.

service:
  name: post-service
  port: 8084

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/post-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

# Lean first stage: two copies, autoscaling on CPU.
replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-post-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/post-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Moderation capability HMAC keys: ISSUED by trust-safety-service,
    # VERIFIED here; byte-identical in both secrets (>= 32 bytes or boot
    # refuses). POST_RESTRICTION_HMAC_KEY (case-specific holds, phase 3)
    # was missing from these values — added (audit finding 5).
    - { secretKey: STORY_MODERATION_HMAC_KEY, remoteRef: story_moderation_hmac_key }
    - { secretKey: STORY_MODERATION_HMAC_KEY_PREVIOUS, remoteRef: story_moderation_hmac_key_previous }
    - { secretKey: POST_MODERATION_HMAC_KEY, remoteRef: post_moderation_hmac_key }
    - { secretKey: POST_MODERATION_HMAC_KEY_PREVIOUS, remoteRef: post_moderation_hmac_key_previous }
    - { secretKey: POST_RESTRICTION_HMAC_KEY, remoteRef: post_restriction_hmac_key }
    # Publication standing (P-5): post-service asks trust-safety with ITS OWN
    # ed25519 service token; without the key EVERY publish answers 503. The
    # private seed + kid live here; the public half is registered with
    # trust-safety-service (caller_post_pubkey / caller_post_kid). Was
    # missing from these values — added (audit finding 5).
    - { secretKey: POST_SERVICE_TOKEN_KEY, remoteRef: post_service_token_key }
    - { secretKey: POST_SERVICE_TOKEN_KID, remoteRef: post_service_token_kid }
    # trust-safety-service calls /v1/posts/internal restrictions with its own
    # token (post:restrictions.read): its PUBLIC key is registered here.
    - { secretKey: SERVICE_CALLER_TRUST_SAFETY_SERVICE_PUBKEY, remoteRef: caller_trust_safety_pubkey }
    - { secretKey: SERVICE_CALLER_TRUST_SAFETY_SERVICE_KID, remoteRef: caller_trust_safety_kid }
    # Admin console (Social and Tube): NOT enabled yet (401 until then). To
    # enable: the founder's ONE admin key (admin-service values, step 1):
    # public half → caller_admin_pubkey, kid → caller_admin_kid; uncomment
    # the two lines below AND add admin-service to SERVICE_CALLERS with its
    # OPS line; enable admin-service's two lines.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  # Copyright title review (post-service migration 073): long videos over 20
  # minutes naming a catalogue title are published held for review. "false"
  # is the kill switch (no new holds; existing holds stay until decided).
  COPYRIGHT_TITLE_HOLD_ENABLED: "true"
  # Owner-registered auto-block (migration 075): false sends auto_block matches to a reviewer.
  COPYRIGHT_AUTO_BLOCK_ENABLED: "true"
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

  # ── Managed stores ────────────────────────────────────────────────────────
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  # Scylla on EKS (operator-managed client Service; terraform output
  # scylla_client_service). Keyspaces: deploy/scylla/ applies schema.prod.cql.
  SCYLLA_HOSTS: atpost-prod-client.scylla.svc.cluster.local

  # Account control: identity-topic consumer + purge acks.
  IDENTITY_KAFKA_TOPIC: identity.events.v1
  PURGE_ACKS_TOPIC: platform.purge-acks.v1
  # POST_PURGE_AFTER / POST_PURGE_INTERVAL unset: production defaults (30 d
  # restore window, 5 min tick). MAX_POSTS_PER_HOUR/DAY unset: production
  # defaults (20/hour, 50/day).

  # ── Peers ────────────────────────────────────────────────────────────────
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  # Action button (2026-10-23): eligibility reads account age and email
  # verified from identity (strikes from trust-safety's standing route).
  AUTH_SERVICE_URL: http://identity-auth-service.atpost.svc.cluster.local:8081
  IDENTITY_USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  # In-app links: no safety lookup for these domains (and subdomains).
  ACTION_LINK_OWN_DOMAINS: 'cleestudio.com'
  # Safety check: Google Web Risk. WEB_RISK_API_KEY is a secret; until it is
  # provisioned every NEW Action button answers 503
  # ACTION_LINK_CHECK_UNAVAILABLE here (production never stores an unchecked
  # link) and the daily recheck does not run. To enable: put the key in this
  # service's secret store as web_risk_api_key and add to externalSecret.data
  #   - { secretKey: WEB_RISK_API_KEY, remoteRef: web_risk_api_key }
  # (not added yet: a remoteRef missing from the store fails the secret sync).
  # WEB_RISK_MOCK and ACTION_LINK_MIN_ACCOUNT_AGE_HOURS stay unset (dev only).
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  # The APP user-service owns usernames (@mention resolution, by-owner).
  APP_USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  # Visible view counts: analytics-service's display view.
  ANALYTICS_SERVICE_URL: http://analytics-service.atpost.svc.cluster.local:8094
  # Publication standing (P-5).
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  # Reviewer programme is OFF at launch (no reviewer-service deployed):
  # REVIEWER_SERVICE_URL unset, nothing is routed to review.
  REVIEW_ALL_VIDEOS: "false"

  # Callers whose service tokens post-service verifies.
  SERVICE_CALLERS: 'trust-safety-service'
  # Security sweep #11 (21 Oct 2026): every /v1/posts/internal WRITE needs a
  # signed token from its one caller. trust-safety sends the copyright hold
  # commands (post:restrictions.write) and the appeal overturn
  # (post:moderation.write) with the same TRUST_SAFETY_SERVICE_TOKEN_KEY.
  # reviewer-service (review-status / visibility) is not deployed here.
  SERVICE_CALLER_TRUST_SAFETY_SERVICE_OPS: 'post:restrictions.read,post:restrictions.write,post:moderation.write'
  # Admin console (see externalSecret above): then SERVICE_CALLERS becomes
  # 'trust-safety-service,admin-service' and this OPS line is uncommented.
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'social:stats.read,social:posts.moderate,social:posts.remove,social:reels.moderate,social:reels.remove,social:comments.moderate,social:comments.remove,social:reports.act,social:users.read,tube:stats.read,tube:videos.moderate,tube:videos.remove,tube:channels.moderate,tube:reports.act'
  # Migration runner: new files under database/migrations/ apply on boot.
  SCHEMA_MIGRATIONS_BASELINE: "false"
  # Author cards, birth dates (age gates) and creator monetization (defaults
  # are compose names).
  PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  MONETIZATION_SERVICE_URL: http://monetization-service.atpost.svc.cluster.local:8099

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

# post-service migrations reference tables owned by other services:
#   media_assets     -> media-service   (003_content_type_reel_video.sql)
#   user_preferences -> feed-service    (009_crosspost_v2.sql)
#   users            -> user-service    (010_postbook_features.sql)
schemaDependencies:
  - media_assets
  - user_preferences
  - users

# Alert rules (lv-21, 18 Nov 2026): the schedule publisher, the review gate's
# pending videos, the outbox relay and the dead letters. The SAME list is in
# values-prod.yaml and values-qa.yaml (render_test.sh and
# internal/postschedule/deploy_values_test.go check it). The chart adds
# source=atpost-service and service=post-service, which the Alertmanager
# route sends to the ops e-mail. Every replica runs the same workers over the
# same tables, so the gauges are equal on every pod: max, never sum.
# media.events dead letters (group post-service-media-transcode) are alerted
# by media-service's MediaEventsDeadLettered; the rule here covers the rest.
prometheusRule:
  enabled: true
  rules:
    # A scheduled post past publish_at that is publishable (no video, or its
    # video is ready) and still not live. The worker ticks every 30 s.
    # internal/postschedule/metrics.go.
    - alert: PostScheduledPublishOverdue
      expr: max(atpost_post_service_scheduled_oldest_overdue_seconds{state="due"}) > 600
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: A scheduled post is more than 10 minutes late going live
        description: "The schedule worker is failing (sum by (result) (rate(atpost_post_service_scheduled_posts_total[15m]))) or behind. Logs: 'post schedule:' on post-service. A held video is not counted here (state held_video)."
    # A video post still pending its review gate 12 h after upload: longer
    # than a 4 h encode plus the 6 h long-queue alert. The gauge is set at the
    # end of each sweep pass. internal/videogate/videogate.go.
    - alert: PostVideoPendingTooLong
      expr: max(post_video_gate_oldest_pending_seconds) > 43200
      for: 30m
      labels: { severity: warning }
      annotations:
        summary: A video post has waited more than 12 hours for its transcode or review verdict
        description: "The transcode is stuck or failed without its result reaching post-service. Check media-service's transcode alerts and media.events.dlq (docs/runbooks/dlq-replay.md); sum by (outcome) (rate(post_video_gate_sweep_posts_total[1h]))."
    # Outbox rows (PostCreated, the fan-out's trigger, among them) not
    # reaching Kafka. internal/service/outbox_metrics.go.
    - alert: PostOutboxRelayStuck
      expr: max(atpost_post_service_outbox_oldest_unpublished_seconds) > 300
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: post-service outbox events are more than 5 minutes late reaching Kafka
        description: "Kafka refuses the writes or the rows cannot be marked. Feeds, search and subscriber notifications wait. sum by (result) (rate(atpost_post_service_outbox_events_total[5m])); logs 'outbox:'."
    # Any other post-service consumer dead-lettered a message. A count, not a
    # depth: the second clause catches a pod's first dead letter (the series
    # appears at 1, which increase() alone does not see).
    - alert: PostEventsDeadLettered
      expr: |-
        (sum by (topic, consumer_group) (increase(atpost_post_service_kafka_dlq_messages_total{consumer_group!="post-service-media-transcode"}[30m])) > 0)
        or
        (count by (topic, consumer_group) (atpost_post_service_kafka_dlq_messages_total{consumer_group!="post-service-media-transcode"} unless atpost_post_service_kafka_dlq_messages_total offset 30m) > 0)
      for: 0m
      labels: { severity: warning }
      annotations:
        summary: post-service dead-lettered a message
        description: "The message is on <topic>.dlq with its error. List it and replay it after the fix with dlq-replay (docs/runbooks/dlq-replay.md)."
