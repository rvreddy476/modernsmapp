# feed-service overrides for QA (AWS ap-south-1, the QA account).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `feed-service`. Secrets by reference only (atpost/qa/feed-service).
# __TF_*__ placeholders come from Terraform outputs.
#
# QA (contract 3 Oct 2026): this file is values-prod.yaml with QA DATA only —
# hosts (qa., api-qa., ws-qa., admin-qa., media-qa.cleestudio.com), secret
# atpost/qa/<svc>, IRSA role atpost-qa-<svc>-irsa, ALB groups atpost-qa-*,
# Scylla atpost-qa-client, the QA VPC CIDR, QA JWT issuer/audience, and the
# QA size (one replica, HPA 1..2, no PDB, smaller requests; limits as prod).
# ENV / APP_ENV / DEPLOY_ENV are the PRODUCTION values on purpose: QA runs
# with production semantics (ENV audit, 3 Oct 2026); any other value turns
# on development rules or refuses to boot. Launch switches are prod's.

service:
  name: feed-service
  port: 8086

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/feed-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-qa-feed-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/qa/feed-service
  data:
    # Aurora `app`. feed-service OWNS user_preferences (tier 1: deploy before
    # post-service).
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  SCYLLA_HOSTS: atpost-qa-client.scylla.svc.cluster.local # terraform output scylla_client_service
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  POST_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  # Close-friends ("trusted") fanout reads the IDENTITY user-service (8110).
  USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  # Viewer's self-service filter keywords (hidden posts).
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  # Visible view count on every hydrated post.
  ANALYTICS_SERVICE_URL: http://analytics-service.atpost.svc.cluster.local:8094
  # Account control: identity-topic consumer + purge acks.
  IDENTITY_KAFKA_TOPIC: identity.events.v1
  PURGE_ACKS_TOPIC: platform.purge-acks.v1
  # Timeline post index (F-24/F-28). No ALLOW FILTERING table scans: a post
  # with no index rows is not looked for (the code default; explicit here).
  # Legacy unsharded index still read until timeline-maintenance --apply has
  # run (deploy/jobs/timeline-maintenance/run.sh), then set "false".
  FEED_HF4_FALLBACK: "false"
  FEED_INDEX_LEGACY_READ: "true"
  # Share of a ranked For You page given to posts from people the viewer
  # does not follow (feed-service internal/service/discovery.go). 0 = off.
  FEED_DISCOVERY_SHARE: "0.2"

ingress:
  enabled: false

pdb:
  enabled: false # QA runs one replica: any PDB would block node drains

# Feed alerts (metrics: Architecture/services/feed-service/internal/service/
# metrics.go and the shared Kafka consumer, Architecture/shared/o11y/metrics/
# kafka.go). Thresholds are starting points; tune them against the k6
# scenarios in docs/production-readiness/FEED_AUDIT.md. values-qa.yaml carries
# the same rules: keep the two lists identical.
#
# The feed consumer retries a failed event until it succeeds (feed-06), so an
# outage of Scylla, Postgres, graph-service or post-service shows as a stalled
# consumer and growing lag, NOT as dead letters. Three signals cover it:
#
#   FeedConsumerStalled      every attempt fails and nothing succeeds. Built
#                            from two counters that exist today
#                            (kafka_messages_errors_total goes up on every
#                            failed attempt, at least once per 32 s while an
#                            event is retried; kafka_messages_processed_total
#                            does not move). This is the outage alert.
#   FeedConsumerLagHigh /    the lag gauge the consumer exports. LIMIT: the
#   FeedConsumerLagCritical  gauge is kafka-go's reader lag (high watermark
#                            minus the last FETCHED offset, set when a fetch
#                            returns, shared/kafka/consumer.go reportLag). A
#                            stalled handler stops fetching after 100 queued
#                            messages, so the gauge freezes at its last value
#                            and does not grow during a full stall. It is
#                            right for a consumer that is slow but moving.
#   FeedEventRetryStuck      INERT until shared/kafka exports
#                            atpost_feed_service_kafka_message_retry_age_seconds
#                            {topic, consumer_group} (seconds since the first
#                            failed attempt of the event now being retried, 0
#                            when none). The metric does not exist yet; the
#                            rule never fires until it does.
#
# Consumer groups: feed-service-group reads social.events.v1,
# feed-service-qa-group reads qa-events (feed-service cmd/server/main.go).
# Dead letters still happen for events that can never succeed (malformed,
# refused with 400/413/414/422): FeedEventsDeadLettered stays.
prometheusRule:
  enabled: true
  rules:
    # Pages are being filtered without a fresh keyword answer from
    # trust-safety (keywordfilter.go, 17 Nov 2026): viewers get their last
    # known keywords, and a viewer with none known gets no keyword filter.
    # The feed stays up, so this is the only signal that it is degraded.
    - alert: FeedKeywordFilterFallback
      expr: sum(rate(atpost_feed_service_keyword_filter_fallback_total[5m])) > 0
      for: 10m
      labels: { severity: warning }
      annotations:
        summary: The feed cannot read keyword filters from trust-safety and is using last known values
        description: trust-safety-service is unreachable or refusing feed-service (check its health and the internal key). Viewers keep their last known filter keywords; a viewer with none known sees posts their keywords would hide. The source label says which.
    - alert: FeedConsumerStalled
      expr: |-
        (sum by (consumer_group, topic) (increase(atpost_feed_service_kafka_messages_errors_total{consumer_group=~"feed-service-group|feed-service-qa-group"}[3m])) > 0)
        unless
        (sum by (consumer_group, topic) (increase(atpost_feed_service_kafka_messages_processed_total{consumer_group=~"feed-service-group|feed-service-qa-group"}[3m])) > 0)
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: A feed consumer has been retrying an event for more than 5 minutes with no success
        description: The consumer group in the alert is stuck on one event; every later event waits behind it, so new posts, deletes and unfollows do not reach feeds. A dependency is down (Scylla, Postgres, graph-service, post-service). The feed-service log line "retrying message" carries the error.
    - alert: FeedEventRetryStuck
      # Depends on a metric the Go code does not export yet (see the comment
      # above). Remove FeedConsumerStalled once this one is proven.
      expr: max by (consumer_group, topic) (atpost_feed_service_kafka_message_retry_age_seconds{consumer_group=~"feed-service-group|feed-service-qa-group"}) > 300
      for: 1m
      labels: { severity: critical }
      annotations:
        summary: A feed event has been retried for more than 5 minutes
        description: Same meaning as FeedConsumerStalled, measured directly. The feed-service log line "retrying message" carries the error.
    - alert: FeedConsumerLagHigh
      expr: max by (consumer_group, topic) (atpost_feed_service_kafka_consumer_lag{consumer_group=~"feed-service-group|feed-service-qa-group"}) > 1000
      for: 10m
      labels: { severity: warning }
      annotations:
        summary: A feed consumer has been more than 1,000 events behind for 10 minutes
        description: New posts, deletes and unfollows are reaching feeds late. Check fan-out duration and Scylla/graph health. The gauge does not grow during a full stall (see FeedConsumerStalled).
    - alert: FeedConsumerLagCritical
      expr: max by (consumer_group, topic) (atpost_feed_service_kafka_consumer_lag{consumer_group=~"feed-service-group|feed-service-qa-group"}) > 1000
      for: 30m
      labels: { severity: critical }
      annotations:
        summary: A feed consumer has been more than 1,000 events behind for 30 minutes
        description: Feeds are stale. The consumer is not catching up; check fan-out duration, Scylla and graph-service, and whether FeedConsumerStalled is also firing.
    - alert: FeedEventsDeadLettered
      expr: sum(increase(atpost_feed_service_kafka_dlq_messages_total[15m])) > 0
      for: 0m
      labels: { severity: ticket }
      annotations:
        summary: feed-service parked events on social.events.v1.dlq
        description: An event that can never succeed (malformed, or refused by a dependency with 400/413/414/422) was dead-lettered. Inspect the x-dlq-error header. An outage does NOT land here; see FeedConsumerStalled.
    - alert: FeedFanoutIncomplete
      expr: sum(rate(atpost_feed_service_fanout_incomplete_total[10m])) / clamp_min(sum(rate(atpost_feed_service_fanout_duration_seconds_count[10m])), 1e-9) > 0.05
      for: 15m
      labels: { severity: ticket }
      annotations:
        summary: More than 5% of feed fan-outs are failing and being retried
        description: Graph-, profile- or post-service lookups or Scylla writes are failing during fan-out.
    - alert: FeedRankerFallingBack
      expr: sum(rate(atpost_feed_service_rank_fallback_total{surface="home"}[10m])) / clamp_min(sum(rate(atpost_feed_service_http_requests_total{path="/v1/feed/home"}[10m])), 1e-9) > 0.10
      for: 15m
      labels: { severity: ticket }
      annotations:
        summary: Over 10% of home pages are served unranked
        description: The ranker is failing or exceeding its 20 ms budget (Redis signal loads). Pages fall back to chronological order.
    - alert: FeedHydrationFailing
      expr: sum(rate(atpost_feed_service_hydration_failures_total[5m])) > 0.5
      for: 10m
      labels: { severity: page }
      annotations:
        summary: Feed hydration is failing (users see HYDRATION_FAILED)
        description: post-service batch, graph privacy checks or trust-safety keyword lookups are failing.
    - alert: FeedHomeLatencyHigh
      expr: histogram_quantile(0.95, sum by (le) (rate(atpost_feed_service_http_request_duration_seconds_bucket{path="/v1/feed/home"}[10m]))) > 0.2
      for: 15m
      labels: { severity: ticket }
      annotations:
        summary: Home feed p95 above the 200 ms target
        description: See the per-dependency breakdown in traces; hydration and graph calls dominate.
