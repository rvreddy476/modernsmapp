# feed-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `feed-service`. Secrets by reference only (atpost/prod/feed-service).
# __TF_*__ placeholders come from Terraform outputs.

service:
  name: feed-service
  port: 8086

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/feed-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-feed-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/feed-service
  data:
    # Aurora `app`. feed-service OWNS user_preferences (tier 1: deploy before
    # post-service).
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  SCYLLA_HOSTS: atpost-prod-client.scylla.svc.cluster.local # terraform output scylla_client_service
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  POST_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  # Close-friends ("trusted") fanout reads the IDENTITY user-service (8110).
  USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  # Viewer's self-service filter keywords (hidden posts).
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  # Visible view count on every hydrated post.
  ANALYTICS_SERVICE_URL: http://analytics-service.atpost.svc.cluster.local:8094
  # Account control: identity-topic consumer + purge acks.
  IDENTITY_KAFKA_TOPIC: identity.events.v1
  PURGE_ACKS_TOPIC: platform.purge-acks.v1
  # Timeline post index (F-24/F-28). No ALLOW FILTERING table scans: a post
  # with no index rows is not looked for (the code default; explicit here).
  # Legacy unsharded index still read until timeline-maintenance --apply has
  # run (deploy/jobs/timeline-maintenance/run.sh), then set "false".
  FEED_HF4_FALLBACK: "false"
  FEED_INDEX_LEGACY_READ: "true"
  # Share of a ranked For You page given to posts from people the viewer
  # does not follow (feed-service internal/service/discovery.go). 0 = off.
  FEED_DISCOVERY_SHARE: "0.2"

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1

# Feed alerts (metrics: Architecture/services/feed-service/internal/service/
# metrics.go and the shared Kafka consumer). Thresholds are starting points;
# tune them against the k6 scenarios in docs/production-readiness/FEED_AUDIT.md.
prometheusRule:
  enabled: true
  rules:
    - alert: FeedConsumerLagHigh
      expr: max by (consumer_group) (atpost_feed_service_kafka_consumer_lag{consumer_group="feed-service-group"}) > 10000
      for: 10m
      labels: { severity: page }
      annotations:
        summary: feed-service is more than 10k social events behind
        description: New posts, deletes and unfollows are reaching feeds late. Check fan-out duration and Scylla/graph health.
    - alert: FeedEventsDeadLettered
      expr: sum(increase(atpost_feed_service_kafka_dlq_messages_total[15m])) > 0
      for: 0m
      labels: { severity: ticket }
      annotations:
        summary: feed-service parked events on social.events.v1.dlq
        description: An event failed every retry. Inspect the x-dlq-error header and replay once fixed.
    - alert: FeedFanoutIncomplete
      expr: sum(rate(atpost_feed_service_fanout_incomplete_total[10m])) / clamp_min(sum(rate(atpost_feed_service_fanout_duration_seconds_count[10m])), 1e-9) > 0.05
      for: 15m
      labels: { severity: ticket }
      annotations:
        summary: More than 5% of feed fan-outs are failing and being retried
        description: Graph-, profile- or post-service lookups or Scylla writes are failing during fan-out.
    - alert: FeedRankerFallingBack
      expr: sum(rate(atpost_feed_service_rank_fallback_total{surface="home"}[10m])) / clamp_min(sum(rate(atpost_feed_service_http_requests_total{path="/v1/feed/home"}[10m])), 1e-9) > 0.10
      for: 15m
      labels: { severity: ticket }
      annotations:
        summary: Over 10% of home pages are served unranked
        description: The ranker is failing or exceeding its 20 ms budget (Redis signal loads). Pages fall back to chronological order.
    - alert: FeedHydrationFailing
      expr: sum(rate(atpost_feed_service_hydration_failures_total[5m])) > 0.5
      for: 10m
      labels: { severity: page }
      annotations:
        summary: Feed hydration is failing (users see HYDRATION_FAILED)
        description: post-service batch, graph privacy checks or trust-safety keyword lookups are failing.
    - alert: FeedHomeLatencyHigh
      expr: histogram_quantile(0.95, sum by (le) (rate(atpost_feed_service_http_request_duration_seconds_bucket{path="/v1/feed/home"}[10m]))) > 0.2
      for: 15m
      labels: { severity: ticket }
      annotations:
        summary: Home feed p95 above the 200 ms target
        description: See the per-dependency breakdown in traces; hydration and graph calls dominate.
