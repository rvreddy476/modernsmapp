# notification-service overrides for QA (AWS ap-south-1, the QA account).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `notification-service`. Secrets by reference only (atpost/qa/
# notification-service). __TF_*__ placeholders come from Terraform outputs.
#
# QA (contract 3 Oct 2026): this file is values-prod.yaml with QA DATA only —
# hosts (qa., api-qa., ws-qa., admin-qa., media-qa.cleestudio.com), secret
# atpost/qa/<svc>, IRSA role atpost-qa-<svc>-irsa, ALB groups atpost-qa-*,
# Scylla atpost-qa-client, the QA VPC CIDR, QA JWT issuer/audience, and the
# QA size (one replica, HPA 1..2, no PDB, smaller requests; limits as prod).
# ENV / APP_ENV / DEPLOY_ENV are the PRODUCTION values on purpose: QA runs
# with production semantics (ENV audit, 3 Oct 2026); any other value turns
# on development rules or refuses to boot. Launch switches are prod's.

service:
  name: notification-service
  port: 8088

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/notification-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-qa-notification-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/qa/notification-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    # Realtime tokens: rider and food mint them, notification verifies them.
    # One shared key (falls back to INTERNAL_SERVICE_KEY when absent), so all
    # three mount it or none does.
    - { secretKey: REALTIME_TOKEN_SECRET, remoteRef: realtime_token_secret }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # FCM push (Firebase HTTP v1). FCM_SERVICE_ACCOUNT_KEY accepts the
    # service-account JSON INLINE (main.go: inline JSON or a file path), so
    # the production google service-account JSON goes into the secret as a
    # string; no file mount. Both blank = push disabled (and then
    # CALL_PUSH_REQUIRED must stay false).
    - { secretKey: FCM_PROJECT_ID, remoteRef: fcm_project_id }
    - { secretKey: FCM_SERVICE_ACCOUNT_KEY, remoteRef: fcm_service_account_key }
    # Transactional email over the SES SMTP interface (the service speaks
    # SMTP, not the SES API). SMTP credentials are derived from an IAM user
    # with ses:SendRawEmail (W1/W3). Blank SMTP_HOST below would mean the
    # NoopMailer: no mail, silently.
    - { secretKey: SMTP_USERNAME, remoteRef: smtp_username }
    - { secretKey: SMTP_PASSWORD, remoteRef: smtp_password }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  SCYLLA_HOSTS: atpost-qa-client.scylla.svc.cluster.local # terraform output scylla_client_service
  # SES SMTP endpoint for ap-south-1 (STARTTLS on 587).
  SMTP_HOST: email-smtp.ap-south-1.amazonaws.com
  SMTP_PORT: "587"
  SMTP_FROM_NAME: Momentum
  SMTP_FROM_ADDR: no-reply@qa.cleestudio.com
  # CALL-LB-4B, machine-enforced by notification-service's manifest test:
  # CALLS_ENABLED may not be "true" in chat-call-service values unless
  # CALL_PUSH_REQUIRED is "true" here AND FCM is configured. Calls are off at
  # launch (plan §3), so this stays false.
  CALL_PUSH_REQUIRED: "false"
  # Tube channel subscriptions live in post-service.
  POST_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  SUBSCRIBERS_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  # Dating lane D8 panic paging: dating is closed at the edge at launch, so
  # the responder list is empty on purpose (every panic raises a critical
  # ops alert instead). DECISION PENDING: name the responder before dating
  # opens.
  DATING_SERVICE_URL: http://dating-service.atpost.svc.cluster.local:8112
  IDENTITY_AUTH_URL: http://identity-auth-service.atpost.svc.cluster.local:8081
  # Web origin for the Creator Hub link in copyright emails.
  WEB_APP_BASE_URL: https://qa.cleestudio.com
  IDENTITY_USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  DATING_SAFETY_RESPONDER_USER_IDS: ""
  DATING_SAFETY_OPS_EMAIL: ""
  # Follow checks and actor cards (defaults are compose names).
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098

ingress:
  enabled: false

pdb:
  enabled: false # QA runs one replica: any PDB would block node drains

# Alert rules (lv-21, 18 Nov 2026): the subscriber upload fan-out and the
# dead letters. The SAME list is in values-prod.yaml and values-qa.yaml
# (render_test.sh and internal/service/deploy_values_test.go check it). The
# chart adds source=atpost-service and service=notification-service, which
# the Alertmanager route sends to the ops e-mail. Every replica samples the
# same job table, so the queue gauges are equal on every pod: max, never sum.
# Metrics: internal/service/fanout_metrics.go, internal/events/
# fanout_trigger_metrics.go, internal/events/dlq_metrics.go.
prometheusRule:
  enabled: true
  rules:
    # A job is due and nobody claims it (the worker ticks every 5 s), or a
    # claimed job has made no progress for 30 min (stale reclaim is 10 min).
    - alert: NotificationFanoutJobStuck
      expr: |-
        max(atpost_notification_service_fanout_queue_oldest_seconds{state="due"}) > 900
        or max(atpost_notification_service_fanout_queue_oldest_seconds{state="running"}) > 1800
      for: 10m
      labels: { severity: critical }
      annotations:
        summary: An upload notification fan-out job is stuck; subscribers are not being told about new uploads
        description: "The fan-out worker is down, wedged, or every pass fails before it moves. Logs: 'fanout:' on notification-service. SELECT post_id, status, attempts, last_error, available_at FROM subscriber_fanout_jobs WHERE status IN ('pending','running') ORDER BY available_at LIMIT 20."
    # Jobs that ran out of attempts (post-service, graph or the inbox down
    # for about 3.5 h). The hourly replay reopens them twice within 72 h.
    - alert: NotificationFanoutJobsFailing
      expr: sum(increase(atpost_notification_service_fanout_jobs_settled_total{outcome="failed"}[1h])) > 0
      for: 0m
      labels: { severity: warning }
      annotations:
        summary: An upload notification fan-out job failed after all its retries
        description: "Its subscribers have not been told. The replay sweep retries it (atpost_notification_service_fanout_replayed_jobs_total). last_error on subscriber_fanout_jobs WHERE status = 'failed' says why."
    # A trigger event that could not become a job: the enqueue failed (the
    # consumer retries) or the pipeline is not wired at all.
    - alert: NotificationFanoutTriggersLost
      expr: sum by (trigger, outcome) (increase(atpost_notification_service_fanout_trigger_events_total{outcome=~"enqueue_error|dropped_no_pipeline"}[15m])) > 0
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: Upload notification triggers are not becoming fan-out jobs
        description: "enqueue_error: the job insert fails (database). dropped_no_pipeline: the fan-out is not wired in this build. The outcome label says which."
    # notification-service wrote a dead letter (today only the call consumer).
    - alert: NotificationEventsDeadLettered
      expr: sum by (topic) (increase(atpost_notification_service_dlq_messages_total[30m])) > 0
      for: 0m
      labels: { severity: warning }
      annotations:
        summary: notification-service dead-lettered a message
        description: "The message is on <topic>.dlq. List it with post-service's dlq-replay (docs/runbooks/dlq-replay.md); a call notification is stale by then and is not replayed."
