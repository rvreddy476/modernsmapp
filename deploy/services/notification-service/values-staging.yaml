# notification-service overrides for the staging environment.
#
# The atpost-service chart owns Deployment / Service / SA / ESO /
# HPA / PDB / ServiceMonitor. Anything not listed here inherits the
# chart default. CI rewrites image.tag on every push to main; never
# hand-edit it.

service:
  name: notification-service
  port: 8088

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/notification-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-staging-notification-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/staging/notification-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    # Add per-service secrets here (POSTGRES_DSN, REDIS_ADDR,
    # KAFKA_BROKERS, SCYLLA_HOSTS, courier API keys, etc.).

env:
  ENV: staging
  LOG_LEVEL: info
  # CALL-LB-4B deployment contract, MACHINE-ENFORCED by
  # notification-service internal/push TestDeployedManifestsCoupleCallsToRequiredPush:
  # CALLS_ENABLED may not be "true" in chat-call-service values for this
  # environment unless CALL_PUSH_REQUIRED is "true" here AND the FCM env
  # (FCM_PROJECT_ID + FCM_SERVICE_ACCOUNT_KEY secret) is configured -- the
  # service then refuses to start without working push credentials.
  CALL_PUSH_REQUIRED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Dating lane D8 panic paging. DATING_SAFETY_RESPONDER_USER_IDS: comma-separated
  # staff user ids, each re-checked for admin/moderator in identity. Empty pages
  # no responder: every panic then raises a critical ops alert (DECISION PENDING:
  # name the responder owner and fill this in).
  DATING_SERVICE_URL: http://dating-service.atpost.svc.cluster.local:8112
  IDENTITY_AUTH_URL: http://identity-auth-service.atpost.svc.cluster.local:8081
  DATING_SAFETY_RESPONDER_USER_IDS: ""
  DATING_SAFETY_OPS_EMAIL: ""
  # Add per-service inter-service URLs here. Common ones:
  #   USER_SERVICE_URL:  http://user-service.atpost.svc.cluster.local:8082
  #   GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  #   POST_SERVICE_URL:  http://post-service.atpost.svc.cluster.local:8084
  #   MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087

# Internal-only — api-gateway is the external surface.
ingress:
  enabled: false
