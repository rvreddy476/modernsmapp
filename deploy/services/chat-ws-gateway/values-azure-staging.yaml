# Default chart alerts (charts/atpost-service/values.yaml, defaultAlerts).
# This service exports no /metrics on purpose: its one port is on the
# public ingress, and a request there lasts as long as the socket, so a
# p99 rule would fire constantly. The scrape and the scrape-target and
# HTTP rules are therefore off; pod and readiness rules stay on. Metrics
# here need a second, non-ingress port in the chart first.
