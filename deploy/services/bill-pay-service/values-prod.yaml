# bill-pay-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `bill-pay-service`. Secrets by reference only (atpost/prod/bill-pay-
# service). __TF_*__ placeholders come from Terraform outputs.
#
# DORMANT (plan §3: bill pay off — no production provider). No Setu BBPS
# account exists, so SETU_MODE stays `mock` and the gateway closes
# /v1/billpay (GATEWAY_DISABLED_PREFIXES in api-gateway values). Deployed
# so the gateway route has an upstream; nothing reaches it from the edge.

service:
  name: bill-pay-service
  port: 8115

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/bill-pay-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-bill-pay-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/bill-pay-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Setu BBPS credentials: only when SETU_MODE leaves `mock`.
    # - { secretKey: SETU_CLIENT_ID, remoteRef: setu_client_id }
    # - { secretKey: SETU_CLIENT_SECRET, remoteRef: setu_client_secret }
    # - { secretKey: SETU_WEBHOOK_SECRET, remoteRef: setu_webhook_secret }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_TOPIC: billpay-events
  WALLET_SERVICE_URL: http://wallet-service.atpost.svc.cluster.local:8114
  # No production aggregator account: mock until Setu exists.
  SETU_MODE: mock
  SETU_BASE_URL: https://prod.setu.co

ingress:
  enabled: false

pdb:
  enabled: false # one replica, dormant
