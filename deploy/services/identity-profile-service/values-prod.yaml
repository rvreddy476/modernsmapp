# identity-profile-service overrides for the prod environment.

service:
  name: identity-profile-service
  port: 8098

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/identity-profile-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-identity-profile-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/identity-profile-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }

env:
  ENV: prod
  LOG_LEVEL: info
  # ── Module 3 SR-4: block enforcement on profile surfaces ────────────────
  # profile-service has no block table of its own (SR-3 removed that copy —
  # nothing enforced it). Block denial means asking graph-service, which is
  # canonical. Without this, authenticated profile reads are REFUSED rather
  # than served unprotected, so an unset value is a visible outage, not a
  # silent one where blocked users can read the profile of whoever blocked them.
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8082
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
