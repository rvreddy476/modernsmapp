# dating-service overrides for the staging environment.
#
# The atpost-service chart owns Deployment / Service / SA / ESO /
# HPA / PDB / ServiceMonitor. Anything not listed here inherits the
# chart default. CI rewrites image.tag on every push to main; never
# hand-edit it.

service:
  name: dating-service
  port: 8112

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/dating-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-staging-dating-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/staging/dating-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    # Lane D8: evidence HMAC key (>= 32 bytes). Boot refuses without it; create
    # dating_evidence_hmac_key in the secret store before deploying. Never rotate
    # casually: a new key unlinks previously retained evidence.
    - { secretKey: DATING_EVIDENCE_HMAC_KEY, remoteRef: dating_evidence_hmac_key }
    # Lane D9: PII sealing keys. The server and the data exporter refuse to
    # boot without them; create dating_pii_keys ("v1:<base64 32-byte key>")
    # and dating_pii_lookup_salt (>= 16 random bytes) in the secret store
    # before deploying. Never drop a key version: rows sealed under it become
    # unreadable. Rotate by appending ",v2:<key>".
    - { secretKey: DATING_PII_KEYS, remoteRef: dating_pii_keys }
    - { secretKey: DATING_PII_LOOKUP_SALT, remoteRef: dating_pii_lookup_salt }
    # Lane P2: dating-service's payments-service token (Premium passes and
    # Boost) is NOT enabled yet. Without it the purchase route answers 503
    # PREMIUM_UNAVAILABLE; boot is not refused. Enable in this order: store
    # dating_service_token_key (base64 ed25519 seed) and
    # dating_service_token_kid here and the matching public key / kid for
    # payments-service (caller_dating_pubkey / caller_dating_kid); enable
    # payments-service first (uncomment its lines, add dating-service to its
    # SERVICE_CALLERS); then uncomment the two lines below. Enabling here
    # first fails the secret sync.
    # - { secretKey: DATING_SERVICE_TOKEN_KEY, remoteRef: dating_service_token_key }
    # - { secretKey: DATING_SERVICE_TOKEN_KID, remoteRef: dating_service_token_kid }
    # Admin console Wave 2: dating verifies admin-service's service tokens on
    # /v1/dating/internal/admin/*. NOT enabled yet: without it the console's
    # Dating dashboard is refused (401); the legacy gateway-scopes admin routes
    # keep working. To enable, in this order:
    #   1. the founder generates admin-service's ed25519 key: the private half
    #      (base64 32-byte seed) and kid go to admin-service's secret store
    #      (admin_service_token_key / admin_service_token_kid); the public half
    #      and the same kid go here as caller_admin_pubkey / caller_admin_kid;
    #   2. uncomment the two lines below AND the SERVICE_CALLERS lines under env;
    #   3. enable admin-service's two lines (its values file).
    # Setting SERVICE_CALLERS before the key exists refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }
    # Add per-service secrets here (POSTGRES_DSN, REDIS_ADDR,
    # KAFKA_BROKERS, SCYLLA_HOSTS, courier API keys, etc.).

env:
  ENV: staging
  LOG_LEVEL: info
  # Admin console Wave 2 (see externalSecret above for the order): uncomment
  # together with SERVICE_CALLER_ADMIN_SERVICE_PUBKEY / _KID.
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'dating:stats.read,dating:reports.read,dating:reports.act,dating:users.ban,dating:photos.review,dating:selfie.review,dating:panic.read,dating:panic.act,dating:panic.reveal,dating:risk.read,dating:audit.read'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Birth date + first name source (required outside local/dev; boot refuses without it).
  IDENTITY_PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  # Boot refuses while duplicate open matches exist. Review them with
  # services/dating-service/scripts/count-duplicate-matches.sql, set "true"
  # for ONE deploy to close them (each emits dating.match.closed), then back.
  DATING_DEDUPE_OPEN_MATCHES: "false"
  # Lane D5: the required selfie is compared by media-service's internal
  # face compare route (internal key, no user identity).
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  # Lane D6: dating photo safety. Label lists and confidence bars use the
  # service defaults (service.DefaultPhotoSafetyConfig) unless set here.
  DATING_PHOTO_MAX_PER_PROFILE: "6"
  DATING_PHOTO_REQUIRE_FACE: "true"
  DATING_PHOTO_RECHECK_ENABLED: "true"
  DATING_PHOTO_RECHECK_INTERVAL_HOURS: "24"
  # Aadhaar via DigiLocker is optional. Boot refuses without a mode and
  # refuses the mock outside local/dev; switch to http once the partner
  # credentials (DIGILOCKER_BASE_URL / DIGILOCKER_API_KEY) are in the store.
  DIGILOCKER_MODE: disabled
  # Lane D8: grievance link per report (required outside local/dev), trusted
  # contacts checked against graph connections, evidence retention after a
  # purge, and the panic / report limits.
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  DATING_EVIDENCE_RETENTION_DAYS: "180"
  DATING_PANIC_DAILY_LIMIT: "5"
  DATING_REPORT_DAILY_LIMIT: "10"
  # Add per-service inter-service URLs here. Common ones:
  #   USER_SERVICE_URL:  http://user-service.atpost.svc.cluster.local:8082
  #   GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  #   POST_SERVICE_URL:  http://post-service.atpost.svc.cluster.local:8084
  #   MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087

# Lane D9: the DPDP data exporter (cmd/data-exporter) as the chart's worker.
# It ships in the dating-service image, so the repository is the server's and
# the command selects the binary. CI must set worker.image.tag to the same sha
# as image.tag. Same env and secrets as the server (DATING_PII_* required).
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/dating-service'
    tag: latest # CI overrides via --set worker.image.tag=<sha>
  command: ["/data-exporter"]
  env:
    KAFKA_GROUP_ID: dating-data-exporter
    DATING_EXPORT_STORAGE: database
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  scratchSizeLimit: 64Mi
  terminationGracePeriodSeconds: 60

# Internal-only — api-gateway is the external surface.
ingress:
  enabled: false
