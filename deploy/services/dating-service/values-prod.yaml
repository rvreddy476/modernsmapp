# dating-service overrides for prod (AWS ap-south-1): the HTTP server and
# the DPDP data exporter (worker block at the end).
#
# Env contract: Architecture/docker/docker-compose.yml, services
# `dating-service` and `dating-data-exporter`. Secrets by reference only
# (atpost/prod/dating-service). __TF_*__ placeholders come from Terraform
# outputs.
#
# DORMANT (plan §3: dating off). The gateway keeps /v1/dating closed with an
# EMPTY pilot allowlist (nobody). Deployed-but-gated, so the service must
# boot: the evidence HMAC key and the PII keys are required.

service:
  name: dating-service
  port: 8112

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/dating-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-dating-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/dating-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Lane D8: evidence HMAC key (>= 32 bytes). Boot refuses without it.
    # Never rotate casually: a new key unlinks previously retained evidence.
    - { secretKey: DATING_EVIDENCE_HMAC_KEY, remoteRef: dating_evidence_hmac_key }
    # Lane D9: PII sealing keys ("v1:<base64 32-byte key>", >= 16-byte
    # salt). The server and the exporter refuse to boot without them; never
    # drop a key version. Rotate by appending ",v2:<key>".
    - { secretKey: DATING_PII_KEYS, remoteRef: dating_pii_keys }
    - { secretKey: DATING_PII_LOOKUP_SALT, remoteRef: dating_pii_lookup_salt }
    # Lane P2: dating's payments token (Premium passes, Boost) is NOT enabled
    # (purchase route answers 503 PREMIUM_UNAVAILABLE). Enable payments-service
    # first (caller_dating_pubkey/kid + SERVICE_CALLERS), then uncomment.
    # - { secretKey: DATING_SERVICE_TOKEN_KEY, remoteRef: dating_service_token_key }
    # - { secretKey: DATING_SERVICE_TOKEN_KID, remoteRef: dating_service_token_kid }
    # Admin console Wave 2 (Dating): NOT enabled yet (401 until then). To
    # enable: the founder's ONE admin key (admin-service values, step 1):
    # public half → caller_admin_pubkey, kid → caller_admin_kid; uncomment
    # the two lines below AND the SERVICE_CALLERS lines under env; enable
    # admin-service's two lines. Setting SERVICE_CALLERS first refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_TOPIC: dating-events
  # Birth date + first name source (required outside local/dev).
  IDENTITY_PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  # Boot refuses while duplicate open matches exist; "true" for ONE deploy
  # closes them. Production starts empty.
  DATING_DEDUPE_OPEN_MATCHES: "false"
  DATING_DECLINE_COOLDOWN_DAYS: "30"
  # Lane D5/D6: selfie liveness and photo safety through media-service
  # (Rekognition); the recheck sweeper runs in production.
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  DATING_PHOTO_MAX_PER_PROFILE: "6"
  DATING_PHOTO_REQUIRE_FACE: "true"
  DATING_PHOTO_RECHECK_ENABLED: "true"
  DATING_PHOTO_RECHECK_INTERVAL_HOURS: "24"
  # Aadhaar via DigiLocker is optional: disabled until partner credentials.
  DIGILOCKER_MODE: disabled
  # Lane D8: grievances to trust-safety, trusted contacts via graph, limits.
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  DATING_EVIDENCE_RETENTION_DAYS: "180"
  DATING_PANIC_DAILY_LIMIT: "5"
  DATING_REPORT_DAILY_LIMIT: "10"
  # Lane P2 (see externalSecret): unused until the token is set.
  PAYMENTS_SERVICE_URL: http://payments-service.atpost.svc.cluster.local:8102
  # Admin console Wave 2 (see externalSecret above for the order).
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'dating:stats.read,dating:reports.read,dating:reports.act,dating:users.ban,dating:photos.review,dating:selfie.review,dating:panic.read,dating:panic.act,dating:panic.reveal,dating:risk.read,dating:audit.read'

# Lane D9: the DPDP data exporter (cmd/data-exporter) as the chart's worker.
# Ships in the dating-service image, so the repository is the server's and
# the command selects the binary. CI sets worker.image.tag to the same sha
# as image.tag. Same env and secrets as the server.
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/dating-service'
    tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render
  command: ["/data-exporter"]
  env:
    KAFKA_GROUP_ID: dating-data-exporter
    DATING_EXPORT_STORAGE: database
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  scratchSizeLimit: 64Mi
  terminationGracePeriodSeconds: 60

ingress:
  enabled: false

pdb:
  enabled: false # one replica, dormant
