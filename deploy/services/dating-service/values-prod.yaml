# dating-service overrides for the prod environment.

service:
  name: dating-service
  port: 8112

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/dating-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-dating-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/dating-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Lane D8: evidence HMAC key (>= 32 bytes). Boot refuses without it; create
    # dating_evidence_hmac_key in the secret store before deploying. Never rotate
    # casually: a new key unlinks previously retained evidence.
    - { secretKey: DATING_EVIDENCE_HMAC_KEY, remoteRef: dating_evidence_hmac_key }

env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Birth date + first name source (required outside local/dev; boot refuses without it).
  IDENTITY_PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  # Boot refuses while duplicate open matches exist. Review them with
  # services/dating-service/scripts/count-duplicate-matches.sql, set "true"
  # for ONE deploy to close them (each emits dating.match.closed), then back.
  DATING_DEDUPE_OPEN_MATCHES: "false"
  # Lane D5: the required selfie is compared by media-service's internal
  # face compare route (internal key, no user identity).
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  # Lane D6: dating photo safety. Label lists and confidence bars use the
  # service defaults (service.DefaultPhotoSafetyConfig) unless set here.
  DATING_PHOTO_MAX_PER_PROFILE: "6"
  DATING_PHOTO_REQUIRE_FACE: "true"
  DATING_PHOTO_RECHECK_ENABLED: "true"
  DATING_PHOTO_RECHECK_INTERVAL_HOURS: "24"
  # Aadhaar via DigiLocker is optional. Boot refuses without a mode and
  # refuses the mock outside local/dev; switch to http once the partner
  # credentials (DIGILOCKER_BASE_URL / DIGILOCKER_API_KEY) are in the store.
  DIGILOCKER_MODE: disabled
  # Lane D8: grievance link per report (required outside local/dev), trusted
  # contacts checked against graph connections, evidence retention after a
  # purge, and the panic / report limits.
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  DATING_EVIDENCE_RETENTION_DAYS: "180"
  DATING_PANIC_DAILY_LIMIT: "5"
  DATING_REPORT_DAILY_LIMIT: "10"

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
