# chat-call-service overrides for the prod environment.

service:
  name: chat-call-service
  port: 8097

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/chat-call-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-chat-call-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/chat-call-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    - { secretKey: JWT_PUBLIC_KEY_PEM, remoteRef: jwt_public_key_pem }
    - { secretKey: LIVEKIT_API_KEY, remoteRef: livekit_api_key }
    - { secretKey: LIVEKIT_API_SECRET, remoteRef: livekit_api_secret }

env:
  ENV: prod
  APP_ENV: production
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: atpost-api
  JWT_RS256_KID: rsa-1
  CALLS_ENABLED: "false"
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
