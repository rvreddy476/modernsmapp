# GENERATED by scripts/gen-azure-values.sh from values-prod.yaml — DO NOT hand-edit.
# Azure (prod) overlay of the service 'admin-service': ACR image, nginx ingress,
# azure-key-vault ClusterSecretStore. Re-run the script after editing the AWS values.
service:
  name: admin-service
  port: 8096
image:
  repository: atpostprod454350.azurecr.io/atpost/admin-service
  tag: latest
replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi
externalSecret:
  enabled: true
  remoteKey: atpost-prod-admin-service
  data:
  - secretKey: INTERNAL_SERVICE_KEY
    remoteRef: internal_service_key
  - secretKey: JWT_SECRET
    remoteRef: jwt_secret
  - secretKey: JWT_KID
    remoteRef: jwt_kid
  - secretKey: JWT_SECRET_PREVIOUS
    remoteRef: jwt_secret_previous
  - secretKey: JWT_KID_PREVIOUS
    remoteRef: jwt_kid_previous
  # Admin console Wave 2: admin-service's service-token key for product admin
  # calls is NOT enabled yet (Dating, Feast, MStore and Trust & safety
  # dashboard routes answer 503; boot is not refused). Enable in this order:
  #   1. store admin_service_token_key (base64 ed25519 seed) and
  #      admin_service_token_kid in the key vault, and the public half and kid
  #      for the products (caller_admin_pubkey / caller_admin_kid);
  #   2. enable dating-service, commerce-service and trust-safety-service first
  #      (their secret lines and SERVICE_CALLERS lines);
  #   3. uncomment below. MStore then stops using the internal key.
  # - secretKey: ADMIN_SERVICE_TOKEN_KEY
  #   remoteRef: admin_service_token_key
  # - secretKey: ADMIN_SERVICE_TOKEN_KID
  #   remoteRef: admin_service_token_kid
  secretStoreName: azure-key-vault
env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  DATING_SERVICE_URL: http://dating-service.atpost.svc.cluster.local:8112
  FOOD_SERVICE_URL: http://food-service.atpost.svc.cluster.local:8113
  COMMERCE_SERVICE_URL: http://commerce-service.atpost.svc.cluster.local:8109
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  # Money dashboards, same key: enable monetization-service and
  # payments-service first (numbered steps in their values files).
  MONETIZATION_SERVICE_URL: http://monetization-service.atpost.svc.cluster.local:8099
  PAYMENTS_SERVICE_URL: http://payments-service.atpost.svc.cluster.local:8102
  # Content apps (Social and Tube on post-service, business pages on
  # user-service, Q&A, and Chat on channel, group and community), same key:
  # enable each product first (numbered steps in its values file).
  POST_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  QA_SERVICE_URL: http://qa-service.atpost.svc.cluster.local:8108
  CHANNEL_SERVICE_URL: http://channel-service.atpost.svc.cluster.local:8106
  GROUP_SERVICE_URL: http://group-service.atpost.svc.cluster.local:8090
  COMMUNITY_SERVICE_URL: http://community-service.atpost.svc.cluster.local:8107
  # Mopedu (rider-service), same key: enable rider-service first (numbered
  # steps in its values file).
  RIDER_SERVICE_URL: http://rider-service.atpost.svc.cluster.local:8116
  # Access page (Wave 1, B4): role management through identity-auth's
  # token-only admin family, same key (audience "identity"); also the URL of
  # the permission lookups. Enable identity-auth-service's two commented
  # lines first (numbered steps in its values file).
  AUTH_SERVICE_URL: http://identity-auth-service.atpost.svc.cluster.local:8081
  ADMIN_REFUND_TWO_PERSON_THRESHOLD_PAISE: '500000'
ingress:
  enabled: false
pdb:
  enabled: true
  minAvailable: 2
