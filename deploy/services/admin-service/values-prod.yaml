# admin-service overrides for the prod environment.

service:
  name: admin-service
  port: 8096

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/admin-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-admin-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/admin-service
  data:
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Admin console Wave 2: admin-service signs a 60 s service token per
    # product admin call. NOT enabled yet: without it the Dating, Feast,
    # MStore and Trust & safety dashboard routes answer 503
    # PRODUCT_UNAVAILABLE; boot is not refused. To enable:
    #   1. the founder generates ONE ed25519 key: the private half (base64
    #      32-byte seed) goes to admin_service_token_key and its kid to
    #      admin_service_token_kid here; the public half and the same kid go
    #      to each product as caller_admin_pubkey / caller_admin_kid
    #      (dating-service, commerce-service, trust-safety-service; and
    #      food-service once it has deploy values);
    #   2. enable each product first (its values file: two secret lines and
    #      the SERVICE_CALLERS lines);
    #   3. uncomment the two lines below.
    # MStore: once this key is enabled, /v1/admin/commerce/* stops using the
    # internal key and needs commerce-service's lines from step 2.
    # - { secretKey: ADMIN_SERVICE_TOKEN_KEY, remoteRef: admin_service_token_key }
    # - { secretKey: ADMIN_SERVICE_TOKEN_KID, remoteRef: admin_service_token_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  POST_SERVICE_URL: http://post-service.atpost.svc.cluster.local:8084
  DATING_SERVICE_URL: http://dating-service.atpost.svc.cluster.local:8112
  FOOD_SERVICE_URL: http://food-service.atpost.svc.cluster.local:8113
  COMMERCE_SERVICE_URL: http://commerce-service.atpost.svc.cluster.local:8109
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  # Money dashboards, same key: enable monetization-service and
  # payments-service first (numbered steps in their values files).
  MONETIZATION_SERVICE_URL: http://monetization-service.atpost.svc.cluster.local:8099
  PAYMENTS_SERVICE_URL: http://payments-service.atpost.svc.cluster.local:8102
  # A Feast or monetization refund, or a payments refund resolved as money,
  # at or above this many paise needs a second approver.
  ADMIN_REFUND_TWO_PERSON_THRESHOLD_PAISE: '500000'

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
