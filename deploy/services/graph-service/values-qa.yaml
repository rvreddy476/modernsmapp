# graph-service overrides for QA (AWS ap-south-1, the QA account).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `graph-service`. Secrets by reference only (atpost/qa/graph-service).
# __TF_*__ placeholders come from Terraform outputs.
#
# QA (contract 3 Oct 2026): this file is values-prod.yaml with QA DATA only —
# hosts (qa., api-qa., ws-qa., admin-qa., media-qa.cleestudio.com), secret
# atpost/qa/<svc>, IRSA role atpost-qa-<svc>-irsa, ALB groups atpost-qa-*,
# Scylla atpost-qa-client, the QA VPC CIDR, QA JWT issuer/audience, and the
# QA size (one replica, HPA 1..2, no PDB, smaller requests; limits as prod).
# ENV / APP_ENV / DEPLOY_ENV are the PRODUCTION values on purpose: QA runs
# with production semantics (ENV audit, 3 Oct 2026); any other value turns
# on development rules or refuses to boot. Launch switches are prod's.

service:
  name: graph-service
  port: 8083

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/graph-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-qa-graph-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/qa/graph-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Module 3 LB-3: the RETIRED profile.blocks table. The reconciler imports
    # those rows under any-block-wins; WITHOUT this DSN the users who pressed
    # Block in profile-service stay unprotected. Production starts EMPTY (no
    # dev data migrated), so this points at the same identity_db and simply
    # finds nothing — keep it so a later import needs no values change.
    - { secretKey: LEGACY_PROFILE_BLOCKS_DSN, remoteRef: legacy_profile_blocks_dsn }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  # Permission resolver reads privacy settings from the IDENTITY user-service
  # (8110; the old values said 8082, the app user-service's port).
  USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  # Read-through projection repair targets the app.users owner.
  APP_USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  # Module 3 LB-3: refuse an unattributed graph mutation.
  GRAPH_WRITE_SOURCE_STRICT: "true"
  # Dating-match call grant: OFF (dating is closed at the edge; calls are
  # off). MESSAGE_SERVICE_URL stays set so enabling is a one-line change.
  DATING_CALLS_ENABLED: "false"
  MESSAGE_SERVICE_URL: http://chat-message-service.atpost.svc.cluster.local:8092

ingress:
  enabled: false

pdb:
  enabled: false # QA runs one replica: any PDB would block node drains

# graph-service migrations reference users, owned by user-service.
schemaDependencies:
  - users
