# graph-service overrides for the prod environment.

service:
  name: graph-service
  port: 8083

image:
  repository: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/atpost/graph-service
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: arn:aws:iam::123456789012:role/atpost-prod-graph-service-irsa

externalSecret:
  enabled: true
  remoteKey: atpost/prod/graph-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Module 3 LB-3: the RETIRED profile.blocks table.
    #
    # profile-service kept its own block table that nothing enforced, so every
    # row in it is a block a real user asked for and never received. The
    # reconciler imports them under any-block-wins. WITHOUT this DSN the import
    # does not run and those users stay unprotected in feed, search and chat —
    # retiring the routes alone helps nobody who already pressed Block.
    #
    # It is a SECRET, not an env value: it is a database connection string.
    - { secretKey: LEGACY_PROFILE_BLOCKS_DSN, remoteRef: legacy_profile_blocks_dsn }

env:
  ENV: prod
  LOG_LEVEL: info
  # Module 3 LB-3: refuse an unattributed graph mutation. The gateway stamps
  # X-Graph-Write-Source on every proxied graph call and OVERWRITES any label a
  # client supplies; approved internal callers stamp their own reviewed source.
  # Setting this to "false" permits an unreviewed second graph writer — the
  # exact class of defect that produced the shadow graph.
  GRAPH_WRITE_SOURCE_STRICT: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2

# graph-service migrations reference users, owned by user-service.
schemaDependencies:
  - users
