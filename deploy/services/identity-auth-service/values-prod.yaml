# identity-auth-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `identity-auth`, translated to production. Secrets by reference only
# (atpost/prod/identity-auth-service). __TF_*__ placeholders come from
# Terraform outputs (deploy/README.md).
#
# OTP_BYPASS_CODE is deliberately ABSENT: the service refuses to start in
# production when it is set (W7b). Never add it here.

service:
  name: identity-auth-service
  port: 8081

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/identity-auth-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

# Lean first stage: two copies (auth is on the sign-in path).
replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# IRSA: ses:SendEmail on the verified identity (W2), MSK client policy.
serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-identity-auth-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/identity-auth-service
  data:
    # Aurora `identity_db` (one DSN per service, pointing at the right
    # database; sslmode=require). The compose name is POSTGRES_DSN; the code
    # also reads DATABASE_URL — one is enough.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    # MSK SASL/SCRAM credentials (seeder copies them from the AmazonMSK_*
    # secret, or point these two entries at it with a per-entry remoteKey).
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # RS256 access-token signing (private key). Production REFUSES TO START
    # without it (HS256 in production would let every verifier mint).
    - { secretKey: JWT_PRIVATE_KEY_PEM, remoteRef: jwt_private_key_pem }
    # Encrypts stored TOTP (2FA) secrets: exactly 64 hex chars (AES-256).
    # Unset, 2FA secrets are stored in plaintext — not acceptable in prod.
    - { secretKey: TOTP_ENCRYPTION_KEY, remoteRef: totp_encryption_key }
    # Mini-app session signer (RS256). One shared key for every replica:
    # unset, each pod signs mini-app sessions with its own throwaway key and
    # a session minted on one pod fails on the next.
    - { secretKey: MINI_APP_SESSION_PRIVATE_KEY_PEM, remoteRef: mini_app_session_private_key_pem }
    - { secretKey: MINI_APP_SESSION_KEY_ID, remoteRef: mini_app_session_key_id }
    # Admin console Wave 1 (the Access page): admin-service's ed25519 PUBLIC
    # key + kid. NOT enabled yet (the family answers 401; boot is not
    # refused). To enable: founder generates the ONE admin key (admin-service
    # values, step 1); its public half → caller_admin_pubkey, kid →
    # caller_admin_kid here; uncomment both lines (a pubkey without a kid
    # refuses boot); enable admin-service's two lines.
    # - { secretKey: ADMIN_SERVICE_TOKEN_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: ADMIN_SERVICE_TOKEN_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

  # ── Managed stores ────────────────────────────────────────────────────────
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512

  # Per-IP limits key on the real client: the gateway (and the ALB in front
  # of it) are the only peers, both inside the VPC.
  TRUSTED_PROXIES: "10.30.0.0/16" # the prod VPC CIDR (infra/terraform/envs/prod/main.tf, module "vpc" vpc_cidr; not an output)
  RATE_LIMIT_ENABLED: "true"

  # ── Email via Amazon SES (Module 3 SR-6; contract) ───────────────────────
  # The service REFUSES TO START in production without these. Credentials
  # come from the SDK default chain (IRSA); no static key anywhere.
  # SES_FROM_ADDRESS must be a VERIFIED identity; the configuration set
  # routes bounces and complaints (W1 creates both).
  SES_FROM_ADDRESS: no-reply@cleestudio.com
  SES_CONFIGURATION_SET: atpost-prod-transactional

  # ── Module 3 SR-1: access-token minting identity ─────────────────────────
  # MUST match api-gateway's JWT_ISSUER / JWT_AUDIENCE exactly.
  APP_ENV: "production"
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: "atpost-api"
  JWT_RS256_KID: rsa-1
  # Token lifetimes: the service defaults (access 15 min, refresh 30 days).
  # ACCESS_TOKEN_TTL / REFRESH_TOKEN_TTL deliberately unset — dev's year-long
  # token must never reach production.

  # ── RBAC bootstrap ───────────────────────────────────────────────────────
  # The production superadmin's identity user UUID(s), comma-separated.
  # Empty = NOBODY can administer roles (fail closed).
  # CHANGEME after the founder registers on production: their identity user
  # id(s); then sync identity-auth-service again. Empty until then.
  SUPERADMIN_USER_IDS: ""
  ADMIN_USER_IDS: ""
  MODERATOR_USER_IDS: ""
  # Role grant/revoke requires the acting superadmin to have 2FA enrolled.
  REQUIRE_MFA_FOR_PRIVILEGED: "true"
  # Sign-up with Google/Apple stays off until production OAuth apps exist.
  OAUTH_NEW_ACCOUNT_ENABLED: "false"
  # Where OAuth sign-in returns the browser (FrontendURL + /auth/callback),
  # and the provider callbacks registered with Google/Apple/GitHub (sign-up
  # through them is off; the URLs must still be production, never localhost).
  FRONTEND_URL: https://app.cleestudio.com
  OAUTH_GOOGLE_REDIRECT_URL: https://api.cleestudio.com/v1/auth/oauth/google/callback
  OAUTH_APPLE_REDIRECT_URL: https://api.cleestudio.com/v1/auth/oauth/apple/callback
  OAUTH_GITHUB_REDIRECT_URL: https://api.cleestudio.com/v1/auth/oauth/github/callback

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1
