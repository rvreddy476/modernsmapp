# Azure (staging) overlay of the service 'rider-service': ACR image, nginx ingress,
# azure-key-vault ClusterSecretStore. Re-run the script after editing the AWS values.
service:
  name: rider-service
  port: 8116
image:
  repository: atpoststaging454350.azurecr.io/atpost/rider-service
  tag: "3bf3601cca56c71a9eb4c556a964f316260115eb"
replicaCount: 2
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
externalSecret:
  enabled: true
  remoteKey: atpost-staging-rider-service
  data:
  - secretKey: INTERNAL_SERVICE_KEY
    remoteRef: internal_service_key
  - secretKey: JWT_SECRET
    remoteRef: jwt_secret
  - secretKey: JWT_KID
    remoteRef: jwt_kid
  # Admin console (Mopedu): rider-service verifies admin-service's service
  # tokens on /v1/rider/internal/admin/*. NOT enabled yet: without it the
  # console's Mopedu routes are refused (401). To enable, in this order:
  #   1. the founder generates admin-service's ed25519 key (one key for
  #      every product): the private half (base64 32-byte seed) and kid go
  #      to admin-service's secret store (admin_service_token_key /
  #      admin_service_token_kid); the public half and the same kid go here
  #      as caller_admin_pubkey / caller_admin_kid;
  #   2. uncomment the four lines below AND the SERVICE_CALLERS lines under env;
  #   3. enable admin-service's two lines (its values file).
  # Setting SERVICE_CALLERS before the key exists refuses boot.
  # - secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY
  #   remoteRef: caller_admin_pubkey
  # - secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID
  #   remoteRef: caller_admin_kid
  # Pricing engine secrets (see values-azure-prod.yaml). Staging boots
  # without them: no RIDER_PII_KEYS means offers cannot be accepted
  # (OTP_SEALING_NOT_CONFIGURED); no MOPEDU_PLATFORM_GSTIN means the flat
  # rider-local rate table. Set both before a staging test session.
  # - secretKey: RIDER_PII_KEYS
  #   remoteRef: rider-pii-keys
  # - secretKey: MOPEDU_PLATFORM_GSTIN
  #   remoteRef: mopedu-platform-gstin
  # - secretKey: GOOGLE_MAPS_SERVER_KEY
  #   remoteRef: google-maps-server-key
  secretStoreName: azure-key-vault
env:
  ENV: staging
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Coupons stay off until the tax adviser confirms the GST treatment of a
  # discount (the same open question as FOOD_COUPONS_ENABLED).
  MOPEDU_COUPONS_ENABLED: "false"
  # Demand surge ceiling in basis points (5000 = x1.5).
  MOPEDU_SURGE_CAP_BPS: "5000"
  # Admin console (see externalSecret above for the order): uncomment
  # together with SERVICE_CALLER_ADMIN_SERVICE_PUBKEY / _KID. OPS is rider's
  # AdminPermissions (rider-service/internal/http/admin_token.go).
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'rider:stats.read,rider:partners.read,rider:partners.approve,rider:partners.suspend,rider:documents.review,rider:vehicles.review,rider:payments.read,rider:payments.settle,rider:payments.reject,rider:rides.read,rider:rides.cancel,rider:ratings.moderate,rider:complaints.act,rider:incidents.read,rider:incidents.act,rider:incidents.reveal,rider:cities.manage,rider:fares.manage,rider:reports.read,rider:audit.read'
ingress:
  enabled: false
