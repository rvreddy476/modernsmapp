# rider-service overrides for the staging environment.
#
# The atpost-service chart owns Deployment / Service / SA / ESO /
# HPA / PDB / ServiceMonitor. Anything not listed here inherits the
# chart default. CI rewrites image.tag on every push to main; never
# hand-edit it.

service:
  name: rider-service
  port: 8116

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/rider-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-staging-rider-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/staging/rider-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    # Admin console (Mopedu): rider-service verifies admin-service's service
    # tokens on /v1/rider/internal/admin/*. NOT enabled yet: without it the
    # console's Mopedu routes are refused (401). To enable, in this order:
    #   1. the founder generates admin-service's ed25519 key (one key for
    #      every product): the private half (base64 32-byte seed) and kid go
    #      to admin-service's secret store (admin_service_token_key /
    #      admin_service_token_kid); the public half and the same kid go here
    #      as caller_admin_pubkey / caller_admin_kid;
    #   2. uncomment the two lines below AND the SERVICE_CALLERS lines under env;
    #   3. enable admin-service's two lines (its values file).
    # Setting SERVICE_CALLERS before the key exists refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }
    # Add per-service secrets here (POSTGRES_DSN, REDIS_ADDR,
    # KAFKA_BROKERS, SCYLLA_HOSTS, courier API keys, etc.).

env:
  ENV: staging
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Admin console (see externalSecret above for the order): uncomment
  # together with SERVICE_CALLER_ADMIN_SERVICE_PUBKEY / _KID. OPS is rider's
  # AdminPermissions (rider-service/internal/http/admin_token.go).
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'rider:stats.read,rider:partners.read,rider:partners.approve,rider:partners.suspend,rider:documents.review,rider:vehicles.review,rider:payments.read,rider:payments.settle,rider:payments.reject,rider:rides.read,rider:rides.cancel,rider:ratings.moderate,rider:complaints.act,rider:incidents.read,rider:incidents.act,rider:incidents.reveal,rider:cities.manage,rider:fares.manage,rider:reports.read,rider:audit.read'
  # Add per-service inter-service URLs here. Common ones:
  #   USER_SERVICE_URL:  http://user-service.atpost.svc.cluster.local:8082
  #   GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  #   POST_SERVICE_URL:  http://post-service.atpost.svc.cluster.local:8084
  #   MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087

# Internal-only — api-gateway is the external surface.
ingress:
  enabled: false
