# monetization-service overrides for the staging environment.
#
# The atpost-service chart owns Deployment / Service / SA / ESO /
# HPA / PDB / ServiceMonitor. Anything not listed here inherits the
# chart default. CI rewrites image.tag on every push to main; never
# hand-edit it.

service:
  name: monetization-service
  port: 8099

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/monetization-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-staging-monetization-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/staging/monetization-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    # Admin console: monetization verifies admin-service's service tokens on
    # /v1/monetization/internal/admin/*. NOT enabled yet: without it the
    # console's Monetization routes are refused (401). The launch flags still
    # apply after enabling: with writes off every route answers 503
    # MONETIZATION_NOT_LAUNCHED, shown in the console as "not launched".
    # To enable, in this order:
    #   1. the founder generates admin-service's ed25519 key (one key for
    #      every product): the private half (base64 32-byte seed) and kid go
    #      to admin-service's secret store (admin_service_token_key /
    #      admin_service_token_kid); the public half and the same kid go here
    #      as caller_admin_pubkey / caller_admin_kid;
    #   2. uncomment the two lines below AND the SERVICE_CALLERS lines under env;
    #   3. enable admin-service's two lines (its values file).
    # Setting SERVICE_CALLERS before the key exists refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }
    # Creator memberships (payments-service application memberships, reference
    # type creator_membership): monetization's PRIVATE ed25519 payments token is
    # NOT enabled (MEMBERSHIPS_ENABLED stays false). Enable payments-service
    # first (caller_monetization_pubkey / caller_monetization_kid, then
    # monetization-service in its SERVICE_CALLERS), then uncomment these two.
    # The public half goes to payments-service only.
    # - { secretKey: MONETIZATION_SERVICE_TOKEN_KEY, remoteRef: monetization_service_token_key }
    # - { secretKey: MONETIZATION_SERVICE_TOKEN_KID, remoteRef: monetization_service_token_kid }

env:
  ENV: staging
  # Admin console (see externalSecret above for the order): uncomment
  # together with SERVICE_CALLER_ADMIN_SERVICE_PUBKEY / _KID.
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'monetization:stats.read,monetization:fraud.review,monetization:wallet.freeze,monetization:wallet.unfreeze,monetization:wallet.rebuild,monetization:fund.read,monetization:fund.rates,monetization:creators.suspend,monetization:fund.settle,monetization:fund.reverse,monetization:fund.budget,monetization:disputes.read,monetization:disputes.act,monetization:refund.issue,monetization:payouts.read,monetization:audit.read'
  # Feast wallet payments (security sweep #17): charge-and-credit needs a food-service
  # token. When Feast launches, add food-service to SERVICE_CALLERS, the
  # SERVICE_CALLER_FOOD_SERVICE_PUBKEY / _KID secrets (the pair of food's
  # FOOD_SERVICE_TOKEN_KEY), and:
  # SERVICE_CALLER_FOOD_SERVICE_OPS: 'monetization:charge-and-credit'
  MONETIZATION_WRITES_ENABLED: "false"
  # Withdrawals. Requires MONETIZATION_WRITES_ENABLED=true; the process
  # refuses to boot with payouts on and writes off. Off in beta: earnings
  # are estimates, RequestPayout answers 503 PAYOUTS_NOT_ENABLED.
  MONETIZATION_PAYOUTS_ENABLED: "false"
  # Maintenance mode: admin routes only (internal key + admin scope), no
  # worker, no Kafka client, every other financial write 503 MAINTENANCE.
  # Only ever true for a supervised correction run on one environment.
  MONETIZATION_MAINTENANCE: "false"
  # TDS at payout: computed and recorded, NOT deducted (founder decision
  # 12 Sep 2026) until the per-user tax module. true withholds.
  MONETIZATION_TDS_APPLY: "false"
  # Paid creator memberships on payments-service. Off in these environments
  # until the founder switches them on (dev compose runs them).
  MEMBERSHIPS_ENABLED: "false"
  # Membership eligibility: the PAN item needs creator_tax_profiles.verified_at
  # (true). Dev compose leaves it false: a PAN passing the format check counts.
  MEMBERSHIPS_REQUIRE_PAN_VERIFIED: "true"
  # Security sweep #16: tips ask graph-service for a block either way before
  # the ledger; unset, every tip answers 503 TIP_UNAVAILABLE.
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  # Creator memberships are paid through payments-service (inert until the
  # token above is enabled).
  PAYMENTS_SERVICE_URL: http://payments-service.atpost.svc.cluster.local:8102
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Add per-service inter-service URLs here. Common ones:
  #   USER_SERVICE_URL:  http://user-service.atpost.svc.cluster.local:8082
  #   GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  #   POST_SERVICE_URL:  http://post-service.atpost.svc.cluster.local:8084
  #   MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087

# Internal-only — api-gateway is the external surface.
ingress:
  enabled: false
