# monetization-service overrides for the prod environment.

service:
  name: monetization-service
  port: 8099

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/monetization-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-monetization-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/monetization-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }

env:
  ENV: prod
  MONETIZATION_WRITES_ENABLED: "false"
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
