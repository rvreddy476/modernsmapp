# ai-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service `ai-service`.
# Secrets by reference only (atpost/prod/ai-service). __TF_*__ placeholders
# come from Terraform outputs.
#
# PORT 8121 (W4): the Helm values said 8098, which is identity-profile's port
# (the gateway's AI_SERVICE_URL pointed at the wrong service); compose uses
# 8117, which is live-service-v2's port in Helm. 8121 is unused anywhere.
# HTTP_PORT follows service.port automatically.

service:
  name: ai-service
  port: 8121

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/ai-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-ai-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/ai-service
  data:
    # Aurora `app` and Redis (compose: POSTGRES_DSN, REDIS_ADDR).
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Model access. Empty in dev; production needs a key or the AI routes
    # answer unavailable. Store anthropic_api_key and uncomment.
    # - { secretKey: ANTHROPIC_API_KEY, remoteRef: anthropic_api_key }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"

ingress:
  enabled: false

pdb:
  enabled: false # one replica at launch
