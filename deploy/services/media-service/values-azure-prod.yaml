service:
  name: media-service
  port: 8087
image:
  repository: atpostprod454350.azurecr.io/atpost/media-service
  tag: latest
replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi
externalSecret:
  enabled: true
  remoteKey: atpost-prod-media-service
  data:
  - secretKey: INTERNAL_SERVICE_KEY
    remoteRef: internal_service_key
  - secretKey: JWT_SECRET
    remoteRef: jwt_secret
  - secretKey: JWT_KID
    remoteRef: jwt_kid
  - secretKey: JWT_SECRET_PREVIOUS
    remoteRef: jwt_secret_previous
  - secretKey: JWT_KID_PREVIOUS
    remoteRef: jwt_kid_previous
  - secretKey: JWT_PUBLIC_KEY_PEM
    remoteRef: jwt_public_key_pem
  secretStoreName: azure-key-vault
env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  JWT_RS256_KID: rsa-1
ingress:
  enabled: false
pdb:
  enabled: true
  minAvailable: 2
# P-17: the transcode worker is its own image (ffmpeg + cmd/worker); the server
# image carries neither. build-push-acr.yml builds and pushes atpost/media-worker
# beside the server image and bumps worker.image.tag to the sha it pushed.
worker:
  enabled: true
  replicaCount: 3
  image:
    repository: atpostprod454350.azurecr.io/atpost/media-worker
    tag: latest # CI overrides via --set worker.image.tag=<sha>
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  scratchSizeLimit: 50Gi
