# GENERATED by scripts/gen-azure-values.sh from values-prod.yaml — DO NOT hand-edit.
# Azure (prod) overlay of the service 'media-service': ACR image, nginx ingress,
# azure-key-vault ClusterSecretStore. Re-run the script after editing the AWS values.
service:
  name: media-service
  port: 8087
image:
  repository: atpostprod454350.azurecr.io/atpost/media-service
  tag: latest
replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi
externalSecret:
  enabled: true
  remoteKey: atpost-prod-media-service
  data:
  - secretKey: INTERNAL_SERVICE_KEY
    remoteRef: internal_service_key
  # REG-1 / N-4: no JWT_SECRET / JWT_SECRET_PREVIOUS (or their KIDs): with
  # ENV prod media-service refuses to start while either is mounted
  # (internal/http/jwt_config.go). Only the public key, as values-prod.yaml.
  - secretKey: JWT_PUBLIC_KEY_PEM
    remoteRef: jwt_public_key_pem
  secretStoreName: azure-key-vault
env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  JWT_RS256_KID: rsa-1
  # TODO(REG-1, needs a human): media-service in production ALSO refuses to
  # start without JWT_ISSUER and JWT_AUDIENCE. They must equal what Azure
  # prod's identity-auth mints and its api-gateway pins, but neither
  # deploy/services/api-gateway/values-azure-prod.yaml nor
  # identity-auth-service/values-azure-prod.yaml sets them (both run ENV prod
  # and would refuse to start the same way). Set all three files together,
  # e.g. as values-prod.yaml does (auth-service / atpost-api), or regenerate
  # with scripts/gen-azure-values.sh prod.
  # JWT_ISSUER: <azure prod issuer>
  # JWT_AUDIENCE: <azure prod audience>
ingress:
  enabled: false
pdb:
  enabled: true
  minAvailable: 2
# P-17: the transcode worker is its own image (ffmpeg + cmd/worker); the server
# image carries neither. build-push-acr.yml builds and pushes atpost/media-worker
# beside the server image and bumps worker.image.tag to the sha it pushed.
worker:
  enabled: true
  replicaCount: 3
  image:
    repository: atpostprod454350.azurecr.io/atpost/media-worker
    tag: latest # CI overrides via --set worker.image.tag=<sha>
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  scratchSizeLimit: 50Gi
  # REG-2: the chart's grace period and the scratch size as worker env; the
  # worker sizes its SIGTERM drain from the grace.
  limitsEnv: true
