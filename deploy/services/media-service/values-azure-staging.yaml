# Azure (staging) overlay of the service 'media-service': ACR image, nginx ingress,
# azure-key-vault ClusterSecretStore. Re-run the script after editing the AWS values.
service:
  name: media-service
  port: 8087
image:
  repository: atpoststaging454350.azurecr.io/atpost/media-service
  tag: "3bf3601cca56c71a9eb4c556a964f316260115eb"
replicaCount: 2
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
externalSecret:
  enabled: true
  remoteKey: atpost-staging-media-service
  data:
  - secretKey: INTERNAL_SERVICE_KEY
    remoteRef: internal_service_key
  # REG-1: RS256 only, as values-staging.yaml; the HS256 secret is not mounted.
  - secretKey: JWT_PUBLIC_KEY_PEM
    remoteRef: jwt_public_key_pem
  secretStoreName: azure-key-vault
env:
  ENV: staging
  # Reels audit 2026-10-30: the transcode worker refuses an original larger
  # than this before downloading it. The worker's scratch is a 20Gi emptyDir
  # here and needs ~3x the original (renditions + HLS); statfs cannot see an
  # emptyDir sizeLimit, so the cap is what keeps a huge upload from getting
  # the pod evicted. 6 GiB. (Default 16 GiB fits prod's 50Gi scratch.)
  MEDIA_WORKER_MAX_ORIGINAL_BYTES: "6442450944"
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  JWT_RS256_KID: rsa-1
  # RS256 only outside production (internal/http/jwt_config.go). Azure
  # staging's identity-auth mounts JWT_PRIVATE_KEY_PEM, so it signs RS256.
  JWT_DISABLE_HS256: "true"
  # TODO(REG-1, needs a human): no JWT_ISSUER / JWT_AUDIENCE here because
  # deploy/services/api-gateway/values-azure-staging.yaml and
  # identity-auth-service/values-azure-staging.yaml set neither (identity-auth
  # then mints its defaults). Outside production media-service checks them
  # only when set; pin the same pair in all three files. Do NOT copy
  # values-staging.yaml's atpost-api-staging audience unless Azure staging's
  # identity-auth is given it too.
ingress:
  enabled: false
# P-17: the transcode worker is its own image (ffmpeg + cmd/worker); the server
# image carries neither. build-push-acr.yml builds and pushes atpost/media-worker
# beside the server image and bumps worker.image.tag to the sha it pushed.
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: atpoststaging454350.azurecr.io/atpost/media-worker
    tag: latest # CI overrides via --set worker.image.tag=<sha>
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  scratchSizeLimit: 20Gi
  # REG-2: the chart's grace period and the scratch size as worker env; the
  # worker sizes its SIGTERM drain from the grace.
  limitsEnv: true
