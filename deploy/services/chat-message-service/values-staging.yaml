# chat-message-service overrides for the staging environment.
#
# The atpost-service chart owns Deployment / Service / SA / ESO /
# HPA / PDB / ServiceMonitor. Anything not listed here inherits the
# chart default. CI rewrites image.tag on every push to main; never
# hand-edit it.

service:
  name: chat-message-service
  port: 8092

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/chat-message-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-staging-chat-message-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/staging/chat-message-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    # RS256 verification: the platform public key only. No JWT_SECRET here —
    # the service refuses to boot in production with one set (a verifier that
    # holds the HS256 secret can mint; security sweep 2026-10-21 #3).
    - { secretKey: JWT_PUBLIC_KEY_PEM, remoteRef: jwt_public_key_pem }
    # Owner-issued conversation-room entitlements (shared HMAC with chat-ws-gateway).
    - { secretKey: CHAT_ENTITLEMENT_SECRET, remoteRef: chat_entitlement_secret }
    # Field encryption at rest (22 Oct 2026): the customer-managed KMS key that
    # wraps the chat content keys (a key-ENCRYPTING key: no data key is stored
    # in this secret; the wrapped data keys live in chat.field_key_ring).
    # Required: with APP_ENV=production message-service refuses to boot
    # without it, and it refuses CHAT_FIELD_KEYS (the dev keyring). The IRSA
    # role needs kms:GenerateDataKey and kms:Decrypt on this key, with the
    # encryption context purpose=chat-field, scope=chat.field.
    - { secretKey: CHAT_KMS_KEY_ID, remoteRef: chat_kms_key_id }
    # Add per-service secrets here (POSTGRES_DSN, REDIS_ADDR,
    # KAFKA_BROKERS, SCYLLA_HOSTS, courier API keys, etc.).

env:
  ENV: staging
  APP_ENV: staging
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: atpost-api-staging
  JWT_RS256_KID: rsa-1
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  SEARCH_SERVICE_URL: http://search-service.atpost.svc.cluster.local:8089
  TRUST_SAFETY_SERVICE_URL: http://trust-safety-service.atpost.svc.cluster.local:8091
  USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  # Chat-policy authority (usr.user_settings). Distinct from the legacy user
  # directory above — pointing this at user-service silently breaks policy
  # refresh (it answers 200 with an empty body on the settings route).
  IDENTITY_USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  # Dating first-message notifications (chat → dating internal route).
  DATING_SERVICE_URL: http://dating-service.atpost.svc.cluster.local:8112
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Add per-service inter-service URLs here. Common ones:
  #   USER_SERVICE_URL:  http://user-service.atpost.svc.cluster.local:8082
  #   GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  #   POST_SERVICE_URL:  http://post-service.atpost.svc.cluster.local:8084
  #   MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087

# Internal-only — api-gateway is the external surface.
ingress:
  enabled: false
