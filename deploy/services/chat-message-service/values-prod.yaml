# chat-message-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `chat-message-service`. Secrets by reference only (atpost/prod/chat-
# message-service). __TF_*__ placeholders come from Terraform outputs.

service:
  name: chat-message-service
  port: 8092

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/chat-message-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

# Lean first stage: two copies (chat is core).
replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-chat-message-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/chat-message-service
  data:
    # Aurora `chat_db`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    - { secretKey: JWT_PUBLIC_KEY_PEM, remoteRef: jwt_public_key_pem }
    # Owner-issued conversation-room entitlements (shared HMAC with
    # chat-ws-gateway; the seeder writes one value to both).
    - { secretKey: CHAT_ENTITLEMENT_SECRET, remoteRef: chat_entitlement_secret }

env:
  ENV: prod
  APP_ENV: production
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: atpost-api
  JWT_RS256_KID: rsa-1
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_TOPIC: chat.events.v1
  IDENTITY_KAFKA_TOPIC: identity.events.v1
  IDENTITY_KAFKA_GROUP_ID: chat-service-identity
  # Scylla keyspace `chatservice` (chat-service/services/message-service/
  # scylla/schema.prod.cql, applied by deploy/scylla/).
  SCYLLA_HOSTS: atpost-prod-client.scylla.svc.cluster.local # terraform output scylla_client_service
  SCYLLA_KEYSPACE: chatservice
  USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  # Chat-policy authority (usr.user_settings): the IDENTITY user-service on
  # 8110. Pointing this at user-service silently breaks policy refresh.
  IDENTITY_USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8110
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  # Dating first-message notifications (dating is closed at the edge; the
  # internal route is harmless while nobody matches).
  DATING_SERVICE_URL: http://dating-service.atpost.svc.cluster.local:8112

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1
