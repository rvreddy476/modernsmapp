# chat-message-service overrides for the prod environment.

service:
  name: chat-message-service
  port: 8092

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/chat-message-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-chat-message-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/chat-message-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    - { secretKey: JWT_PUBLIC_KEY_PEM, remoteRef: jwt_public_key_pem }
    # Owner-issued conversation-room entitlements (shared HMAC with chat-ws-gateway).
    - { secretKey: CHAT_ENTITLEMENT_SECRET, remoteRef: chat_entitlement_secret }

env:
  ENV: prod
  APP_ENV: production
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: atpost-api
  JWT_RS256_KID: rsa-1
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083
  MEDIA_SERVICE_URL: http://media-service.atpost.svc.cluster.local:8087
  USER_SERVICE_URL: http://user-service.atpost.svc.cluster.local:8082
  # Chat-policy authority (usr.user_settings). Distinct from the legacy user
  # directory above — pointing this at user-service silently breaks policy
  # refresh (it answers 200 with an empty body on the settings route).
  IDENTITY_USER_SERVICE_URL: http://identity-user-service.atpost.svc.cluster.local:8082
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
