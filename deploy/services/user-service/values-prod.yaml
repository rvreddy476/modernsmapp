# user-service (the APP user-service, app.users) overrides for prod.
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `user-service`. Secrets by reference only (atpost/prod/user-service).
# __TF_*__ placeholders come from Terraform outputs.

service:
  name: user-service
  port: 8082

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/user-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 2
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-user-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/user-service
  data:
    # Aurora `app`. user-service OWNS public.users (tier 1: deploy before
    # graph-service and post-service, whose migrations reference it).
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Admin console (business pages): admin-service's service tokens on
    # /v1/users/internal/admin/*. NOT enabled yet (401 until then). To
    # enable: the founder's ONE admin ed25519 key (admin-service values,
    # step 1): public half → caller_admin_pubkey, kid → caller_admin_kid;
    # uncomment the two lines below AND the SERVICE_CALLERS lines under env;
    # enable admin-service's two lines. Setting SERVICE_CALLERS before the
    # key exists refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  PROFILE_SERVICE_URL: http://identity-profile-service.atpost.svc.cluster.local:8098
  # Business-page admins (compose carries a dev account id). Production:
  # fill with the operator's user id(s) or leave empty (nobody).
  PAGES_ADMIN_USER_IDS: ""
  # Admin console (see externalSecret above for the order). user-service's
  # SERVICE_CALLERS is ONE registry shared with private-profile readers:
  # when another caller is added, APPEND it (comma-separated) and keep its
  # own SERVICE_CALLER_<NAME>_KID/_PUBKEY/_OPS lines.
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'social:stats.read,social:pages.moderate,social:pages.suspend,social:pages.disable,social:documents.review'

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 1
