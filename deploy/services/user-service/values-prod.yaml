# user-service overrides for the prod environment.

service:
  name: user-service
  port: 8082

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/user-service'
  tag: latest # CI overrides via --set image.tag=<sha>

replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 1Gi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-user-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/user-service
  data:
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }
    # Admin console: user-service verifies admin-service's service tokens on
    # /v1/users/internal/admin/*. NOT enabled yet: without it the console's
    # business pages (Social) routes are refused (401). To enable, in this order:
    #   1. the founder generates admin-service's ed25519 key (one key for
    #      every product): the private half (base64 32-byte seed) and kid go
    #      to admin-service's secret store (admin_service_token_key /
    #      admin_service_token_kid); the public half and the same kid go here
    #      as caller_admin_pubkey / caller_admin_kid;
    #   2. uncomment the two lines below AND the SERVICE_CALLERS lines under env;
    #   3. enable admin-service's two lines (its values file).
    # Setting SERVICE_CALLERS before the key exists refuses boot.
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_PUBKEY, remoteRef: caller_admin_pubkey }
    # - { secretKey: SERVICE_CALLER_ADMIN_SERVICE_KID, remoteRef: caller_admin_kid }

env:
  ENV: prod
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  # Admin console (see externalSecret above for the order): uncomment
  # together with SERVICE_CALLER_ADMIN_SERVICE_PUBKEY / _KID.
  # user-service's SERVICE_CALLERS is ONE registry shared with private-profile
  # readers (audience user-service, users:profile.read_private). No such caller
  # is configured in these values today; when one is, list it WITH
  # admin-service (comma-separated, e.g. 'chat-service,admin-service') and keep
  # its own SERVICE_CALLER_<NAME>_KID/_PUBKEY/_OPS lines — never replace the list.
  # SERVICE_CALLERS: 'admin-service'
  # SERVICE_CALLER_ADMIN_SERVICE_OPS: 'social:stats.read,social:pages.moderate,social:pages.suspend,social:pages.disable,social:documents.review'

ingress:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2
