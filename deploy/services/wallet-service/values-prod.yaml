# wallet-service overrides for prod (AWS ap-south-1).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `wallet-service`. Secrets by reference only (atpost/prod/wallet-service).
# __TF_*__ placeholders come from Terraform outputs.
#
# DORMANT (plan §3: wallet off — no production provider). There is no
# partner bank, so BANK_PARTNER stays `mock` and the gateway closes
# /v1/wallet (GATEWAY_DISABLED_PREFIXES in api-gateway values). Deployed so
# bill-pay-service and rider-service have the upstream they are configured
# for; nothing reaches it from the edge.

service:
  name: wallet-service
  port: 8114

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/wallet-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-prod-wallet-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/prod/wallet-service
  data:
    # Aurora `app`.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }
    - { secretKey: JWT_SECRET, remoteRef: jwt_secret }
    - { secretKey: JWT_KID, remoteRef: jwt_kid }
    - { secretKey: JWT_SECRET_PREVIOUS, remoteRef: jwt_secret_previous }
    - { secretKey: JWT_KID_PREVIOUS, remoteRef: jwt_kid_previous }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_TOPIC: wallet-events
  # No partner bank yet: the mock partner, and a placeholder VPA that can
  # never receive money. Replace both when a PPI partner is contracted.
  BANK_PARTNER: mock
  PARTNER_BANK_VPA: atpostwallet@partnerbank

ingress:
  enabled: false

pdb:
  enabled: false # one replica, dormant
