# suggestion-service overrides for QA (AWS ap-south-1, the QA account).
#
# Env contract: Architecture/docker/docker-compose.yml, service
# `suggestion-service`. Secrets by reference only (atpost/qa/suggestion-
# service). __TF_*__ placeholders come from Terraform outputs. The ECR
# repository and IRSA role are added by W1 (they did not exist when this
# directory was created).
#
# Module 3 LB-7 / SR-7: block safety is FAIL-CLOSED. Without
# GRAPH_SERVICE_URL (or with graph-service unreachable) every suggestion
# surface returns an empty list rather than an unfiltered one.
#
# QA (contract 3 Oct 2026): this file is values-prod.yaml with QA DATA only —
# hosts (qa., api-qa., ws-qa., admin-qa., media-qa.cleestudio.com), secret
# atpost/qa/<svc>, IRSA role atpost-qa-<svc>-irsa, ALB groups atpost-qa-*,
# Scylla atpost-qa-client, the QA VPC CIDR, QA JWT issuer/audience, and the
# QA size (one replica, HPA 1..2, no PDB, smaller requests; limits as prod).
# ENV / APP_ENV / DEPLOY_ENV are the PRODUCTION values on purpose: QA runs
# with production semantics (ENV audit, 3 Oct 2026); any other value turns
# on development rules or refuses to boot. Launch switches are prod's.

service:
  name: suggestion-service
  port: 8100

image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/suggestion-service'
  tag: "" # set by CI (commit sha, scripts/ci/bump-service-tags.sh); empty refuses to render

replicaCount: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  irsaRoleArn: 'arn:aws:iam::{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}:role/atpost-qa-suggestion-service-irsa'

externalSecret:
  enabled: true
  remoteKey: atpost/qa/suggestion-service
  data:
    # Reads BOTH the app database and the identity database.
    - { secretKey: POSTGRES_DSN, remoteRef: postgres_dsn }
    - { secretKey: IDENTITY_POSTGRES_DSN, remoteRef: identity_postgres_dsn }
    - { secretKey: REDIS_ADDR, remoteRef: redis_addr }
    - { secretKey: REDIS_PASSWORD, remoteRef: redis_password }
    - { secretKey: KAFKA_BROKERS, remoteRef: kafka_brokers }
    - { secretKey: KAFKA_SASL_USERNAME, remoteRef: kafka_sasl_username }
    - { secretKey: KAFKA_SASL_PASSWORD, remoteRef: kafka_sasl_password }
    # Authenticates the outbound call to graph-service's blocked-and-muted
    # endpoint and gates this service's own /v1/suggestions routes.
    - { secretKey: INTERNAL_SERVICE_KEY, remoteRef: internal_service_key }

env:
  ENV: prod
  LOG_LEVEL: info
  AWS_REGION: ap-south-1
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo.observability.svc.cluster.local:4318
  REDIS_TLS_ENABLED: "true"
  KAFKA_TLS_ENABLED: "true"
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  SCYLLA_HOSTS: atpost-qa-client.scylla.svc.cluster.local # terraform output scylla_client_service
  GRAPH_SERVICE_URL: http://graph-service.atpost.svc.cluster.local:8083

ingress:
  enabled: false # internal-only — api-gateway is the external surface

pdb:
  enabled: false # QA runs one replica: any PDB would block node drains
