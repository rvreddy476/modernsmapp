# web zone "admin" — prod. Reuses charts/atpost-service.
#
# Founder decision 2026-09-17: the admin console lives on its OWN host,
# admin.cleestudio.com, at the root (no /admin prefix). The image is built
# with ADMIN_BASE_PATH=/ (atpost-web .github/workflows/build-push.yml), it
# sets its own strict CSP + HSTS + host-only admin_* cookies, and the
# browser only ever talks to this host (its /api/proxy reaches the gateway
# in-cluster). It is deliberately NOT reachable at app.cleestudio.com/admin
# any more: the shell zone answers that path with a redirect here when its
# ADMIN_HOST_URL env is set.
service:
  name: web-admin
  port: 3000            # Next standalone listens on 3000
image:
  repository: '{{ required "global.awsAccountId is required" .Values.global.awsAccountId }}.dkr.ecr.ap-south-1.amazonaws.com/atpost/web-admin'
  tag: latest           # CI overrides with the commit SHA
replicaCount: 3
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { cpu: 1, memory: 768Mi }
env:
  HOSTNAME: 0.0.0.0
  PORT: "3000"
  NODE_ENV: production
  # Server-side proxy/refresh targets (cluster-internal):
  API_GATEWAY_URL: http://api-gateway.atpost.svc.cluster.local:8080
  AUTH_SERVICE_URL: http://identity-auth-service.atpost.svc.cluster.local:8081
  # Own host, served at the root: the browser axios base is "" (same origin,
  # /v1 → /api/proxy). Baked at build time from ADMIN_BASE_PATH=/; kept here
  # so the runtime value can never disagree with the bundle.
  NEXT_PUBLIC_API_BASE_URL: ""
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: atpost-web-prod   # all zones share ONE ALB; this one is a host rule
    alb.ingress.kubernetes.io/group.order: "10"          # shell (/) is the catch-all, evaluated last
    # HTTPS only + 301 for any http:// — required for the console's HSTS
    # header (max-age two years, includeSubDomains, preload) to be honoured.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health   # the root page redirects to sign-in, which an ALB would count as unhealthy
    # Same TLS mechanism as every other zone: an ACM certificate on the shared
    # ALB. The cert MUST list admin.cleestudio.com as a SAN (or be a
    # *.cleestudio.com wildcard); the ALB serves it by SNI next to the
    # app.cleestudio.com cert. See docs/runbooks/admin-console-weekend-test.md §8.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:123456789012:certificate/CHANGEME
  hosts:
    - host: admin.cleestudio.com
      paths:
        - { path: /, pathType: Prefix }
pdb:
  enabled: true
  minAvailable: 1
