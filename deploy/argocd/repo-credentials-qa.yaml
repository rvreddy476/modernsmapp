# ArgoCD repository credential for the QA cluster — the same object as
# repo-credentials.yaml (production), reading the QA account's secret
# atpost/qa/argocd-repo-modernsmapp (an empty shell from infra/terraform/envs/qa
# extra_secret_shells, filled by the seeder with --env qa, never by hand in
# chat). Keys, ClusterSecretStore and the resulting Secret are identical; see
# repo-credentials.yaml for the PAT / deploy-key notes.
#
# Apply on the QA cluster with the AppProject, before the ApplicationSets:
#   kubectl apply -f deploy/argocd/repo-credentials-qa.yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atpost-repo-modernsmapp
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: atpost-repo-modernsmapp
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/rvreddy476/modernsmapp.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: atpost/qa/argocd-repo-modernsmapp
        property: username
    - secretKey: password
      remoteRef:
        key: atpost/qa/argocd-repo-modernsmapp
        property: password
