# ArgoCD repository credential for https://github.com/rvreddy476/modernsmapp.git
#
# The repository is private, so ArgoCD needs a credential to read the chart
# and the values files. NO VALUE LIVES HERE. This ExternalSecret (the same
# external-secrets operator and ClusterSecretStore the services use) reads
# the Secrets Manager secret named below and mints the Kubernetes Secret
# `atpost-repo-modernsmapp` in the argocd namespace with the label ArgoCD
# watches for repositories.
#
# Secrets Manager secret (created as an empty shell by Terraform with the
# other atpost/prod/* secrets; filled by the W3 seeder, never by hand in
# chat):
#
#   name:  atpost/prod/argocd-repo-modernsmapp
#   keys:  username   a GitHub user name (for a fine-grained PAT: the owner)
#          password   a fine-grained personal access token with
#                     Contents: read-only on rvreddy476/modernsmapp, or a
#                     GitHub App installation token
#
# A deploy key (SSH) is the alternative: store `sshPrivateKey` instead and
# change `url` to git@github.com:rvreddy476/modernsmapp.git.
#
# Apply with the AppProject, before the ApplicationSets:
#   kubectl apply -f deploy/argocd/repo-credentials.yaml
# The ClusterSecretStore name must match the one Terraform's external-secrets
# module publishes (default aws-secrets-manager, the same the chart uses).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: atpost-repo-modernsmapp
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: atpost-repo-modernsmapp
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/rvreddy476/modernsmapp.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: atpost/prod/argocd-repo-modernsmapp
        property: username
    - secretKey: password
      remoteRef:
        key: atpost/prod/argocd-repo-modernsmapp
        property: password
