# Profile — a user's profile detail (posts/media tabs, follow, message,
# subscribe/tip) and the my-media grid, plus the profile provider. User +
# social-graph data from user_domain, posts from social_domain; the chat
# "Message" button and monetization (subscribe/tip) via feature_contracts.
name: feature_profile
description: atPost profile feature.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  feature_contracts: ^0.1.0
  social_domain: ^0.1.0
  user_domain: ^0.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
