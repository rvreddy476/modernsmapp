# Notifications — the inbox screen plus its data stack: model, repository,
# the dedicated SSE stream service, and the bell/list/live providers. The
# unread-CHAT badge stays in the app (it reads ChatRepository); everything
# here is notification-only. Session via the AuthSession contract.
name: feature_notifications
description: atPost notifications inbox feature.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  atpost_realtime: ^0.1.0
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^16.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
