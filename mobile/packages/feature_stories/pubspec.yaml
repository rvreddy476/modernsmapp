# Stories UI vertical: viewer + composer (poll/quiz/countdown/question/
# slider interactives). Builds on social_domain (story model + provider);
# current user via feature_contracts. Never imports atpost_app or another
# feature package.
name: feature_stories
description: atPost Stories feature (viewer + interactive composer).
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  feature_contracts: ^0.1.0
  social_domain: ^0.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  image_picker: ^1.1.2
  video_player: ^2.10.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
