# Bill-pay UI vertical: home, categories, accounts, recharge, payments,
# reminders, scheduled. Sits on billpay_domain + wallet_domain (pay via
# wallet). Never imports atpost_app or another feature package.
name: feature_billpay
description: atPost bill-pay feature (BBPS bills + mobile recharge).
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  billpay_domain: ^0.1.0
  wallet_domain: ^0.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
