# Commerce UI vertical: buyer (home/product/cart/checkout/orders/returns),
# seller (dashboard/products/orders/earnings), RFQ, and B2B checkout. Sits
# on top of commerce_domain (shared models/repos/providers). Never imports
# atpost_app or another feature package.
name: feature_commerce
description: FiGo-adjacent commerce feature (buyer, seller, RFQ, returns).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  commerce_domain: ^0.1.0
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
