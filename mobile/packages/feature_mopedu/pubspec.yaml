# Mopedu ride-hailing UI vertical: rider (home/booking/history/safety) +
# partner (onboarding/dashboard/earnings/navigation). Sits on
# mopedu_domain + wallet_domain (partner payouts). Never imports
# atpost_app or another feature package.
name: feature_mopedu
description: atPost Mopedu ride-hailing feature (rider + partner).
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  mopedu_domain: ^0.1.0
  wallet_domain: ^0.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  google_maps_flutter: ^2.12.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
