# Shared, feature-agnostic UI widgets reused across surfaces: video
# player, story ring, reaction picker, hashtag text, icon buttons,
# error/offline states, filter pills. Depends on the design system +
# leaf infra only; never on the app or a feature package.
name: shared_ui
description: atPost shared reusable widgets.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  video_player: ^2.10.2
  chewie: ^1.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
