# Calls — 1:1 voice/video over LiveKit: the call model, calls repository,
# CallService (state machine + WebRTC/LiveKit plumbing), the realtime
# signaling service, the in-call screen and the floating overlay. Callee
# lookup via user_domain; wire events via atpost_realtime.
name: feature_calls
description: atPost voice/video calls feature.
version: 0.1.0
publish_to: none
environment: {sdk: ^3.10.7}
resolution: workspace
dependencies:
  flutter: {sdk: flutter}
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  atpost_realtime: ^0.1.0
  user_domain: ^0.1.0
  flutter_riverpod: ^2.6.1
  flutter_webrtc: ^1.4.0
  go_router: ^16.3.0
  livekit_client: ^2.7.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^6.0.0
