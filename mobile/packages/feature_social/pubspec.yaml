    sdk: flutter
  atpost_design: ^0.1.0
  feature_contracts: ^0.1.0
  user_domain: ^0.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
