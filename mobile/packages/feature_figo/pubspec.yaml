# FiGo food-delivery vertical (customer surface): home, live order
# tracking (SSE topics via atpost_realtime), rewards. Talks to the app
# only through atpost_* packages — never imports atpost_app.
name: feature_figo
description: FiGo food feature (home, order tracking, rewards).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  atpost_realtime: ^0.1.0
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
