# Chat — direct messaging: conversation/presence models, chat + presence
# repositories and providers (live WS-driven conversation list, per-friend
# unread), and the list/requests/detail screens. Start-call buttons via
# feature_calls; session via the AuthSession contract. The app's host
# bindings read chat_repository/chat_provider for the chat contracts.
name: feature_chat
description: atPost chat (direct messaging) feature.
version: 0.1.0
publish_to: none
environment: {sdk: ^3.10.7}
resolution: workspace
dependencies:
  flutter: {sdk: flutter}
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  atpost_realtime: ^0.1.0
  feature_calls: ^0.1.0
  shared_ui: ^0.1.0
  user_domain: ^0.1.0
  clock: ^1.1.1
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^6.0.0
