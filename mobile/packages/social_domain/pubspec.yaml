# Social domain kernel: the Post/Story models plus the feed, post,
# stories, comments, bookmarks, and following repositories/providers —
# the shared social data layer the whole social surface builds on. Author
# hydration + the viewer's following set come through feature_contracts
# so this layer never depends on the app's user repository.
name: social_domain
description: atPost social domain (post/story models, feed + social data layer).
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_network: ^0.1.0
  atpost_realtime: ^0.1.0
  feature_contracts: ^0.1.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  dio: ^5.9.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
