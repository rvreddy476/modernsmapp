# Memories (slambooks) UI vertical — a self-contained feature: its own
# memory/slambook models + repository live here since nothing else uses
# them. Talks to the host only through feature_contracts (user search)
# and atpost_network's AuthSession (current user id).
name: feature_memories
description: atPost Memories feature (slambooks compose/detail/share).
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  atpost_core: ^0.1.0
  atpost_design: ^0.1.0
  atpost_network: ^0.1.0
  feature_contracts: ^0.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
