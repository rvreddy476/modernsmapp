# ── JVM ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ── Performance ────────────────────────────────────────────────────────
# Configuration cache is ON from day one. Retrofitting it once 25 modules
# exist is far more painful than complying from the start (PHASE_0_1_PLAN §C).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# ── Android ────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# NOTE: android.defaults.buildfeatures.* were removed in AGP 9 (they now
# default to false anyway). Modules opt in explicitly — :app turns on
# buildConfig in the application convention plugin.

# ── AGP 9 compatibility flags (see libs.versions.toml toolchain note) ──
# KSP does not support AGP's built-in Kotlin, and the standard Kotlin
# Android plugin does not support AGP 9's new DSL. Hilt (now) and Room
# (Phase 1) both require KSP, so both flags stay off until KSP catches up.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# ── Kotlin ─────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
ksp.useKSP2=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
