# Production secrets manifest for tools/prodsecrets (W3 of
# docs/runbooks/aws-first-production-deployment.md).
#
# One Secrets Manager secret per deployable, <prefix>/<name>, each a flat JSON
# object. Terraform creates every one as an EMPTY shell (envs/prod/secrets.tf,
# output service_secret_names: the 32 services + web + admin-console) so
# External Secrets can reference it; this tool fills them. Key names are the
# `remoteRef` properties in deploy/services/<svc>/values-prod.yaml and
# deploy/web/app/values-prod.yaml; manifest_test.go fails on any drift from
# those files and on any difference from Terraform's list. Keys the values
# files carry only commented out (admin-console callers, providers that are
# off at launch) are filled too, so enabling one is uncommenting two lines.
#
# Production values are freshly generated, typed by the founder, or read
# from what Terraform generated. Dev values are never reused.
#
# File format: a strict YAML subset parsed by manifest.go: nested mappings of
# scalars, two-space indentation, full-line comments. No lists, anchors,
# trailing comments or multi-line scalars.
#
# Value specs (kind:argument), grouped as the runbook counts them:
#   generate   generate:hex32            32 hex characters (16 random bytes)
#              generate:hex64            64 hex characters (32 random bytes)
#              generate:totp-hex64       64 hex characters, AES-256 key for TOTP at rest
#              generate:password         32 characters from [A-Za-z0-9]
#              generate:pii-keyring      "v1:<base64 of 32 random bytes>"
#              generate:ed25519-keypair  (shared only) base64 32-byte seed + base64 public key
#              generate:rsa2048-pem      (shared only) PKCS1 private PEM + PKIX public PEM
#   prompt     prompt:<label>            typed by the founder, never echoed, required
#              prompt-optional:<label>   may stay empty at launch (the feature is off)
#              prompt-file:<label>       the founder types a PATH; the file's contents are the value
#   terraform  tf:<output>               a `terraform output -json` value (not secret)
#   derive     derive:<template>         {tf:<output>} and {copy:<source>#<field>} substituted
#              dsn:<database>/<role>     postgres://<role>:<pw>@<tf:aurora_cluster_endpoint>:5432/<database>?sslmode=require
#                                        one generated password per role; CREATE ROLE/GRANT SQL in roles.sql
#              shared:<name>             the same value in every secret that names it
#              shared-private:<name>     private half of a shared keypair (the CALLER)
#              shared-public:<name>      public half of the same keypair (every RECEIVER)
#   copy       copy:<source>#<field>     a field of a secret Terraform generated (see sources)
#   literal    const:<value>             literal, may be empty (an empty "previous" slot)

version: 1
prefix: atpost/prod

# Secrets this tool READS and never writes. Terraform generates them; their
# values are copied into the per-service secrets, never re-generated.
sources:
  # modules/auth-keys: jwt_secret, jwt_kid, internal_service_key,
  # jwt_private_key_pem, jwt_public_key_pem, jwt_rs256_kid.
  platform-auth: atpost/prod/platform-auth
  # modules/elasticache: auth_token, primary_endpoint, reader_endpoint, port.
  elasticache-auth: atpost/prod/elasticache/auth
  # modules/opensearch: username, password, endpoint. This is the internal
  # MASTER user of fine-grained access control; search-service uses it until
  # a least-privilege OpenSearch user is created inside the domain.
  opensearch-master: atpost/prod/opensearch/master
  # modules/msk: username, password (the AmazonMSK_ name is AWS-mandated).
  msk-scram: tf:msk_scram_secret_name
  # modules/media: media_cloudfront_key_pair_id, media_cloudfront_private_key,
  # media_cdn_base_url. Terraform generates the CloudFront signing key pair.
  cloudfront-signing: atpost/prod/media/cloudfront-signing

shared:
  # A fresh deployment has no previous key. External Secrets needs the
  # property to exist, so it is written empty; the first rotation fills it.
  jwt_secret_previous: const:
  jwt_kid_previous: const:
  # chat-message-service and chat-ws-gateway entitlement HMAC.
  chat_entitlement_secret: generate:hex64
  # notification-service verifies the realtime tokens rider and food mint.
  realtime_token_secret: generate:hex64
  # Moderation capabilities: issued by trust-safety-service, verified by
  # post-service; byte-identical in both secrets.
  story_moderation_hmac_key: generate:hex64
  story_moderation_hmac_key_previous: const:
  post_moderation_hmac_key: generate:hex64
  post_moderation_hmac_key_previous: const:
  post_restriction_hmac_key: generate:hex64
  post_restriction_hmac_key_previous: const:
  # Service-to-service tokens (Ed25519). The private seed signs in the
  # CALLER; the public half is SERVICE_CALLER_<NAME>_PUBKEY in every
  # RECEIVER, with the same kid. The tool refuses to emit a pair whose
  # halves do not match.
  svc_admin: generate:ed25519-keypair
  svc_admin_kid: const:admin-1
  svc_commerce: generate:ed25519-keypair
  svc_commerce_kid: const:commerce-1
  svc_food: generate:ed25519-keypair
  svc_food_kid: const:food-1
  svc_dating: generate:ed25519-keypair
  svc_dating_kid: const:dating-1
  svc_rider: generate:ed25519-keypair
  svc_rider_kid: const:rider-1
  svc_post: generate:ed25519-keypair
  svc_post_kid: const:post-1
  svc_trust_safety: generate:ed25519-keypair
  svc_trust_safety_kid: const:trust-safety-1
  svc_live: generate:ed25519-keypair
  svc_live_kid: const:live-1
  # identity-auth mini-app session signer (RS256).
  mini_app_session_rs256: generate:rsa2048-pem
  # Third parties, typed once, used by several services.
  razorpay_key_id: prompt:Razorpay LIVE key id (rzp_live_...)
  razorpay_key_secret: prompt:Razorpay LIVE key secret
  razorpay_webhook_secret: prompt:Razorpay webhook secret (dashboard webhook to https://api.cleestudio.com/v1/payments/webhook)
  livekit_url: prompt:LiveKit Cloud PRODUCTION project URL (wss://<project>.livekit.cloud)
  livekit_public_url: prompt:LiveKit Cloud URL devices dial (wss://...; the same as the project URL on Cloud)
  livekit_api_key: prompt:LiveKit Cloud PRODUCTION API key
  livekit_api_secret: prompt:LiveKit Cloud PRODUCTION API secret

secrets:

  api-gateway:
    redis_addr: derive:{tf:elasticache_primary_endpoint}:6379
    redis_password: copy:elasticache-auth#auth_token
    internal_service_key: copy:platform-auth#internal_service_key
    jwt_secret: copy:platform-auth#jwt_secret
    jwt_kid: copy:platform-auth#jwt_kid
    jwt_secret_previous: shared:jwt_secret_previous
    jwt_kid_previous: shared:jwt_kid_previous
    jwt_public_key_pem: copy:platform-auth#jwt_public_key_pem

  identity-auth-service:
    postgres_dsn: dsn:identity_db/identity_auth
    redis_addr: derive:{tf:elasticache_primary_endpoint}:6379
    redis_password: copy:elasticache-auth#auth_token
    kafka_brokers: tf:msk_bootstrap_brokers
    kafka_sasl_username: copy:msk-scram#username
    kafka_sasl_password: copy:msk-scram#password
    internal_service_key: copy:platform-auth#internal_service_key
    jwt_secret: copy:platform-auth#jwt_secret
    jwt_kid: copy:platform-auth#jwt_kid
    jwt_secret_previous: shared:jwt_secret_previous
    jwt_kid_previous: shared:jwt_kid_previous
    # RS256 access-token signing key (Terraform-generated, platform-auth).
    jwt_private_key_pem: copy:platform-auth#jwt_private_key_pem
    totp_encryption_key: generate:totp-hex64
    # Without a stable key every pod and restart signs mini-app sessions
    # with its own ephemeral key (mini_app_sessions.go falls back silently).
    mini_app_session_private_key_pem: shared-private:mini_app_session_rs256
    mini_app_session_key_id: const:miniapp-1
    # Sign-in with Google/Apple/GitHub is off at launch (OAUTH_NEW_ACCOUNT_ENABLED=false).
    oauth_google_client_id: prompt-optional:Google OAuth client id (empty until the production OAuth app exists)
    oauth_google_client_secret: prompt-optional:Google OAuth client secret
    oauth_apple_client_id: prompt-optional:Apple Sign-in client id
    oauth_apple_client_secret: prompt-optional:Apple Sign-in client secret
    oauth_github_client_id: prompt-optional:GitHub OAuth client id
    oauth_github_client_secret: prompt-optional:GitHub OAuth client secret
    # Admin console: pre-filled so enabling is uncommenting the values lines.
    caller_admin_pubkey: shared-public:svc_admin
    caller_admin_kid: shared:svc_admin_kid

  identity-user-service:
