// Gradle init script (scripts/ci/android-deps-lockfile.sh): adds a task to
// every Android application module that writes the external components its
// release builds ship (every *ReleaseRuntimeClasspath, all flavours), one
// `group:name:version` per line. Touches no build file. A dependency that
// does not resolve fails the task, so a partial list never reaches the scan.
//
// Output directory: -DciDepsOut=<dir>; one <module>.txt per application.

def outDir = System.getProperty('ciDepsOut')
if (!outDir) {
    throw new GradleException('android-release-deps.init.gradle: pass -DciDepsOut=<dir>')
}

allprojects { p ->
    p.plugins.withId('com.android.application') {
        p.tasks.register('ciReleaseDependencies') { t ->
            t.notCompatibleWithConfigurationCache('resolves configurations at execution time')
            t.doLast {
                def coords = new TreeSet<String>()
                def unresolved = new TreeSet<String>()
                def configs = p.configurations.findAll {
                    it.canBeResolved && it.name.endsWith('ReleaseRuntimeClasspath')
                }
                if (configs.isEmpty()) {
                    throw new GradleException("${p.path}: no *ReleaseRuntimeClasspath configuration")
                }
                configs.each { c ->
                    def result = c.incoming.resolutionResult
                    result.allDependencies.each { d ->
                        if (d instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                            unresolved << "${c.name}: ${d.attempted.displayName}".toString()
                        }
                    }
                    result.allComponents.each { comp ->
                        def id = comp.id
                        if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                            coords << "${id.group}:${id.module}:${id.version}".toString()
                        }
                    }
                }
                if (!unresolved.isEmpty()) {
                    throw new GradleException("${p.path}: unresolved dependencies:\n  " + unresolved.join('\n  '))
                }
                def f = new File(outDir, p.path.substring(1).replace(':', '_') + '.txt')
                f.parentFile.mkdirs()
                f.text = coords.join('\n') + '\n'
                println "ciReleaseDependencies ${p.path}: ${configs.size()} configurations, ${coords.size()} components"
            }
        }
    }
}
