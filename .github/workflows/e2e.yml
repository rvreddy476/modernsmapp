name: E2E

# Module-wise end-to-end flows (docs/TESTING.md W5). Each matrix entry boots the
# shared infra (Postgres/Redis/Scylla/Redpanda/MinIO) once, starts only the
# services that domain needs via run-local.sh, waits for health, then runs that
# domain's flows from the build-tagged integration harness.
#
# Flows that authenticate with a minted JWT (social/media/chat/monetization) do
# NOT need identity-auth running — the gateway just verifies the shared-secret
# token. Only the auth domain starts identity-auth.

on:
  # Manual run from any branch (lead verifies harness changes without a PR).
  workflow_dispatch:
  pull_request:
    paths:
      - 'Architecture/**'
      - 'identity-platform/**'
      - 'chat-service/**'
      - '.github/workflows/e2e.yml'
      - '.github/e2e/**'
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.domain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: auth
            services: "api-gateway identity-auth user-service"
            health: "http://localhost:8080 http://localhost:8081 http://localhost:8082"
            run: "TestE2E_Auth|TestSmoke"
          - domain: social
            services: "api-gateway user-service graph-service post-service feed-service"
            # Every service the flow calls, feed-service (8086) included: it
            # was missing, so the feed could be polled before it listened.
            health: "http://localhost:8080 http://localhost:8082 http://localhost:8083 http://localhost:8084 http://localhost:8086"
            run: "TestE2E_Social"
            # graph-service only follows ids it finds in user-service's users
            # table, so the flow needs two real rows (see "Seed E2E users").
            seed_users: true
          - domain: media
            services: "api-gateway media-service"
            health: "http://localhost:8080 http://localhost:8087"
            run: "TestE2E_Media"
          - domain: chat
            # A direct chat is decided by the sender's chat policy (identity
            # user-service) and by graph-service (the recipient follows the
            # sender), so both are part of the stack, with two seeded users.
            services: "api-gateway identity-auth identity-user user-service graph-service chat-message-service"
            health: "http://localhost:8080 http://localhost:8081 http://localhost:8097 http://localhost:8082 http://localhost:8083 http://localhost:8092"
            seed_users: true
            seed_identity: true
            # graph-service reads privacy settings from the identity
            # user-service here, as it does under docker compose.
            graph_user_url: http://localhost:8097
            run: "TestE2E_Chat"
          - domain: monetization
            services: "api-gateway user-service analytics-service graph-service post-service monetization-service"
            health: "http://localhost:8080 http://localhost:8082 http://localhost:8094 http://localhost:8083 http://localhost:8084 http://localhost:8099"
            run: "TestE2E_Monetization|TestTip|TestMembership|TestCreatorFund"
          - domain: reviewer
            services: "api-gateway reviewer-service"
            health: "http://localhost:8080 http://localhost:8120"
            run: "TestE2E_Reviewer"
          - domain: trust-safety
            services: "api-gateway trust-safety-service"
            health: "http://localhost:8080 http://localhost:8091"
            run: "TestE2E_TrustSafety"
          - domain: wallet
            services: "api-gateway wallet-service"
            health: "http://localhost:8080 http://localhost:8114"
            run: "TestE2E_Wallet"
          - domain: commerce
            # TestE2E_Commerce_FullJourney approves the seller + product via
            # /v1/admin/commerce/* on admin-service; the prepaid confirm path
            # verifies intents against payments-service.
            services: "api-gateway commerce-service admin-service payments-service"
            health: "http://localhost:8080 http://localhost:8109 http://localhost:8096 http://localhost:8102"
            run: "TestE2E_Commerce"
          - domain: dating
            services: "api-gateway dating-service"
            health: "http://localhost:8080 http://localhost:8112"
            run: "TestE2E_Dating"
          - domain: content
            services: "api-gateway user-service post-service group-service channel-service community-service qa-service memories-service"
            health: "http://localhost:8080 http://localhost:8082 http://localhost:8084 http://localhost:8090 http://localhost:8106 http://localhost:8107 http://localhost:8108 http://localhost:8104"
            run: "TestE2E_Group|TestE2E_Channel|TestE2E_Community|TestE2E_QA|TestE2E_Memories"
          - domain: discovery
            # graph-service: a signed-in search reads the viewer's blocks from it
            # and fails closed (503) without it; user-service owns its users table.
            services: "api-gateway user-service graph-service search-service notification-service analytics-service suggestion-service feature-flag-service ai-service"
            health: "http://localhost:8080 http://localhost:8082 http://localhost:8083 http://localhost:8089 http://localhost:8088 http://localhost:8094 http://localhost:8100 http://localhost:8095 http://localhost:8098"
            run: "TestE2E_Search|TestE2E_Notification|TestE2E_Analytics|TestE2E_Suggestion|TestE2E_FeatureFlag|TestE2E_AI"
          - domain: live
            # live-service (v1) is retired: the gateway answers 410 before routing.
            services: "api-gateway live-service-v2"
            health: "http://localhost:8080 http://localhost:8117"
            run: "TestE2E_Live"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          # Architecture is a Go workspace: there is no Architecture/go.sum, so
          # the old path made every run log "Restore cache failed" and build
          # each service from a cold cache.
          cache-dependency-path: Architecture/go.work.sum

      - name: Start infra (Postgres/Redis/Scylla/Redpanda/MinIO)
        # The override swaps the MinIO image only: minio/minio no longer
        # exists on Docker Hub (see the override file).
        run: >-
          docker compose
          -f Architecture/docker/docker-compose.infra.yml
          -f .github/e2e/docker-compose.e2e.yml
          up -d --wait

      - name: Start services
        env:
          # post-service refuses to start without these (32 bytes or more).
          # CI-only placeholders, like the internal key and JWT secret below;
          # Architecture/docker/local.env carries neither.
          STORY_MODERATION_HMAC_KEY: ci_e2e_only_story_moderation_hmac_key_change_me
          POST_MODERATION_HMAC_KEY: ci_e2e_only_post_moderation_hmac_key_change_me
          # local.env names no environment, and a service with none assumes
          # production: dating, commerce and wallet then refuse to start on
          # this stack's mock partners and local blob store.
          ENV: local
          # post-service asks trust-safety for the author's standing before
          # every publication and fails closed (503 STANDING_UNAVAILABLE)
          # without the signed-token key pair. This is the switch its own
          # start-up warning names for a dev stack; the standing check is
          # therefore NOT covered by these flows.
          PUBLISH_REQUIRE_STANDING_CHECK: "false"
          # Where chat-message-service finds the two user services; neither
          # is in local.env, and the defaults are docker compose host names.
          IDENTITY_USER_SERVICE_URL: http://localhost:8097
          APP_USER_SERVICE_URL: http://localhost:8082
          # Empty except in the chat job (run-local.sh, graph-service).
          GRAPH_USER_SERVICE_URL: ${{ matrix.graph_user_url }}
          # One fixed id on the live pilot list, for the host path of the live
          # flows (ATPOST_E2E_LIVE_PILOT_USER below). Not a real account.
          LIVE_PILOT_USER_IDS: 0e2e0000-0000-4000-8000-000000000001
          # commerce-service will not start without its PII salt and, on a
          # local stack, two 32-byte data keys. CI-only placeholders.
          COMMERCE_PII_LOOKUP_SALT: ci_e2e_only_pii_lookup_salt
          COMMERCE_PII_DEV_KEY_PROFILE: ci_e2e_only_pii_profile_key_0000
          COMMERCE_PII_DEV_KEY_SNAPSHOT: ci_e2e_only_pii_snapshot_key_000
        run: |
          set -e
          # Every service here shares one database and creates its own
          # tables when it boots, and some migration chains point at another
          # service's tables: graph-service and post-service at users
          # (user-service), post-service at user_preferences (feed-service)
          # and media_assets (media-service). docker compose restarts a
          # service that lost that race; run-local.sh does not, so the
          # owners go first here.
          # local.env sends AI calls to 8117, which is live-service-v2;
          # run-local.sh starts ai-service on 8098. The file exports the
          # value unconditionally, so it is corrected in this checkout only.
          sed -i 's#^export AI_SERVICE_URL=.*#export AI_SERVICE_URL="http://localhost:8098"#' Architecture/docker/local.env
          all=" ${{ matrix.services }} "
          psql_app() {
            docker compose \
              -f Architecture/docker/docker-compose.infra.yml \
              -f .github/e2e/docker-compose.e2e.yml \
              exec -T postgres psql -U postgres -d app -v ON_ERROR_STOP=1 -q "$@"
          }
          : > services.log
          if [[ "$all" == *" post-service "* ]]; then
            if [[ "$all" != *" media-service "* ]]; then
              psql_app < Architecture/services/media-service/database/setup.sql
            fi
            if [[ "$all" != *" feed-service "* ]]; then
              # Only the column post-service's migrations alter rows by.
              psql_app -c "CREATE TABLE IF NOT EXISTS user_preferences (user_id UUID PRIMARY KEY);"
            fi
          fi
          # Three tiers, each waited for before the next: table owners
          # (user, feed, analytics), then the services other chains point at
          # (graph, post: group-service needs posts), then everything else.
          tier1=""
          tier2=""
          rest=""
          for svc in ${{ matrix.services }}; do
            case "$svc" in
              user-service|feed-service|analytics-service|identity-auth) tier1="$tier1 $svc" ;;
              # identity-user only alters tables identity-auth creates.
              graph-service|post-service|identity-user) tier2="$tier2 $svc" ;;
              *) rest="$rest $svc" ;;
            esac
          done
          port_of() {
            case "$1" in
              user-service) echo 8082 ;;
              graph-service) echo 8083 ;;
              post-service) echo 8084 ;;
              feed-service) echo 8086 ;;
              analytics-service) echo 8094 ;;
              identity-auth) echo 8081 ;;
              identity-user) echo 8097 ;;
            esac
          }
          # The identity services have no root /healthz.
          path_of() {
            case "$1" in
              identity-auth) echo /v1/auth/health ;;
              identity-user) echo /v1/users/health ;;
              *) echo /healthz ;;
            esac
          }
          start_tier() {
            [ -n "$1" ] || return 0
            nohup bash Architecture/docker/run-local.sh $1 >> services.log 2>&1 &
            for svc in $1; do
              port=$(port_of "$svc")
              ok=""
              for i in $(seq 1 300); do
                code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port$(path_of "$svc")" || true)
                # Any answer below 500 means it is listening, and a service
                # applies its schema before it listens. Not only 200: the
                # identity user-service answers 401 on its health route
                # without the internal key.
                case "$code" in
                  000|5*) ;;
                  *) ok=1; break ;;
                esac
                sleep 2
              done
              if [ -z "$ok" ]; then
                echo "✗ $svc did not come up before the services that need its tables"
                tail -n 200 services.log
                exit 1
              fi
              echo "✓ $svc is up; its tables exist"
            done
          }
          # Every job has api-gateway in the last tier, so there is always
          # something for the earlier tiers to go ahead of.
          start_tier "$tier1"
          start_tier "$tier2"
          # run-local.sh backgrounds each service then waits; background the
          # whole script so the job continues. Logs stream to services.log.
          nohup bash Architecture/docker/run-local.sh $rest >> services.log 2>&1 &
          echo "RUN_LOCAL_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for health
        run: |
          set -e
          # One budget for the whole list. run-local.sh starts every service
          # with `go run`, so the first answer waits for a compile of each
          # one; the old 2 minutes per URL was never long enough.
          deadline=$((SECONDS + 900))
          for url in ${{ matrix.health }}; do
            echo "waiting for $url ..."
            while :; do
              # "Up" means the listener answers with any non-5xx status on
              # /health or /healthz: the gateway serves /health, the shared
              # health checker serves /healthz, and admin-service answers 401
              # to everything without the internal key.
              #
              # A refused connection must read as exactly 000. This used to be
              # `$(curl -w '%{http_code}' ... || echo 000)`: curl prints 000
              # itself AND exits non-zero, so the value was "000000", which is
              # not "000" and is below 500. Every URL passed at once with
              # nothing listening, the flows then skipped ("gateway not
              # reachable") and the job was green without testing anything.
              up=0
              for p in /health /healthz; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "$url$p" 2>/dev/null) || code=000
                case "$code" in
                  [1-4][0-9][0-9]) up=1; break ;;
                esac
              done
              if [ "$up" = "1" ]; then
                echo "  ✓ $url ($code)"; break
              fi
              if ! kill -0 "$RUN_LOCAL_PID" 2>/dev/null; then
                echo "  ✗ run-local.sh exited before $url answered"; tail -n 200 services.log; exit 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "  ✗ $url never became healthy (last status $code)"; tail -n 200 services.log; exit 1
              fi
              sleep 2
            done
          done

      - name: Seed E2E users
        if: matrix.seed_users
        run: |
          set -euo pipefail
          # Two users for the flows that follow and post. user-service owns
          # the users table and creates it before it listens, and the wait
          # above has seen it answer. Ids are fresh per run; the database is
          # this job's own container.
          a=$(cat /proc/sys/kernel/random/uuid)
          b=$(cat /proc/sys/kernel/random/uuid)
          docker compose \
            -f Architecture/docker/docker-compose.infra.yml \
            -f .github/e2e/docker-compose.e2e.yml \
            exec -T postgres psql -U postgres -d app -v ON_ERROR_STOP=1 -c \
            "INSERT INTO users (id, display_name, created_at, updated_at) VALUES ('$a', 'E2E user A', now(), now()), ('$b', 'E2E user B', now(), now());"
          if [ "${{ matrix.seed_identity }}" = "true" ]; then
            # The same two ids as identity accounts with open message
            # settings (the columns auth-service's CreateUserRecordTx writes).
            docker compose               -f Architecture/docker/docker-compose.infra.yml               -f .github/e2e/docker-compose.e2e.yml               exec -T postgres psql -U postgres -d identity_db -v ON_ERROR_STOP=1 -c               "INSERT INTO usr.users (id, status, is_verified, created_at, updated_at) VALUES ('$a','active',false,now(),now()), ('$b','active',false,now(),now()); INSERT INTO usr.user_settings (user_id, account_visibility, allow_messages_from, allow_comments_from, created_at, updated_at) VALUES ('$a','public','everyone','everyone',now(),now()), ('$b','public','everyone','everyone',now(),now());"
          fi
          echo "ATPOST_E2E_USER_A=$a" >> "$GITHUB_ENV"
          echo "ATPOST_E2E_USER_B=$b" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.domain }} E2E flows
        working-directory: Architecture/tools/integration
        env:
          ATPOST_RUN_INTEGRATION: "1"
          # A stack that is not reachable fails the flow instead of skipping
          # it (tools/integration client.go, StackRequired). CI=true already
          # does this on GitHub; the flag says so in this file.
          ATPOST_E2E_REQUIRE_STACK: "1"
          # The auth flow reads its e-mail verification code from the
          # development mail sender's line in the service log.
          ATPOST_E2E_MAIL_LOG: ${{ github.workspace }}/services.log
          ATPOST_E2E_LIVE_PILOT_USER: 0e2e0000-0000-4000-8000-000000000001
          # The services this entry started, for TestSmokeHealthChecks.
          ATPOST_E2E_HEALTH_URLS: ${{ matrix.health }}
          ATPOST_API_GATEWAY_URL: http://localhost:8080
          ATPOST_USER_URL: http://localhost:8082
          ATPOST_GRAPH_URL: http://localhost:8083
          ATPOST_POST_URL: http://localhost:8084
          ATPOST_MONETIZATION_URL: http://localhost:8099
          ATPOST_INTERNAL_KEY: local_dev_internal_service_key_change_me
          ATPOST_JWT_SECRET: local_dev_jwt_change_me
        run: |
          set -o pipefail
          go test -tags integration -v -count=1 -run "${{ matrix.run }}" ./... | tee "$RUNNER_TEMP/e2e.out"
          # go test exits 0 when every flow skipped, or when -run matched
          # nothing ("no tests to run"). Neither is a pass.
          if ! grep -q -- '^--- PASS' "$RUNNER_TEMP/e2e.out"; then
            echo "::error::no ${{ matrix.domain }} flow passed: every flow skipped or -run matched nothing"
            exit 1
          fi

      - name: Dump service logs on failure
        if: failure()
        run: tail -n 300 services.log || true
