name: iOS Native CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-native.yml'
  pull_request:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-packages:
    name: Swift Test (Core & Features) & App Build
    # The packages are iOS-only (UIKit representables, AVAudioSession), so they
    # are tested on an iOS simulator via xcodebuild; `swift test` builds for
    # macOS and cannot compile them. Xcode 16 / iOS 18 SDK is what the code is
    # written against (View is @MainActor there).
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          xcode=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run UsCore Tests
        run: |
          cd mobile/ios/Packages/UsCore
          xcodebuild test -scheme UsCore-Package -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

      - name: Run UsFeatures Tests
        run: |
          cd mobile/ios/Packages/UsFeatures
          xcodebuild test -scheme UsFeatures-Package -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

      - name: Validate XcodeGen Project Generation
        run: |
          brew install xcodegen
          cd mobile/ios
          xcodegen generate

      - name: Build iOS App Target
        run: |
          cd mobile/ios
          xcodebuild -project Us.xcodeproj -scheme Us -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
