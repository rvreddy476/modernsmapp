name: Security

on:
  # Manual run from any branch (lead verifies harness changes without a PR).
  workflow_dispatch:
  pull_request:
  # codex/** too (17 Nov, reels-9): the scheduled run below always uses the
  # copy of this file on main, which predates the per-module govulncheck and
  # .gitleaksignore fixes on the release branch, so it has failed every week
  # since 30 Aug and says nothing about the code being released. Pushes to
  # the release branch scan its head with the fixed jobs.
  push:
    branches:
      - main
      - 'codex/**'
  schedule:
    # Weekly Sunday 02:00 UTC — keeps govulncheck/Trivy current without
    # blocking every PR on slow scans.
    - cron: '0 2 * * 0'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Push and PR: the action scans only the commits in the push / PR
      # (fast; it logs "N commits scanned").
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Gate line 4: the weekly run and a manual dispatch scan the WHOLE
      # history of every ref fetched, with the same gitleaks the action uses
      # and the same .gitleaksignore. Pinned release, checksum-verified.
      # --redact: a finding prints its fingerprint, never the value.
      - name: gitleaks full history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --log-opts="--full-history --all" \
            --gitleaks-ignore-path .gitleaksignore .

  govulncheck:
    name: govulncheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Per module, from each go.work's `use` list: govulncheck at a go.work
        # root fails ("govulncheck only works with Go modules").
        workspace: [Architecture, identity-platform, chat-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.workspace }}/go.work
          cache-dependency-path: ${{ matrix.workspace }}/**/go.sum
      - name: install
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan every module
        env:
          WS: ${{ matrix.workspace }}
        run: |
          mapfile -t MODULES < <(cd "$WS" && go work edit -json | jq -r '.Use[].DiskPath' | sed 's#^\./##' | sort)
          failed=()
          for m in "${MODULES[@]}"; do
            echo "::group::$WS/$m"
            # A module whose every package carries the integration tag
            # (Architecture/tools/integration) matches no packages without it.
            tags=()
            if [ -z "$(cd "$WS/$m" && go list ./... 2>/dev/null)" ]; then tags=(-tags integration); fi
            if (cd "$WS/$m" && govulncheck "${tags[@]}" ./...); then
              echo "PASS govulncheck $WS/$m"
            else
              echo "FAIL govulncheck $WS/$m"
              failed+=("$WS/$m")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "RESULT FAIL (${#failed[@]} modules): ${failed[*]}"
            exit 1
          fi
          echo "RESULT PASS"

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      # Pinned to the v0.36.0 commit (was @master, a moving branch of a
      # third-party action that runs with this job's token).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
