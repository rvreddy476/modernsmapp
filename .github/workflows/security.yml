name: Security

on:
  # Manual run from any branch (lead verifies harness changes without a PR).
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Sunday 02:00 UTC — keeps govulncheck/Trivy current without
    # blocking every PR on slow scans.
    - cron: '0 2 * * 0'

jobs:
  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  govulncheck:
    name: govulncheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Per module, from each go.work's `use` list: govulncheck at a go.work
        # root fails ("govulncheck only works with Go modules").
        workspace: [Architecture, identity-platform, chat-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.workspace }}/go.work
          cache-dependency-path: ${{ matrix.workspace }}/**/go.sum
      - name: install
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan every module
        env:
          WS: ${{ matrix.workspace }}
        run: |
          mapfile -t MODULES < <(cd "$WS" && go work edit -json | jq -r '.Use[].DiskPath' | sed 's#^\./##' | sort)
          failed=()
          for m in "${MODULES[@]}"; do
            echo "::group::$WS/$m"
            if (cd "$WS/$m" && govulncheck ./...); then
              echo "PASS govulncheck $WS/$m"
            else
              echo "FAIL govulncheck $WS/$m"
              failed+=("$WS/$m")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "RESULT FAIL (${#failed[@]} modules): ${failed[*]}"
            exit 1
          fi
          echo "RESULT PASS"

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
