# Build + push service images to ECR, then bump the tag in the
# deploy/services/<svc>/values-staging.yaml file (the promotion candidate).
#
# Trigger model (3 Oct 2026, aws-first-production-deployment W5):
#   push to main       → build the changed services → push :<git sha> →
#                        bump values-staging.yaml → commit + push back.
#   workflow_dispatch  → 'all' or a comma list of DEPLOY names.
#
# release/prod is deliberately NOT a trigger: production runs the exact image
# built from main, promoted by promote.yml as a values-only change, so the sha
# in prod is bit-identical to what was tested. Nothing is ever rebuilt on
# promote.
#
# Image names use the DEPLOY convention (= ECR repo atpost/<name> = the
# deploy/services/<name> dir = Terraform service_names):
#   Architecture/services/<s>      → <s>
#   identity-platform/services/<s> → identity-<s>   (identity-auth-service, …)
#   chat-service/services/<s>      → chat-<s>       (chat-message-service, chat-ws-gateway, chat-call-service)
# This mirrors build-push-acr.yml, which was the only workflow that had the
# identity/chat names right; the old ECR workflow built them under the source
# dir name, so no registry ever held them.
#
# A service with a Dockerfile.worker gets a second image <name>-worker from
# the same context (media-service → atpost/media-worker).
#
# Not built (retired or never deployed; the gateway answers 404/410 for them):
#   memories-service, feature-flag-service, reviewer-service, live-service (v1).
# food-service and suggestion-service ARE built (they have ECR repos, roles and
# values since 3 Oct).

name: build-push

on:
  push:
    branches:
      - main
    paths:
      - "Architecture/services/**"
      - "Architecture/shared/**"
      - "Architecture/vendor/**"
      - "identity-platform/**"
      - "chat-service/**"
      # NOT deploy/services/**: the bump job commits there, and a values-only
      # change needs no new image (ArgoCD reads the values directly).
      - ".github/workflows/build-push.yml"
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated DEPLOY names to rebuild (e.g. post-service,identity-auth-service) or 'all'"
        required: true
        default: "all"

env:
  AWS_REGION: ap-south-1
  ECR_PREFIX: atpost
  # Source directories that are never built. Matched against the deploy name.
  EXCLUDED_SERVICES: "memories-service feature-flag-service reviewer-service live-service"

permissions:
  contents: write        # needed to push the bumped values file back
  id-token: write        # OIDC token to assume the CI role
  pull-requests: read    # for the changed-files action

jobs:
  # ─── Job 1: figure out which services to build ───────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.services }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Resolve the service set (comma-separated deploy names), then emit it
          # two ways: services= (CSV, for the if-guards + bump job) and matrix=
          # (JSON array; Actions expressions have no split(), so jq builds it).
          exclude() {
            grep -v '_archived' | while read -r s; do
              skip=0
              for x in $EXCLUDED_SERVICES; do [[ "$s" == "$x" ]] && skip=1; done
              [[ $skip -eq 0 ]] && echo "$s"
            done
          }
          all_services() {
            for d in Architecture/services/*/;     do echo "$(basename "$d")"; done
            for d in identity-platform/services/*/; do echo "identity-$(basename "$d")"; done
            for d in chat-service/services/*/;      do echo "chat-$(basename "$d")"; done
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED" != "all" ]]; then
            SVCS="$(printf '%s' "$REQUESTED" | tr ',' '\n' | sed 's/ //g' | exclude | sort -u | paste -sd, -)"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SVCS="$(all_services | exclude | sort -u | paste -sd, -)"
          else
            BASE="$BEFORE"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)
            fi
            CHANGED="$(git diff --name-only "$BASE" HEAD)"
            # A change to a workspace's shared code or vendor tree rebuilds every
            # service in that workspace; a change inside one service rebuilds
            # that service only.
            SVCS=$( {
              printf '%s\n' "$CHANGED" | awk -F/ '
                /^Architecture\/services\// && NF >= 3 { print $3 }
                /^identity-platform\/services\// && NF >= 3 { print "identity-" $3 }
                /^chat-service\/services\// && NF >= 3 { print "chat-" $3 }
              '
              if printf '%s\n' "$CHANGED" | grep -qE '^Architecture/(shared|vendor)/'; then
                for d in Architecture/services/*/; do echo "$(basename "$d")"; done
              fi
              if printf '%s\n' "$CHANGED" | grep -qE '^identity-platform/(shared|vendor)/'; then
                for d in identity-platform/services/*/; do echo "identity-$(basename "$d")"; done
              fi
              if printf '%s\n' "$CHANGED" | grep -qE '^chat-service/(shared|vendor)/'; then
                for d in chat-service/services/*/; do echo "chat-$(basename "$d")"; done
              fi
            } | exclude | sort -u | paste -sd, -)
          fi
          echo "services=$SVCS" >> "$GITHUB_OUTPUT"
          if [[ -z "$SVCS" ]]; then
            echo "No service changes detected; nothing to do."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "Building: $SVCS"
            echo "matrix=$(printf '%s' "$SVCS" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"
          fi

  # ─── Job 2: matrixed build + push ────────────────────────────────
  build-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve service path
        id: path
        env:
          SVC: ${{ matrix.service }}
        run: |
          # Map the deploy name back to its source dir. workspace_root = the Go
          # workspace root (go.work + vendor/ + shared/ + services/) and is the
          # Docker build CONTEXT; the image keeps the deploy name (SVC).
          if [[ -d "Architecture/services/$SVC" ]]; then
            root=Architecture; src="$SVC"
          elif [[ "$SVC" == identity-* && -d "identity-platform/services/${SVC#identity-}" ]]; then
            root=identity-platform; src="${SVC#identity-}"
          elif [[ "$SVC" == chat-* && -d "chat-service/services/${SVC#chat-}" ]]; then
            root=chat-service; src="${SVC#chat-}"
          else
            echo "::error ::service '$SVC' not found under any workspace (use the deploy name: identity-auth-service, chat-message-service, …)"; exit 1
          fi
          [[ -f "$root/services/$src/Dockerfile" ]] || { echo "::error ::$root/services/$src has no Dockerfile"; exit 1; }
          echo "service_path=$root/services/$src" >> "$GITHUB_OUTPUT"
          echo "workspace_root=$root" >> "$GITHUB_OUTPUT"
          # A service that ships a Dockerfile.worker gets a SECOND image,
          # <name>-worker (media-service -> atpost/media-worker), built below
          # from the same context. Empty when there is none.
          if [[ -f "$root/services/$src/Dockerfile.worker" ]]; then
            echo "worker_dockerfile=$root/services/$src/Dockerfile.worker" >> "$GITHUB_OUTPUT"
            echo "worker_image=${SVC%-service}-worker" >> "$GITHUB_OUTPUT"
          else
            echo "worker_dockerfile=" >> "$GITHUB_OUTPUT"
            echo "worker_image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The EKS node groups are Graviton (arm64); the runner is x86, so the
      # build runs under QEMU unless the Dockerfile cross-compiles.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.path.outputs.workspace_root }}
          file: ${{ steps.path.outputs.service_path }}/Dockerfile
          push: true
          # One tag: the immutable :<sha> that ArgoCD pins. No moving
          # :<env>-latest — ECR is IMMUTABLE and refuses to re-point a tag.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/arm64
          provenance: false

      # P-17 (docs/designs/copyright-match-plan.md §4): the transcode worker is
      # its own image — Dockerfile.worker carries ffmpeg and cmd/worker, the
      # server image carries neither. Same context, same platform, its own
      # repository and cache scope, the same commit sha that bump-tag writes
      # into worker.image.tag. The ECR repository atpost/<name>-worker must
      # exist (infra/terraform envs: worker_image_names).
      - name: Build + push worker image
        if: ${{ steps.path.outputs.worker_dockerfile != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.path.outputs.workspace_root }}
          file: ${{ steps.path.outputs.worker_dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PREFIX }}/${{ steps.path.outputs.worker_image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.path.outputs.worker_image }}
          cache-to: type=gha,mode=max,scope=${{ steps.path.outputs.worker_image }}
          platforms: linux/arm64
          provenance: false

  # ─── Job 3: bump tag in the staging values file + push back ──────
  # values-staging.yaml is the promotion candidate: promote.yml copies its
  # image.tag into values-qa.yaml (target qa, PR against branch qa) or
  # values-prod.yaml (target prod, PR against release/prod). Service images
  # are environment-neutral (tag = git sha), so one build serves both. The
  # staging cluster itself is not built.
  bump-tag:
    needs: [detect-changes, build-push]
    if: ${{ needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Token with push perms — repo settings must grant the
          # default GITHUB_TOKEN write:contents.
          token: ${{ secrets.VALUES_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "atpost-ci"
          git config user.email "ci@atpost.io"

      - name: Bump image.tag per service
        env:
          ENV_NAME: staging
          SERVICES: ${{ needs.detect-changes.outputs.services }}
          SHA: ${{ github.sha }}
        run: |
          IFS=, read -ra SVCS <<< "$SERVICES"
          for svc in "${SVCS[@]}"; do
            f="deploy/services/$svc/values-$ENV_NAME.yaml"
            if [[ ! -f "$f" ]]; then
              echo "::warning ::$f missing — skipping bump for $svc"
              continue
            fi
            # Key-specific: image.tag always; worker.image.tag only when a
            # worker image was pushed at this sha (Dockerfile.worker) or the
            # worker runs from the server image. Tested by scripts/ci/values-tag-test.sh.
            bash scripts/ci/bump-service-tags.sh "$svc" "$f" "$SHA"
            git add "$f"
          done
          # No-op when there was nothing to commit (e.g. the only
          # changes were the values files themselves).
          if ! git diff --cached --quiet; then
            # [skip ci]: the bump commit must never start another build.
            git commit -m "ci(deploy): bump $ENV_NAME image tags to $SHA [skip ci]"
            git push
          else
            echo "No values changes to commit."
          fi
