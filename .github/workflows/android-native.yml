name: Android Native CI

# Phase 0 CI for the native Android app under mobile/android/.
# Deliberately scoped by path so it never runs for backend or Flutter changes.
#
# Jobs 1-7 correspond to PHASE_0_1_PLAN.md §E. Instrumented tests, the
# macrobenchmark gate, and Paparazzi screenshots are intentionally absent —
# they arrive in Phases 2 and 4. The `benchmark` job name is reserved below
# so wiring it later is a one-line change.

on:
  push:
    # codex/** too (17 Nov, reels-9): release work lands as direct pushes.
    branches:
      - main
      - 'codex/**'
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-native.yml'
      - 'scripts/verify/android.sh'
      - 'scripts/verify/lib.sh'
      - 'scripts/ci/android-placeholder-google-services.sh'
      - 'scripts/ci/android-deps-lockfile.sh'
      - 'scripts/ci/android-release-deps.init.gradle'
      - 'scripts/ci/osv-gate.mjs'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-native.yml'
      - 'scripts/verify/android.sh'
      - 'scripts/verify/lib.sh'
      - 'scripts/ci/android-placeholder-google-services.sh'
      - 'scripts/ci/android-deps-lockfile.sh'
      - 'scripts/ci/android-release-deps.init.gradle'
      - 'scripts/ci/osv-gate.mjs'
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:00 UTC: the dependency scan only (new advisories
    # land without a code change). Runs the copy of this file on main.
    - cron: '0 3 * * 0'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile/android

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  build:
    name: Assemble, test and analyse
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/verify/android.sh --base diffs against the merge base.
          fetch-depth: 0

      # JDK 21 runs the Gradle daemon; modules still emit Java 17 bytecode
      # (source/targetCompatibility 17). See README "Toolchain".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The action's default package list is "tools platform-tools"; the
      # obsolete "tools" package no longer exists in the SDK repository, so
      # `sdkmanager tools` exited 1 right after the licences were accepted
      # (16 Oct run). Install what the build compiles against instead:
      # compileSdk 37 (AndroidSdk.COMPILE, build-logic/convention/.../
      # ProjectExtensions.kt) and the matching build-tools. The action
      # accepts the licences non-interactively.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Firebase config. Deliberately NOT in the repo (see mobile/android/
      # .gitignore): it carries a project API key that is package-restricted
      # but still an identifier this repo should not publish. The google-services
      # Gradle plugin fails the build without it, so CI materialises it from a
      # secret holding the base64 of the file downloaded from the Firebase
      # console. Set GOOGLE_SERVICES_JSON in repository secrets.
      #
      # Without the secret (17 Nov, reels-9: every run since August failed
      # here, before Gradle, so no unit test ran in CI):
      #   - push to main: fail, with this message; main must build for real;
      #   - anything else (PR, codex/** push, manual): write a clearly fake
      #     placeholder (scripts/ci/android-placeholder-google-services.sh)
      #     so compile, unit tests, lint and detekt run; the release build
      #     below is then skipped, and nothing built here is uploaded.
      # Local runs (scripts/verify/android.sh) use the developer's own
      # gitignored file and never see the placeholder.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # The run steps' working directory is already mobile/android.
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "FIREBASE_CONFIG=real" >> "$GITHUB_ENV"
            echo "clients:"
            grep -o '"package_name": "[^"]*"' app/google-services.json | cut -d'"' -f4
          elif [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            echo "::error title=GOOGLE_SERVICES_JSON missing::The GOOGLE_SERVICES_JSON repository secret is empty. A push to main must build with the real Firebase config: add the secret (base64 of mobile/android/app/google-services.json) under Settings > Secrets and variables > Actions."
            exit 1
          else
            bash ../../scripts/ci/android-placeholder-google-services.sh app/google-services.json \
              com.us.android com.us.android.dev com.us.android.staging
            echo "FIREBASE_CONFIG=placeholder" >> "$GITHUB_ENV"
            echo "::warning title=Placeholder Firebase config::GOOGLE_SERVICES_JSON is not set: unit tests, lint and detekt run against a fake google-services.json; the prodRelease build is skipped. Add the secret to build for real."
          fi

      # ── The agents' check (docs/harness/AGENT-RULES.md) ───────────────
      # The same command agents and the lead run: moduleGraphCheck, the unit
      # tests of every module changed since the base, the unit-test sources
      # of their dependents, :app:compileDevDebugKotlin and detekt. Online,
      # since a fresh runner has no Gradle cache (the script defaults to
      # --offline). A change to build-logic, gradle/ or a root build file
      # checks every module.
      - name: Agent check (scripts/verify/android.sh --full)
        env:
          ANDROID_VERIFY_ONLINE: '1'
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
               git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="HEAD~1"
          fi
          echo "base: $BASE"
          bash ../../scripts/verify/android.sh --full --base "$BASE"

      # ── Job 1: assemble ───────────────────────────────────────────────
      - name: Assemble devDebug
        run: ./gradlew assembleDevDebug

      # ── Job 2: unit tests ─────────────────────────────────────────────
      # Two task names on purpose. Library modules have no product flavors,
      # so their task is `testDebugUnitTest`; only :app is flavored and has
      # `testDevDebugUnitTest`. Running just the latter silently skips every
      # library module's tests.
      # The agent check above already ran the changed modules' tests and
      # detekt; Gradle finds those up to date here, so this adds only the
      # untouched modules.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :app:testDevDebugUnitTest

      # ── Job 3: Android lint ───────────────────────────────────────────
      - name: Lint
        run: ./gradlew lintDevDebug

      # ── Job 7: release build (unsigned) ───────────────────────────────
      # Catches R8, manifest merge, and resource-shrink breakage early,
      # long before there is a signing config (blocker B6).
      # Never with the placeholder Firebase config (see "Write
      # google-services.json"): a release build needs the real file.
      - name: Assemble prodRelease (unsigned)
        if: env.FIREBASE_CONFIG == 'real'
        run: ./gradlew assembleProdRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            mobile/android/**/build/reports/**
            mobile/android/**/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ── Gate line 5: dependency vulnerability scan ──────────────────────
  # osv-scanner over the release runtime classpaths of every application
  # module (scripts/ci/android-deps-lockfile.sh writes them as a Gradle
  # lockfile; the project keeps no lockfiles of its own). FAILS on a HIGH or
  # CRITICAL finding with a fixed version; everything else only prints
  # (scripts/ci/osv-gate.mjs). Never needs GOOGLE_SERVICES_JSON: Gradle
  # configuration gets the placeholder file. To accept a finding, add an
  # [[IgnoredVulns]] entry (id, ignoreUntil, reason) to an osv-scanner.toml
  # next to the lockfile and pass it with --config.
  dependency-scan:
    name: Dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Placeholder google-services.json
        run: |
          bash ../../scripts/ci/android-placeholder-google-services.sh app/google-services.json \
            com.us.android com.us.android.dev com.us.android.staging

      - name: Release dependency list
        run: bash ../../scripts/ci/android-deps-lockfile.sh "$RUNNER_TEMP/android-release.lockfile"

      - name: Install osv-scanner ${{ env.OSV_SCANNER_VERSION }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/osv-scanner"
          curl -sSfL -o "$bin" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin" | sha256sum -c -
          chmod +x "$bin"
          "$bin" --version

      - name: Scan (fail on high/critical with a fix)
        run: |
          set -euo pipefail
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan source \
            -L "gradle.lockfile:$RUNNER_TEMP/android-release.lockfile" \
            --format json --output-file "$RUNNER_TEMP/osv.json" || rc=$?
          # 0 = clean, 1 = findings (the gate decides); anything else is an
          # error (127) or no packages read (128), which must not pass.
          if [ "$rc" -gt 1 ]; then
            echo "::error title=osv-scanner failed::exit $rc"
            exit 1
          fi
          node ../../scripts/ci/osv-gate.mjs "$RUNNER_TEMP/osv.json"

  # Reserved. Enabled in Phase 4, when the macrobenchmark module exists and
  # jank / startup numbers become merge gates (parent plan §7).
  benchmark:
    name: Macrobenchmark (Phase 4)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enabled in Phase 4."
