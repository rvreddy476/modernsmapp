name: Android Native CI

# Phase 0 CI for the native Android app under mobile/android/.
# Deliberately scoped by path so it never runs for backend or Flutter changes.
#
# Jobs 1-7 correspond to PHASE_0_1_PLAN.md §E. Instrumented tests, the
# macrobenchmark gate, and Paparazzi screenshots are intentionally absent —
# they arrive in Phases 2 and 4. The `benchmark` job name is reserved below
# so wiring it later is a one-line change.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-native.yml'
      - 'scripts/verify/android.sh'
      - 'scripts/verify/lib.sh'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-native.yml'
      - 'scripts/verify/android.sh'
      - 'scripts/verify/lib.sh'
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile/android

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.welcome=never

jobs:
  build:
    name: Assemble, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/verify/android.sh --base diffs against the merge base.
          fetch-depth: 0

      # JDK 21 runs the Gradle daemon; modules still emit Java 17 bytecode
      # (source/targetCompatibility 17). See README "Toolchain".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The action's default package list is "tools platform-tools"; the
      # obsolete "tools" package no longer exists in the SDK repository, so
      # `sdkmanager tools` exited 1 right after the licences were accepted
      # (16 Oct run). Install what the build compiles against instead:
      # compileSdk 37 (AndroidSdk.COMPILE, build-logic/convention/.../
      # ProjectExtensions.kt) and the matching build-tools. The action
      # accepts the licences non-interactively.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Firebase config. Deliberately NOT in the repo (see mobile/android/
      # .gitignore): it carries a project API key that is package-restricted
      # but still an identifier this repo should not publish. The google-services
      # Gradle plugin fails the build without it, so CI materialises it from a
      # secret holding the base64 of the file downloaded from the Firebase
      # console. Set GOOGLE_SERVICES_JSON in repository secrets.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set — the Android build cannot run." >&2
            exit 1
          fi
          # The run steps' working directory is already mobile/android.
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "clients:"
          grep -o '"package_name": "[^"]*"' app/google-services.json | cut -d'"' -f4

      # ── The agents' check (docs/harness/AGENT-RULES.md) ───────────────
      # The same command agents and the lead run: moduleGraphCheck, the unit
      # tests of every module changed since the base, the unit-test sources
      # of their dependents, :app:compileDevDebugKotlin and detekt. Online,
      # since a fresh runner has no Gradle cache (the script defaults to
      # --offline). A change to build-logic, gradle/ or a root build file
      # checks every module.
      - name: Agent check (scripts/verify/android.sh --full)
        env:
          ANDROID_VERIFY_ONLINE: '1'
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
               git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE="HEAD~1"
          fi
          echo "base: $BASE"
          bash ../../scripts/verify/android.sh --full --base "$BASE"

      # ── Job 1: assemble ───────────────────────────────────────────────
      - name: Assemble devDebug
        run: ./gradlew assembleDevDebug

      # ── Job 2: unit tests ─────────────────────────────────────────────
      # Two task names on purpose. Library modules have no product flavors,
      # so their task is `testDebugUnitTest`; only :app is flavored and has
      # `testDevDebugUnitTest`. Running just the latter silently skips every
      # library module's tests.
      # The agent check above already ran the changed modules' tests and
      # detekt; Gradle finds those up to date here, so this adds only the
      # untouched modules.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :app:testDevDebugUnitTest

      # ── Job 3: Android lint ───────────────────────────────────────────
      - name: Lint
        run: ./gradlew lintDevDebug

      # ── Job 7: release build (unsigned) ───────────────────────────────
      # Catches R8, manifest merge, and resource-shrink breakage early,
      # long before there is a signing config (blocker B6).
      - name: Assemble prodRelease (unsigned)
        run: ./gradlew assembleProdRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            mobile/android/**/build/reports/**
            mobile/android/**/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # Reserved. Enabled in Phase 4, when the macrobenchmark module exists and
  # jank / startup numbers become merge gates (parent plan §7).
  benchmark:
    name: Macrobenchmark (Phase 4)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enabled in Phase 4."
