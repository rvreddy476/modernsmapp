# Promote images to an environment: a values-only PR.
#
# Manually dispatched only — promotion is a deliberate human action. Two
# targets (input `target`):
#
#   qa    PR against branch `qa`, editing deploy/**/values-qa.yaml. The job
#         first waits on the GitHub environment `qa` (required reviewer =
#         founder). QA ArgoCD tracks branch `qa` and syncs MANUALLY at first.
#   prod  PR against release/prod, editing deploy/**/values-prod.yaml —
#         exactly as before QA existed (no environment gate on this job).
#
# Services: reads image.tag (and worker.image.tag) from
# deploy/services/<svc>/values-staging.yaml — the candidate build-push.yml
# writes on every main build — and copies them into values-<target>.yaml.
#
# Web: build-web.yml prints the commit shas it pushed (atpost/web from
# postbook-ui, atpost/admin-console from atpost-web-ui). Pass them as
# web_tag / admin_console_tag and they are written into
# deploy/web/app/values-<target>.yaml and
# deploy/web/admin-console/values-<target>.yaml. A web image bakes its
# NEXT_PUBLIC_* URLs at build time, so promote to qa only a web tag that
# build-web built with environment=qa.
#
# Service images are environment-neutral (tag = git sha) and already exist in
# ECR, so promotion is purely a values-file edit. No rebuild.
#
# release/prod and qa are created by the lead at deploy time (git branch from
# main); until the target branch exists this workflow fails at `git fetch`.
# ArgoCD is MANUAL sync: merging the PR changes the desired state only; the
# lead syncs each app.

name: promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to promote to: qa (PR to branch qa) or prod (PR to release/prod)"
        type: choice
        options: [qa, prod]
        default: qa
      services:
        description: "Comma-separated service names to promote, 'all', or blank for web only"
        required: false
        default: ""
      web_tag:
        description: "atpost/web tag (postbook-ui commit sha from build-web), blank = unchanged"
        required: false
        default: ""
      admin_console_tag:
        description: "atpost/admin-console tag (atpost-web-ui commit sha from build-web), blank = unchanged"
        required: false
        default: ""
      reason:
        description: "Short reason for the promotion (lands in PR body)"
        required: true
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  # QA promotions wait here for the `qa` environment's required reviewer.
  # Only this gate runs in the environment; the promote job below needs no
  # cloud credentials, only the repository token.
  approve-qa:
    name: approve (qa)
    if: ${{ github.event.inputs.target == 'qa' }}
    runs-on: ubuntu-latest
    environment: qa
    permissions: {}
    steps:
      - name: Approved
        run: echo "QA promotion approved by the qa environment reviewer."

  promote:
    needs: approve-qa
    # prod: the gate is skipped and the job runs as before; qa: only after
    # the gate succeeded.
    if: ${{ !cancelled() && ((github.event.inputs.target == 'qa' && needs.approve-qa.result == 'success') || (github.event.inputs.target == 'prod' && needs.approve-qa.result == 'skipped')) }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        env:
          SERVICES: ${{ github.event.inputs.services }}
          WEB_TAG: ${{ github.event.inputs.web_tag }}
          ADMIN_TAG: ${{ github.event.inputs.admin_console_tag }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          case "$TARGET" in
            qa)   BASE=qa ;;
            prod) BASE=release/prod ;;
            *)    echo "::error ::target must be qa or prod, got '$TARGET'"; exit 1 ;;
          esac
          echo "BASE_BRANCH=$BASE" >> "$GITHUB_ENV"
          if [[ -z "$SERVICES" && -z "$WEB_TAG" && -z "$ADMIN_TAG" ]]; then
            echo "::error ::nothing to promote: give services, web_tag or admin_console_tag"
            exit 1
          fi
          if [[ -z "$REASON" ]]; then
            echo "::error ::reason input required (lands in the PR body)"
            exit 1
          fi
          # Web tags are full commit shas (build-web tags with the checkout's
          # commit); anything else is a typo that would fail the image pull.
          for t in "$WEB_TAG" "$ADMIN_TAG"; do
            if [[ -n "$t" && ! "$t" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error ::'$t' is not a 40-character commit sha"
              exit 1
            fi
          done

      - name: Resolve service list
        id: list
        env:
          REQUESTED: ${{ github.event.inputs.services }}
        run: |
          if [[ "$REQUESTED" == "all" ]]; then
            LIST=$(ls -d deploy/services/*/ | xargs -I{} basename {} | sort -u | paste -sd, -)
          else
            LIST="$(printf '%s' "$REQUESTED" | tr -d ' ')"
          fi
          echo "services=$LIST" >> "$GITHUB_OUTPUT"
          echo "Promoting services to $TARGET: ${LIST:-none}"

      - name: Configure git
        run: |
          git config user.name "atpost-ci"
          git config user.email "ci@atpost.io"

      - name: Create promotion branch
        id: branch
        run: |
          if [[ "$TARGET" == "prod" ]]; then
            BRANCH="promote/$(date -u +%Y%m%d-%H%M%S)"
          else
            BRANCH="promote/$TARGET-$(date -u +%Y%m%d-%H%M%S)"
          fi
          # Candidate tags and the tag helper come from THIS checkout (main);
          # the target branch may not carry the helper yet.
          cp scripts/ci/values-tag.sh "$RUNNER_TEMP/values-tag.sh"
          mkdir -p "$RUNNER_TEMP/staging"
          for d in deploy/services/*/; do
            svc=$(basename "$d")
            [[ -f "$d/values-staging.yaml" ]] && cp "$d/values-staging.yaml" "$RUNNER_TEMP/staging/$svc.yaml"
          done
          # Start from the target branch so the PR is only the values bump,
          # not anything else merged to main since.
          git fetch origin "$BASE_BRANCH"
          git checkout -b "$BRANCH" "origin/$BASE_BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Promote tags
        id: promote
        env:
          SERVICES: ${{ steps.list.outputs.services }}
          WEB_TAG: ${{ github.event.inputs.web_tag }}
          ADMIN_TAG: ${{ github.event.inputs.admin_console_tag }}
        run: |
          vt="$RUNNER_TEMP/values-tag.sh"
          PROMOTED=()
          if [[ -n "$SERVICES" ]]; then
            IFS=, read -ra SVCS <<< "$SERVICES"
          else
            SVCS=()
          fi
          for svc in "${SVCS[@]}"; do
            staging="$RUNNER_TEMP/staging/$svc.yaml"
            dest="deploy/services/$svc/values-$TARGET.yaml"
            if [[ ! -f "$staging" || ! -f "$dest" ]]; then
              echo "::warning ::$svc missing values files — skipping"
              continue
            fi
            # Key-specific (P-17): image.tag, and worker.image.tag when the
            # candidate has one — each copied from its own key, so a worker
            # tag is never overwritten with the server's.
            staging_tag=$(bash "$vt" get "$staging" image.tag)
            dest_tag=$(bash "$vt" get "$dest" image.tag)
            staging_worker_tag=$(bash "$vt" get "$staging" worker.image.tag 2>/dev/null || true)
            dest_worker_tag=$(bash "$vt" get "$dest" worker.image.tag 2>/dev/null || true)
            if [[ -z "$staging_tag" || "$staging_tag" == "latest" ]]; then
              echo "::warning ::$svc has no built candidate tag yet — skipping"
              continue
            fi
            if [[ "$staging_tag" == "$dest_tag" && "$staging_worker_tag" == "$dest_worker_tag" ]]; then
              echo "::notice ::$svc already at $staging_tag in $TARGET"
              continue
            fi
            bash "$vt" set "$dest" image.tag "$staging_tag"
            if [[ -n "$staging_worker_tag" ]]; then
              bash "$vt" set "$dest" worker.image.tag "$staging_worker_tag"
            fi
            git add "$dest"
            PROMOTED+=("$svc:${dest_tag:-none}→$staging_tag")
          done
          web() {
            local name="$1" tag="$2" dest="deploy/web/$1/values-$TARGET.yaml"
            [[ -n "$tag" ]] || return 0
            [[ -f "$dest" ]] || { echo "::error ::$dest missing on $BASE_BRANCH"; exit 1; }
            local old
            old=$(bash "$vt" get "$dest" image.tag)
            if [[ "$old" == "$tag" ]]; then
              echo "::notice ::$name already at $tag in $TARGET"
              return 0
            fi
            bash "$vt" set "$dest" image.tag "$tag"
            git add "$dest"
            PROMOTED+=("web/$name:${old:-none}→$tag")
          }
          web app "$WEB_TAG"
          web admin-console "$ADMIN_TAG"
          if [[ ${#PROMOTED[@]} -eq 0 ]]; then
            echo "::notice ::Nothing to promote — exit clean."
            echo "promoted=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'promoted=%s\n' "${PROMOTED[*]}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(deploy): promote ${#PROMOTED[@]} image(s) to $TARGET"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open promotion PR
        if: ${{ steps.promote.outputs.promoted != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
          REASON: ${{ github.event.inputs.reason }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          # PROMOTED is space-separated tokens of form name:oldtag→newtag.
          {
            if [[ "$TARGET" == "prod" ]]; then echo "## Promotion"; else echo "## Promotion to $TARGET"; fi
            echo
            echo "**Reason:** $REASON"
            echo
            echo "**Triggered by:** @$ACTOR"
            echo
            echo "### Images"
            echo
            for tok in $PROMOTED; do
              echo "- \`${tok%%:*}\`: ${tok#*:}"
            done
            echo
            echo "### Verify before merge"
            echo
            echo "- [ ] Each tag was built from main (build-push / build-web run is green)."
            if [[ "$TARGET" == "prod" ]]; then
              echo "- [ ] Dev has been running the same code for the soak window."
              echo "- [ ] No open prod incidents."
              echo
              echo "Production ArgoCD is MANUAL sync: merging this PR only changes the"
              echo "desired state. After merging, sync each promoted app in ArgoCD"
              echo "and watch it become Healthy."
            else
              echo "- [ ] Web tags (if any) were built by build-web with environment=qa."
              echo
              echo "QA ArgoCD tracks branch \`qa\` and is MANUAL sync: merging this PR only"
              echo "changes the desired state. After merging, sync each promoted app in"
              echo "the QA ArgoCD and watch it become Healthy."
            fi
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "promote: $(echo "$PROMOTED" | wc -w | tr -d ' ') image(s) → $TARGET" \
            --body-file "$RUNNER_TEMP/pr-body.md"
