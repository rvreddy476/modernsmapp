# Standalone local database tooling; does not recreate application services.
# Credentials are generated into the ignored .secrets directory.
services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atpost-pgadmin-local
    restart: unless-stopped
    env_file:
      - ../../.secrets/pgadmin.local.env
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.local.json:/pgadmin4/servers.json:ro
    networks:
      - database
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/misc/ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

volumes:
  pgadmin_data:

networks:
  database:
    external: true
    name: atpost_stack_default
