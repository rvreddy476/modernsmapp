      LIVE_PLAYBACK_URL_TEMPLATE: ${LIVE_PLAYBACK_URL_TEMPLATE:-http://localhost:8103/v1/live/streams/{stream_id}/playback/index.m3u8}
      LIVE_PLAYBACK_INTERNAL_BASE_URL: ${LIVE_PLAYBACK_INTERNAL_BASE_URL:-http://mediamtx:8888}
      LIVE_PLAYBACK_PROTOCOL: ${LIVE_PLAYBACK_PROTOCOL:-hls}
      LIVE_PUBLISH_URL_TEMPLATE: ${LIVE_PUBLISH_URL_TEMPLATE:-http://localhost:8103/v1/live/streams/{stream_id}/publish/whip}
      LIVE_PUBLISH_INTERNAL_BASE_URL: ${LIVE_PUBLISH_INTERNAL_BASE_URL:-http://mediamtx:8889}
      LIVE_PUBLISH_PROTOCOL: ${LIVE_PUBLISH_PROTOCOL:-whip}
      LIVE_INGEST_URL: ${LIVE_INGEST_URL:-rtmp://localhost:1935/live}
      LIVE_INGEST_PROTOCOL: ${LIVE_INGEST_PROTOCOL:-rtmp}
