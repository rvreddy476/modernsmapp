  # Rider service (Mopedu mini-app). Customers ride free; partners pay
  # monthly subscription. See services/rider-service + mopedu/MOPEDU_SPEC.md.
  rider-service:
    build:
      context: ..
      dockerfile: services/rider-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8116"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: rider-events
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Partner subscriptions only. Rides never touch the wallet: cash settles
      # with the captain, upi / card are the payments lane's.
      WALLET_SERVICE_URL: http://wallet-service:8114
      # identity-auth owns ecosystem roles; rider grants rider_partner through
      # its internal role API. See the note in commerce-service's block about
      # why this is declared rather than left to a compiled-in default.
      IDENTITY_AUTH_URL: http://identity-auth:8081
      # Pricing engine (rider-service/internal/pricing).
      # Ride fares are priced through shared/gst with the platform as the
      # e-commerce operator liable under s.9(5): the same SYNTHETIC test GSTIN
      # food-service uses (checksum-valid, never issued). Dev only; production
      # sets the real e-commerce-operator GSTIN and refuses to start without.
      MOPEDU_PLATFORM_GSTIN: 29ZZZPZ0000Z1Z6
      # Demand surge ceiling in basis points (5000 = x1.5). Peak / night
      # windows are rider_fare_windows rows and are not capped by this.
      MOPEDU_SURGE_CAP_BPS: ${MOPEDU_SURGE_CAP_BPS:-5000}
      # Coupons on the dev stack. Staging and production keep this "false"
      # until the adviser confirms the GST treatment of a discount (same
      # question as FOOD_COUPONS_ENABLED).
      MOPEDU_COUPONS_ENABLED: ${MOPEDU_COUPONS_ENABLED:-true}
      # Routes API (TWO_WHEELER, traffic-aware) with haversine fallback; empty
      # means haversine only. A server key: restrict it to the Routes API and
      # this service's egress, never ship it to a client.
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      MOPEDU_ROUTING_TIMEOUT_MS: ${MOPEDU_ROUTING_TIMEOUT_MS:-2000}
      # Ride OTPs are sealed at rest under scope rider.ride_otp (shared/pii),
      # "v1:<base64 32-byte key>[,v2:<key>]" like FOOD_PII_KEYS. The dev key
      # lives in the gitignored Architecture/docker/.env; unset, offers cannot
      # be accepted (OTP_SEALING_NOT_CONFIGURED) rather than storing a
      # plaintext OTP. Production refuses to start without it. Never reuse a
      # dev key in staging or production.
      RIDER_PII_KEYS: ${RIDER_PII_KEYS:-}
      # Payments lane: upi / card ride fares and outstanding fees are paid
      # through payments-service (application mopedu, reference type
      # mopedu_ride) with rider's service token; a payment is marked paid only
      # from the signed payment.succeeded event (rider_payment_inbox). The
      # dev-only Ed25519 seed and kid live in the gitignored .env, and the
      # matching SERVICE_CALLER_RIDER_SERVICE_PUBKEY / KID feed payments-service
      # above, with rider-service listed in its SERVICE_CALLERS (.env). Without
      # the key the intent routes answer 503 PAYMENTS_UNAVAILABLE; boot is not
      # refused. ENV is unset here, so an intent with no checkout session (the
      # stub gateway) is refused.
      PAYMENTS_SERVICE_URL: http://payments-service:8102
      RIDER_SERVICE_TOKEN_KEY: ${RIDER_SERVICE_TOKEN_KEY:-}
      RIDER_SERVICE_TOKEN_KID: ${RIDER_SERVICE_TOKEN_KID:-}
      DIGILOCKER_MODE: ${DIGILOCKER_MODE:-mock}
      DIGILOCKER_BASE_URL: ${DIGILOCKER_BASE_URL:-}
      DIGILOCKER_API_KEY: ${DIGILOCKER_API_KEY:-}
      DIGILOCKER_REDIRECT_URI: ${DIGILOCKER_REDIRECT_URI:-https://atpost.app/rider/aadhaar/callback}
      # Launch safety (2026-09-18): captain onboarding approves itself when
      # the data is government-verified. The DigiLocker mock above returns
      # the Aadhaar, DL and vehicle RC as verified; the selfie is compared
      # server-side with the DL photo through media-service's internal
      # face-compare route (the one dating uses). On the dev stack the
      # compare is MOCKED (every selfie matches) so the whole path runs with
      # no human; "mock" is refused in production, where MEDIA_SERVICE_URL is
      # required (boot is refused without it). Below the threshold, or with
      # media-service unavailable, the selfie waits for an admin — the one
      # human fallback, along with any document a captain uploads by hand.
      MOPEDU_FACE_COMPARE_MODE: ${MOPEDU_FACE_COMPARE_MODE:-mock}
      MEDIA_SERVICE_URL: http://media-service:8087
      MOPEDU_SELFIE_MIN_SIMILARITY: ${MOPEDU_SELFIE_MIN_SIMILARITY:-80}
      # Admin console (Mopedu): /v1/rider/internal/admin/* admits only
      # admin-service tokens (audience "rider") scoped to the one permission
      # admin-service checked, naming the admin. OPS is rider's
      # AdminPermissions. A distinct .env name, because SERVICE_CALLERS in
      # .env is payments'. Blank = no tokens accepted (401).
      SERVICE_CALLERS: ${RIDER_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: rider:stats.read,rider:partners.read,rider:partners.approve,rider:partners.suspend,rider:documents.review,rider:vehicles.review,rider:payments.read,rider:payments.settle,rider:payments.reject,rider:rides.read,rider:rides.cancel,rider:ratings.moderate,rider:complaints.act,rider:incidents.read,rider:incidents.act,rider:incidents.reveal,rider:cities.manage,rider:fares.manage,rider:reports.read,rider:audit.read
    # No host port, on purpose. rider-service authorises on X-User-Id and
    # X-Scopes, so it is reachable only through api-gateway on this network.
    # Health: docker compose exec rider-service wget -qO- http://localhost:8116/healthz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      wallet-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  live-service:
