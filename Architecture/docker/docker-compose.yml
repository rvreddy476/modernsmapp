  admin-service:
    build:
      context: ..
      dockerfile: services/admin-service/Dockerfile
    environment:
      <<: *kafka_client_env
      HTTP_PORT: "8096"
      POSTGRES_DSN: *app_postgres_dsn
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Every admin route needs X-Admin-MFA=true, which the gateway stamps from
      # identity's admin_mfa claim (a session that completed an authenticator
      # code). Set ADMIN_REQUIRE_MFA=false only to debug locally. Step-up is
      # enforced regardless.
      ADMIN_REQUIRE_MFA: ${ADMIN_REQUIRE_MFA:-true}
      # Admin console Wave 2: admin-service calls each product's token-only
      # admin family with a 60 s service token it signs per call (audience =
      # product, scope = the permission it checked, act = the admin). The
      # dev-only Ed25519 seed and kid live in the gitignored .env; the matching
      # ADMIN_SERVICE_TOKEN_PUBKEY is registered with dating-service below.
      # Without the key, product dashboards answer 503; boot is not refused.
      ADMIN_SERVICE_TOKEN_KEY: ${ADMIN_SERVICE_TOKEN_KEY:-}
      ADMIN_SERVICE_TOKEN_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      DATING_SERVICE_URL: http://dating-service:8112
      # Money dashboards (Monetization, Payments), same token contract. Payments
      # registers admin-service through its existing SERVICE_CALLERS.
      MONETIZATION_SERVICE_URL: http://monetization-service:8099
      PAYMENTS_SERVICE_URL: http://payments-service:8102
      # Feast, MStore and Trust & safety dashboards, same token contract. The
      # matching public key is registered with each service below.
      FOOD_SERVICE_URL: http://food-service:8113
      COMMERCE_SERVICE_URL: http://commerce-service:8109
      TRUST_SAFETY_SERVICE_URL: http://trust-safety-service:8091
      # Content apps (Social and Tube on post-service, business pages on the
      # app user-service, Q&A, and Chat on channel, group and community), same
      # token contract. Each registers admin-service through its own
      # <NAME>_SERVICE_CALLERS below.
      POST_SERVICE_URL: http://post-service:8084
      USER_SERVICE_URL: http://user-service:8082
      QA_SERVICE_URL: http://qa-service:8108
      CHANNEL_SERVICE_URL: http://channel-service:8106
      GROUP_SERVICE_URL: http://group-service:8090
      COMMUNITY_SERVICE_URL: http://community-service:8107
      # Mopedu (rider-service), same token contract; rider registers
      # admin-service through RIDER_SERVICE_CALLERS below.
      RIDER_SERVICE_URL: http://rider-service:8116
      # Access page (Wave 1, B4): role management through identity-auth's
      # token-only /v1/auth/internal/admin/* family, same token contract
      # (audience "identity"), at the URL the permission lookups already use.
      # identity-auth registers ADMIN_SERVICE_TOKEN_PUBKEY / _KID above.
      AUTH_SERVICE_URL: http://identity-auth:8081
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ─── Commerce Services (v2.1) ────────────────────────────────

  # Phase F1.4 — orders-service retired. /v1/commerce/orders in
  # commerce-service is the single source of truth; the gateway no
  # longer proxies /v1/orders. Source removed from go.work.

  payments-service:
    build:
      context: ..
      dockerfile: services/payments-service/Dockerfile
    environment:
      <<: *kafka_client_env
      HTTP_PORT: "8102"
      # Which services may call /v1/payments/internal, and with which
      # public key and operations (Commerce P0 A2). Values in .env.
      SERVICE_CALLERS: ${SERVICE_CALLERS:-}
      SERVICE_CALLER_COMMERCE_SERVICE_KID: ${SERVICE_CALLER_COMMERCE_SERVICE_KID:-c1}
      SERVICE_CALLER_COMMERCE_SERVICE_PUBKEY: ${SERVICE_CALLER_COMMERCE_SERVICE_PUBKEY:-}
      SERVICE_CALLER_COMMERCE_SERVICE_OPS: ${SERVICE_CALLER_COMMERCE_SERVICE_OPS:-payments:intent.create,payments:intent.read,payments:refund.create}
      SERVICE_CALLER_COMMERCE_SERVICE_REFTYPES: ${SERVICE_CALLER_COMMERCE_SERVICE_REFTYPES:-order}
      # The applications (products) commerce may open payments for (migration 010).
      SERVICE_CALLER_COMMERCE_SERVICE_APPLICATIONS: ${SERVICE_CALLER_COMMERCE_SERVICE_APPLICATIONS:-mstore}
      # dating-service: Momentum Dating Premium passes (migration 011). Takes
      # effect only once SERVICE_CALLERS names dating-service and its PUBKEY is set.
      SERVICE_CALLER_DATING_SERVICE_KID: ${SERVICE_CALLER_DATING_SERVICE_KID:-d1}
      SERVICE_CALLER_DATING_SERVICE_PUBKEY: ${SERVICE_CALLER_DATING_SERVICE_PUBKEY:-}
      SERVICE_CALLER_DATING_SERVICE_OPS: ${SERVICE_CALLER_DATING_SERVICE_OPS:-payments:intent.create,payments:intent.read,payments:refund.create}
      SERVICE_CALLER_DATING_SERVICE_REFTYPES: ${SERVICE_CALLER_DATING_SERVICE_REFTYPES:-dating_premium}
      SERVICE_CALLER_DATING_SERVICE_APPLICATIONS: ${SERVICE_CALLER_DATING_SERVICE_APPLICATIONS:-dating}
      # rider-service: Mopedu ride fares (migration 012) and captain plan
      # periods (migration 013). Takes effect only once SERVICE_CALLERS names
      # rider-service and its PUBKEY is set.
      SERVICE_CALLER_RIDER_SERVICE_KID: ${SERVICE_CALLER_RIDER_SERVICE_KID:-r1}
      SERVICE_CALLER_RIDER_SERVICE_PUBKEY: ${SERVICE_CALLER_RIDER_SERVICE_PUBKEY:-}
      SERVICE_CALLER_RIDER_SERVICE_OPS: ${SERVICE_CALLER_RIDER_SERVICE_OPS:-payments:intent.create,payments:intent.read,payments:refund.create}
      SERVICE_CALLER_RIDER_SERVICE_REFTYPES: ${SERVICE_CALLER_RIDER_SERVICE_REFTYPES:-mopedu_ride,mopedu_subscription}
      SERVICE_CALLER_RIDER_SERVICE_APPLICATIONS: ${SERVICE_CALLER_RIDER_SERVICE_APPLICATIONS:-mopedu}
      # admin-service: the admin console's /v1/payments/internal/admin/* only.
      # OPS is payments' AdminPermissions; no REFTYPES and no APPLICATIONS (boot
      # refuses either). Takes effect only once SERVICE_CALLERS names
      # admin-service and ADMIN_SERVICE_TOKEN_PUBKEY is set.
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: payments:stats.read,payments:refunds.read,payments:refund.issue,payments:intents.read,payments:reconciliation.read,payments:applications.read,payments:applications.manage,payments:audit.read
      POSTGRES_DSN: *commerce_postgres_dsn
      KAFKA_BROKERS: redpanda:9092
      # Razorpay credentials — omit to use StubGateway in dev.
      # Audit P8: payments-service refuses boot when RAZORPAY_KEY_ID
      # is empty unless PAYMENTS_ALLOW_STUB=true. Default true here so
      # local docker compose comes up; prod overrides with real creds.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENTS_ALLOW_STUB: ${PAYMENTS_ALLOW_STUB:-true}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  suggestion-service:
    build:
      context: ..
      dockerfile: services/suggestion-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8100"
