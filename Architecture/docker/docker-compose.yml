        reservations:
          cpus: '0.25'
          memory: 256M

  monetization-service:
    build:
      context: ..
      dockerfile: services/monetization-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8099"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      # The financial launch boundary. Default stays CLOSED: only the
      # read-only creator-ledger endpoints are served and no money-moving
      # worker starts. Set MONETIZATION_WRITES_ENABLED=true in the shell
      # to open it for a local settlement run.
      MONETIZATION_WRITES_ENABLED: ${MONETIZATION_WRITES_ENABLED:-false}
      # Withdrawals (plan Phase 3C). Off by default; needs writes on too,
      # or the container refuses to boot.
      MONETIZATION_PAYOUTS_ENABLED: ${MONETIZATION_PAYOUTS_ENABLED:-false}
      # Maintenance mode (January remediation, reviewer correction B):
      # admin routes only, behind the internal key AND the admin scope;
      # every other financial write answers 503 MAINTENANCE; no worker
      # and no Kafka client starts. Refuses to boot with payouts on or
      # with INTERNAL_SERVICE_KEY empty.
      MONETIZATION_MAINTENANCE: ${MONETIZATION_MAINTENANCE:-false}
      # TDS at payout (founder decision 12 Sep 2026): computed and
      # recorded in tds_ledger on every payout, but NOT deducted from the
      # transfer until the later per-user tax module. true withholds.
      MONETIZATION_TDS_APPLY: ${MONETIZATION_TDS_APPLY:-false}
      # The gateway stamps X-Internal-Service-Key on every proxied
      # request and the direct callers (commerce, post, food) send it;
      # maintenance mode requires it on every admin route.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # The payout rail (plan Phase 4B): RazorpayX contacts, fund accounts
      # and payouts. The client is built only when payouts are enabled AND
      # all four are set; otherwise the rail stays off and says so once.
      # The key id/secret are the same pair payments-service uses; the
      # account number and webhook secret are the rail's own. No real
      # RazorpayX credentials exist yet — leave these empty until the
      # founder places test keys.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
      RAZORPAYX_WEBHOOK_SECRET: ${RAZORPAYX_WEBHOOK_SECRET:-}
      # Bank account capture (plan Phase 4D): the AES-256 key the full
      # account number is stored under (32 bytes, hex or base64). Unset
      # means POST /payout-methods with method_type bank_account answers
      # 503 BANK_CAPTURE_NOT_CONFIGURED rather than storing the number in
      # the clear.
      MONETIZATION_BANK_DETAILS_KEY: ${MONETIZATION_BANK_DETAILS_KEY:-}
      # How often the creator-fund payment run happens: monthly (default)
      # or semimonthly (1st-15th, 16th-end).
      CF_SETTLEMENT_CADENCE: ${CF_SETTLEMENT_CADENCE:-monthly}
      # Admin console: admin-service reaches /v1/monetization/internal/admin/*
      # only with a token scoped to the one permission it checked, naming the
      # admin. The launch flags still apply: with writes off every route answers
      # 503 MONETIZATION_NOT_LAUNCHED. A distinct .env name, because
      # SERVICE_CALLERS in .env is payments'. OPS is monetization's
      # AdminPermissions. Blank = no tokens accepted.
      SERVICE_CALLERS: ${MONETIZATION_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: monetization:stats.read,monetization:fraud.review,monetization:wallet.freeze,monetization:wallet.unfreeze,monetization:wallet.rebuild,monetization:fund.read,monetization:fund.rates,monetization:creators.suspend,monetization:fund.settle,monetization:fund.reverse,monetization:fund.budget,monetization:disputes.read,monetization:disputes.act,monetization:refund.issue,monetization:payouts.read,monetization:audit.read
    ports:
      # Loopback only: the admin routes trust X-Scopes/X-User-Id from
      # whoever reaches the port, so the port must not be reachable from
      # the LAN. Other containers still reach it by service name.
      - "127.0.0.1:8099:8099"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
