        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  dating-service:
    build:
      context: ..
      dockerfile: services/dating-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8112"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: dating-events
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Lane D2: birth date and first name come from identity-profile's
      # internal read (/internal/v1/profiles/users/:id/identity), not the client.
      IDENTITY_PROFILE_SERVICE_URL: http://identity-profile:8098
      # Duplicate open matches at boot: ENV is unset here, so this stack is
      # NOT local/dev to the service — boot refuses while duplicates exist
      # unless this is true. Review with scripts/count-duplicate-matches.sql.
      DATING_DEDUPE_OPEN_MATCHES: ${DATING_DEDUPE_OPEN_MATCHES:-false}
      # Days a declined sender stays away from the decliner (1-365).
      DATING_DECLINE_COOLDOWN_DAYS: ${DATING_DECLINE_COOLDOWN_DAYS:-30}
      # Lane D8: every report opens a trust-safety grievance (internal route);
      # trusted contacts are checked against graph-service connections. ENV is
      # unset here, so the evidence HMAC key is required: the default below is
      # for this local stack only.
      TRUST_SAFETY_SERVICE_URL: http://trust-safety-service:8091
      GRAPH_SERVICE_URL: http://graph-service:8083
      DATING_EVIDENCE_HMAC_KEY: ${DATING_EVIDENCE_HMAC_KEY:-local_dev_dating_evidence_hmac_key_change_me_32b}
      DATING_EVIDENCE_RETENTION_DAYS: ${DATING_EVIDENCE_RETENTION_DAYS:-180}
      DATING_PANIC_DAILY_LIMIT: ${DATING_PANIC_DAILY_LIMIT:-5}
      DATING_REPORT_DAILY_LIMIT: ${DATING_REPORT_DAILY_LIMIT:-10}
      # Lane D5: the required blink selfie is checked by media-service's
      # internal liveness route.
      MEDIA_SERVICE_URL: http://media-service:8087
      # Lane D6: dating photos go through media-service's internal dating
      # photo routes (ownership, stored moderation labels, EXIF strip + server
      # blur, signed delivery, delete). The media recheck sweeper is off
      # locally so seeded rows with made-up media ids are not rejected;
      # staging and prod run it.
      DATING_PHOTO_MAX_PER_PROFILE: ${DATING_PHOTO_MAX_PER_PROFILE:-6}
      DATING_PHOTO_RECHECK_ENABLED: ${DATING_PHOTO_RECHECK_ENABLED:-false}
      # Aadhaar (DigiLocker) is optional. ENV is unset here, so the mock is
      # refused; set ENV=local and DIGILOCKER_MODE=mock to exercise it.
      DIGILOCKER_MODE: ${DIGILOCKER_MODE:-disabled}
      # Lane D9: sealing keys for religion, community, exact panic / share /
      # meet points, device fingerprints and IPs, and export blobs. Dev-only
      # random keys live in the gitignored Architecture/docker/.env. ENV is
      # unset here, so boot REFUSES without them. Never reuse a dev key in
      # staging or production.
      DATING_PII_KEYS: ${DATING_PII_KEYS:-}
      DATING_PII_LOOKUP_SALT: ${DATING_PII_LOOKUP_SALT:-}
      # Lane P2: Premium passes and Boost are paid through payments-service
      # (application dating, reference type dating_premium). The dev-only
      # Ed25519 seed and kid live in the gitignored .env, and the matching
      # SERVICE_CALLER_DATING_SERVICE_PUBKEY / KID feed payments-service above,
      # with dating-service listed in its SERVICE_CALLERS (.env). Without the
      # key the purchase route answers 503 PREMIUM_UNAVAILABLE; boot is not
      # refused. ENV is unset here, so an intent with no checkout session (the
      # stub gateway) is refused.
      PAYMENTS_SERVICE_URL: http://payments-service:8102
      DATING_SERVICE_TOKEN_KEY: ${DATING_SERVICE_TOKEN_KEY:-}
      DATING_SERVICE_TOKEN_KID: ${DATING_SERVICE_TOKEN_KID:-}
      # Admin console Wave 2: callers whose service tokens dating verifies.
      # admin-service reaches /v1/dating/internal/admin/* only with a token
      # scoped to the one permission it checked and naming the admin (act).
      # A distinct .env name (DATING_SERVICE_CALLERS), because SERVICE_CALLERS
      # in .env is payments-service's list. Blank = no tokens accepted.
      SERVICE_CALLERS: ${DATING_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: ${SERVICE_CALLER_ADMIN_SERVICE_OPS:-dating:stats.read,dating:reports.read,dating:reports.act,dating:users.ban,dating:photos.review,dating:selfie.review,dating:panic.read,dating:panic.act,dating:panic.reveal,dating:risk.read,dating:audit.read}
    ports:
      - "8112:8112"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_started }
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Lane D9: the DPDP data exporter (same image, cmd/data-exporter). Consumes
  # dating.data.export.requested from dating-events, stores the finished
  # export sealed on its row and emits dating.data.export.ready; the owner
  # downloads it from GET /v1/dating/data-export/:id/download.
  dating-data-exporter:
    build:
      context: ..
      dockerfile: services/dating-service/Dockerfile
    command: ["/data-exporter"]
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      POSTGRES_DSN: *app_postgres_dsn
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: dating-events
      KAFKA_GROUP_ID: dating-data-exporter
      DATING_EXPORT_STORAGE: database
      DATING_PII_KEYS: ${DATING_PII_KEYS:-}
      DATING_PII_LOOKUP_SALT: ${DATING_PII_LOOKUP_SALT:-}
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_started }
      dating-service: { condition: service_started }
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

volumes:
  pgdata:
