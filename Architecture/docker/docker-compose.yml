      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: *minio_access_key
      MINIO_SECRET_KEY: *minio_secret_key
      MINIO_BUCKET: media
      KAFKA_BROKERS: redpanda:9092
