      GRAPH_SERVICE_URL: http://graph-service:8083
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      scylla-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Phase F1.4 — shop-service retired. Catalog, cart, checkout, and
  # payouts all live under /v1/commerce/* in commerce-service.

  commerce-service:
    build:
      context: ..
      dockerfile: services/commerce-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8109"
      POSTGRES_DSN: *commerce_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Sibling services. AUTH_SERVICE_URL's compiled-in default is
      # http://auth-service:8081, which is not a compose service name —
      # buyer-email resolution for order events silently failed until it
      # was declared here against identity-auth.
      AUTH_SERVICE_URL: http://identity-auth:8081
      # Same host, separate variable, for the identity role client (which
      # grants `seller`). Kept distinct so the two clients can be pointed
      # apart if identity ever splits contact lookup from role management.
      IDENTITY_AUTH_URL: http://identity-auth:8081
      PAYMENTS_SERVICE_URL: http://payments-service:8102
      # Commerce speaks to payments with its own signed identity, not the
      # shared internal key (Commerce P0 A2). Key material lives in .env.
      COMMERCE_SERVICE_TOKEN_KEY: ${COMMERCE_SERVICE_TOKEN_KEY:-}
      COMMERCE_SERVICE_TOKEN_KID: ${COMMERCE_SERVICE_TOKEN_KID:-c1}
      # Address PII: KMS in prod/staging, static dev keys locally.
      ENV: ${ENV:-dev}
      COMMERCE_PII_LOOKUP_SALT: ${COMMERCE_PII_LOOKUP_SALT:-}
      COMMERCE_PII_DEV_KEY_PROFILE: ${COMMERCE_PII_DEV_KEY_PROFILE:-}
      COMMERCE_PII_DEV_KEY_SNAPSHOT: ${COMMERCE_PII_DEV_KEY_SNAPSHOT:-}
      # Seller KYC identifiers (migration 035). Unset derives a local key from
      # the profile key; the cutover defaults to dual.
      COMMERCE_PII_DEV_KEY_KYC: ${COMMERCE_PII_DEV_KEY_KYC:-}
      COMMERCE_KYC_PII_CUTOVER: ${COMMERCE_KYC_PII_CUTOVER:-dual}
      MONETIZATION_SERVICE_URL: http://monetization-service:8099
      # Stub gateway opt-in for POST /orders/:id/payment/confirm with
      # gateway=stub. Mirrors payments-service's flag; prod leaves both unset.
      PAYMENTS_ALLOW_STUB: ${PAYMENTS_ALLOW_STUB:-true}
      # Invoice PDFs (IssueInvoice) go to MinIO.
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: *minio_access_key
      MINIO_SECRET_KEY: *minio_secret_key
      MINIO_USE_SSL: "false"
      COMMERCE_INVOICE_BUCKET: ${COMMERCE_INVOICE_BUCKET:-commerce-invoices}
      # Courier integration. COURIER_PROVIDER=stub auto-confirms shipments
      # locally without booking; =shiprocket calls the real Shiprocket API
      # (production endpoint apiv2.shiprocket.in — no sandbox available).
      # SHIPROCKET_PICKUP_LOCATION_ID was passed but never read; dropped.
      COURIER_PROVIDER: ${COURIER_PROVIDER:-stub}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SHIPROCKET_WEBHOOK_TOKEN: ${SHIPROCKET_WEBHOOK_TOKEN:-}
      SHIPROCKET_WEBHOOK_HMAC: ${SHIPROCKET_WEBHOOK_HMAC:-}
      # The nickname of the pickup address registered in the Shiprocket
      # account. A booking is refused when it names no address of theirs.
      SHIPROCKET_PICKUP_LOCATION: ${SHIPROCKET_PICKUP_LOCATION:-Primary}
      # Admin console: admin-service reaches /v1/commerce/internal/admin/* only
      # with a token scoped to the one permission it checked, naming the admin.
      # A distinct .env name, because SERVICE_CALLERS in .env is payments'.
      # OPS is commerce's AdminPermissions. Blank = no tokens accepted.
      SERVICE_CALLERS: ${COMMERCE_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: commerce:stats.read,commerce:sellers.read,commerce:seller.approve,commerce:seller.suspend,commerce:products.moderate,commerce:kyc.verify,commerce:payouts.read,commerce:cod.settle,commerce:catalogue.edit,commerce:banners.edit,commerce:jobs.read,commerce:compliance.read,commerce:compliance.sweep
    ports:
      - "8109:8109"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  food-service:
    build:
      context: ..
      dockerfile: services/food-service/Dockerfile
    environment:
      <<: *redis_client_env
      HTTP_PORT: "8113"
      # Realtime (order tracking, kitchen queue, rider offers) is published to
      # Redis Streams, which notification-service's SSE reads. Without it the
      # token route answers 503 and every live event is dropped.
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: *app_postgres_dsn
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      MONETIZATION_SERVICE_URL: http://monetization-service:8099
      PAYMENTS_SERVICE_URL: http://payments-service:8102
      # identity-auth owns ecosystem roles for the whole platform; food grants
      # restaurant_owner / delivery_partner through its internal role API.
      # Declared explicitly rather than left to the compiled-in default, for
      # the reason recorded in commerce-service's block below: a client that
      # defaults to a host name compose does not have fails silently forever.
      IDENTITY_AUTH_URL: http://identity-auth:8081
      # food-service refuses to start when ENV is blank or anything other than
      # local/dev/development AND a production secret is missing: the
      # payments service-token key (FOOD_SERVICE_TOKEN_KEY) and the PII
      # sealing keys (FOOD_PII_KEYS, FOOD_PII_LOOKUP_SALT). A blank ENV counts
      # as production on purpose. This dev stack sets neither secret, so ENV
      # must say dev: payments fall back to the internal key, and the PII
      # routes (restaurant PAN, payout accounts) answer 503
      # PII_NOT_CONFIGURED rather than writing plaintext.
      ENV: dev
      # Order pricing needs the platform's GSTIN: the platform is the party
      # liable for restaurant-service GST under CGST s.9(5), so it appears on
      # every order and platform invoice. Without it, carts carry a
      # pricing_error and every order is refused with 503.
      #
      # THIS IS A SYNTHETIC TEST IDENTIFIER, NOT A REAL REGISTRATION. It is
      # the checksum-valid golden value from shared/kyc's GSTIN tests (state
      # 29, PAN serial 0000, which is never issued). Dev only. Production must
      # set the platform's real e-commerce-operator GSTIN, and outside
      # local/dev the service refuses to start without one.
      FOOD_PLATFORM_GSTIN: 29ZZZPZ0000Z1Z6
      # PII sealing for restaurant PAN, payout accounts and rider documents.
      # Dev-only random keys live in the gitignored Architecture/docker/.env;
      # unset, those routes answer 503 PII_NOT_CONFIGURED. Never reuse a dev
      # key in staging or production.
      FOOD_PII_KEYS: ${FOOD_PII_KEYS:-}
      FOOD_PII_LOOKUP_SALT: ${FOOD_PII_LOOKUP_SALT:-}
      # Rider DigiLocker return. The public base URL must be an origin the
      # PHONE's browser can reach (the gateway on the PC's LAN IP, or the dev
      # tunnel); localhost only works from this machine. The app link is the
      # Feast Rider dev flavour's http link — on Android 12+ enable it once
      # under Settings > Apps > Feast Rider (dev) > Open by default.
      FOOD_PUBLIC_BASE_URL: ${FOOD_PUBLIC_BASE_URL:-http://localhost:8080}
      FOOD_RIDER_APP_LINK_URL: ${FOOD_RIDER_APP_LINK_URL:-http://rider.feast.dev.invalid/rider/digilocker/return}
      # Admin console: admin-service reaches /v1/food/internal/admin/* only
      # with a token scoped to the one permission it checked, naming the admin.
      # A distinct .env name, because SERVICE_CALLERS in .env is payments'.
      # OPS is food's AdminPermissions. Blank = no tokens accepted.
      SERVICE_CALLERS: ${FOOD_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: food:stats.read,food:restaurant.approve,food:restaurant.suspend,food:delivery_partner.approve,food:delivery_partner.suspend,food:documents.review,food:payout_accounts.read,food:orders.read,food:orders.cancel,food:refund.issue,food:refunds.read,food:settlement.read,food:settlement.generate,food:settlement.mark_paid,food:menu.moderate,food:reviews.moderate,food:tickets.act,food:coupons.manage,food:service_areas.manage,food:reports.read,food:fraud.read,food:audit.read
    ports:
      - "8113:8113"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Consumer wallet — BC of partner-bank PPI. See services/wallet-service.
  wallet-service:
