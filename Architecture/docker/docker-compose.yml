      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # ICE config handed to every call grant. Default: Google STUN plus the
      # in-stack coturn below. TURN_HOST is what DEVICES dial: 10.0.2.2 for
      # the emulator; set your LAN IP for phones on your WiFi, or a public
      # host/managed-TURN creds (override ICE_SERVERS_JSON wholesale) for
      # devices on other networks — the Cloudflare tunnel cannot carry TURN.
      ICE_SERVERS_JSON: >-
        ${ICE_SERVERS_JSON:-[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:${TURN_HOST:-10.0.2.2}:3478?transport=udp","turn:${TURN_HOST:-10.0.2.2}:3478?transport=tcp"],"username":"atpost","credential":"${TURN_SECRET:-atpost_dev_turn_secret}"}]}
    ports:
