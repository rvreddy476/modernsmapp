          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  channel-service:
    build:
      context: ..
      dockerfile: services/channel-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8106"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Admin console (Chat: channel reports and suspension):
      # /v1/broadcast-channels/internal/admin/* admits only admin-service
      # tokens (audience "chat"). OPS is channel-service's AdminPermissions.
      # A distinct .env name, because SERVICE_CALLERS in .env is payments'.
      SERVICE_CALLERS: ${CHANNEL_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: chat:stats.read,chat:reports.read,chat:reports.act,chat:channels.moderate
    ports:
      - "8106:8106"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_started }
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  community-service:
    build:
      context: ..
      dockerfile: services/community-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8107"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Admin console (Chat: community reports): /v1/communities/internal/admin/*
      # admits only admin-service tokens (audience "chat"). OPS is
      # community-service's AdminPermissions. A distinct .env name, because
      # SERVICE_CALLERS in .env is payments'.
      SERVICE_CALLERS: ${COMMUNITY_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: chat:stats.read,chat:reports.read,chat:reports.act
    ports:
      - "8107:8107"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_started }
