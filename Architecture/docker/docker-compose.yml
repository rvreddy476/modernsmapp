        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # TURN relay for 1:1 calls (coturn). WebRTC media is peer-to-peer; when
  # NATs block the direct path, media relays through here — the difference
  # between "calls work on the same WiFi" and "calls work". Long-term-
  # credential auth with one static dev user; production runs the same
  # image on a public host with real secrets (use-auth-secret + TLS).
  coturn:
    image: coturn/coturn:4.6
    command: >-
      -n --log-file=stdout --verbose
      --realm=atpost.dev
      --user=atpost:${TURN_SECRET:-atpost_dev_turn_secret}
      --lt-cred-mech
      --fingerprint
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --external-ip=${TURN_HOST:-10.0.2.2}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  # The LiveKit SFU behind live-service-v2. Dev keys only — NEVER these
  # values in staging/prod. Media: 7881/tcp is the ICE-TCP fallback and
  # 7882/udp is the port-muxed RTP path; both are what an emulator (via
  # 10.0.2.2) or a LAN phone actually streams over. The Cloudflare tunnel
  # cannot carry this traffic — live media is LAN/emulator-only in dev.
  livekit:
    image: livekit/livekit-server:v1.8
    command: --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-10.0.2.2}
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret0000000000000000000000000}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  live-service-v2:
    build:
      context: ..
      dockerfile: services/live-service-v2/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8117"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      GRAPH_SERVICE_URL: http://graph-service:8083
      # Dev defaults target the in-stack LiveKit SFU below; the PUBLIC url
      # is what devices dial (10.0.2.2 = the emulator's route to the host).
      # A physical phone on the LAN needs LIVEKIT_PUBLIC_URL=ws://<LAN-IP>:7880.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://10.0.2.2:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret0000000000000000000000000}
      LIVEKIT_WEBHOOK_SECRET: ${LIVEKIT_WEBHOOK_SECRET:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET_LIVE_RECORDINGS: ${MINIO_BUCKET_LIVE_RECORDINGS:-live-recordings}
      LIVE_RECORDING_PUBLIC_BASE_URL: ${LIVE_RECORDING_PUBLIC_BASE_URL:-http://localhost:9001}
    ports:
      - "8119:8117"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

