      # Calling P0: enabled in dev; the policy gate requires the graph
      # permission authority + internal key when enabled (config validation).
      CALLS_ENABLED: "true"
      # Dev-only: direct-WebRTC 1:1 on the stub provider, no LiveKit/TURN.
      # The policy gates (graph authority + internal key) still apply.
      CALLS_DEV_ALLOW_STUB_MEDIA: "true"
