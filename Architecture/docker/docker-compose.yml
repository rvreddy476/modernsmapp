      - "8189:8189/tcp"
      - "8189:8189/udp"
    expose:
      - "8888"
      - "8889"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8088"
      SCYLLA_HOSTS: scylla
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      POSTGRES_DSN: *app_postgres_dsn
      # FCM push (Firebase HTTP v1) — leave blank to disable push in dev
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_KEY: ${FCM_SERVICE_ACCOUNT_KEY:-}
      # APNs push (iOS) — leave blank to disable push in dev
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY_PATH: ${APNS_PRIVATE_KEY_PATH:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      # Transactional email (SMTP). Blank SMTP_HOST → NoopMailer (no mail sent).
      # Put real creds in Architecture/docker/.env (gitignored) to send email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-atPost}
      SMTP_FROM_ADDR: ${SMTP_FROM_ADDR:-no-reply@atpost.local}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Tube channel subscriptions moved to post-service (12 Sep 2026); the
      # subscriber-ids and by-owner internal routes keep their paths and JSON.
      POST_SERVICE_URL: http://post-service:8084
      SUBSCRIBERS_SERVICE_URL: http://post-service:8084
      # Dating lane D8 panic paging: staff user ids to page (comma separated),
      # each re-checked for an admin/moderator role in identity; blank pages
      # nobody and raises a critical ops alert per panic. Optional ops email.
      DATING_SERVICE_URL: http://dating-service:8112
      DATING_SAFETY_RESPONDER_USER_IDS: ${DATING_SAFETY_RESPONDER_USER_IDS:-}
      DATING_SAFETY_OPS_EMAIL: ${DATING_SAFETY_OPS_EMAIL:-}
      IDENTITY_AUTH_URL: http://identity-auth:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "8088:8088"
    volumes:
      # The Firebase service-account JSON, read-only.
      #
      # main.go reads this only when FCM_SERVICE_ACCOUNT_KEY holds a path;
      # that variable defaults to blank, so dev runs with push DISABLED and
      # the file is merely present.
      #
      # The filename must match a real file. It previously named
      # `firebase-cleestudio-2b06d.json`, which does not exist here — Docker
      # then silently created an empty DIRECTORY at that path and the service
      # never started at all. That is why no notification has ever been
      # delivered: the whole service was absent from the running stack while
      # the gateway happily answered /v1/notifications with 502.
      - ../../.secrets/fcm-service-account.json:/run/secrets/firebase-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      scylla-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  search-service:
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8089"
      POSTGRES_DSN: *app_postgres_dsn
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # Source of truth for the users_v1 reindex / startup auto-heal.
      PROFILE_SERVICE_URL: http://identity-profile:8098
      IDENTITY_KAFKA_TOPIC: identity.events.v1
      # Account control (deactivate/delete/purge): ack topic for the
      # existing identity-topic consumer's user.purge_requested handling.
      PURGE_ACKS_TOPIC: platform.purge-acks.v1
      # Private accounts: follow-set scope for the posts query, and the
      # account_visibility authority stamped into is_private / author_is_private.
      GRAPH_SERVICE_URL: http://graph-service:8083
      IDENTITY_USER_SERVICE_URL: http://identity-user:8110
      # Page-scoped search result rows: thumbnails / avatars are resolved
      # through media-service's batch endpoint as the viewer.
      MEDIA_SERVICE_URL: http://media-service:8087
      # Product search: the catalogue read-back behind
      # commerce.product.published / .unpublished, and the attribute
      # definitions the facet rail is built from at query time.
      COMMERCE_SERVICE_URL: http://commerce-service:8109
    ports:
      - "8089:8089"
    # Wait for OpenSearch to actually serve, not merely to have started —
    # search-service refuses to boot without its safety indices.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  trust-safety-service:
    build:
      context: ..
      dockerfile: services/trust-safety-service/Dockerfile
    environment:
      <<: *kafka_client_env
      HTTP_PORT: "8091"
      POSTGRES_DSN: *app_postgres_dsn
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Must stay byte-identical to post-service's keys — this service issues the
      # capabilities that post-service verifies. See the note in post-service.
      STORY_MODERATION_HMAC_KEY: ${STORY_MODERATION_HMAC_KEY:-local_dev_story_moderation_hmac_key_change_me}
      POST_MODERATION_HMAC_KEY: ${POST_MODERATION_HMAC_KEY:-local_dev_post_moderation_hmac_key_change_me}
      # Admin console: admin-service reaches /v1/internal/admin/trust/* only
      # with a token scoped to the one permission it checked, naming the admin.
