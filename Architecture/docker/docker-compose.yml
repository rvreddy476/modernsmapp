    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8088"
      SCYLLA_HOSTS: scylla
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      POSTGRES_DSN: *app_postgres_dsn
      # FCM push (Firebase HTTP v1) — leave blank to disable push in dev
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_KEY: ${FCM_SERVICE_ACCOUNT_KEY:-}
      # APNs push (iOS) — leave blank to disable push in dev
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY_PATH: ${APNS_PRIVATE_KEY_PATH:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      # Transactional email (SMTP). Blank SMTP_HOST → NoopMailer (no mail sent).
      # Put real creds in Architecture/docker/.env (gitignored) to send email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-atPost}
      SMTP_FROM_ADDR: ${SMTP_FROM_ADDR:-no-reply@atpost.local}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "8088:8088"
    volumes:
      # The Firebase service-account JSON, read-only.
      #
      # main.go reads this only when FCM_SERVICE_ACCOUNT_KEY holds a path;
      # that variable defaults to blank, so dev runs with push DISABLED and
      # the file is merely present.
      #
      # The filename must match a real file. It previously named
      # `firebase-cleestudio-2b06d.json`, which does not exist here — Docker
      # then silently created an empty DIRECTORY at that path and the service
      # never started at all. That is why no notification has ever been
      # delivered: the whole service was absent from the running stack while
      # the gateway happily answered /v1/notifications with 502.
      - ../../.secrets/fcm-service-account.json:/run/secrets/firebase-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      scylla-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

