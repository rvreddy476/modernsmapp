  qa-service:
    build:
      context: ..
      dockerfile: services/qa-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8108"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Admin console (Q&A): /v1/qa/internal/admin/* admits only admin-service
      # tokens (audience "qa"). OPS is qa-service's AdminPermissions. A
      # distinct .env name, because SERVICE_CALLERS in .env is payments'.
      SERVICE_CALLERS: ${QA_SERVICE_CALLERS:-}
      SERVICE_CALLER_ADMIN_SERVICE_KID: ${ADMIN_SERVICE_TOKEN_KID:-a1}
      SERVICE_CALLER_ADMIN_SERVICE_PUBKEY: ${ADMIN_SERVICE_TOKEN_PUBKEY:-}
      SERVICE_CALLER_ADMIN_SERVICE_OPS: qa:stats.read,qa:reports.read,qa:reports.act,qa:questions.moderate,qa:questions.merge,qa:answers.moderate,qa:comments.moderate,qa:audit.read
    ports:
      - "8108:8108"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_started }
