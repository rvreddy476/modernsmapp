name: atpost_stack

x-postgres-dsns:
  identity: &identity_postgres_dsn postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/identity_db?sslmode=disable
  app: &app_postgres_dsn postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/app?sslmode=disable
  chat: &chat_postgres_dsn postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/chat_db?sslmode=disable
  call: &call_postgres_dsn postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/call_db?sslmode=disable
  commerce: &commerce_postgres_dsn postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/commerce_db?sslmode=disable

x-minio-creds:
  access_key: &minio_access_key ${MINIO_ACCESS_KEY:-minio}
  secret_key: &minio_secret_key ${MINIO_SECRET_KEY:-local_dev_minio_password_change_me}

x-redis-client-env: &redis_client_env
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
  REDIS_TLS_INSECURE_SKIP_VERIFY: ${REDIS_TLS_INSECURE_SKIP_VERIFY:-false}
  REDIS_TLS_SERVER_NAME: ${REDIS_TLS_SERVER_NAME:-}
  REDIS_CA_CERT_FILE: ${REDIS_CA_CERT_FILE:-}
  REDIS_CLIENT_CERT_FILE: ${REDIS_CLIENT_CERT_FILE:-}
  REDIS_CLIENT_KEY_FILE: ${REDIS_CLIENT_KEY_FILE:-}

x-kafka-client-env: &kafka_client_env
  KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
  KAFKA_TLS_INSECURE_SKIP_VERIFY: ${KAFKA_TLS_INSECURE_SKIP_VERIFY:-false}
  KAFKA_TLS_SERVER_NAME: ${KAFKA_TLS_SERVER_NAME:-}
  KAFKA_CA_CERT_FILE: ${KAFKA_CA_CERT_FILE:-}
  KAFKA_CLIENT_CERT_FILE: ${KAFKA_CLIENT_CERT_FILE:-}
  KAFKA_CLIENT_KEY_FILE: ${KAFKA_CLIENT_KEY_FILE:-}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-10s}

services:
  # ─── Shared Infrastructure ──────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
      - ./database:/docker-entrypoint-initdb.d/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  scylla:
    image: scylladb/scylla:5.4
    command: ["--overprovisioned", "1", "--smp", "1", "--memory", "512M", "--developer-mode", "1"]
    ports:
      - "9042:9042"
    volumes:
      - scylladata:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' $(hostname -i) 9042 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  scylla-init:
    image: scylladb/scylla:5.4
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./scylla/schema.cql:/schema.cql:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "cqlsh scylla 9042 -f /schema.cql && echo 'Scylla schema applied'"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Phase F3 — Jaeger all-in-one for local W3C trace inspection.
  # OTLP receivers: 4317 (gRPC) and 4318 (HTTP). The trace package
  # auto-maps :4318 → :4317 so existing OTEL_EXPORTER_OTLP_ENDPOINT
  # values keep working. Open http://localhost:16686 to view traces.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: atpost_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    volumes:
      - ./init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8085:8080"
    depends_on:
      - redpanda
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_dev_minio_password_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LocalDev@OpenSearch2024}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    # OpenSearch needs 30-60s before it serves, and the container reports
    # "started" almost immediately. Consumers that only wait for service_started
    # therefore race it. search-service fails CLOSED when its safety indices are
    # unreachable ("safety index unavailable; refusing to start"), which is the
    # correct behaviour — so without a real readiness probe it simply exits 1 on
    # every cold boot of the stack.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ─── API Gateway ────────────────────────────────────────────

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      # Per-environment capacity tuning. Unset means the production values.
      #
      # Added during C-CLB-PROOF-1 on the assumption that the gateway limiter
      # was rejecting most of a 50-concurrent same-key burst. It was not — 50
      # fits under 100/60; post-service's MAX_POSTS_PER_HOUR was the blocker.
      # Leave these UNSET in production until bounds and alerting exist.
      RATE_LIMIT_IP_PER_SEC: "${RATE_LIMIT_IP_PER_SEC:-100}"
      RATE_LIMIT_USER_PER_SEC: "${RATE_LIMIT_USER_PER_SEC:-60}"
      HTTP_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_change_me}
      # RS256 (optional): set JWT_PUBLIC_KEY_PEM to also verify RS256 tokens
      # minted by identity-auth's private key. Empty = HS256 only (default).
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
      JWT_RS256_KID: ${JWT_RS256_KID:-rsa-1}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      AUTH_SERVICE_URL: http://identity-auth:8081
      CALL_SERVICE_URL: http://call-service:8097
      # The gateway's built-in default is http://ws-gateway:8093, but the
      # compose service is named chat-ws-gateway, so /v1/ws resolved to a
      # non-existent host and every socket upgrade returned 502. Chat sockets
      # are routed here, never to notification-service.
      WS_GATEWAY_URL: http://chat-ws-gateway:8093
      # Privacy settings only. `/v1/users/me/settings` is routed to the
      # IDENTITY user-service because that is the service that owns
      # who_can_message and the one graph-service reads when it decides
      # whether a direct message is allowed. Everything else under /v1/users
      # still goes to the Architecture user-service on the next line.
      IDENTITY_USER_SERVICE_URL: http://identity-user:8110
      USER_SERVICE_URL: http://user-service:8082
      GRAPH_SERVICE_URL: http://graph-service:8083
      POST_SERVICE_URL: http://post-service:8084
      FEED_SERVICE_URL: http://feed-service:8086
      MEDIA_SERVICE_URL: http://media-service:8087
      NOTIFY_SERVICE_URL: http://notification-service:8088
      SEARCH_SERVICE_URL: http://search-service:8089
      MONETIZATION_SERVICE_URL: http://monetization-service:8099
      TRUST_SAFETY_SERVICE_URL: http://trust-safety-service:8091
      REVIEWER_SERVICE_URL: http://reviewer-service:8120
      MESSAGE_SERVICE_URL: http://chat-message-service:8092
      ANALYTICS_SERVICE_URL: http://analytics-service:8094
      AI_SERVICE_URL: http://ai-service:8117
      FLAGS_SERVICE_URL: http://feature-flag-service:8117
      GROUP_SERVICE_URL: http://group-service:8090
      ADMIN_SERVICE_URL: http://admin-service:8096
      PROFILE_SERVICE_URL: http://identity-profile:8098
      PAYMENTS_SERVICE_URL: http://payments-service:8102
      LIVE_SERVICE_URL: http://live-service:8103
      LIVE_V2_SERVICE_URL: http://live-service-v2:8117
      MEMORIES_SERVICE_URL: http://memories-service:8104
      CHANNEL_SERVICE_URL: http://channel-service:8106
      COMMUNITY_SERVICE_URL: http://community-service:8107
      QA_SERVICE_URL: http://qa-service:8108
      COMMERCE_SERVICE_URL: http://commerce-service:8109
      DATING_SERVICE_URL: http://dating-service:8112
      FOOD_SERVICE_URL: http://food-service:8113
      WALLET_SERVICE_URL: http://wallet-service:8114
      BILL_PAY_SERVICE_URL: http://bill-pay-service:8115
      RIDER_SERVICE_URL: http://rider-service:8116
    ports:
      - "8080:8080"
    depends_on:
      - identity-auth
      - user-service
      - post-service
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ─── Identity Platform Services ─────────────────────────────

  identity-auth:
    build:
      context: ../../identity-platform
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8081"
      POSTGRES_DSN: *identity_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_change_me}
      RATE_LIMIT_ENABLED: "false"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # No SCHEMA_MIGRATIONS_* knobs here, deliberately. As of 2026-08-16
      # auth-service does not migrate its own database: schema is owned by the
      # deployment pipeline, and the service VERIFIES its preconditions at boot
      # (identity-shared/store/schemaguard) and refuses to start when the
      # pipeline has not run. See internal/store/requirements.go for the list
      # and prompt/audit-...-scale-readiness.md D11 for why. identity-user and
      # identity-profile do the same.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # Encrypts stored TOTP (2FA) secrets. Must be exactly 64 hex chars
      # (32 bytes, AES-256) — see identity-platform/shared/crypto/secret_box.go.
      # Unset, the service logs "2FA secrets stored in plaintext" and carries on,
      # which is tolerable on a laptop and not tolerable once the stack is
      # reachable from the internet. Generate with: openssl rand -hex 32
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Dev default is a year so laptop sessions don't expire mid-work. Override
      # it in .env (e.g. ACCESS_TOKEN_TTL=24h) whenever this stack is exposed
      # publicly — a leaked year-long token is a year-long compromise.
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-8760h}
      REFRESH_TOKEN_TTL: "87600h"
      # Authorization scopes are now resolved SERVER-SIDE from these allowlists
      # and stamped into the signed access token. The gateway authorizes admin /
      # internal surfaces from the token claim ONLY — it no longer trusts a
      # client-sent X-Scopes header. Set these to the relevant user UUIDs;
      # comma-separated. Empty = nobody has admin (secure default).
      SUPERADMIN_USER_IDS: ${SUPERADMIN_USER_IDS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      MODERATOR_USER_IDS: ${MODERATOR_USER_IDS:-}
      # RS256 (optional): set JWT_PRIVATE_KEY_PEM to sign access tokens with
      # RS256 (verifiers then use the matching JWT_PUBLIC_KEY_PEM). Empty =
      # HS256 signing (default). Enabling RS256 is a deliberate opt-in.
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_RS256_KID: ${JWT_RS256_KID:-rsa-1}
      # When true, privileged actions (role grant/revoke) require the acting
      # superadmin to have 2FA enabled. Off by default so first-superadmin
      # bootstrap isn't locked out before enrolling MFA.
      REQUIRE_MFA_FOR_PRIVILEGED: ${REQUIRE_MFA_FOR_PRIVILEGED:-false}
    ports:
      - "8081:8081"
    # identity-auth provisions the shared identity base tables (auth.*, plus
    # profile.profiles and usr.* — see services/auth-service/database/setup.sql).
    # identity-user and identity-profile assert those objects at boot and refuse
    # to start without them, so they wait on this healthcheck rather than racing
    # it on a fresh database.
    healthcheck:
      # /v1/auth/health, not /health — the route is registered inside the
      # versioned group. Bare /health answers 404 on this service, and a
      # healthcheck that can never pass would deadlock everything waiting on it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/v1/auth/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  identity-user:
    build:
      context: ../../identity-platform
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8110"
      POSTGRES_DSN: *identity_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      # JWT_SECRET must match auth-service; otherwise tokens validate at
      # the gateway but get rejected here → 401 → UI clears session →
      # "Authorization Required" on /settings/profile even after a fresh
      # login.
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_change_me}
      # Gates /v1/users/* (incl. the privacy-settings endpoint the graph
      # permission resolver reads). The api-gateway injects this key.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # No SCHEMA_MIGRATIONS_* knobs here, deliberately. As of 2026-08-16 this
      # service does not migrate its own database: it applies its own additive
      # schema file (services/*/database/setup.sql) and then VERIFIES its
      # preconditions via identity-shared/store/schemaguard, refusing to start
      # when an object it depends on is absent. Schema changes that need a
      # decision about existing data belong in the deployment pipeline.
    ports:
      - "8110:8110"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for auth-service, which provisions the shared identity base
      # tables this service asserts at boot and refuses to start without.
      identity-auth:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  identity-profile:
    build:
      context: ../../identity-platform
      dockerfile: services/profile-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8098"
      POSTGRES_DSN: *identity_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_change_me}
      # Required for authenticated profile reads to return anything at all.
      #
      # profile-service enforces blocks by asking graph-service, and it fails
      # CLOSED when it cannot: with this unset, filterBlockedProfileMap drops
      # every entry and POST /v1/profiles/batch answers `{}` to any caller that
      # sends X-User-Id — including the viewer's own profile. That behaviour is
      # correct (SR-4: a caller must not probe by bisection); the defect was
      # that this variable was never wired here.
      #
      # Found on 2026-08-17 by the feed-hydration evidence pass: every feed
      # item rendered `author.display_name = "Deleted account"` because the
      # batch it depends on was silently returning nothing. The service logged
      # the cause at startup as an ERROR and nothing consumed it until now.
      GRAPH_SERVICE_URL: http://graph-service:8083
      # Avatar/cover writes fail closed unless media-service proves that the
      # asset is owned by the profile owner, ready, approved and the right
      # subtype.
      MEDIA_SERVICE_URL: http://media-service:8087
      # Anonymous profile-photo policy is read directly; authenticated viewers
      # are resolved by graph-service's permission matrix.
      USER_SERVICE_URL: http://identity-user:8110
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # No SCHEMA_MIGRATIONS_* knobs here, deliberately. As of 2026-08-16 this
      # service does not migrate its own database: it applies its own additive
      # schema file (services/*/database/setup.sql) and then VERIFIES its
      # preconditions via identity-shared/store/schemaguard, refusing to start
      # when an object it depends on is absent. Schema changes that need a
      # decision about existing data belong in the deployment pipeline.
    ports:
      - "8098:8098"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for auth-service, which provisions the shared identity base
      # tables this service asserts at boot and refuses to start without.
      identity-auth:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ─── Architecture Services ──────────────────────────────────

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8082"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      PROFILE_SERVICE_URL: http://identity-profile:8098
      PAGES_ADMIN_USER_IDS: ${PAGES_ADMIN_USER_IDS:-c52b44aa-c75f-4843-98fa-2225041a5e00}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  graph-service:
    build:
      context: ..
      dockerfile: services/graph-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8083"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Permission resolver reads privacy settings from the identity user-service.
      USER_SERVICE_URL: http://identity-user:8110
      # Read-through projection repair targets the app.users-owning user-service.
      APP_USER_SERVICE_URL: http://user-service:8082
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "8083:8083"
    # Cross-service schema ordering, compose edition.
    #
    # graph-service migration 004 references public.users, which user-service
    # owns. depends_on only waits for the CONTAINER, not for that service's
    # migrations, so on a fresh volume graph-service can reach postgres before
    # `users` exists and exits 1 with SQLSTATE 42P01.
    #
    # Kubernetes already handles this: deploy/services/graph-service/values-*.yaml
    # declares `schemaDependencies: [users]`, and the chart's init container
    # blocks until the table appears. Compose has no init container, so retrying
    # is how it converges here — noisier than the Helm gate, same end state.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  group-service:
    build:
      context: ..
      dockerfile: services/group-service/Dockerfile
    environment:
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8090"
      POSTGRES_DSN: *app_postgres_dsn
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      MESSAGE_SERVICE_URL: http://chat-message-service:8092
      POST_SERVICE_URL: http://post-service:8084
      # Audit CG4: group-service now refuses boot when JWT_SECRET is
      # unset (previously defaulted to the literal "dev_secret_change_me").
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_change_me}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  post-service:
    build:
      context: ..
      dockerfile: services/post-service/Dockerfile
    environment:
      # C-CLB-PROOF-1: the 50-way same-key durability proof needs the
      # frequency cap out of the way so requests reach the idempotency gate.
      # Unset means the production values (20/hour, 50/day).
      MAX_POSTS_PER_HOUR: "${MAX_POSTS_PER_HOUR:-20}"
      MAX_POSTS_PER_DAY: "${MAX_POSTS_PER_DAY:-50}"
      <<: [*redis_client_env, *kafka_client_env]
      HTTP_PORT: "8084"
      POSTGRES_DSN: *app_postgres_dsn
      SCYLLA_HOSTS: scylla
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      USER_SERVICE_URL: http://identity-user:8110
      REVIEWER_SERVICE_URL: http://reviewer-service:8120
      # Local media uses the non-production stub scanner and has no human
      # reviewer deployment. Production AWS manifests may opt into review-all;
      # the local contract stack must allow already-scanned fixtures to flow.
      REVIEW_ALL_VIDEOS: ${REVIEW_ALL_VIDEOS:-false}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
      # Required for the internal media-access authority to answer at all.
      #
      # Story visibility is a relationship question, so story_policy.go needs a
      # graph client. Without one it returns ErrStoryPolicyUnresolved — an
      # honest "I could not decide", which the handler surfaces as 503 so the
      # caller retries rather than caching a denial produced by an outage.
      #
      # Found on 2026-08-17 by the feed-hydration evidence pass: media-service
      # asks this route to authorize a page of media, so an unresolvable answer
      # here made every ranked feed surface (reels, videos, watch) return
      # 503 FEED_UNAVAILABLE. The fail-closed chain behaved correctly; the
      # defect was that this variable was never wired here.
      GRAPH_SERVICE_URL: http://graph-service:8083
      # Moderation capability HMAC keys.
      #
      # trust-safety-service ISSUES these capabilities and post-service VERIFIES
      # them, so the two services must hold byte-identical keys or every
      # capability fails verification. Both blocks reference the same variable
      # with the same default, so they cannot drift apart.
      #
      # The services refuse to start below 32 bytes (correctly — a short HMAC key
      # is forgeable). Without these set, post-service and trust-safety-service
      # exit 1 on boot and the local stack has no moderation path at all.
      STORY_MODERATION_HMAC_KEY: ${STORY_MODERATION_HMAC_KEY:-local_dev_story_moderation_hmac_key_change_me}
      POST_MODERATION_HMAC_KEY: ${POST_MODERATION_HMAC_KEY:-local_dev_post_moderation_hmac_key_change_me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # Migration runner baseline knob — leave default ("false") so new migration
      # files added to database/migrations/ get applied on next boot. Set to
      # "true" only when adopting the runner against an existing DB whose
      # migrations were applied out-of-band; the first such boot marks them
      # as applied without executing. (One-shot, see migrationrunner package.)
      SCHEMA_MIGRATIONS_BASELINE: ${SCHEMA_MIGRATIONS_BASELINE:-false}
    ports:
      - "8084:8084"
    # Same cross-service schema ordering as graph-service, and a longer list:
    # deploy/services/post-service/values-*.yaml declares schemaDependencies
    # [media_assets, user_preferences, users], owned by media-service,
    # feed-service and user-service respectively. Retry until they exist.
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      scylla-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  feed-service:
