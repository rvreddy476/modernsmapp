  payments-service:
    build:
      context: ..
      dockerfile: services/payments-service/Dockerfile
    environment:
      <<: *kafka_client_env
      HTTP_PORT: "8102"
      POSTGRES_DSN: *commerce_postgres_dsn
      KAFKA_BROKERS: redpanda:9092
      # Razorpay credentials — omit to use StubGateway in dev.
      # Audit P8: payments-service refuses boot when RAZORPAY_KEY_ID
      # is empty unless PAYMENTS_ALLOW_STUB=true. Default true here so
      # local docker compose comes up; prod overrides with real creds.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENTS_ALLOW_STUB: ${PAYMENTS_ALLOW_STUB:-true}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local_dev_internal_service_key_change_me}
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

