        '200':
          description: Detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBookingDetail'}

  /v1/doorstep/internal/admin/bookings/{id}/cancel:
    post:
      summary: Ops cancel (full refund unless fee_paise given)
      operationId: adminCancelBooking
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:bookings.cancel
      x-lane: A3
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCancelInput'}
      responses:
        '200':
          description: Booking (admin view, OTPs null). Golden bytes admin_booking_cancel_200.json. The refund (refundable - fee) is written with the cancellation, keyed doorstep:refund:{id}:admin_cancel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}

  /v1/doorstep/internal/admin/bookings/{id}/redispatch:
    post:
      summary: Take the job off the current professional; the customer picks another (never hand-picking)
      operationId: adminRedispatchBooking
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:bookings.redispatch
      x-lane: A4
      description: >-
        From confirmed, assigned, en_route or arrived. B1: the current professional's offer or
        job is released (no penalty) and the booking goes to pro_unavailable (cause
        ops_redispatch): the customer picks another professional (the current one and
        exclude_pro_ids are excluded from their list) or cancels; nobody is offered the job by
        ops. The body cannot name a professional (strict
        decoding: 400). Audited in the same transaction. Golden bytes
        admin_booking_redispatch_200.json, admin_booking_redispatch_400_pick.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRedispatchInput'}
      responses:
        '200':
          description: Booking (pro_unavailable)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: DOORSTEP_INVALID_TRANSITION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/internal/admin/bookings/{id}/refund:
    post:
      summary: Issue a refund (step-up in admin-service)
      operationId: adminRefundBooking
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:refunds.issue
      x-lane: A3
      description: >-
        Refunds the booking payment: amount_paise must not exceed captured minus every refund
        that has not failed (DOORSTEP_REFUND_EXCEEDS_PAID). Idempotent on the Idempotency-Key
        admin-service forwards (its two-person approval replays the same key): the refund key is
        doorstep:refund:{id}:admin_<hash of the key>, and a replay answers the same row. Written
        with its audit row in one transaction, then submitted to payments-service; settled only by
        payment.refunded. payment=extras answers 422 until the visit lane pays extras.
        Golden bytes admin_booking_refund_201.json, admin_booking_refund_422_exceeds.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_paise, reason]
              properties:
                amount_paise: {type: integer, format: int64, minimum: 1}
                reason: {type: string}
                payment: {type: string, enum: [booking, extras], default: booking}
      responses:
        '201':
          description: Refund requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '400':
          description: DOORSTEP_INVALID_REQUEST (no Idempotency-Key, amount, reason)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: DOORSTEP_REFUND_EXCEEDS_PAID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

