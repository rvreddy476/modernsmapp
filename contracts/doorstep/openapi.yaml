  /v1/doorstep/internal/admin/zones:
    get:
      summary: List zones (optionally by city)
      operationId: adminListZones
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:catalogue.read
      x-lane: A1
      parameters:
        - $ref: '#/components/parameters/CityFilter'
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminZoneList'}
    post:
      summary: Create a zone (GeoJSON Polygon or MultiPolygon, WGS84)
      operationId: adminCreateZone
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:config.write
      x-lane: A1
      requestBody:
        required: true
