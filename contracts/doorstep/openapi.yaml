    post:
      summary: Location fix (latest only; Redis GEO per city; live position to the customer while en route)
      operationId: proLocation
      tags: [Professional]
      x-lane: A4
      description: >-
        Overwrites the professional's latest fix (no trail is kept) and mirrors it into
        Redis GEO doorstep:pros:geo:<CITY>. While travelling to a job (en_route) a
        doorstep.booking.pro_location frame goes to that booking's topic. Send at least
        every 5 minutes on duty, or the stale-GPS worker takes you off duty. Golden bytes
        pro_location_409_not_on_duty.json, pro_location_400.json.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationInput'}
      responses:
        '204':
          description: Accepted
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: DOORSTEP_NOT_ON_DUTY
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/offers:
    get:
      summary: My open offers (locality only, no address)
      operationId: proListOffers
      tags: [ProfessionalJob]
      x-lane: A4
      description: Open offers only (status open), soonest expiry first. Golden bytes pro_offers_get_200.json.
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Offer'}

  /v1/doorstep/pro/offers/{id}:
    get:
      summary: One of my offers, in any state (A4 addition; the offer push deep link)
      operationId: proGetOffer
      tags: [ProfessionalJob]
      x-lane: A4
      description: status says whether it can still be accepted. Golden bytes pro_offer_get_200.json, pro_offer_get_404.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Offer'}
        '404':
          description: DOORSTEP_OFFER_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/offers/{id}/accept:
    post:
      summary: Accept an offer (row-locked; idempotent)
      operationId: proAcceptOffer
      tags: [ProfessionalJob]
      x-lane: A4
      description: >-
        Only the offered professional may accept (anyone else: 404). The booking row is
        locked, the professional re-checked (approved, not suspended, gender rule,
        background check valid on the slot date) and the booking moves confirmed to
        assigned with a version compare. Accepting again answers the same job. Golden
        bytes pro_offer_accept_200.json, _404.json, _409_taken.json, _410_expired.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The job, now with address and chat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProJob'}
        '403':
          description: DOORSTEP_GENDER_RULE, DOORSTEP_BACKGROUND_CHECK_REQUIRED, DOORSTEP_PRO_SUSPENDED, DOORSTEP_PRO_NOT_APPROVED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: DOORSTEP_OFFER_NOT_FOUND, DOORSTEP_PRO_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: DOORSTEP_OFFER_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '410':
          description: DOORSTEP_OFFER_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/offers/{id}/decline:
    post:
      summary: Decline an offer (next professional is offered in the same transaction)
      operationId: proDeclineOffer
      tags: [ProfessionalJob]
      x-lane: A4
      description: Body optional. Declining twice is a no-op. Golden bytes pro_offer_decline_400_reason.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, enum: [too_far, busy, not_my_skill, other]}
      responses:
        '204':
          description: Declined
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: DOORSTEP_OFFER_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: DOORSTEP_OFFER_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '410':
          description: DOORSTEP_OFFER_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs:
    get:
      summary: My accepted jobs
      operationId: proListJobs
      tags: [ProfessionalJob]
      x-lane: A4
      description: >-
        upcoming (assigned, soonest first), active (en_route to awaiting_extras_payment,
        soonest first), past (ended, latest first), all (latest first; the default).
        date (YYYY-MM-DD, Asia/Kolkata) narrows to one day; paging continues with
        next_cursor. Golden bytes pro_jobs_get_200.json, pro_jobs_get_400_date.json.
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [upcoming, active, past, all]}
        - name: date
          in: query
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProJob'}
                  next_cursor: {type: string, nullable: true}
        '400':
          $ref: '#/components/responses/Error'

  /v1/doorstep/pro/jobs/{id}:
    get:
      summary: One of my jobs, or a job offered to me (locality only until accepted)
      operationId: proGetJob
      tags: [ProfessionalJob]
      x-lane: A4
      description: >-
        address and chat_open only from acceptance to completion + 2 h. Golden bytes
        pro_job_get_200.json (assigned), pro_job_get_200_offered.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProJob'}
        '404':
          description: DOORSTEP_BOOKING_NOT_FOUND (not offered to or accepted by me)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/en-route:
    post:
      summary: Start travelling (assigned -> en_route)
      operationId: proJobEnRoute
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ProJob'
        '409':
          $ref: '#/components/responses/Error'

  /v1/doorstep/pro/jobs/{id}/arrived:
    post:
      summary: Arrived (geo-checked against the booking point)
      operationId: proJobArrived
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationInput'}
      responses:
        '200':
          $ref: '#/components/responses/ProJob'
        '422':
          description: DOORSTEP_GEO_CHECK_FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/photos:
    post:
      summary: Record a before/after/kit photo (workspace and kit only, never the customer)
      operationId: proJobPhoto
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhotoInput'}
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Photo'}

  /v1/doorstep/pro/jobs/{id}/start:
    post:
      summary: Start with the customer's start OTP (needs min before photos; salon also a sealed-kit photo)
      operationId: proJobStart
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OTPInput'}
      responses:
        '200':
          $ref: '#/components/responses/ProJob'
        '422':
          description: DOORSTEP_OTP_INVALID, DOORSTEP_PHOTOS_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '423':
          description: DOORSTEP_OTP_LOCKED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/extras:
    post:
      summary: Propose an extra from the category rate card (or a catalogue add-on for salon)
      operationId: proProposeExtra
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtraInput'}
      responses:
        '201':
          description: Proposed (customer approves in the app)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extra'}
        '422':
          description: DOORSTEP_EXTRA_INVALID, DOORSTEP_EXTRAS_NOT_ALLOWED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/extras/{extraId}:
    delete:
      summary: Withdraw a proposed extra
      operationId: proWithdrawExtra
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExtraIdPath'
      responses:
        '204':
          description: Withdrawn

  /v1/doorstep/pro/jobs/{id}/finish:
    post:
      summary: Work done; opens the extras bill (awaiting_extras_payment when over the threshold)
      operationId: proJobFinish
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ProJob'
        '409':
          description: DOORSTEP_EXTRAS_PENDING
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/complete:
    post:
      summary: Complete with the end OTP (needs min after photos)
      operationId: proJobComplete
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OTPInput'}
      responses:
        '200':
          $ref: '#/components/responses/ProJob'
        '422':
          description: DOORSTEP_OTP_INVALID, DOORSTEP_PHOTOS_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '423':
          description: DOORSTEP_OTP_LOCKED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/no-show:
    post:
      summary: Customer not present (arrived + waited 15 min)
      operationId: proJobCustomerNoShow
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ProJob'

  /v1/doorstep/pro/jobs/{id}/cancel:
    post:
      summary: Professional gives the job back before arriving (penalty tier; dispatch re-runs)
      operationId: proJobCancel
      tags: [ProfessionalJob]
      x-lane: A4
      description: >-
        From assigned or en_route. The penalty tier (x-doorstep-booking-states.dispatch)
        is written as a negative earning line, the cancellation counts against the
        matcher, the booking goes back to confirmed and the next professional is offered
        it in the same transaction (doorstep.booking.reassigned, cause pro_cancel).
        Inside 45 min of the slot a 30-min rescue window applies.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '204':
          description: Released
        '404':
          description: DOORSTEP_BOOKING_NOT_FOUND (not my accepted job)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: DOORSTEP_INVALID_TRANSITION (arrived or later; use unsafe-exit or no-show)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/jobs/{id}/sos:
    post:
      summary: Professional SOS
      operationId: proJobSOS
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SOSInput'}
      responses:
        '201':
          description: Incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}

  /v1/doorstep/pro/jobs/{id}/unsafe-exit:
    post:
      summary: '"Unsafe, leaving": professional exits; incident raised, booking redispatched or refunded, no penalty'
      operationId: proJobUnsafeExit
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SOSInput'}
      responses:
        '201':
          description: Incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}

  /v1/doorstep/pro/jobs/{id}/rating:
    post:
      summary: Rate the customer
      operationId: proRateCustomer
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RatingInput'}
      responses:
        '201':
          description: Rated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rating'}

  /v1/doorstep/pro/jobs/{id}/messages:
    get:
      summary: Chat with the customer
      operationId: proListMessages
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
    post:
      summary: Send a message
      operationId: proPostMessage
      tags: [ProfessionalJob]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageInput'}
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}

  /v1/doorstep/pro/earnings:
    get:
      summary: Earning lines and totals (computed; payouts OFF)
      operationId: proEarnings
      tags: [Professional]
      x-lane: A5
      parameters:
        - name: from
          in: query
          schema: {type: string, format: date}
        - name: to
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          description: Earnings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Earnings'}

  /v1/doorstep/pro/realtime/token:
    post:
      summary: Realtime token for doorstep.pro.<user_id> and the bookings the professional has accepted
      operationId: issueProRealtimeToken
      tags: [Professional]
      x-lane: A4
      description: >-
        Topics: doorstep.pro.<caller user id> first, then doorstep.booking.<id> for
        every accepted booking still happening (assigned to awaiting_extras_payment).
        No body. Golden bytes pro_realtime_token_post_200.json.
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeToken'}
        '404':
          description: DOORSTEP_PRO_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: DOORSTEP_REALTIME_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  # ===================================================================
  # Background-check vendor webhook (future vendor; signed, no identity)
  # ===================================================================
  # ---------- B1: the professional's own prices ----------
  /v1/doorstep/pro/me/prices:
    get:
      summary: The services I may price, with my prices
      operationId: proListPrices
      tags: [Professional]
      x-lane: B1
      description: >-
        Every active service whose skill I declared (pending or verified; not revoked), each
        item (options with their unit, add-ons per job) with the city's suggested price, my
        live approved price, my submission waiting for review and my newest rejection (with
        its reason). bookable: customers can book me for the service now (approved, skill
        verified, an approved option price, a family the tax computer prices). Golden bytes
        pro_prices_get_200.json.
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProServicePricing'}
    post:
      summary: Submit a price (pending until an admin approves it)
      operationId: proSubmitPrice
      tags: [Professional]
      x-lane: B1
      description: >-
        GST-inclusive paise per unit, 100..10000000. Pending until an admin approves it (nothing
        approves itself); my approved price for the item stays live meanwhile; a submission
        already pending for the item is withdrawn (superseded). The live price again with
        nothing pending is 409 DOORSTEP_CONFLICT (details.reason unchanged). Emits
        doorstep.pro.price_submitted. Golden bytes pro_price_post_201.json,
        pro_price_post_400.json, pro_price_post_403_skill.json, pro_price_post_409_unchanged.json.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProPriceInput'}
      responses:
        '201':
          description: The pending price
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProPrice'}
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: DOORSTEP_SKILL_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: DOORSTEP_SERVICE_NOT_FOUND (no such active service, option or add-on)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: DOORSTEP_CONFLICT (unchanged), DOORSTEP_INVALID_TRANSITION (rejected or blocked professional)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/me/prices/{id}/withdraw:
    post:
      summary: Withdraw a pending price, or stop my live price now
      operationId: proWithdrawPrice
      tags: [Professional]
      x-lane: B1
      description: >-
        A pending price is withdrawn; the live approved one stops now (effective_to) and the
        item is no longer bookable with me. Anything else is 409. Golden bytes
        pro_price_withdraw_200.json, pro_price_withdraw_409.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The withdrawn price
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProPrice'}
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: DOORSTEP_INVALID_TRANSITION (details.status)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/pro/me/services/{id}/same-day:
    put:
      summary: Opt in or out of same-day (as soon as possible) jobs for one service
      operationId: proSetSameDay
      tags: [Professional]
      x-lane: B1
      description: Golden bytes pro_same_day_put_200.json. A service whose skill I have not declared is 403 DOORSTEP_SKILL_REQUIRED.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SameDayInput'}
      responses:
        '200':
          description: The setting
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SameDaySetting'}
        '403':
          description: DOORSTEP_SKILL_REQUIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/webhooks/background-check/{provider}:
    post:
      summary: Background-check vendor callback (AuthBridge / IDfy / OnGrid, later)
      operationId: backgroundCheckWebhook
      tags: [Webhook]
      security: []
      x-lane: A2
      description: Verified by the provider's HMAC signature header; unknown provider -> 404; bad signature -> 401. No provider is enabled at launch.
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '204':
          description: Applied (idempotent on the provider event id)

  # ===================================================================
  # Admin-internal (admin-service tokens only)
