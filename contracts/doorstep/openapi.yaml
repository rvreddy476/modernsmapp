components:
  securitySchemes:
    gatewayIdentity:
      type: apiKey
      in: header
      name: X-Verified-User-Id
      description: Stamped by the gateway from the verified JWT (with X-Internal-Service-Key). Never sent by clients directly.
    adminServiceToken:
      type: apiKey
      in: header
      name: X-Service-Authorization
      description: 'Bearer <ed25519 service token>: iss admin-service, aud doorstep, scope [one doorstep:* permission], act <admin user id>, exp <= 60 s.'

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExtraIdPath:
      name: extraId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CityQuery:
      name: city
      in: query
      required: true
      description: City code, e.g. HYD (case-insensitive)
      schema: {type: string, example: HYD}
    CityFilter:
      name: city
      in: query
      required: false
      schema: {type: string, example: HYD}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 128}

  responses:
    Error:
      description: Error envelope (see x-doorstep-error-codes)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ProJob:
      description: The job after the action
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProJob'}

  schemas:
    # ---------- envelope ----------
    Meta:
      type: object
      properties:
        request_id: {type: string}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: DOORSTEP_ADDON_INVALID}
            message: {type: string}
            details:
              type: object
              additionalProperties: true
        meta: {$ref: '#/components/schemas/Meta'}

    # ---------- enums ----------
    Family:
      type: string
      description: >-
        Drives the GST category (shared/gst `<FAMILY>_VIA_ECO` / `<FAMILY>_REGISTERED`). B1 added
        CAR_CARE, HOME_STAFFING, RELOCATION, PHOTOGRAPHY, FITNESS_WELLNESS and CONSTRUCTION: no
        shared/gst category yet (the tax lane maps them); until then their services are not
        offered to customers (professionals can declare the skills and submit prices).
      enum: [HOME_CLEANING, PEST_CONTROL, APPLIANCE_REPAIR, INSTALLATION_REPAIR, PAINTING, BEAUTY_SALON, CAR_CARE, HOME_STAFFING, RELOCATION, PHOTOGRAPHY, FITNESS_WELLNESS, CONSTRUCTION]
    GenderRule:
      type: string
      enum: [any, female_pros_only, male_pros_only]
    ExtrasPolicy:
      type: string
      enum: [rate_card, catalogue_addons_only]
    BookingStatus:
      type: string
      enum: [pending_payment, confirmed, assigned, en_route, arrived, in_progress, awaiting_extras_payment, completed, cancelled, expired, customer_no_show, pro_no_show, pro_unavailable]
    ProStatus:
      type: string
      enum: [draft, pending_verification, approved, suspended, rejected, blocked]

    # ---------- catalogue (A1, golden) ----------
    CityRef:
      type: object
      required: [code, name]
      properties:
        code: {type: string, example: HYD}
        name: {type: string, example: Hyderabad}
    Catalogue:
      type: object
      required: [city, categories]
      properties:
        city: {$ref: '#/components/schemas/CityRef'}
        categories:
          type: array
          items: {$ref: '#/components/schemas/CategorySummary'}
    CategorySummary:
      type: object
      required: [id, slug, name, description, family, gender_rule, image_url, sort_order, service_count, starting_price_paise]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        family: {$ref: '#/components/schemas/Family'}
        gender_rule: {$ref: '#/components/schemas/GenderRule'}
        image_url: {type: string, nullable: true}
        sort_order: {type: integer}
        service_count: {type: integer, description: Active services with an active option}
        starting_price_paise: {type: integer, format: int64, nullable: true, description: "B1: the lowest bookable professional price of the category's options in the city now; null while no professional offers one"}
    CategoryPage:
      type: object
      required: [city, category, services]
      properties:
        city: {$ref: '#/components/schemas/CityRef'}
        category: {$ref: '#/components/schemas/CategorySummary'}
        services:
          type: array
          items: {$ref: '#/components/schemas/ServiceSummary'}
    ServiceSummary:
      type: object
      required: [id, category_id, slug, name, description, duration_minutes, image_url, starting_price_paise, suggested_price_paise]
      properties:
        id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        duration_minutes: {type: integer}
        image_url: {type: string, nullable: true}
        starting_price_paise: {type: integer, format: int64, nullable: true, description: "B1: lowest bookable professional price of its options (null: nobody yet)"}
        suggested_price_paise: {type: integer, format: int64, nullable: true, description: "B1: lowest city suggested price of its options (informational, never charged); replaces starting_mrp_paise"}
    ServicePage:
      type: object
      required: [city, service]
      properties:
        city: {$ref: '#/components/schemas/CityRef'}
        service: {$ref: '#/components/schemas/ServiceDetail'}
    ServiceDetail:
      type: object
      required: [id, category, slug, name, description, duration_minutes, inclusions, exclusions, image_url, crew_size, rework_days, min_before_photos, min_after_photos, options, addon_groups]
      properties:
        id: {type: string, format: uuid}
        category:
          type: object
          required: [id, slug, name, family, gender_rule, extras_policy]
          properties:
            id: {type: string, format: uuid}
            slug: {type: string}
            name: {type: string}
            family: {$ref: '#/components/schemas/Family'}
            gender_rule: {$ref: '#/components/schemas/GenderRule'}
            extras_policy: {$ref: '#/components/schemas/ExtrasPolicy'}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        duration_minutes: {type: integer}
        inclusions: {type: array, items: {type: string}}
        exclusions: {type: array, items: {type: string}}
        image_url: {type: string, nullable: true}
        crew_size: {type: integer, description: Always 1 at launch (crew bookings switched off)}
        rework_days: {type: integer}
        min_before_photos: {type: integer}
        min_after_photos: {type: integer}
        options:
          type: array
          items: {$ref: '#/components/schemas/ServiceOption'}
        addon_groups:
          type: array
          items: {$ref: '#/components/schemas/AddonGroup'}
    ServiceOption:
      type: object
      description: "B1: the menu. price_paise is gone: every bookable price is a professional's (GET /services/{id}/professionals)."
      required: [id, name, description, duration_minutes, max_quantity, unit, is_default, suggested_price_paise, mrp_paise, from_price_paise]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        duration_minutes: {type: integer, description: "Duration of one unit (per_month: the first visit, which the calendar reserves)"}
        max_quantity: {type: integer}
        unit: {type: string, enum: [per_job, per_hour, per_month], description: quantity counts units}
        is_default: {type: boolean}
        suggested_price_paise: {type: integer, format: int64, nullable: true, description: The city's suggested price per unit (informational, never charged)}
        mrp_paise: {type: integer, format: int64, nullable: true}
        from_price_paise: {type: integer, format: int64, nullable: true, description: The lowest bookable professional price per unit now}
    AddonGroup:
      type: object
      required: [id, name, min_select, max_select, is_required, addons]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        min_select: {type: integer}
        max_select: {type: integer}
        is_required: {type: boolean}
        addons:
          type: array
          items: {$ref: '#/components/schemas/Addon'}
    Addon:
      type: object
      required: [id, name, description, extra_duration_minutes, suggested_price_paise, from_price_paise]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        extra_duration_minutes: {type: integer}
        suggested_price_paise: {type: integer, format: int64, nullable: true}
        from_price_paise: {type: integer, format: int64, nullable: true}

    ServiceabilityRequest:
      type: object
      required: [lat, lng]
      properties:
        lat: {type: number, format: double, minimum: -90, maximum: 90}
        lng: {type: number, format: double, minimum: -180, maximum: 180}
    Serviceability:
      type: object
      required: [serviceable, city, zone, reason]
      properties:
        serviceable: {type: boolean}
        city:
          allOf: [{$ref: '#/components/schemas/CityRef'}]
          nullable: true
        zone:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        reason:
          type: string
          nullable: true
          enum: [OUTSIDE_SERVICE_AREA, null]

    QuoteRequest:
      type: object
      required: [service_id, pro_id, option_id, lat, lng]
      properties:
        service_id: {type: string, format: uuid}
        pro_id: {type: string, format: uuid, description: "B1: the professional the customer picked (GET /services/{id}/professionals)"}
        option_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, default: 1}
        addons:
          type: array
          items:
            type: object
            required: [addon_id]
            properties:
              addon_id: {type: string, format: uuid}
        lat: {type: number, format: double}
        lng: {type: number, format: double}
    Quote:
      type: object
      required: [id, status, service_id, option_id, quantity, pro_id, city_code, zone_id, lines, total_paise, taxable_paise, tax_paise, prices_include_tax, tax_provisional, tax_note, duration_minutes, expires_at, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [open, expired, consumed]}
        service_id: {type: string, format: uuid}
        option_id: {type: string, format: uuid}
        quantity: {type: integer}
        pro_id: {type: string, format: uuid, description: "B1: the picked professional; the quote is priced with their approved prices"}
        city_code: {type: string}
        zone_id: {type: string, format: uuid}
        lines:
          type: array
          items: {$ref: '#/components/schemas/QuoteLine'}
        total_paise: {type: integer, format: int64, description: What the customer pays (GST-inclusive)}
        taxable_paise: {type: integer, format: int64}
        tax_paise: {type: integer, format: int64}
        prices_include_tax: {type: boolean}
        tax_provisional:
          type: boolean
          description: true while the stub TaxComputer is in use (shared/gst Doorstep categories pending adviser sign-off)
        tax_note: {type: string}
        duration_minutes: {type: integer}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    QuoteLine:
      type: object
      required: [kind, ref_id, price_id, name, unit, quantity, unit_price_paise, line_total_paise, taxable_paise, tax_paise, tax_rate_bps, gst_category, sac]
      properties:
        kind: {type: string, enum: [option, addon]}
        ref_id: {type: string, format: uuid}
        price_id: {type: string, format: uuid, description: "B1: the professional's doorstep.pro_service_prices row used (always an approved one)"}
        name: {type: string}
        unit: {type: string, enum: [per_job, per_hour, per_month]}
        quantity: {type: integer, description: Units (hours, months) for per_hour and per_month}
        unit_price_paise: {type: integer, format: int64}
        line_total_paise: {type: integer, format: int64}
        taxable_paise: {type: integer, format: int64}
        tax_paise: {type: integer, format: int64}
        tax_rate_bps: {type: integer}
        gst_category: {type: string, example: HOME_CLEANING_VIA_ECO}
        sac: {type: string}

    # ---------- customer (A3/A5) ----------
    Address:
      type: object
      required: [id, label, line1, line2, landmark, locality, city_code, pincode, lat, lng, zone_id, is_default, created_at]
      properties:
        id: {type: string, format: uuid}
        label: {type: string, example: Home}
        line1: {type: string}
        line2: {type: string, nullable: true}
        landmark: {type: string, nullable: true}
        locality: {type: string, description: The only part shown to a professional before acceptance}
        city_code: {type: string}
        pincode: {type: string}
        lat: {type: number}
        lng: {type: number}
        zone_id: {type: string, format: uuid}
        is_default: {type: boolean}
        created_at: {type: string, format: date-time}
    AddressInput:
      type: object
      required: [label, line1, locality, pincode, lat, lng]
      properties:
        label: {type: string}
        line1: {type: string}
        line2: {type: string}
        landmark: {type: string}
        locality: {type: string}
        pincode: {type: string}
        lat: {type: number}
        lng: {type: number}
        is_default: {type: boolean}
    SlotDays:
      type: object
      required: [timezone, days]
      properties:
        timezone: {type: string, example: Asia/Kolkata}
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            properties:
              date: {type: string, format: date}
              slots:
                type: array
                items:
                  type: object
                  required: [start, end, available]
                  properties:
                    start: {type: string, format: date-time}
                    end: {type: string, format: date-time}
                    available: {type: boolean}
    BookingCreateRequest:
      type: object
      description: Exactly one of slot_start or asap=true (B1).
      required: [quote_id, address_id]
      properties:
        quote_id: {type: string, format: uuid}
        address_id: {type: string, format: uuid}
        slot_start: {type: string, format: date-time}
        asap: {type: boolean, description: "B1: same day, as soon as possible (the quote's professional on duty in range, opted in to same-day jobs)"}
        require_female_pro: {type: boolean, default: false}
        notes: {type: string, maxLength: 500}
    BookingCreated:
      type: object
      required: [booking, payment_intent]
      properties:
        booking: {$ref: '#/components/schemas/Booking'}
        payment_intent: {$ref: '#/components/schemas/PaymentIntent'}
    BookingSummary:
      type: object
      required: [id, status, service_name, category_slug, slot_start, slot_end, total_paise, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/BookingStatus'}
        service_name: {type: string}
        category_slug: {type: string}
        slot_start: {type: string, format: date-time}
        slot_end: {type: string, format: date-time}
        total_paise: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
    StatusStep:
      type: object
      description: One step of the customer's booking timeline (A3). Actor and reason are admin-only.
      required: [from_status, to_status, created_at]
      properties:
        from_status: {type: string, nullable: true}
        to_status: {$ref: '#/components/schemas/BookingStatus'}
        created_at: {type: string, format: date-time}
    Booking:
      type: object
      description: >-
        Golden bytes booking_get_200.json (confirmed), booking_get_200_pending_payment.json,
        booking_cancel_post_200.json, booking_reschedule_post_200.json. end_otp, photos and
        status_history closed the A3 contract gaps: end_otp stays null until the visit lane
        (A5) sets it, photos stays [] until A5 uploads before/after photos (customers see
        only those two phases), status_history is the timeline oldest first.
      required: [id, status, service_id, service_name, category_slug, city_code, zone_id, slot_start, slot_end, duration_minutes, require_female_pro, items, total_paise, taxable_paise, tax_paise, paid_paise, refunded_paise, cancellation_fee_paise, extras_total_paise, outstanding_paise, hold_expires_at, address, professional, parent_booking_id, start_otp, end_otp, photos, status_history, can_cancel, can_reschedule, asap, choice_deadline, unavailable_cause, pending_change, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/BookingStatus'}
        service_id: {type: string, format: uuid}
        service_name: {type: string}
        category_slug: {type: string}
        city_code: {type: string}
        zone_id: {type: string, format: uuid}
        slot_start: {type: string, format: date-time}
        slot_end: {type: string, format: date-time}
        duration_minutes: {type: integer}
        require_female_pro: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/QuoteLine'}
        total_paise: {type: integer, format: int64}
        taxable_paise: {type: integer, format: int64}
        tax_paise: {type: integer, format: int64}
        paid_paise: {type: integer, format: int64}
        refunded_paise: {type: integer, format: int64}
        cancellation_fee_paise: {type: integer, format: int64}
        extras_total_paise: {type: integer, format: int64}
        outstanding_paise: {type: integer, format: int64}
        hold_expires_at: {type: string, format: date-time, nullable: true}
        address: {$ref: '#/components/schemas/Address'}
        professional:
          type: object
          nullable: true
          description: "B1: the professional the customer picked (from booking on), else the one who accepted; null while nobody holds the job (pro_unavailable). First name, photo, rating; a phone never."
          required: [first_name, photo_media_id, rating_avg, jobs_completed]
          properties:
            first_name: {type: string}
            photo_media_id: {type: string, nullable: true}
            rating_avg: {type: number, nullable: true}
            jobs_completed: {type: integer}
        parent_booking_id: {type: string, format: uuid, nullable: true}
        start_otp: {type: string, nullable: true, description: Shown to the customer from assigned until in_progress (A5 sets it; null before)}
        end_otp: {type: string, nullable: true, description: Shown to the customer while in_progress once the after photos are in (A5 sets it; null before). Never in an admin response.}
        photos:
          type: array
          description: Before/after visit photos (A5); [] until then
          items: {$ref: '#/components/schemas/Photo'}
        status_history:
          type: array
          items: {$ref: '#/components/schemas/StatusStep'}
        can_cancel: {type: boolean}
        can_reschedule: {type: boolean, description: "confirmed or assigned, never rescheduled before, and at least 3 h before the slot (same professional only)"}
        asap: {type: boolean, description: "B1: a same-day, as-soon-as-possible booking"}
        choice_deadline: {type: string, format: date-time, nullable: true, description: "B1: while pro_unavailable, pick another professional (or cancel) by then, else it is cancelled with a full refund"}
        unavailable_cause: {type: string, nullable: true, enum: [declined, offer_expired, pro_cancel, not_on_duty, pro_no_show, ops_redispatch, no_professional, null], description: "B1: why the professional is gone (pro_unavailable only)"}
        pending_change:
          allOf: [{$ref: '#/components/schemas/ProChange'}]
          nullable: true
          description: "B1: a change of professional waiting for its difference to be paid (with the payment intent), else null"
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, maxLength: 500}
    CancelPreview:
      type: object
      required: [allowed, fee_paise, refund_paise, rule]
      properties:
        allowed: {type: boolean}
        fee_paise: {type: integer, format: int64}
        refund_paise: {type: integer, format: int64}
        rule: {type: string, description: "e.g. free_before_assignment, lt_3h, lt_1h_or_en_route, arrived, pro_late_free, pro_unavailable_free (B1: always free, a full refund)"}
    PaymentIntent:
      type: object
      required: [payment_id, reference_type, reference_id, amount_paise, status, checkout]
      properties:
        payment_id: {type: string, format: uuid}
        reference_type: {type: string, enum: [doorstep_booking, doorstep_extras]}
        reference_id: {type: string, format: uuid}
        amount_paise: {type: integer, format: int64}
        status: {type: string, enum: [created, pending, succeeded, failed, refunded, partially_refunded]}
        checkout:
          type: object
          additionalProperties: {type: string}
          description: >-
            payments-service's client session relayed unchanged (paymentsclient.ClientSession):
            provider (razorpay, or stub on a dev stack), order_id, key_id (publishable) and,
            when payments has one, merchant_display_name. {} when payments attached none.
            Never a secret. Paid is read ONLY from GET /bookings/{id}/payment.
          properties:
            provider: {type: string, example: razorpay}
            order_id: {type: string}
            key_id: {type: string}
            merchant_display_name: {type: string}
    BookingPayments:
      type: object
      required: [payments, refunds]
      properties:
        payments:
          type: array
          items: {$ref: '#/components/schemas/PaymentIntent'}
        refunds:
          type: array
          items: {$ref: '#/components/schemas/Refund'}
    Refund:
      type: object
      required: [id, payment_id, cause, amount_paise, status, created_at]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        cause: {type: string, example: customer_cancel}
        amount_paise: {type: integer, format: int64}
        status: {type: string, enum: [requested, pending, succeeded, failed]}
        created_at: {type: string, format: date-time}
    Extra:
      type: object
      required: [id, booking_id, kind, rate_card_id, addon_id, name, quantity, unit_price_paise, total_paise, status, evidence_media_id, created_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        kind: {type: string, enum: [rate_card, addon]}
        rate_card_id: {type: string, format: uuid, nullable: true}
        addon_id: {type: string, format: uuid, nullable: true}
        name: {type: string}
        quantity: {type: integer}
        unit_price_paise: {type: integer, format: int64}
        total_paise: {type: integer, format: int64}
        status: {type: string, enum: [proposed, approved, declined, withdrawn, billed]}
        evidence_media_id: {type: string, nullable: true, description: The photo the professional attached to the extra}
        created_at: {type: string, format: date-time}
    ExtraInput:
      type: object
      required: [quantity]
      properties:
        rate_card_id: {type: string, format: uuid}
        addon_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        evidence_media_id: {type: string, format: uuid}
    ExtrasBill:
      type: object
      required: [id, booking_id, amount_paise, taxable_paise, tax_paise, status, due_at, paid_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        amount_paise: {type: integer, format: int64}
        taxable_paise: {type: integer, format: int64}
        tax_paise: {type: integer, format: int64}
        status: {type: string, enum: [open, payment_pending, paid, outstanding, waived, refunded]}
        due_at: {type: string, format: date-time, nullable: true}
        paid_at: {type: string, format: date-time, nullable: true}
    Outstanding:
      type: object
      required: [total_paise, bills]
      properties:
        total_paise: {type: integer, format: int64}
        bills:
          type: array
          items: {$ref: '#/components/schemas/ExtrasBill'}
    RatingInput:
      type: object
      required: [stars]
      properties:
        stars: {type: integer, minimum: 1, maximum: 5}
        tags: {type: array, items: {type: string}}
        comment: {type: string, maxLength: 1000}
    Rating:
      type: object
      required: [id, booking_id, rater_kind, stars, tags, comment, hidden, created_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        rater_kind: {type: string, enum: [customer, pro]}
        stars: {type: integer}
        tags: {type: array, items: {type: string}}
        comment: {type: string, nullable: true}
        hidden: {type: boolean}
        created_at: {type: string, format: date-time}
    ReworkInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, maxLength: 1000}
        media_ids: {type: array, items: {type: string, format: uuid}}
        slot_start: {type: string, format: date-time}
    ReworkRequest:
      type: object
      required: [id, booking_id, child_booking_id, status, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        child_booking_id: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [requested, approved, rejected, scheduled, completed]}
        reason: {type: string}
        created_at: {type: string, format: date-time}
    SOSInput:
      type: object
      properties:
        lat: {type: number}
        lng: {type: number}
        note: {type: string, maxLength: 1000}
    Incident:
      type: object
      required: [id, booking_id, raised_by_kind, kind, severity, status, description, pro_auto_suspended, created_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid, nullable: true}
        raised_by_kind: {type: string, enum: [customer, pro, system, admin]}
        kind: {type: string, enum: [sos, safety, damage, harassment, theft, unsafe_exit, other]}
        severity: {type: string, enum: [low, medium, high, critical]}
        status: {type: string, enum: [open, acknowledged, resolved]}
        description: {type: string, nullable: true}
        pro_auto_suspended: {type: boolean}
        created_at: {type: string, format: date-time}
    ShareToken:
      type: object
      required: [token, url, expires_at]
      properties:
        token: {type: string}
        url: {type: string}
        expires_at: {type: string, format: date-time}
    SharedBookingView:
      type: object
      required: [status, locality, professional_first_name, slot_start, eta_minutes]
      properties:
        status: {$ref: '#/components/schemas/BookingStatus'}
        locality: {type: string}
        professional_first_name: {type: string, nullable: true}
        slot_start: {type: string, format: date-time}
        eta_minutes: {type: integer, nullable: true}
    TrustedContact:
      type: object
      nullable: true
      required: [name, phone_masked, updated_at]
      properties:
        name: {type: string}
        phone_masked: {type: string, example: '******4321'}
        updated_at: {type: string, format: date-time}
    MessageInput:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 1000}
    Message:
      type: object
      required: [id, booking_id, sender_kind, body, created_at, read_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        sender_kind: {type: string, enum: [customer, pro, system]}
        body: {type: string}
        created_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time, nullable: true}
    MessagePage:
      type: object
      required: [items, next_cursor, open]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Message'}
        next_cursor: {type: string, nullable: true}
        open: {type: boolean, description: false outside acceptance .. completion + 2 h}
    TicketInput:
      type: object
      required: [subject, body]
      properties:
        booking_id: {type: string, format: uuid}
        category: {type: string, enum: [payment, quality, safety, damage, professional, other]}
        subject: {type: string, maxLength: 200}
        body: {type: string, maxLength: 4000}
    Ticket:
      type: object
      required: [id, booking_id, category, subject, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid, nullable: true}
        category: {type: string}
        subject: {type: string}
        status: {type: string, enum: [open, in_progress, resolved, closed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RealtimeToken:
      type: object
      required: [token, topics, expires_at]
      properties:
        token: {type: string}
        topics:
          type: array
          items: {type: string, example: doorstep.booking.9b3f0c55-0000-4000-8000-000000000000}
        expires_at: {type: string, format: date-time}

    # ---------- professional (A2/A4/A5) ----------
    ProApplyInput:
      type: object
      required: [display_name, city_code]
      properties:
        display_name: {type: string}
        city_code: {type: string}
        category_ids: {type: array, items: {type: string, format: uuid}}
    Professional:
      type: object
      required: [id, user_id, status, display_name, city_code, gender, photo_media_id, rating_avg, rating_count, jobs_completed, max_jobs_per_day, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ProStatus'}
        display_name: {type: string}
        city_code: {type: string}
        gender: {type: string, nullable: true, enum: [female, male, other, null], description: From DigiLocker Aadhaar only}
        photo_media_id: {type: string, nullable: true}
        rating_avg: {type: number, nullable: true}
        rating_count: {type: integer}
        jobs_completed: {type: integer}
        max_jobs_per_day: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProReadiness:
      type: object
      required: [status, missing_steps, completed_steps, can_go_on_duty]
      properties:
        status: {$ref: '#/components/schemas/ProStatus'}
        missing_steps:
          type: array
          items: {$ref: '#/components/schemas/OnboardingStep'}
        completed_steps:
          type: array
          items: {$ref: '#/components/schemas/OnboardingStep'}
        recommended_steps:
          type: array
          items: {$ref: '#/components/schemas/OnboardingStep'}
        can_go_on_duty: {type: boolean}
    OnboardingStep:
      type: string
      description: In order; pan is recommended, never required
      enum: [profile, aadhaar_digilocker, selfie_face_match, skills, service_area, weekly_hours, bank, police_certificate, agreement, pan]
    KycCheck:
      type: object
      description: >-
        Founder rule (4 Oct 2026): a selfie face match is advisory. The service writes it
        pending (with the score) or failed; passed is written only by an admin approving the
        selfie document, and the database refuses a passed selfie check without an audited
        admin in its transaction.
      required: [kind, status, score, verified_at]
      properties:
        kind: {type: string, enum: [digilocker_aadhaar, selfie_face_match, pan, bank]}
        status: {type: string, enum: [pending, passed, failed, expired]}
        score: {type: number, nullable: true}
        verified_at: {type: string, format: date-time, nullable: true}
    Skill:
      type: object
      required: [code, name, description, requires_certificate]
      properties:
        code: {type: string, example: ac_service}
        name: {type: string}
        description: {type: string}
        requires_certificate: {type: boolean, description: "true: verified only through an admin-approved trade certificate (POST /pro/me/skills/{code}/certificate); false: declaring the skill verifies it (A2)"}
    SkillInput:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[a-z][a-z0-9_]{1,47}$'}
        name: {type: string}
        description: {type: string}
        requires_certificate: {type: boolean, default: true, description: Omitted means true (fail closed)}
    ProSkill:
      type: object
      required: [skill_code, status, verified_at]
      properties:
        skill_code: {type: string}
        status: {type: string, enum: [pending, verified, revoked]}
        verified_at: {type: string, format: date-time, nullable: true}
    ProAreaInput:
      type: object
      required: [zone_ids, home_lat, home_lng, radius_m]
      properties:
        zone_ids: {type: array, items: {type: string, format: uuid}}
        home_lat: {type: number}
        home_lng: {type: number}
        radius_m: {type: integer, minimum: 1000, maximum: 15000}
    ProArea:
      type: object
      description: The saved service area. home_lat/home_lng are null until one is saved (GET /pro/me/area).
      required: [zone_ids, home_lat, home_lng, radius_m]
      properties:
        zone_ids: {type: array, items: {type: string, format: uuid}}
        home_lat: {type: number, nullable: true}
        home_lng: {type: number, nullable: true}
        radius_m: {type: integer, minimum: 1000, maximum: 15000}
    WeeklyHours:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [weekday, start, end]
            properties:
              weekday: {type: integer, minimum: 0, maximum: 6, description: 0 = Sunday}
              start: {type: string, example: '09:00'}
              end: {type: string, example: '18:00'}
    DayOff:
      type: object
      required: [date]
      properties:
        date: {type: string, format: date}
        reason: {type: string, nullable: true}
    PayoutAccount:
      type: object
      required: [account_holder, account_last4, ifsc, status]
      properties:
        account_holder: {type: string}
        account_last4: {type: string}
        ifsc: {type: string}
        status: {type: string, enum: [pending, verified, failed]}
    ProDocument:
      type: object
      required: [id, pro_id, kind, skill_code, media_id, status, issued_on, expires_on, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        pro_id: {type: string, format: uuid}
        kind: {type: string, enum: [police_certificate, trade_certificate, selfie, aadhaar, pan, other], description: "A2: selfie documents are written by POST /pro/selfie (approved when the face match passed, pending for review below the threshold, rejected when it failed or was superseded); aadhaar is never stored"}
        skill_code: {type: string, nullable: true, description: The skill a trade_certificate is for; null for every other kind}
        media_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, rejected]}
        issued_on: {type: string, format: date, nullable: true}
        expires_on: {type: string, format: date, nullable: true}
        reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    AdminProfessionalDetail:
      type: object
      required: [professional, readiness, skills, zone_ids, documents, background_checks, kyc_checks, payout_account]
      properties:
        professional: {$ref: '#/components/schemas/Professional'}
        readiness: {$ref: '#/components/schemas/ProReadiness'}
        skills: {type: array, items: {$ref: '#/components/schemas/ProSkill'}}
        zone_ids: {type: array, items: {type: string, format: uuid}}
        documents: {type: array, items: {$ref: '#/components/schemas/ProDocument'}}
        background_checks:
          type: array
          items:
            type: object
            required: [id, source, status, valid_until]
            properties:
              id: {type: string, format: uuid}
              source: {type: string, enum: [provider, uploaded_document]}
              status: {type: string, enum: [pending, clear, consider, failed, expired]}
              valid_until: {type: string, format: date, nullable: true}
        kyc_checks: {type: array, items: {$ref: '#/components/schemas/KycCheck'}}
        payout_account:
          allOf: [{$ref: '#/components/schemas/PayoutAccount'}]
          nullable: true
    LocationInput:
      type: object
      required: [lat, lng]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
        accuracy_m: {type: number, minimum: 0, maximum: 100000}
    DutyState:
      type: object
      required: [on_duty, since]
      properties:
        on_duty: {type: boolean}
        since: {type: string, format: date-time, nullable: true}
    ProZone:
      type: object
      description: A zone a professional may pick (GET /pro/zones).
      required: [id, city_code, name, slug, boundary]
      properties:
        id: {type: string, format: uuid}
        city_code: {type: string}
        name: {type: string}
        slug: {type: string}
        boundary: {$ref: '#/components/schemas/GeoJSONPolygon'}
    Offer:
      type: object
      description: >-
        A job offered to a professional. Locality only, never the address.
        status: open (can be accepted until expires_at), accepted, declined,
        expired, withdrawn (released by ops, a reschedule, or the booking ended).
        earning_estimate_paise = taxable value less the city/category commission
        (settlement recomputes at completion). distance_m is from the
        professional's previous job that day, else home.
      required: [id, booking_id, status, service_name, category_slug, locality, distance_m, slot_start, slot_end, earning_estimate_paise, expires_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        status: {type: string, enum: [open, accepted, declined, expired, withdrawn]}
        service_name: {type: string}
        category_slug: {type: string}
        locality: {type: string, description: Locality only before acceptance}
        distance_m: {type: integer}
        slot_start: {type: string, format: date-time}
        slot_end: {type: string, format: date-time}
        earning_estimate_paise: {type: integer, format: int64}
        expires_at: {type: string, format: date-time}
    PhotoCounts:
      type: object
      required: [before, after, kit_seal]
      properties:
        before: {type: integer}
        after: {type: integer}
        kit_seal: {type: integer}
    ProJob:
      type: object
      description: >-
        A booking as its professional sees it (also an offered one, locality
        only). photos_uploaded, arrived_at and finished let the app resume a
        visit with no device memory (A4 additions).
      required: [booking_id, status, service_name, category_slug, slot_start, slot_end, items, locality, address, customer_first_name, chat_open, photos_required, photos_uploaded, arrived_at, finished, earning_estimate_paise]
      properties:
        booking_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/BookingStatus'}
        service_name: {type: string}
        category_slug: {type: string}
        slot_start: {type: string, format: date-time}
        slot_end: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/QuoteLine'}
        locality: {type: string}
        address:
          allOf: [{$ref: '#/components/schemas/Address'}]
          nullable: true
          description: From acceptance to completion + 2 h only
        customer_first_name: {type: string, nullable: true, description: Always null until the user service exposes it}
        chat_open: {type: boolean}
        photos_required:
          allOf: [{$ref: '#/components/schemas/PhotoCounts'}]
          description: kit_seal is 1 for salon categories
        photos_uploaded: {$ref: '#/components/schemas/PhotoCounts'}
        arrived_at: {type: string, format: date-time, nullable: true}
        finished: {type: boolean, description: The professional has finished the work (finished_at set)}
        earning_estimate_paise: {type: integer, format: int64}
    PhotoInput:
      type: object
      required: [phase, media_id]
      properties:
        phase: {type: string, enum: [before, after, kit_seal, extra_evidence]}
        media_id: {type: string, format: uuid}
        lat: {type: number}
        lng: {type: number}
    Photo:
      type: object
      required: [id, booking_id, phase, media_id, created_at]
      properties:
        id: {type: string, format: uuid}
        booking_id: {type: string, format: uuid}
        phase: {type: string, enum: [before, after, kit_seal, extra_evidence]}
        media_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    OTPInput:
      type: object
      required: [otp]
      properties:
        otp: {type: string, pattern: '^[0-9]{4}$'}
    Earnings:
      type: object
      required: [total_paise, lines]
      properties:
        total_paise: {type: integer, format: int64}
        lines:
          type: array
          items:
            type: object
            required: [id, booking_id, kind, amount_paise, created_at]
            properties:
              id: {type: string, format: uuid}
              booking_id: {type: string, format: uuid, nullable: true}
              kind: {type: string, enum: [job, extras, incentive, penalty, adjustment, commission]}
              amount_paise: {type: integer, format: int64}
              created_at: {type: string, format: date-time}
    Settlement:
      type: object
      required: [id, pro_id, period_start, period_end, gross_paise, commission_paise, tax_paise, net_paise, status]
      properties:
        id: {type: string, format: uuid}
        pro_id: {type: string, format: uuid}
        period_start: {type: string, format: date}
        period_end: {type: string, format: date}
        gross_paise: {type: integer, format: int64}
        commission_paise: {type: integer, format: int64}
        tax_paise: {type: integer, format: int64}
        net_paise: {type: integer, format: int64}
        status: {type: string, enum: [computed, approved, paid]}

    # ---------- admin (A1 golden: cities, zones, categories, prices) ----------
    ReasonInput:
      type: object
      properties:
        reason: {type: string, maxLength: 1000}
