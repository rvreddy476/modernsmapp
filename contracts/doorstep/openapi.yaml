  /v1/doorstep/realtime/token:
    post:
      summary: Scoped realtime token for one of the customer's bookings (doorstep.booking.<id>)
      operationId: issueCustomerRealtimeToken
      tags: [Booking]
      x-lane: A4
      description: >-
        shared/realtime TokenSigner token (REALTIME_TOKEN_SECRET) naming exactly
        doorstep.booking.<booking_id>; lives 5 minutes (notification-service checks it
        when an SSE connection opens; fetch one per connect). Someone else's booking is
        404 DOORSTEP_BOOKING_NOT_FOUND. Frames carry ids, statuses and times only, never
        an address, phone or OTP (asyncapi x-realtime-frames). Golden bytes
        realtime_token_post_200.json, realtime_token_post_404.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id]
              properties:
                booking_id: {type: string, format: uuid}
      responses:
        '200':
          description: shared/realtime TokenSigner token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeToken'}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: DOORSTEP_BOOKING_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: DOORSTEP_REALTIME_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

