        - $ref: '#/components/parameters/ExtraIdPath'
      responses:
        '200':
          description: >-
            Approved. When the approved extras exceed the city's
            charge-now threshold (default 300000 paise) an extras bill is
            opened and must be paid now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extra'}

  /v1/doorstep/bookings/{id}/extras/{extraId}/decline:
    post:
      summary: Decline a proposed extra
      operationId: declineExtra
      tags: [Visit]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ExtraIdPath'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extra'}

  /v1/doorstep/bookings/{id}/extras-bill:
    get:
      summary: The extras bill of a booking
      operationId: getExtrasBill
      tags: [Visit]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Bill
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExtrasBill'}

  /v1/doorstep/extras-bills/{id}/payment/intent:
    post:
      summary: Pay an extras bill (also how outstanding is paid)
      operationId: createExtrasPaymentIntent
      tags: [Visit]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
