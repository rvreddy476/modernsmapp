        description: {type: string}
        unit: {type: string, enum: [per_item, per_metre, per_hour, per_visit]}
        price_paise: {type: integer, format: int64, description: GST-inclusive}
        max_quantity: {type: integer}
        is_part: {type: boolean, description: Goods (spare part) vs labour; adviser item on composite supply}
        sort_order: {type: integer}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminRateCardInput:
      type: object
      required: [city_code, category_id, code, name, unit, price_paise]
      properties:
        city_code: {type: string}
        category_id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        unit: {type: string, enum: [per_item, per_metre, per_hour, per_visit]}
        price_paise: {type: integer, format: int64, minimum: 1}
        max_quantity: {type: integer, default: 10}
        is_part: {type: boolean, default: false}
        sort_order: {type: integer}
        active: {type: boolean, default: true}
    AdminRateCardPatch:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        unit: {type: string, enum: [per_item, per_metre, per_hour, per_visit]}
        price_paise: {type: integer, format: int64}
        max_quantity: {type: integer}
        is_part: {type: boolean}
        sort_order: {type: integer}
        active: {type: boolean}
    AdminRateCardList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminRateCard'}}
    AdminSlotConfig:
      type: object
      required: [id, city_code, category_id, open_time, close_time, slot_step_minutes, min_lead_minutes, horizon_days, hold_minutes, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        city_code: {type: string}
        category_id: {type: string, format: uuid, nullable: true, description: null = city default}
        open_time: {type: string, example: '08:00'}
        close_time: {type: string, example: '20:00'}
        slot_step_minutes: {type: integer, default: 30}
        min_lead_minutes: {type: integer, default: 120}
        horizon_days: {type: integer, default: 7}
        hold_minutes: {type: integer, default: 10}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminSlotConfigInput:
      type: object
      required: [city_code, open_time, close_time]
      properties:
        city_code: {type: string}
        category_id: {type: string, format: uuid}
        open_time: {type: string}
        close_time: {type: string}
        slot_step_minutes: {type: integer}
        min_lead_minutes: {type: integer}
        horizon_days: {type: integer}
        hold_minutes: {type: integer}
        active: {type: boolean, default: true}
    AdminSlotConfigPatch:
      type: object
      properties:
        open_time: {type: string}
        close_time: {type: string}
        slot_step_minutes: {type: integer}
        min_lead_minutes: {type: integer}
        horizon_days: {type: integer}
        hold_minutes: {type: integer}
        active: {type: boolean}
    AdminSlotConfigList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminSlotConfig'}}
    AdminCancellationRule:
      type: object
      required: [id, city_code, category_id, stage, minutes_before_lt, fee_paise, allowed, sort_order, active, created_at, updated_at]
      description: >-
        The first active rule (category-specific before city default, then
        sort_order) whose stage matches and whose minutes_before_lt is null or
        greater than the minutes left before the slot decides the fee.
        Placeholders: unassigned free; assigned >= 180 min free; < 180 min
        7500; < 60 min or en_route 15000; arrived 20000; in_progress not allowed.
      properties:
        id: {type: string, format: uuid}
        city_code: {type: string}
        category_id: {type: string, format: uuid, nullable: true}
        stage: {type: string, enum: [unassigned, assigned, en_route, arrived, in_progress]}
        minutes_before_lt: {type: integer, nullable: true}
        fee_paise: {type: integer, format: int64}
        allowed: {type: boolean}
        sort_order: {type: integer}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminCancellationRuleInput:
      type: object
      required: [city_code, stage, fee_paise]
      properties:
        city_code: {type: string}
        category_id: {type: string, format: uuid}
        stage: {type: string, enum: [unassigned, assigned, en_route, arrived, in_progress]}
        minutes_before_lt: {type: integer}
        fee_paise: {type: integer, format: int64, minimum: 0}
        allowed: {type: boolean, default: true}
        sort_order: {type: integer}
        active: {type: boolean, default: true}
    AdminCancellationRulePatch:
      type: object
      properties:
        minutes_before_lt: {type: integer, nullable: true}
        fee_paise: {type: integer, format: int64}
        allowed: {type: boolean}
        sort_order: {type: integer}
        active: {type: boolean}
    AdminCancellationRuleList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminCancellationRule'}}
    AdminCommissionRule:
      type: object
      required: [id, city_code, category_id, commission_bps, effective_from, effective_to, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        city_code: {type: string}
        category_id: {type: string, format: uuid, nullable: true}
        commission_bps: {type: integer, minimum: 0, maximum: 5000}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, nullable: true}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminCommissionRuleInput:
      type: object
      required: [city_code, commission_bps]
      properties:
        city_code: {type: string}
        category_id: {type: string, format: uuid}
        commission_bps: {type: integer}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time}
        active: {type: boolean, default: true}
    AdminCommissionRulePatch:
      type: object
      properties:
        commission_bps: {type: integer}
        effective_to: {type: string, format: date-time}
        active: {type: boolean}
    AdminCommissionRuleList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminCommissionRule'}}
    AdminCancelInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, maxLength: 1000}
        fee_paise:
          type: integer
          format: int64
          minimum: 0
          description: Omitted = full refund of what is refundable; a fee is capped at it
    AdminBookingDetail:
      type: object
      description: >-
        Golden bytes admin_booking_get_200.json. booking.start_otp and booking.end_otp are
        always null here (never exposed to admins); photos lists every phase.
      required: [booking, customer_user_id, reserved_pro_id, needs_attention, attention_reason, history, assignments, payments, refunds, extras, photos, excluded_pro_ids, pro_changes]
      properties:
        booking: {$ref: '#/components/schemas/Booking'}
        customer_user_id: {type: string, format: uuid}
        reserved_pro_id: {type: string, format: uuid, nullable: true, description: The professional whose calendar holds the slot (A4 offers to them first)}
        needs_attention: {type: boolean, description: Money did not match (capture amount/payer/intent/currency) or a refund failed; never confirmed from it}
        attention_reason: {type: string, nullable: true}
        history:
          type: array
          items:
            type: object
            required: [from_status, to_status, actor_kind, reason, created_at]
            properties:
              from_status: {type: string, nullable: true}
              to_status: {type: string}
              actor_kind: {type: string, enum: [customer, pro, system, admin, payment_event]}
              reason: {type: string, nullable: true}
              created_at: {type: string, format: date-time}
        assignments:
          type: array
          items:
            type: object
            required: [id, pro_id, role, status, offered_at, offer_expires_at, responded_at]
            properties:
              id: {type: string, format: uuid}
              pro_id: {type: string, format: uuid}
              role: {type: string, enum: [lead, helper]}
              status: {type: string, enum: [offered, accepted, declined, expired, released, completed, no_show, cancelled]}
              offered_at: {type: string, format: date-time}
              offer_expires_at: {type: string, format: date-time}
              responded_at: {type: string, format: date-time, nullable: true}
        payments: {type: array, items: {$ref: '#/components/schemas/PaymentIntent'}}
        refunds: {type: array, items: {$ref: '#/components/schemas/Refund'}}
        extras: {type: array, items: {$ref: '#/components/schemas/Extra'}}
        photos: {type: array, items: {$ref: '#/components/schemas/Photo'}}
        excluded_pro_ids: {type: array, items: {type: string, format: uuid}, description: "B1: professionals the customer may not pick again (they let it go, or ops excluded them)"}
        pro_changes: {type: array, items: {$ref: '#/components/schemas/ProChange'}, description: "B1: every change of professional, oldest first"}
    AdminStats:
      type: object
      required: [bookings_today, bookings_in_progress, unassigned_within_2h, bookings_needing_attention, pros_approved, pros_pending_verification, documents_pending, incidents_open, gmv_today_paise, refunds_today_paise, outstanding_paise]
      description: Golden bytes admin_stats_200.json. "Today" is the IST day.
      properties:
        bookings_today: {type: integer}
        bookings_in_progress: {type: integer}
        unassigned_within_2h: {type: integer}
        bookings_needing_attention: {type: integer}
        pros_approved: {type: integer}
        pros_pending_verification: {type: integer}
        documents_pending: {type: integer}
        incidents_open: {type: integer}
        gmv_today_paise: {type: integer, format: int64}
        refunds_today_paise: {type: integer, format: int64}
        outstanding_paise: {type: integer, format: int64}
    AuditLog:
      type: object
      required: [id, actor_user_id, permission, action, entity, entity_id, details, created_at]
      properties:
        id: {type: integer, format: int64}
        actor_user_id: {type: string, format: uuid}
        permission: {type: string}
        action: {type: string, example: price.create}
        entity: {type: string, example: city_price}
        entity_id: {type: string}
        details: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}

    # ---------- B1 (4 Oct 2026): professionals' prices, the pick, pro_unavailable ----------
    ProPrice:
      type: object
      description: One of a professional's price rows (GST-inclusive paise per unit). An approved row is live from effective_from until effective_to (null - still live).
      required: [id, service_id, item_kind, item_id, unit, price_paise, status, effective_from, effective_to, submitted_at, reviewed_at, reason]
      properties:
        id: {type: string, format: uuid}
        service_id: {type: string, format: uuid}
        item_kind: {type: string, enum: [option, addon]}
        item_id: {type: string, format: uuid}
        unit: {type: string, enum: [per_job, per_hour, per_month]}
        price_paise: {type: integer, format: int64}
        status: {type: string, enum: [pending, approved, rejected, withdrawn]}
        effective_from: {type: string, format: date-time, nullable: true}
        effective_to: {type: string, format: date-time, nullable: true}
        submitted_at: {type: string, format: date-time}
        reviewed_at: {type: string, format: date-time, nullable: true}
        reason: {type: string, nullable: true}
    ProPriceItem:
      type: object
      required: [item_kind, item_id, name, unit, max_quantity, suggested_price_paise, approved, pending, rejected]
      properties:
        item_kind: {type: string, enum: [option, addon]}
        item_id: {type: string, format: uuid}
        name: {type: string}
        unit: {type: string, enum: [per_job, per_hour, per_month]}
        max_quantity: {type: integer}
        suggested_price_paise: {type: integer, format: int64, nullable: true}
        approved:
          allOf: [{$ref: '#/components/schemas/ProPrice'}]
          nullable: true
        pending:
          allOf: [{$ref: '#/components/schemas/ProPrice'}]
          nullable: true
        rejected:
          allOf: [{$ref: '#/components/schemas/ProPrice'}]
          nullable: true
          description: The newest rejection, when newer than what is live or pending
    ProServicePricing:
      type: object
      required: [service_id, service_name, category_slug, category_name, family, skill_code, skill_status, same_day, bookable, items]
      properties:
        service_id: {type: string, format: uuid}
        service_name: {type: string}
        category_slug: {type: string}
        category_name: {type: string}
        family: {$ref: '#/components/schemas/Family'}
        skill_code: {type: string}
        skill_status: {type: string, enum: [pending, verified]}
        same_day: {type: boolean}
        bookable: {type: boolean, description: "approved professional, skill verified, an approved option price, a family the tax computer prices"}
        items:
          type: array
          items: {$ref: '#/components/schemas/ProPriceItem'}
    ProPriceInput:
      type: object
      required: [service_id, item_kind, item_id, price_paise]
      properties:
        service_id: {type: string, format: uuid}
        item_kind: {type: string, enum: [option, addon]}
        item_id: {type: string, format: uuid}
        price_paise: {type: integer, format: int64, minimum: 100, maximum: 10000000, description: GST-inclusive, per unit}
    SameDayInput:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    SameDaySetting:
      type: object
      required: [service_id, same_day, updated_at]
      properties:
        service_id: {type: string, format: uuid}
        same_day: {type: boolean}
        updated_at: {type: string, format: date-time}
    AdminProPrice:
      allOf:
        - $ref: '#/components/schemas/ProPrice'
        - type: object
          required: [pro_id, pro_display_name, pro_status, city_code, service_name, category_slug, item_name, suggested_price_paise, current_approved_paise, reviewed_by]
          properties:
            pro_id: {type: string, format: uuid}
            pro_display_name: {type: string}
            pro_status: {$ref: '#/components/schemas/ProStatus'}
            city_code: {type: string}
            service_name: {type: string}
            category_slug: {type: string}
            item_name: {type: string}
            suggested_price_paise: {type: integer, format: int64, nullable: true}
            current_approved_paise: {type: integer, format: int64, nullable: true, description: The professional's live approved price for the item (another row)}
            reviewed_by: {type: string, format: uuid, nullable: true}
    AdminProPricePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminProPrice'}
        next_cursor: {type: string, nullable: true}
    PriceDecisionInput:
      type: object
      properties:
        reason: {type: string, maxLength: 1000, description: Required to reject}
    PriceLine:
      type: object
      required: [kind, ref_id, name, unit, quantity, unit_price_paise, line_total_paise]
      properties:
        kind: {type: string, enum: [option, addon]}
        ref_id: {type: string, format: uuid}
        name: {type: string}
        unit: {type: string, enum: [per_job, per_hour, per_month]}
        quantity: {type: integer}
        unit_price_paise: {type: integer, format: int64}
        line_total_paise: {type: integer, format: int64}
    NextSlot:
      type: object
      required: [start, end]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    ProfessionalCard:
      type: object
      description: A professional the customer may pick. Never an exact distance, location or phone.
      required: [pro_id, first_name, photo_media_id, rating_avg, rating_count, jobs_completed, distance_band, price, next_slots, eta_minutes, same_day, difference_paise]
      properties:
        pro_id: {type: string, format: uuid}
        first_name: {type: string}
        photo_media_id: {type: string, nullable: true}
        rating_avg: {type: number, nullable: true}
        rating_count: {type: integer}
        jobs_completed: {type: integer}
        distance_band: {type: string, enum: [under_2_km, 2_to_5_km, 5_to_10_km, over_10_km], description: "scheduled: from home; asap: from the live fix"}
        price:
          type: object
          required: [total_paise, taxable_paise, tax_paise, lines]
          properties:
            total_paise: {type: integer, format: int64, description: GST-inclusive}
            taxable_paise: {type: integer, format: int64}
            tax_paise: {type: integer, format: int64}
            lines:
              type: array
              items: {$ref: '#/components/schemas/PriceLine'}
        next_slots:
          type: array
          description: "scheduled: free starts on the date (up to 6) or from now (up to 3); [] for asap"
          items: {$ref: '#/components/schemas/NextSlot'}
        eta_minutes: {type: integer, nullable: true, description: asap only}
        same_day: {type: boolean}
        difference_paise: {type: integer, format: int64, nullable: true, description: "GET /bookings/{id}/professionals only: price minus the booking's total"}
    ProfessionalList:
      type: object
      required: [service_id, option_id, quantity, addon_ids, booking_id, mode, date, sort, timezone, items, no_professional, no_professional_reason, scheduled_alternatives]
      properties:
        service_id: {type: string, format: uuid}
        option_id: {type: string, format: uuid}
        quantity: {type: integer}
        addon_ids: {type: array, items: {type: string, format: uuid}}
        booking_id: {type: string, format: uuid, nullable: true}
        mode: {type: string, enum: [scheduled, asap]}
        date: {type: string, format: date, nullable: true}
        sort: {type: string, enum: [price, rating, soonest]}
        timezone: {type: string, example: Asia/Kolkata}
        items:
          type: array
          items: {$ref: '#/components/schemas/ProfessionalCard'}
        no_professional: {type: boolean}
        no_professional_reason: {type: string, nullable: true, enum: [none_available_now, null]}
        scheduled_alternatives:
          type: array
          description: "asap with nobody: the next free starts for the same selection and address (founder: include schedule as well in case no worker found)"
          items: {$ref: '#/components/schemas/ProfessionalCard'}
    ProChange:
      type: object
      required: [id, status, pro_id, pro_first_name, asap, slot_start, slot_end, previous_total_paise, new_total_paise, difference_paise, refund_paise, hold_expires_at, payment_intent, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending_payment, applied, abandoned]}
        pro_id: {type: string, format: uuid}
        pro_first_name: {type: string}
        asap: {type: boolean}
        slot_start: {type: string, format: date-time}
        slot_end: {type: string, format: date-time}
        previous_total_paise: {type: integer, format: int64}
        new_total_paise: {type: integer, format: int64}
        difference_paise: {type: integer, format: int64, description: new - previous}
        refund_paise: {type: integer, format: int64, description: Refunded at once when the new professional is cheaper}
        hold_expires_at: {type: string, format: date-time, nullable: true, description: pending_payment only}
        payment_intent:
          allOf: [{$ref: '#/components/schemas/PaymentIntent'}]
          nullable: true
          description: "pending_payment only: reference doorstep_extras (the pro_change bill), paid only by the signed event"
        created_at: {type: string, format: date-time}
    ProChangeRequest:
      type: object
      description: Exactly one of slot_start or asap=true.
      required: [pro_id]
      properties:
        pro_id: {type: string, format: uuid}
        slot_start: {type: string, format: date-time}
        asap: {type: boolean}
    ProChangeResult:
      type: object
      required: [booking, change]
      properties:
        booking: {$ref: '#/components/schemas/Booking'}
        change: {$ref: '#/components/schemas/ProChange'}
