    get:
      summary: My declared skills and their review (A4 addition for the pro app)
      operationId: proGetMySkills
      tags: [Professional]
      x-lane: A4
      description: Golden bytes pro_me_skills_get_200.json.
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProSkill'}
    put:
      summary: Declare my skills (every one pending until an admin verifies it)
      description: >-
        Founder rule (4 Oct 2026): declaring never verifies a skill, certificate-free
        ones included. An admin verifies it (skills/{code}/verify, or approving its trade
        certificate); the database refuses a verification without an audited admin.
      operationId: proPutSkills
      tags: [Professional]
      x-lane: A2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_codes]
              properties:
                skill_codes:
                  type: array
                  items: {type: string}
      responses:
        '200':
          description: My skills with verification status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProSkill'}

  /v1/doorstep/pro/me/skills/{code}/certificate:
    post:
      summary: Upload a trade certificate for a declared skill that requires one (reviewed by an admin)
      operationId: proPostTradeCertificate
      tags: [Professional]
      x-lane: A2
      description: >-
        A skill whose requires_certificate is true is verified only when an
        admin approves its trade certificate (POST
        /internal/admin/documents/{id}/decide); a skill with
        requires_certificate false is verified on declaration. The image must
        be the caller's own processed, moderation-passed upload.
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id, issued_on]
              properties:
                media_id: {type: string, format: uuid}
                issued_on: {type: string, format: date}
                certificate_number: {type: string}
      responses:
        '201':
          description: Document pending review (kind trade_certificate, skill_code set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProDocument'}
        '400':
          description: DOORSTEP_INVALID_REQUEST (unknown skill, skill needs no certificate, skill not declared, not your media)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: DOORSTEP_CONFLICT (a certificate for this skill is already under review)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

