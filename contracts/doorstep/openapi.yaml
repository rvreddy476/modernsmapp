        /v1/media/internal/{mediaId}/image-bytes, internal key plus a
        doorstep-service token, audience media, operation
        media:image-bytes.read, no user identity) and streams the bytes with
        Cache-Control no-store, private and X-Content-Type-Options nosniff.
        Never a redirect or a URL. One admin_audit_log row (action
        document.view) per successful view, written before the bytes are
        sent. admin-service proxies it with step-up and its own audit row per
        view (like the commerce KYC /view route). Error bodies are the JSON
        envelope. Fixtures: admin_document_view_404.json,
        admin_document_view_403_scope.json, admin_document_view_503.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Raster image (JPEG, PNG, WebP, GIF or AVIF), at most 15 MB
          headers:
            Cache-Control: {schema: {type: string, example: 'no-store, private'}}
            X-Content-Type-Options: {schema: {type: string, example: nosniff}}
          content:
            image/*:
              schema: {type: string, format: binary}
        '403':
          description: ADMIN_PERMISSION_NOT_IN_TOKEN (and the other token refusals)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: DOORSTEP_NOT_FOUND (no such document, or media-service has no viewable image for it)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: DOORSTEP_MEDIA_UNAVAILABLE (media-service unreachable or refused doorstep's credential)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/internal/admin/bookings:
    get:
      summary: Bookings (filters)
      operationId: adminListBookings
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:bookings.read
      x-lane: A3
      description: Latest slot first, 50 per page; rows carry no address. Golden bytes admin_bookings_list_200.json.
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/BookingStatus'}
        - $ref: '#/components/parameters/CityFilter'
        - name: date
          in: query
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/BookingSummary'}
                  next_cursor: {type: string, nullable: true}

  /v1/doorstep/internal/admin/bookings/{id}:
    get:
      summary: Booking with history, assignments, payments, refunds, extras, photos
      operationId: adminGetBooking
      tags: [Admin]
      security: [{adminServiceToken: []}]
      x-permission: doorstep:bookings.read
      x-lane: A3
