openapi: 3.0.3
info:
  title: Doorstep Home Services API
  version: 1.0.0
  description: >-
    Authoritative REST contract for Doorstep (Urban Company style home
    services): the customer surface (Momentum Android app and postbook-ui
    /doorstep), the professional surface (/pro, the doorstep_pro Android app)
    and the admin-internal family (/internal/admin, admin-service tokens only).


    Served by doorstep-service (port 8122, schema `doorstep`) behind the API
    gateway prefix /v1/doorstep (dormant gate DOORSTEP_PUBLIC_ENABLED, pilot
    allowlist DOORSTEP_PILOT_USER_IDS). Pilot city Hyderabad (`HYD`).


    Conventions (binding for every lane):

    - Every response is the shared envelope: success `{"data": <payload>,
      "meta": {"request_id": "..."}}`, failure `{"error": {"code", "message",
      "details"?}, "meta": {...}}`. Schemas below describe `data` unless they
      are named `*Envelope` or `ErrorEnvelope`.

    - Money is integer paise in fields ending `_paise`. Customer prices are
      GST-inclusive; the split is shown as `taxable_paise` + `tax_paise`.

    - Error codes are stable UPPER_SNAKE strings (see `x-doorstep-error-codes`).
      Clients branch on `error.code`, never on `message`.

    - Timestamps are RFC 3339 UTC. Dates are `YYYY-MM-DD` in the city's time
      zone (Asia/Kolkata). Times of day are `HH:MM`.

    - Optional values are emitted as explicit `null`, never omitted, on every
      Doorstep payload (strict decoders on web and Android).

    - Identity: the gateway is the only JWT verifier; it stamps
      X-Verified-User-Id / X-User-Id and X-Internal-Service-Key. Routes marked
      `security: []` need only the internal key (no user). The
      /internal/admin family needs `X-Service-Authorization: Bearer <token>`
      minted by admin-service (aud `doorstep`, iss `admin-service`, scope =
      the one `doorstep:*` permission, act = admin user id, exp 60 s), and the
      gateway refuses /internal/ from the edge.


    `x-lane` names the doorstep-service lane that implements a route
    (A1 catalogue/zones/quotes/admin catalogue+config, A2 professional
    onboarding, A3 calendar/holds/bookings/payments, A4 dispatch/offers/
    realtime, A5 visit/extras/ratings/rework/safety/chat/tickets/settlements,
    A6 remaining admin, B1 the 4 Oct 2026 change of model). Golden bytes: doorstep-service
    internal/http/testdata/contracts/*.json (copied byte-identical to web and
    Android).


    B1 (4 Oct 2026, the change of model): the platform catalogue is the
    menu (categories, services, options with a unit per_job / per_hour /
    per_month, add-ons); every bookable price is a professional's own
    (doorstep.pro_service_prices), pending until an admin approves it
    (doorstep:prices.review). A city price is only a SUGGESTED price, never
    charged. The customer lists the professionals for a selection and an
    address (GET /services/{id}/professionals: price, rating, a distance
    band, next free starts, or for asap=true the on-duty professionals in
    range with an ETA), picks one, quotes with them (pro_id), books them
    (slot_start or asap=true; the hold is on them and nobody else). A
    booking whose professional is gone goes to pro_unavailable: the customer
    picks another professional (difference refunded at once, or charged as a
    pro_change extras bill) or cancels for a full refund; 30 minutes without
    a choice refund it in full. Nobody is reassigned silently. Founder rule
    (same day): nothing a professional submits is approved by itself — the
    face match, a vendor background-check verdict and skill declarations are
    advisory until an admin decides, and the database refuses any approval
    without an audit row of an admin in its transaction.
servers:
  - url: https://api.atpost.app
    description: Production API Gateway
  - url: http://localhost:8080
    description: Local API Gateway

tags:
  - name: Catalogue
  - name: Customer
  - name: Booking
  - name: Visit
  - name: Safety
  - name: Professional
  - name: ProfessionalJob
  - name: Admin
  - name: Webhook

security:
  - gatewayIdentity: []

x-doorstep-booking-states:
  description: >-
    Booking status values and the only transitions the service performs.
    Every transition writes doorstep.booking_status_history and emits the
    matching doorstep.booking.* event through the outbox in the same
    transaction.
  states:
    - pending_payment        # booking created, 10-minute hold on the reserved professional, payment intent open
    - confirmed              # signed payment.succeeded applied via ApplyOnce; offer sent to the reserved professional
    - assigned               # a professional accepted the offer
    - en_route               # professional started travelling
    - arrived                # professional within the arrival radius (geo-checked)
    - in_progress            # start OTP verified + minimum before photos uploaded
    - awaiting_extras_payment  # finished with approved extras >= the charge-now threshold, not yet paid
    - completed              # after photos + end OTP; extras paid or turned into outstanding
    - cancelled              # by customer, professional (before start), ops or a worker; refunds per cancellation rules
    - expired                # hold lapsed before payment; a late capture is fully refunded
    - customer_no_show       # professional waited, customer absent; no-show fee applies
    - pro_no_show            # professional never arrived and no replacement could be found; full refund (A4 rescue rows only since B1)
    - pro_unavailable        # B1: the picked professional declined, let the offer lapse, gave the job back, was not on duty, did not turn up, or ops took it off them; payment kept, calendar released; the customer picks another professional (no new payment; difference refunded or charged) or cancels (full refund); 30 min without a choice: cancelled, full refund
  transitions:
    - {from: pending_payment, to: confirmed, by: payment_event}
    - {from: pending_payment, to: expired, by: worker}
    - {from: expired, to: confirmed, by: payment_event_late_capture}  # only while the reserved professional is still free and the slot ahead; else a full refund and it stays expired
    - {from: pending_payment, to: cancelled, by: customer}
    - {from: confirmed, to: assigned, by: pro_accept}
    - {from: confirmed, to: pro_unavailable, by: [pro_decline, worker_offer_expired, ops_redispatch, no_professional]}  # B1: never moved to someone else silently
    - {from: confirmed, to: cancelled, by: [customer, ops, worker_t_minus_45, worker_rescue_failed]}  # T-45 never applies to an ASAP booking
    - {from: confirmed, to: pro_no_show, by: worker_rescue_failed}  # A4 rescue rows only (no new rescue since B1)
    - {from: assigned, to: pro_unavailable, by: [pro_cancel, ops_redispatch, worker_not_on_duty, worker_pro_no_show]}
    - {from: assigned, to: en_route, by: pro}
    - {from: assigned, to: cancelled, by: [customer, ops]}
    - {from: en_route, to: arrived, by: pro_geo_checked}
    - {from: en_route, to: pro_unavailable, by: [pro_cancel, pro_unsafe_exit, ops_redispatch, worker_pro_no_show]}
    - {from: en_route, to: cancelled, by: [customer, ops]}
    - {from: arrived, to: in_progress, by: pro_start_otp_and_photos}
    - {from: arrived, to: customer_no_show, by: pro}
    - {from: arrived, to: pro_unavailable, by: [pro_unsafe_exit, ops_redispatch]}
    - {from: pro_unavailable, to: confirmed, by: [customer_change_professional, payment_event_change_difference]}  # the picked professional is offered the job
    - {from: pro_unavailable, to: cancelled, by: [customer, ops, worker_choice_timeout]}  # full refund
    - {from: arrived, to: cancelled, by: [customer, ops]}
    - {from: in_progress, to: awaiting_extras_payment, by: pro_finish}
    - {from: in_progress, to: completed, by: pro_end_otp_and_photos}
    - {from: in_progress, to: cancelled, by: [ops, pro_unsafe_exit]}
    - {from: awaiting_extras_payment, to: completed, by: [payment_event, worker_grace_to_outstanding]}
  rework: >-
    A rework request on a completed booking within the service's rework_days
    creates a child booking (parent_booking_id set, total 0, status
    confirmed) that follows the same lifecycle.
  offer_window: >-
    2 h when the slot starts more than 12 h after the offer, else 10 min (city
    config offer_window_far/near_minutes, offer_far_threshold_minutes); 3 min
    for an ASAP booking (B1); never past a rescue deadline. One open offer per
    booking, always to the professional the customer picked (reserved_pro_id,
    whose calendar holds the slot).
  dispatch: >-
    B1 (supersedes A4 auto-reassignment). The job is offered to the
    professional the customer picked and to nobody else. Decline, expiry, a
    job given back, not on duty, a no-show and ops redispatch close that
    professional's assignment (penalties as before), release the calendar
    and move the booking to pro_unavailable (doorstep.booking.pro_unavailable
    + realtime doorstep.booking.pro_unavailable): the customer lists
    alternatives (GET /bookings/{id}/professionals, everyone who let it go
    excluded) and picks one (POST /bookings/{id}/change-professional) — a
    cheaper or equal professional is confirmed at once (difference refunded,
    key doorstep:refund:{id}:pro_change_<hash>), a dearer one is held while
    the difference is paid (extras bill kind pro_change, payments reference
    doorstep_extras, intent key doorstep:extras:{bill}, applied ONLY by the
    signed payment.succeeded) — or cancels for a full refund. Ops never
    choose the professional; an ops redispatch produces the choice for the
    customer. Penalties (placeholders, negative earning lines): job given
    back >= 24 h before 0, 3-24 h 100 rupees, < 3 h 200 rupees, once
    travelling 300 rupees; no-show 300 rupees.
  workers:
    - offer past its expiry -> expired, booking pro_unavailable (never the next professional)
    - confirmed with no live offer -> offered again to the picked professional (at most every 2 min, ASAP always, scheduled while the slot is > 45 min away)
    - T-2h unassigned (scheduled only) -> doorstep.booking.unassigned_alert (reason t_minus_2h, once) + doorstep.admin.live
    - T-45min unassigned (scheduled only) -> cancelled by the system + full refund (doorstep:refund:{id}:unassigned)
    - assigned professional not on duty by T-90min (accepted >= 15 min earlier) -> pro_unavailable (cause not_on_duty)
    - slot start + 15 min not arrived -> doorstep.booking.pro_late; the customer may cancel free (cancel-preview rule pro_late_free)
    - slot start + 30 min not arrived -> pro no-show (penalty, no_show_count) -> pro_unavailable (cause pro_no_show)
    - pro_unavailable for 30 min with no change being paid for -> cancelled by the system, full refund over every payment (doorstep:refund:{id}:pro_unavailable)
    - a change of professional whose difference was not paid before its hold lapsed -> abandoned (hold released; the customer may pick again until the deadline; a later capture is refunded)
    - A4 rescue window over with nobody accepting (rows from before B1) -> pro_no_show or cancelled by the system, full refund
    - on duty with no location fix for 5 min -> off duty

x-doorstep-error-codes:
  # Shared middleware codes (not Doorstep-prefixed, emitted by shared code)
  UNAUTHORIZED: {status: 401, meaning: X-Internal-Service-Key missing or wrong}
  AUTH_REQUIRED: {status: 401, meaning: no gateway identity on a user route}
  INVALID_USER_ID: {status: 401, meaning: gateway identity is not a UUID}
  ADMIN_SERVICE_TOKEN_REQUIRED: {status: 401, meaning: admin route without X-Service-Authorization}
  SERVICE_CREDENTIAL_REQUIRED: {status: 401, meaning: deployment accepts no service tokens (SERVICE_CALLERS unset)}
  SERVICE_TOKEN_REJECTED: {status: 403, meaning: bad signature, unknown caller, wrong audience, expired, or a caller other than admin-service}
  ADMIN_PERMISSION_NOT_IN_TOKEN: {status: 403, meaning: token scope lacks the route permission; details.required}
  ADMIN_ACTOR_REQUIRED: {status: 403, meaning: token has no act claim}
  # Doorstep domain codes
  DOORSTEP_INVALID_REQUEST: {status: 400, meaning: malformed body, id or query; details.field when known}
  DOORSTEP_CITY_NOT_FOUND: {status: 404, meaning: unknown or inactive city code}
  DOORSTEP_CATEGORY_NOT_FOUND: {status: 404}
  DOORSTEP_SERVICE_NOT_FOUND: {status: 404}
  DOORSTEP_SERVICE_NOT_AVAILABLE: {status: 422, meaning: "service has no active option in the city, or (details.reason tax_category_pending) its family has no GST category yet (B1 families: the tax lane maps them)"}
  DOORSTEP_OUTSIDE_SERVICE_AREA: {status: 422, meaning: point is in no active zone of an active city}
  DOORSTEP_OPTION_INVALID: {status: 422, meaning: option unknown, inactive or of another service}
  DOORSTEP_QUANTITY_INVALID: {status: 422, meaning: quantity outside 1..option.max_quantity}
  DOORSTEP_ADDON_INVALID: {status: 422, meaning: add-on unknown, of another service, inactive, duplicated, or a group's min/max broken; details.group_id, details.min_select, details.max_select when a group rule failed}
  DOORSTEP_QUOTE_NOT_FOUND: {status: 404}
  DOORSTEP_QUOTE_EXPIRED: {status: 410}
  DOORSTEP_ADDRESS_NOT_FOUND: {status: 404}
  DOORSTEP_SLOT_UNAVAILABLE: {status: 422, meaning: "details.reason: inside_lead_time, beyond_horizon, not_on_grid, no_professional, professional_unavailable (the picked professional fails a hard filter or is busy then), professional_excluded (they let this booking go, or ops excluded them), not_available_now (ASAP: not on duty in range, no same-day opt-in, busy, or outside open hours)"}
  DOORSTEP_SLOT_TAKEN: {status: 409, meaning: the picked professional could not be held (the exclusion constraint lost a race); list the professionals again}
  DOORSTEP_HOLD_EXPIRED: {status: 410, meaning: the 10-minute hold lapsed; book again}
  DOORSTEP_OUTSTANDING_DUE: {status: 409, meaning: customer has unpaid extras; details.outstanding_paise, details.extras_bill_ids}
  DOORSTEP_BOOKING_NOT_FOUND: {status: 404}
  DOORSTEP_INVALID_TRANSITION: {status: 409, meaning: action not allowed in the booking's status; details.status}
  DOORSTEP_CANCEL_NOT_ALLOWED: {status: 409, meaning: cancellation after the start OTP}
  DOORSTEP_RESCHEDULE_NOT_ALLOWED: {status: 409, meaning: already rescheduled once, or less than 3 h before the slot}
  DOORSTEP_PAYMENTS_UNAVAILABLE: {status: 503, meaning: payments-service client not configured or down}
  DOORSTEP_PAYMENT_ALREADY_SETTLED: {status: 409}
  DOORSTEP_GENDER_RULE: {status: 403, meaning: the professional's DigiLocker gender does not satisfy the category rule or the customer's woman-professional preference}
  DOORSTEP_OTP_INVALID: {status: 422, meaning: wrong start/end OTP; details.attempts_left}
  DOORSTEP_OTP_LOCKED: {status: 423, meaning: too many wrong OTPs; details.locked_until}
  DOORSTEP_PHOTOS_REQUIRED: {status: 422, meaning: before/after/kit photos missing; details.phase, details.required, details.uploaded}
  DOORSTEP_GEO_CHECK_FAILED: {status: 422, meaning: arrived reported too far from the address; details.distance_m, details.max_distance_m}
  DOORSTEP_EXTRA_INVALID: {status: 422, meaning: rate-card item unknown/inactive, quantity over max, or free text}
  DOORSTEP_EXTRAS_NOT_ALLOWED: {status: 422, meaning: category allows catalogue add-ons only (salon)}
  DOORSTEP_EXTRAS_PENDING: {status: 409, meaning: finish attempted with undecided extras}
  DOORSTEP_OFFER_NOT_FOUND: {status: 404, meaning: no such offer for this professional (another professional's offer reads the same)}
  DOORSTEP_OFFER_EXPIRED: {status: 410, meaning: the offer lapsed (the next professional is offered by the worker)}
  DOORSTEP_OFFER_TAKEN: {status: 409, meaning: the offer was declined, withdrawn or superseded, or the booking is no longer waiting for this professional}
  DOORSTEP_PRO_NOT_FOUND: {status: 404}
  DOORSTEP_PRO_EXISTS: {status: 409}
  DOORSTEP_PRO_NOT_APPROVED: {status: 403}
  DOORSTEP_PRO_SUSPENDED: {status: 403}
  DOORSTEP_ONBOARDING_INCOMPLETE: {status: 422, meaning: details.missing_steps}
  DOORSTEP_BACKGROUND_CHECK_REQUIRED: {status: 403, meaning: no clear check valid on the slot date}
  DOORSTEP_DIGILOCKER_UNAVAILABLE: {status: 503}
  DOORSTEP_FACE_MATCH_FAILED: {status: 422}
  DOORSTEP_NOT_ON_DUTY: {status: 409, meaning: a location fix from a professional who is off duty}
  DOORSTEP_REALTIME_UNAVAILABLE: {status: 503, meaning: realtime is not wired on this deployment (no Redis or no token secret)}
  DOORSTEP_RATING_EXISTS: {status: 409}
  DOORSTEP_RATING_WINDOW_CLOSED: {status: 422}
  DOORSTEP_REWORK_WINDOW_CLOSED: {status: 422}
  DOORSTEP_REWORK_EXISTS: {status: 409}
  DOORSTEP_CHAT_CLOSED: {status: 409, meaning: chat opens at acceptance and closes 2 h after completion}
  DOORSTEP_SHARE_TOKEN_INVALID: {status: 404}
  DOORSTEP_TICKET_NOT_FOUND: {status: 404}
  DOORSTEP_INCIDENT_NOT_FOUND: {status: 404}
  DOORSTEP_REFUND_EXCEEDS_PAID: {status: 422}
  DOORSTEP_STUB_UNAVAILABLE: {status: 409, meaning: dev stub confirm while payments-service has a real provider (pay through checkout)}
  DOORSTEP_NOT_FOUND: {status: 404, meaning: admin entity not found}
  DOORSTEP_CONFLICT: {status: 409, meaning: admin write violates a unique rule (slug, code, default option)}
  DOORSTEP_ZONE_INVALID: {status: 422, meaning: boundary is not a valid GeoJSON Polygon/MultiPolygon}
  DOORSTEP_PRICE_OVERLAP: {status: 409, meaning: price periods for one item and city overlap}
  DOORSTEP_PII_UNAVAILABLE: {status: 503, meaning: sealing keys are not configured (development only; production refuses to boot without them)}
  DOORSTEP_MEDIA_UNAVAILABLE: {status: 503, meaning: media-service could not verify an upload or serve a document image}
  DOORSTEP_CERTIFICATE_REQUIRED: {status: 422, meaning: a skill with requires_certificate is verified only through an approved trade certificate; details.skill_code}
  DOORSTEP_WEBHOOK_SIGNATURE_INVALID: {status: 401, meaning: background-check vendor webhook signature does not verify}
  DOORSTEP_PRICE_UNAVAILABLE: {status: 422, meaning: "B1: the picked professional has no approved, live price for an item of the selection (details.item_ids), or a price was withdrawn or replaced after the quote"}
  DOORSTEP_SKILL_REQUIRED: {status: 403, meaning: "B1: pricing (or same-day for) a service whose skill the professional has not declared or an admin revoked"}
  DOORSTEP_CHOICE_WINDOW_CLOSED: {status: 409, meaning: "B1: the 30 minutes to pick another professional for a pro_unavailable booking are over"}
  DOORSTEP_INTERNAL: {status: 500}

x-doorstep-permissions:
  # admin-service token scope per route (doorstep:<area>.<verb>)
  - doorstep:catalogue.read
  - doorstep:catalogue.write
  - doorstep:config.write
  - doorstep:pros.read
  - doorstep:pros.approve
  - doorstep:pros.suspend
  - doorstep:documents.review
  - doorstep:bookings.read
  - doorstep:bookings.cancel
  - doorstep:bookings.redispatch
  - doorstep:refunds.issue        # step-up in admin-service
  - doorstep:incidents.read
  - doorstep:incidents.act
  - doorstep:tickets.act
  - doorstep:ratings.moderate
  - doorstep:settlements.read
  - doorstep:stats.read
  - doorstep:audit.read
  - doorstep:prices.review       # B1: review professionals' prices (identity catalogue, admin-service mirror and BFF, console "Prices" approvals tab)

x-doorstep-payments:
  application: doorstep
  reference_types:
    doorstep_booking: {reference_id: booking id, intent_key: "doorstep:booking:{booking_id}"}
    doorstep_extras: {reference_id: extras bill id, intent_key: "doorstep:extras:{bill_id}", bill_kinds: "visit_extras (A5) | pro_change (B1: the difference when the customer picks a dearer professional for a pro_unavailable booking)"}
  rules:
    - A booking or extras bill is paid ONLY by the signed payment.succeeded event applied once (shared/paymentevents ApplyOnce); client callbacks are advisory.
    - No cash method exists in this API.
    - "B1: a refund is spread over the booking's payments (the booking payment first, then each paid pro_change bill); the first row carries the cause's key, a further row <key>:<hash of the payment>."
    - "B1: refund causes pro_unavailable (no choice in 30 min), pro_change_<hash of the change> (a cheaper professional picked), late_change_<hash of the bill> (a difference captured after its change lapsed)."
    - Refund idempotency key per cause, e.g. doorstep:refund:{booking_id}:{cause}.

paths:
  # ===================================================================
  # Catalogue (A1) - internal key only, no user identity
  # ===================================================================
  /v1/doorstep/catalogue:
    get:
      summary: Categories offered in a city
      operationId: getCatalogue
      tags: [Catalogue]
      security: []
      x-lane: A1
      parameters:
        - $ref: '#/components/parameters/CityQuery'
      responses:
        '200':
          description: Active categories of a family the tax computer prices (B1 families wait for the tax lane) with at least one active service; starting_price_paise is the lowest bookable professional price (null while nobody offers one). Golden bytes catalogue_get_200.json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalogue'}
        '404':
          $ref: '#/components/responses/Error'

  /v1/doorstep/categories/{slug}:
    get:
      summary: One category with its services
      operationId: getCategory
      tags: [Catalogue]
      security: []
      x-lane: A1
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, example: salon-women}
        - $ref: '#/components/parameters/CityQuery'
      responses:
        '200':
          description: Golden bytes category_get_200.json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryPage'}
        '404':
          description: DOORSTEP_CITY_NOT_FOUND or DOORSTEP_CATEGORY_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/services/{id}:
    get:
      summary: Service detail (the menu) with options, units, add-on groups, suggested and from prices
      operationId: getService
      tags: [Catalogue]
      security: []
      x-lane: A1
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/CityQuery'
      responses:
        '200':
          description: Active options (with unit, the city's suggested price and the lowest bookable professional price) and active add-ons; prices are the professionals', picked through GET /services/{id}/professionals. Golden bytes service_get_200.json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServicePage'}
        '404':
          description: DOORSTEP_CITY_NOT_FOUND, DOORSTEP_SERVICE_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: DOORSTEP_SERVICE_NOT_AVAILABLE (no active option, or details.reason tax_category_pending)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/serviceability:
    post:
      summary: Is a point inside an active service zone?
      operationId: checkServiceability
      tags: [Catalogue]
      security: []
      x-lane: A1
      description: >-
        Point-in-zone via PostGIS ST_Covers on the zone boundary (a point on
        the edge is inside). When zones touch, the lowest (sort by name, id)
        zone wins. Always 200; `serviceable=false` carries reason
        OUTSIDE_SERVICE_AREA. Golden bytes serviceability_in_200.json,
        serviceability_out_200.json.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceabilityRequest'}
      responses:
        '200':
          description: Serviceability answer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Serviceability'}
        '400':
          $ref: '#/components/responses/Error'

  /v1/doorstep/share/{token}:
    get:
      summary: Shared booking status (trusted contact view)
      operationId: getSharedBooking
      tags: [Safety]
      security: []
      x-lane: A5
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedBookingView'}
          description: Locality, status, professional first name and photo, ETA. Never the full address.
        '404':
          description: DOORSTEP_SHARE_TOKEN_INVALID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  # ===================================================================
  # Customer (gateway identity)
  # ===================================================================
  /v1/doorstep/quotes:
    post:
      summary: Price a service selection with the picked professional (GST-inclusive)
      operationId: createQuote
      tags: [Customer]
      x-lane: A1
      description: >-
        B1: pro_id (required) is the professional the customer picked; every
        line is priced with that professional's approved, live price (no city
        price ever fills a gap: DOORSTEP_PRICE_UNAVAILABLE, details.item_ids)
        and price_id is that price row. Validates the option (active, of this
        service), the quantity (1..max_quantity) and the add-ons with the food
        add-on group rules (each group: count >= max(min_select, is_required ?
        1 : 0) and count <= max_select; no duplicates; add-on of this service,
        active). Prices are GST-inclusive; tax is split by
        the TaxComputer (provisional until shared/gst lands; the invoice is
        recomputed at completion with the actual professional). Expires after
        15 minutes. Golden bytes quote_post_201.json, quote_post_422_*.json.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteRequest'}
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quote'}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: DOORSTEP_SERVICE_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: DOORSTEP_OUTSIDE_SERVICE_AREA, DOORSTEP_OPTION_INVALID, DOORSTEP_QUANTITY_INVALID, DOORSTEP_ADDON_INVALID, DOORSTEP_SERVICE_NOT_AVAILABLE, DOORSTEP_PRICE_UNAVAILABLE (quote_post_422_price_unavailable.json; quote_post_400_pro_required.json without pro_id)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/quotes/{id}:
    get:
      summary: Read one of my quotes
      operationId: getQuote
      tags: [Customer]
      x-lane: A1
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quote'}
          description: The quote (status open, expired or consumed)
        '404':
          description: DOORSTEP_QUOTE_NOT_FOUND (also for another user's quote)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/addresses:
    get:
      summary: My saved addresses
      operationId: listAddresses
      tags: [Customer]
      x-lane: A3
      description: Default first, then newest. Street lines are sealed at rest (shared/pii) and opened for the owner only. Golden bytes addresses_get_200.json.
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Address'}
    post:
      summary: Save an address (point must be serviceable)
      operationId: createAddress
      tags: [Customer]
      x-lane: A3
      description: >-
        Serviceability on save: the point must be in an active zone (city and zone are derived
        from it). The first address is the default. line1, line2 and landmark are sealed. Golden
        bytes address_post_201.json, address_post_422_outside_area.json. 503
        DOORSTEP_PII_UNAVAILABLE when sealing keys are absent (development only).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '422':
          description: DOORSTEP_OUTSIDE_SERVICE_AREA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/addresses/{id}:
    patch:
      summary: Edit an address
      operationId: updateAddress
      tags: [Customer]
      x-lane: A3
      description: Partial update. An absent field keeps its value (lat and lng change together); the point is re-checked for serviceability. Bookings keep their own snapshot.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove an address (soft delete; bookings keep their snapshot)
      operationId: deleteAddress
      tags: [Customer]
      x-lane: A3
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Removed

  /v1/doorstep/slots:
    get:
      summary: Bookable slots for a quote (calendar-derived)
      operationId: listSlots
      tags: [Booking]
      x-lane: A3
      description: >-
        B1: the grid of the quote's professional (or, with booking_id, the
        booking's professional) only; GET /services/{id}/professionals is the
        primary picker.         A slot is offered only when at least one professional passes the hard
        dispatch filters (approved, background check clear on the date, skill,
        gender rule + preference, zone, calendar fit incl. travel buffer, daily
        cap). Earliest slot = now + min_lead_minutes (2 h); horizon from the
        slot config. Also used for reschedule with booking_id. Send exactly one of
        quote_id or booking_id. Every grid start of the horizon is listed; available is
        false inside the lead time or when nobody can take it. Cached at most 30 s (advisory:
        the hold decides). Golden bytes slots_get_200.json, slots_get_409_outstanding.json.
      parameters:
        - name: quote_id
          in: query
          schema: {type: string, format: uuid}
        - name: booking_id
          in: query
          description: Reschedule mode (excludes the booking's own block)
          schema: {type: string, format: uuid}
        - name: address_id
          in: query
          schema: {type: string, format: uuid}
        - name: require_female_pro
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Days with slots
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotDays'}
        '409':
          description: DOORSTEP_OUTSTANDING_DUE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '410':
          description: DOORSTEP_QUOTE_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings:
    post:
      summary: Book the picked professional for a slot or as soon as possible (hold, then pay)
      operationId: createBooking
      tags: [Booking]
      x-lane: A3
      description: >-
        B1: the hold goes on the quote's professional (the customer's pick)
        and nobody else; on a lost race DOORSTEP_SLOT_TAKEN and the client
        lists again. Send exactly one of slot_start (the grid) or asap=true
        (an on-duty professional in range who opted in to same-day jobs: the
        block runs from now, the job starts at now + ETA, the hold lasts 5
        minutes, the offer 3 minutes; booking_post_201_asap.json). Every
        line's price must still be the professional's approved, live price
        (else DOORSTEP_PRICE_UNAVAILABLE). Inserts a `hold`
        calendar block (EXCLUDE USING gist makes a double hold impossible),
        creates the booking in pending_payment and the payments-service
        intent (application doorstep, reference doorstep_booking). Idempotent
        on the Idempotency-Key header per customer. A replay with the same body answers the
        same booking (and opens the intent if it was never opened); the same key with another
        quote, address or slot (or asap) is 400. The professional is reserved (reserved_pro_id).
        The hold is [slot_start, slot_end + the zone travel buffer) (ASAP: from the booking
        time). Outstanding extras refuse with 409. Golden bytes
        booking_post_201.json, booking_post_400_idempotency_key.json,
        booking_post_409_slot_taken.json, booking_post_409_outstanding.json,
        booking_post_410_quote_expired.json, booking_post_422_slot_unavailable.json
        (details.reason inside_lead_time, beyond_horizon, not_on_grid, no_professional,
        professional_unavailable or not_available_now).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingCreateRequest'}
      responses:
        '201':
          description: Booking created; pay before hold_expires_at
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingCreated'}
        '409':
          description: DOORSTEP_SLOT_TAKEN, DOORSTEP_OUTSTANDING_DUE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '410':
          description: DOORSTEP_QUOTE_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: DOORSTEP_SLOT_UNAVAILABLE, DOORSTEP_OUTSIDE_SERVICE_AREA, DOORSTEP_PRICE_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: DOORSTEP_PAYMENTS_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    get:
      summary: My bookings
      operationId: listBookings
      tags: [Booking]
      x-lane: A3
      description: upcoming = active bookings soonest first; past = finished, latest first; all = latest slot first. Golden bytes bookings_get_200.json.
      parameters:
        - name: status
          in: query
          description: upcoming | past | all
          schema: {type: string, enum: [upcoming, past, all], default: all}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of bookings
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/BookingSummary'}
                  next_cursor: {type: string, nullable: true}

  /v1/doorstep/bookings/{id}:
    get:
      summary: One of my bookings
      operationId: getBooking
      tags: [Booking]
      x-lane: A3
      description: Golden bytes booking_get_200.json, booking_get_200_pending_payment.json, booking_get_404.json (also for another customer's booking).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '404':
          $ref: '#/components/responses/Error'

  /v1/doorstep/bookings/{id}/cancel-preview:
    get:
      summary: What cancelling now would cost
      operationId: previewCancel
      tags: [Booking]
      x-lane: A3
      description: >-
        Fee tiers from doorstep.cancellation_rules (category rules first, then sort order): free
        before payment and before assignment; assigned free from 3 h out, then the lt_3h and
        lt_1h fees; en route and arrived their fees; in progress not allowed. The fee never
        exceeds what is refundable. Golden bytes cancel_preview_get_200.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Fee and refund
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CancelPreview'}

  /v1/doorstep/bookings/{id}/cancel:
    post:
      summary: Cancel my booking
      operationId: cancelBooking
      tags: [Booking]
      x-lane: A3
      description: Releases the calendar, cancels open offers, writes the refund (paid - fee, key doorstep:refund:{id}:customer_cancel) with the cancellation and submits it. Golden bytes booking_cancel_post_200.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200':
          description: Cancelled; refund (total - fee) requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '409':
          description: DOORSTEP_CANCEL_NOT_ALLOWED, DOORSTEP_INVALID_TRANSITION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/reschedule:
    post:
      summary: Move my booking to another slot (free once, up to 3 h before)
      operationId: rescheduleBooking
      tags: [Booking]
      x-lane: A3
      description: >-
        From confirmed or assigned, once, at least 3 h before the slot, with the same professional
        only (B1: the customer picked them and their price; a slot they cannot take is 422
        DOORSTEP_SLOT_UNAVAILABLE, nobody else is held). New block then the old one released, in
        one transaction. Golden bytes booking_reschedule_post_200.json,
        booking_reschedule_post_409.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_start]
              properties:
                slot_start: {type: string, format: date-time}
      responses:
        '200':
          description: Rescheduled (may re-run dispatch)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Booking'}
        '409':
          description: DOORSTEP_RESCHEDULE_NOT_ALLOWED, DOORSTEP_SLOT_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/payment/intent:
    post:
      summary: (Re)open the payment intent for a pending booking
      operationId: createBookingPaymentIntent
      tags: [Booking]
      x-lane: A3
      description: Golden bytes booking_payment_intent_post_200.json, booking_payment_intent_410_hold_expired.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Intent (idempotent on doorstep:booking:{id})
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentIntent'}
        '409':
          description: DOORSTEP_PAYMENT_ALREADY_SETTLED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '410':
          description: DOORSTEP_HOLD_EXPIRED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: DOORSTEP_PAYMENTS_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/payment:
    get:
      summary: Payment status of a booking (paid only by the signed event)
      operationId: getBookingPayment
      tags: [Booking]
      x-lane: A3
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Payment rows (booking + extras) and refunds. The ONLY source a client reads "paid" from. Golden bytes booking_payment_get_200_pending.json, booking_payment_get_200.json, booking_payment_get_200_refund.json.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingPayments'}
        '404':
          description: DOORSTEP_BOOKING_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/payment/stub-confirm:
    post:
      summary: (Development only) settle the booking through payments-service's stub gateway
      operationId: stubConfirmBookingPayment
      tags: [Booking]
      x-lane: A3
      description: >-
        Local/dev stacks only (404 DOORSTEP_NOT_FOUND anywhere else, the route does nothing
        there). Asks payments-service to verify a stub callback for the booking's intent; its
        stub settlement publishes the signed payment.succeeded, and the consumer confirms the
        booking from that event like any real capture. This route never marks anything paid:
        poll GET /bookings/{id}/payment. Refused with 409 DOORSTEP_STUB_UNAVAILABLE when
        payments-service has a real provider (the webhook settles there). Golden bytes
        booking_payment_stub_confirm_404.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The payment rows as they stand (usually still pending for a moment)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingPayments'}
        '404':
          description: DOORSTEP_NOT_FOUND (not a development stack), DOORSTEP_BOOKING_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: DOORSTEP_STUB_UNAVAILABLE, DOORSTEP_INVALID_TRANSITION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  # ===================================================================
  # B1 (4 Oct 2026): the customer picks the professional
  # ===================================================================
  /v1/doorstep/services/{id}/professionals:
    get:
      summary: The professionals the customer may pick for a selection at an address
      operationId: listServiceProfessionals
      tags: [Booking]
      x-lane: B1
      description: >-
        Every approved professional who passes every hard filter (approved and not
        incident-suspended, background check clear on the date, the service's skill verified,
        the category gender rule and the customer's woman-professional preference against
        the DigiLocker gender, the address's zone among theirs and within their radius, the
        calendar incl. the travel buffer, the daily cap) AND has an approved, live price for
        every item of the selection. Each card: first name, photo, rating, a distance band
        (never an exact distance or location), the GST-inclusive price split by the tax
        computer, and up to 3 next free starts (6 on a chosen date). asap=true: the
        professionals on duty with a location fix younger than 5 min, within their radius of
        the address (from that fix), who opted in to same-day jobs for the service and are
        free from now, each with eta_minutes (travel at 20 km/h + 5 min prep, rounded to 5);
        nobody -> no_professional true, no_professional_reason none_available_now and
        scheduled_alternatives (the same selection's next free starts). At most 20, sorted by
        price (default), rating (smoothed) or soonest. Golden bytes
        service_professionals_get_200.json, service_professionals_get_200_asap.json,
        service_professionals_get_200_asap_none.json, service_professionals_get_400_address.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - {name: option_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: quantity, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: addon_id, in: query, description: Repeat for each add-on, schema: {type: array, items: {type: string, format: uuid}}, style: form, explode: true}
        - {name: address_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: query, description: "YYYY-MM-DD (IST) within the horizon; omitted: the next free starts from now", schema: {type: string, format: date}}
        - {name: asap, in: query, description: Same day, as soon as possible (not with date), schema: {type: boolean, default: false}}
        - {name: sort, in: query, schema: {type: string, enum: [price, rating, soonest], default: price}}
        - {name: require_female_pro, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfessionalList'}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: DOORSTEP_SERVICE_NOT_FOUND, DOORSTEP_ADDRESS_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: DOORSTEP_OPTION_INVALID, DOORSTEP_QUANTITY_INVALID, DOORSTEP_ADDON_INVALID, DOORSTEP_OUTSIDE_SERVICE_AREA, DOORSTEP_SERVICE_NOT_AVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/professionals:
    get:
      summary: Alternatives for a pro_unavailable booking
      operationId: listBookingProfessionals
      tags: [Booking]
      x-lane: B1
      description: >-
        The same list for the booking's own selection and address, the professionals who let
        it go (and any ops excluded) left out, each card with difference_paise against the
        booking's total (negative: refunded on the change; positive: charged). date, asap
        and sort as on the service list. Only while the booking is pro_unavailable (else 409
        DOORSTEP_INVALID_TRANSITION). Golden bytes booking_professionals_get_200.json,
        booking_professionals_get_200_asap.json, booking_professionals_get_409.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: asap, in: query, schema: {type: boolean, default: false}}
        - {name: sort, in: query, schema: {type: string, enum: [price, rating, soonest], default: price}}
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfessionalList'}
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: DOORSTEP_INVALID_TRANSITION
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/change-professional:
    post:
      summary: Pick another professional and a time for a pro_unavailable booking (no new payment)
      operationId: changeBookingProfessional
      tags: [Booking]
      x-lane: B1
      description: >-
        Idempotency-Key required (a replay answers the same change; the same key with another
        body is 400). Exactly one of slot_start or asap=true. Before choice_deadline (else 409
        DOORSTEP_CHOICE_WINDOW_CLOSED); the professional must not be excluded (422
        DOORSTEP_SLOT_UNAVAILABLE reason professional_excluded), must pass every hard filter for
        the time (reason professional_unavailable or not_available_now) and price the booking's
        selection (DOORSTEP_PRICE_UNAVAILABLE). Cheaper or equal: confirmed at once with the new
        professional, lines, slot and total; the difference refunded (change.refund_paise); the
        job offered to them (doorstep.booking.pro_changed). Dearer: the professional is held
        (hold_expires_at) while the difference is paid — change.status pending_payment with a
        payment_intent (reference doorstep_extras, intent key doorstep:extras:{bill}); only the
        signed payment.succeeded applies it (poll GET /bookings/{id}); a pending change keeps the
        30-minute timeout off until its hold lapses. A new pick abandons a pending one. Golden
        bytes booking_change_professional_post_200_refund.json,
        booking_change_professional_post_200_charge.json,
        booking_change_professional_422_excluded.json, booking_change_professional_409_window.json.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProChangeRequest'}
      responses:
        '200':
          description: The booking and the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProChangeResult'}
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: DOORSTEP_INVALID_TRANSITION, DOORSTEP_CHOICE_WINDOW_CLOSED, DOORSTEP_SLOT_TAKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: DOORSTEP_SLOT_UNAVAILABLE, DOORSTEP_PRICE_UNAVAILABLE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '503':
          description: DOORSTEP_PAYMENTS_UNAVAILABLE (a dearer change with no extras payments client)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /v1/doorstep/bookings/{id}/extras:
    get:
      summary: Extras the professional proposed
      operationId: listBookingExtras
      tags: [Visit]
      x-lane: A5
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Extras
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Extra'}

  /v1/doorstep/bookings/{id}/extras/{extraId}/approve:
    post:
      summary: Approve a proposed extra
      operationId: approveExtra
      tags: [Visit]
      x-lane: A5
      parameters:
