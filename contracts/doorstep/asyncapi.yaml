asyncapi: 2.6.0
info:
  title: Doorstep Event Contracts
  version: 1.0.0
  description: >-
    Kafka topic `doorstep.events` (written only through the schema-local
    transactional outbox `doorstep.outbox_events`, drained by shared/outbox),
    realtime topics (shared/realtime StreamPublisher + TokenSigner, delivered
    by notification-service SSE), and the push-type registry for the Momentum
    app and the `doorstep_pro` device app.


    Envelope (every Kafka value): `{event_id, event_type, version, occurred_at,
    booking_id?, customer_user_id?, pro_user_id?, data}`. Every payload carries
    `customer_user_id` and/or `pro_user_id` so notification-service never has
    to call back. Partition key: booking_id for doorstep.booking.* and
    doorstep.incident.raised; pro_user_id for doorstep.pro.*. Kafka header
    `event_type` mirrors the envelope. Consumers dedupe on event_id. Money in
    integer paise. No address, phone, OTP or document number ever appears in an
    event (locality at most).

channels:
  doorstep.events:
    description: Authoritative Doorstep lifecycle events.
    publish:
      summary: Emitted by doorstep-service via the outbox in the same transaction as the state change
      message:
        oneOf:
          - $ref: '#/components/messages/BookingCreated'
          - $ref: '#/components/messages/BookingConfirmed'
          - $ref: '#/components/messages/BookingExpired'
          - $ref: '#/components/messages/BookingAssigned'
          - $ref: '#/components/messages/BookingReassigned'
          - $ref: '#/components/messages/BookingUnassignedAlert'
          - $ref: '#/components/messages/BookingProLate'
          - $ref: '#/components/messages/BookingEnRoute'
          - $ref: '#/components/messages/BookingArrived'
          - $ref: '#/components/messages/BookingStarted'
          - $ref: '#/components/messages/BookingExtrasProposed'
          - $ref: '#/components/messages/BookingExtrasDecided'
          - $ref: '#/components/messages/BookingExtrasPaymentDue'
          - $ref: '#/components/messages/BookingExtrasPaid'
          - $ref: '#/components/messages/BookingOutstandingCreated'
          - $ref: '#/components/messages/BookingCompleted'
          - $ref: '#/components/messages/BookingCancelled'
          - $ref: '#/components/messages/BookingRescheduled'
          - $ref: '#/components/messages/BookingNoShow'
          - $ref: '#/components/messages/BookingRefunded'
          - $ref: '#/components/messages/BookingRefundFailed'
          - $ref: '#/components/messages/BookingPaymentAttention'
          - $ref: '#/components/messages/BookingRated'
          - $ref: '#/components/messages/BookingReworkRequested'
          - $ref: '#/components/messages/BookingMessageSent'
          - $ref: '#/components/messages/BookingReminder'
          - $ref: '#/components/messages/IncidentRaised'
          - $ref: '#/components/messages/ProApplied'
          - $ref: '#/components/messages/ProStatusChanged'
          - $ref: '#/components/messages/ProDocumentReviewed'
          - $ref: '#/components/messages/ProBackgroundCheckExpiring'
          - $ref: '#/components/messages/ProOfferCreated'
          - $ref: '#/components/messages/ProOfferClosed'
          - $ref: '#/components/messages/ProSettlementComputed'
          - $ref: '#/components/messages/ProPriceSubmitted'
          - $ref: '#/components/messages/ProPriceReviewed'
          - $ref: '#/components/messages/BookingProUnavailable'
          - $ref: '#/components/messages/BookingProChanged'

  doorstep.booking.{booking_id}:
    description: >-
      Realtime topic for one booking. Token scope: the booking's customer
      (POST /realtime/token), the accepted professional (POST
      /pro/realtime/token), admin console. Frames (A4): see x-realtime-frames
      (doorstep.booking.status, doorstep.booking.pro_late,
      doorstep.booking.pro_location while en_route, B1 doorstep.booking.pro_unavailable). Ids, statuses and times
      only: never an address, phone or OTP. Clients refetch on reconnect;
      Kafka is the durable copy.
    parameters:
      booking_id:
        schema: {type: string, format: uuid}
    subscribe:
      message:
        $ref: '#/components/messages/RealtimeFrame'

  doorstep.pro.{user_id}:
    description: Realtime topic for one professional (offers, job changes).
    parameters:
      user_id:
        schema: {type: string, format: uuid}
    subscribe:
      message:
        $ref: '#/components/messages/RealtimeFrame'

  doorstep.admin.live:
    description: Ops live feed (unassigned alerts, SOS, incidents). Admin console token only.
    subscribe:
      message:
        $ref: '#/components/messages/RealtimeFrame'

x-realtime-frames:
  description: >-
    A4. Published by doorstep-service after the change commits, through
    shared/realtime StreamPublisher (Redis Streams rts:<topic>; read by
    notification-service SSE). Wire shape: shared/realtime Event {topic,
    event_type, data, emitted_at}. Tokens: shared/realtime TokenSigner with
    REALTIME_TOKEN_SECRET, 5-minute lifetime. No frame carries an address, a
    phone number or an OTP.
  doorstep.booking.<booking_id>:
    doorstep.booking.status: {data: [booking_id, status, slot_start, slot_end, at], when: "every status change (confirmed, assigned, back to confirmed, pro_unavailable, confirmed again after a change of professional, cancelled, pro_no_show) and a slot moved by a reschedule or a no-show rescue"}
    doorstep.booking.pro_late: {data: [booking_id, minutes_late, free_cancel, at], when: "slot + 15 min, not arrived"}
    doorstep.booking.pro_location: {data: [booking_id, lat, lng, eta_minutes, at], when: "a location fix while the professional is en_route to this booking"}
    doorstep.booking.pro_unavailable: {data: [booking_id, cause, choice_deadline, at], cause: [declined, offer_expired, pro_cancel, not_on_duty, pro_no_show, ops_redispatch, no_professional], when: "B1: the picked professional is gone; the customer picks another (GET /bookings/{id}/professionals) or cancels by choice_deadline (30 min, then a full refund). Sent right after the status frame"}
  doorstep.pro.<user_id>:
    doorstep.pro.offer.new: {data: [offer_id, booking_id, expires_at, slot_start, slot_end, at]}
    doorstep.pro.offer.closed: {data: [offer_id, booking_id, outcome, at], outcome: [accepted, declined, expired, withdrawn], when: "B1: a decline or an expiry moves the booking to pro_unavailable; it is never offered to anyone else"}
    doorstep.pro.job.assigned: {data: [booking_id, status, at]}
    doorstep.pro.job.removed: {data: [booking_id, cause, at], cause: [pro_cancel, pro_no_show, not_on_duty, ops_redispatch, rescheduled, booking_cancelled], when: "B1: pro_cancel, pro_no_show, not_on_duty and ops_redispatch now leave the booking pro_unavailable (the customer chooses) instead of re-dispatching it"}
    doorstep.pro.job.updated: {data: [booking_id, status, cause, at], when: "the customer moved the slot and the professional keeps the job"}
    doorstep.pro.duty: {data: [on_duty, since, reason, at], reason: [professional, no_location]}
  doorstep.admin.live:
    doorstep.admin.unassigned: {data: [booking_id, reason, minutes_to_slot, at], reason: [t_minus_2h, no_professional_left], when: "B1: no_professional_left when the picked professional's calendar no longer admits the job (the booking then goes to pro_unavailable)"}

x-push-types:
  description: >-
    notification-service maps doorstep.events to pushes. Momentum (customer)
    types are prefixed `doorstep.`; doorstep_pro device-app types are
    prefixed `doorstep.pro.`. `deeplink` is the in-app route. Titles/bodies
    are owned by notification-service; `data` keys listed are the push data
    payload (strings).
  momentum:
    doorstep.booking.confirmed: {from_event: doorstep.booking.confirmed, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.assigned: {from_event: doorstep.booking.assigned, data: [booking_id, pro_first_name], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.reassigned: {from_event: doorstep.booking.reassigned, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}", when: "B1: only a reschedule to a slot the accepted professional cannot take (cause rescheduled)"}
    doorstep.booking.pro_unavailable: {from_event: doorstep.booking.pro_unavailable, data: [booking_id, cause, choice_deadline], deeplink: "momentum://doorstep/bookings/{booking_id}/professionals", priority: high, when: "B1: pick another professional or cancel for a full refund before choice_deadline"}
    doorstep.booking.pro_changed: {from_event: doorstep.booking.pro_changed, data: [booking_id, difference_paise], deeplink: "momentum://doorstep/bookings/{booking_id}", when: "B1: the new professional is confirmed (difference_paise < 0 - refunded)"}
    doorstep.booking.pro_en_route: {from_event: doorstep.booking.en_route, data: [booking_id, eta_minutes], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.pro_arrived: {from_event: doorstep.booking.arrived, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.started: {from_event: doorstep.booking.started, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.extras_proposed: {from_event: doorstep.booking.extras_proposed, data: [booking_id, extra_id, total_paise], deeplink: "momentum://doorstep/bookings/{booking_id}/extras"}
    doorstep.booking.extras_payment_due: {from_event: doorstep.booking.extras_payment_due, data: [booking_id, bill_id, amount_paise], deeplink: "momentum://doorstep/bookings/{booking_id}/extras"}
    doorstep.booking.completed: {from_event: doorstep.booking.completed, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}/rate"}
    doorstep.booking.cancelled: {from_event: doorstep.booking.cancelled, data: [booking_id, refund_paise], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.expired: {from_event: doorstep.booking.expired, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.refund_issued: {from_event: doorstep.booking.refunded, data: [booking_id, amount_paise], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.reminder: {from_event: doorstep.booking.reminder, data: [booking_id, slot_start], deeplink: "momentum://doorstep/bookings/{booking_id}"}
    doorstep.booking.pro_no_show: {from_event: doorstep.booking.no_show, data: [booking_id], deeplink: "momentum://doorstep/bookings/{booking_id}", when: "data.party == 'pro'"}
    doorstep.outstanding.due: {from_event: doorstep.booking.outstanding_created, data: [booking_id, bill_id, amount_paise], deeplink: "momentum://doorstep/outstanding"}
    doorstep.message.new: {from_event: doorstep.booking.message_sent, data: [booking_id, message_id], deeplink: "momentum://doorstep/bookings/{booking_id}/chat", when: "data.sender_kind == 'pro'"}
    doorstep.rework.updated: {from_event: doorstep.booking.rework_requested, data: [booking_id, rework_id], deeplink: "momentum://doorstep/bookings/{booking_id}"}
  doorstep_pro:
    doorstep.pro.offer.new: {from_event: doorstep.pro.offer_created, data: [offer_id, booking_id, expires_at], deeplink: "doorstep-pro://offers/{offer_id}", priority: high}
    doorstep.pro.offer.expired: {from_event: doorstep.pro.offer_closed, data: [offer_id], deeplink: "doorstep-pro://offers", when: "data.outcome == 'expired'"}
    doorstep.pro.job.cancelled: {from_event: doorstep.booking.cancelled, data: [booking_id], deeplink: "doorstep-pro://jobs/{booking_id}", when: "pro_user_id != null"}
    doorstep.pro.job.rescheduled: {from_event: doorstep.booking.rescheduled, data: [booking_id, slot_start], deeplink: "doorstep-pro://jobs/{booking_id}", when: "pro_user_id != null"}
    doorstep.pro.job.reminder: {from_event: doorstep.booking.reminder, data: [booking_id, slot_start], deeplink: "doorstep-pro://jobs/{booking_id}", when: "pro_user_id != null"}
    doorstep.pro.extras.approved: {from_event: doorstep.booking.extras_decided, data: [booking_id, extra_id], deeplink: "doorstep-pro://jobs/{booking_id}", when: "data.decision == 'approved'"}
    doorstep.pro.extras.declined: {from_event: doorstep.booking.extras_decided, data: [booking_id, extra_id], deeplink: "doorstep-pro://jobs/{booking_id}", when: "data.decision == 'declined'"}
    doorstep.pro.extras.paid: {from_event: doorstep.booking.extras_paid, data: [booking_id, bill_id], deeplink: "doorstep-pro://jobs/{booking_id}"}
    doorstep.pro.message.new: {from_event: doorstep.booking.message_sent, data: [booking_id, message_id], deeplink: "doorstep-pro://jobs/{booking_id}/chat", when: "data.sender_kind == 'customer'"}
    doorstep.pro.application.approved: {from_event: doorstep.pro.status_changed, data: [pro_id], deeplink: "doorstep-pro://home", when: "data.to_status == 'approved' && data.from_status == 'pending_verification'"}
    doorstep.pro.application.rejected: {from_event: doorstep.pro.status_changed, data: [pro_id], deeplink: "doorstep-pro://onboarding", when: "data.to_status == 'rejected'"}
    doorstep.pro.account.suspended: {from_event: doorstep.pro.status_changed, data: [pro_id], deeplink: "doorstep-pro://account", when: "data.to_status == 'suspended'"}
    doorstep.pro.account.reinstated: {from_event: doorstep.pro.status_changed, data: [pro_id], deeplink: "doorstep-pro://home", when: "data.to_status == 'approved' && data.from_status == 'suspended'"}
    doorstep.pro.price.reviewed: {from_event: doorstep.pro.price_reviewed, data: [price_id, service_id, decision], deeplink: "doorstep-pro://prices", when: "B1: an admin approved or rejected a submitted price"}
    doorstep.pro.document.reviewed: {from_event: doorstep.pro.document_reviewed, data: [document_id, decision], deeplink: "doorstep-pro://onboarding"}
    doorstep.pro.background_check.expiring: {from_event: doorstep.pro.background_check_expiring, data: [valid_until], deeplink: "doorstep-pro://onboarding/police-certificate"}
    doorstep.pro.rating.received: {from_event: doorstep.booking.rated, data: [booking_id, stars], deeplink: "doorstep-pro://jobs/{booking_id}", when: "data.rater_kind == 'customer'"}
    doorstep.pro.settlement.computed: {from_event: doorstep.pro.settlement_computed, data: [settlement_id, net_paise], deeplink: "doorstep-pro://earnings"}

components:
  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, version, occurred_at, data]
      properties:
        event_id: {type: string, format: uuid}
        event_type: {type: string}
        version: {type: integer, const: 1}
        occurred_at: {type: string, format: date-time}
        booking_id: {type: string, format: uuid, nullable: true}
        customer_user_id: {type: string, format: uuid, nullable: true}
        pro_user_id: {type: string, format: uuid, nullable: true, description: "The ACCEPTED professional only (A4 onward); a professional reserved by the hold but never offered the job is not named"}
        data: {type: object}
    BookingCore:
      type: object
      required: [booking_id, customer_user_id, status, city_code, category_slug, service_id, slot_start, slot_end]
      properties:
        booking_id: {type: string, format: uuid}
        customer_user_id: {type: string, format: uuid}
        pro_user_id: {type: string, format: uuid, nullable: true}
        status: {type: string}
        city_code: {type: string}
        category_slug: {type: string}
        service_id: {type: string, format: uuid}
        slot_start: {type: string, format: date-time}
        slot_end: {type: string, format: date-time}
        parent_booking_id: {type: string, format: uuid, nullable: true}

  messages:
    RealtimeFrame:
      name: doorstep.realtime
      payload:
        type: object
        required: [event_type, data, at]
        properties:
          event_type: {type: string}
          data: {type: object}
          at: {type: string, format: date-time}

    BookingCreated:
      name: doorstep.booking.created
      summary: Booking created in pending_payment with a professional held
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [total_paise, hold_expires_at]
            properties:
              total_paise: {type: integer, format: int64}
              hold_expires_at: {type: string, format: date-time}
    BookingConfirmed:
      name: doorstep.booking.confirmed
      summary: Signed payment.succeeded applied
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [paid_paise, payment_id]
            properties:
              paid_paise: {type: integer, format: int64}
              payment_id: {type: string, format: uuid}
    BookingExpired:
      name: doorstep.booking.expired
      payload:
        $ref: '#/components/schemas/BookingCore'
    BookingAssigned:
      name: doorstep.booking.assigned
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [pro_user_id, pro_first_name, assignment_id]
            properties:
              pro_first_name: {type: string}
              assignment_id: {type: string, format: uuid}
    BookingReassigned:
      name: doorstep.booking.reassigned
      summary: >-
        B1: emitted only for cause rescheduled (decline, give-back, no-show,
        not on duty and ops redispatch now emit doorstep.booking.pro_unavailable).
        Back to confirmed; dispatch re-runs excluding previous_pro_user_id. The
        envelope pro_user_id is null (nobody has accepted); previous_pro_user_id
        names the professional who lost the job so they can be told (A4: also a
        doorstep.pro.job.removed realtime frame). cause rescheduled: the customer
        moved the slot to one only another professional can take.
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [previous_pro_user_id, cause]
            properties:
              previous_pro_user_id: {type: string, format: uuid}
              cause: {type: string, enum: [pro_cancel, pro_no_show, not_on_duty, unsafe_exit, ops_redispatch, pro_suspended, rescheduled]}
    BookingUnassignedAlert:
      name: doorstep.booking.unassigned_alert
      summary: >-
        Ops only. reason t_minus_2h: two hours before the slot with no accepted
        professional (once per booking; T-45 min then cancels with a full refund).
        reason no_professional_left: dispatch found nobody free who has not
        already let the booking go (once until an offer goes out again).
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [minutes_to_slot, reason]
            properties:
              minutes_to_slot: {type: integer}
              reason: {type: string, enum: [t_minus_2h, no_professional_left]}
    BookingProLate:
      name: doorstep.booking.pro_late
      summary: >-
        A4. Slot + 15 min and the professional has not arrived (assigned or
        en_route); the customer may now cancel free of charge (cancel-preview rule
        pro_late_free). Once per booking. No push type is registered yet
        (notification-service counts it unknown until one is).
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [minutes_late, free_cancel]
            properties:
              minutes_late: {type: integer}
              free_cancel: {type: boolean}
    BookingEnRoute:
      name: doorstep.booking.en_route
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            properties:
              eta_minutes: {type: integer, nullable: true}
    BookingArrived:
      name: doorstep.booking.arrived
      payload:
        $ref: '#/components/schemas/BookingCore'
    BookingStarted:
      name: doorstep.booking.started
      payload:
        $ref: '#/components/schemas/BookingCore'
    BookingExtrasProposed:
      name: doorstep.booking.extras_proposed
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [extra_id, name, total_paise]
            properties:
              extra_id: {type: string, format: uuid}
              name: {type: string}
              total_paise: {type: integer, format: int64}
    BookingExtrasDecided:
      name: doorstep.booking.extras_decided
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [extra_id, decision]
            properties:
              extra_id: {type: string, format: uuid}
              decision: {type: string, enum: [approved, declined]}
    BookingExtrasPaymentDue:
      name: doorstep.booking.extras_payment_due
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [bill_id, amount_paise, due_at]
            properties:
              bill_id: {type: string, format: uuid}
              amount_paise: {type: integer, format: int64}
              due_at: {type: string, format: date-time}
    BookingExtrasPaid:
      name: doorstep.booking.extras_paid
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [bill_id, amount_paise]
            properties:
              bill_id: {type: string, format: uuid}
              amount_paise: {type: integer, format: int64}
    BookingOutstandingCreated:
      name: doorstep.booking.outstanding_created
      summary: Extras below the charge-now threshold unpaid 15 min after finish; customer blocked from new bookings
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [bill_id, amount_paise]
            properties:
              bill_id: {type: string, format: uuid}
              amount_paise: {type: integer, format: int64}
    BookingCompleted:
      name: doorstep.booking.completed
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [total_paise, extras_total_paise]
            properties:
              total_paise: {type: integer, format: int64}
              extras_total_paise: {type: integer, format: int64}
    BookingCancelled:
      name: doorstep.booking.cancelled
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [cancelled_by, reason, fee_paise, refund_paise]
            properties:
              cancelled_by: {type: string, enum: [customer, pro, admin, system]}
              reason: {type: string}
              fee_paise: {type: integer, format: int64}
              refund_paise: {type: integer, format: int64}
    BookingRescheduled:
      name: doorstep.booking.rescheduled
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [previous_slot_start]
            properties:
              previous_slot_start: {type: string, format: date-time}
    BookingNoShow:
      name: doorstep.booking.no_show
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [party]
            properties:
              party: {type: string, enum: [customer, pro]}
              fee_paise: {type: integer, format: int64}
    BookingRefunded:
      name: doorstep.booking.refunded
      summary: Refund succeeded at payments-service
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [refund_id, amount_paise, cause]
            properties:
              refund_id: {type: string, format: uuid}
              amount_paise: {type: integer, format: int64}
              cause: {type: string}
    BookingRefundFailed:
      name: doorstep.booking.refund_failed
      summary: payments-service could not make a refund (payment.refund_failed); the booking needs ops attention. Ops live board only, never a customer push.
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [refund_id, amount_paise, cause, reason]
            properties:
              refund_id: {type: string, format: uuid}
              amount_paise: {type: integer, format: int64}
              cause: {type: string}
              reason: {type: string, nullable: true}
    BookingPaymentAttention:
      name: doorstep.booking.payment_attention
      summary: A payment event did not match the booking (amount, currency, payer or intent) or a refund failed; the booking was NOT confirmed from it. Ops live board only.
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
