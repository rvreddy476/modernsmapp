    # ---------- B1 (4 Oct 2026) ----------
    ProPriceSubmitted:
      name: doorstep.pro.price_submitted
      summary: >-
        A professional submitted a price; it is pending until an admin approves
        it (nothing approves itself). For the ops review queue. Partition key
        pro_user_id. previous_price_paise is the professional's live approved
        price for the item, if any.
      payload:
        type: object
        required: [price_id, pro_id, pro_user_id, service_id, item_kind, item_id, unit, price_paise, previous_price_paise]
        properties:
          price_id: {type: string, format: uuid}
          pro_id: {type: string, format: uuid}
          pro_user_id: {type: string, format: uuid}
          service_id: {type: string, format: uuid}
          item_kind: {type: string, enum: [option, addon]}
          item_id: {type: string, format: uuid}
          unit: {type: string, enum: [per_job, per_hour, per_month]}
          price_paise: {type: integer, format: int64, description: GST-inclusive, per unit}
          previous_price_paise: {type: integer, format: int64, nullable: true}
    ProPriceReviewed:
      name: doorstep.pro.price_reviewed
      summary: >-
        An admin approved (live from now; the previous approved price for the
        item closed) or rejected a price, audited in the same transaction.
        Partition key pro_user_id.
      payload:
        type: object
        required: [price_id, pro_id, pro_user_id, service_id, item_kind, item_id, price_paise, decision, reason]
        properties:
          price_id: {type: string, format: uuid}
          pro_id: {type: string, format: uuid}
          pro_user_id: {type: string, format: uuid}
          service_id: {type: string, format: uuid}
          item_kind: {type: string, enum: [option, addon]}
          item_id: {type: string, format: uuid}
          price_paise: {type: integer, format: int64}
          decision: {type: string, enum: [approved, rejected]}
          reason: {type: string, nullable: true}
    BookingProUnavailable:
      name: doorstep.booking.pro_unavailable
      summary: >-
        The professional the customer picked is gone: declined, let the offer
        expire (3 min for ASAP), gave the job back, was not on duty, did not
        turn up, ops took the job off them, or their calendar no longer admits
        it. Nothing is reassigned silently: the customer picks another
        professional and a time (GET /bookings/{id}/professionals, POST
        /bookings/{id}/change-professional) or cancels for a full refund, by
        choice_deadline (30 min; then a full refund and doorstep.booking.cancelled).
        The envelope pro_user_id is null; previous_pro_user_id names the
        professional who let it go (null when none was offered).
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [previous_pro_user_id, cause, choice_deadline]
            properties:
              previous_pro_user_id: {type: string, format: uuid, nullable: true}
              cause: {type: string, enum: [declined, offer_expired, pro_cancel, not_on_duty, pro_no_show, ops_redispatch, no_professional]}
              choice_deadline: {type: string, format: date-time}
    BookingProChanged:
      name: doorstep.booking.pro_changed
      summary: >-
        The customer picked another professional for a pro_unavailable booking:
        confirmed again with the new professional, slot, lines and total, and
        offered to them next (doorstep.pro.offer_created follows). Emitted at
        once for a cheaper or equal change (the difference refunded;
        doorstep.booking.refunded when it settles), or when the signed payment for a
        dearer one succeeds (reference doorstep_extras, a pro_change bill). The
        envelope pro_user_id stays null until the new professional accepts.
      payload:
        allOf:
          - $ref: '#/components/schemas/BookingCore'
          - type: object
            required: [change_id, previous_pro_user_id, new_pro_user_id, difference_paise, asap]
            properties:
              change_id: {type: string, format: uuid}
              previous_pro_user_id: {type: string, format: uuid, nullable: true}
              new_pro_user_id: {type: string, format: uuid}
              difference_paise: {type: integer, format: int64, description: new total - previous total (negative - refunded)}
              asap: {type: boolean}
