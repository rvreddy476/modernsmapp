openapi: 3.0.3
info:
  title: Mopedu Mobility Platform API
  version: 1.0.0
  description: Authoritative REST API for Mopedu Rider & Captain Mobility Services. All monetary amounts are in integer paise (INR).
servers:
  - url: https://api.atpost.app
    description: Production API Gateway
  - url: http://localhost:8080
    description: Local API Gateway

paths:
  /v1/rider/cities:
    get:
      summary: List serviceable cities
      operationId: listCities
      tags: [Public]
      responses:
        '200':
          description: List of serviceable cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'

  /v1/rider/serviceability:
    get:
      summary: Check coordinates serviceability
      operationId: checkServiceability
      tags: [Public]
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Serviceability response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceabilityResponse'

  /v1/rider/estimate:
    post:
      summary: Request authoritative fare quote
      operationId: estimateFare
      tags: [Rider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: >-
            Quote snapshot with vehicle options. Every amount is integer paise;
            each option carries the itemised breakdown that is locked for the
            ride (fare window / surge, coupon discount, previous cancellation
            fees, tax lines). Golden bytes: rider-service
            internal/http/testdata/contracts/estimate_peak_window_coupon.json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSnapshotResponse'
        '422':
          description: The coupon_code was refused (see CouponError codes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponError'

  /v1/rider/coupons/validate:
    get:
      summary: Validate a coupon code before quoting
      operationId: validateCoupon
      tags: [Public]
      description: >-
        Public; with a gateway identity the first-ride-only and per-user
        limits are checked too. The fare-dependent minimum-fare rule is only
        applied by the estimate. Golden bytes for the 422:
        rider-service internal/http/testdata/contracts/coupon_validate_error.json.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: city_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The coupon is valid for this caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidation'
        '422':
          description: The coupon was refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponError'

  /v1/rider/rides:
    post:
      summary: Create or book a ride
      operationId: createRide
      tags: [Rider]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      responses:
        '201':
          description: >-
            Ride booked successfully. The quote's coupon redemption is
            reserved and its outstanding fees are bound to the ride in the
            same transaction; the locked breakdown is copied to
            Ride.fare_breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          description: >-
            payment_method not in cash, upi, card (wallet is not a ride
            method), or the quote is missing / expired / for another user
        '422':
          description: The quote's coupon can no longer be reserved (limits raced)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponError'

  /v1/rider/rides/active:
    get:
      summary: Get caller's active ride snapshot
      operationId: getActiveRide
      tags: [Rider]
      responses:
        '200':
          description: Active ride details or active=false
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  ride:
                    $ref: '#/components/schemas/Ride'

  /v1/rider/rides/me:
    get:
      summary: List recent rides
      operationId: listMyRides
      tags: [Rider]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'

  /v1/rider/rides/{id}:
    get:
      summary: Get ride by ID
      operationId: getRide
      tags: [Rider]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /v1/rider/rides/{id}/receipt:
    get:
      summary: Get immutable trip receipt
      operationId: getRideReceipt
      tags: [Rider]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Trip receipt in integer paise. distance_meters / duration_seconds
            are what was priced (the quoted route, or the server-tracked
            route when completion re-priced it); the captain's report is
            telemetry (reported_*). Golden bytes: rider-service
            internal/http/testdata/contracts/receipt_waiting_charge.json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideReceipt'

  /v1/rider/rides/{id}/cancel:
    post:
      summary: Cancel a ride
      operationId: cancelRide
      tags: [Rider]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                idempotency_key:
                  type: string
      responses:
        '200':
          description: Cancellation confirmed

  /v1/rider/rides/{id}/rate:
    post:
      summary: Rate a completed trip
      operationId: rateRide
      tags: [Rider]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                feedback:
                  type: string
      responses:
        '200':
          description: Rating recorded

  /v1/rider/offers/incoming:
    get:
      summary: Get incoming ride offers for online captain
      operationId: getIncomingOffers
      tags: [Captain]
      responses:
        '200':
          description: List of pending offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RideOffer'

  /v1/rider/offers/{id}/accept:
    post:
      summary: Accept a dispatched offer
      operationId: acceptOffer
      tags: [Captain]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Offer accepted; ride assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptOfferResponse'

  /v1/rider/offers/{id}/reject:
    post:
      summary: Reject an offer
      operationId: rejectOffer
      tags: [Captain]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Offer rejected

  /v1/rider/rides/{id}/arriving:
    post:
      summary: Mark captain is arriving at pickup
      operationId: markArriving
      tags: [Captain]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status updated to partner_arriving

  /v1/rider/rides/{id}/arrived:
    post:
      summary: Mark captain has arrived at pickup
      operationId: markArrived
      tags: [Captain]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status updated to arrived

  /v1/rider/rides/{id}/start:
    post:
      summary: Verify OTP and start trip
      operationId: startRide
      tags: [Captain]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  example: "4829"
      responses:
        '200':
          description: OTP verified; trip started

  /v1/rider/rides/{id}/complete:
    post:
      summary: Complete trip and submit final telemetry
      operationId: completeRide
      tags: [Captain]
      description: >-
        The fare is upfront: the quote's locked total plus the waiting charge
        (minutes beyond the free window between arrival and start) and any
        previous cancellation fee, minus the coupon. Distance and time are
        re-priced ONLY when the server-tracked route exceeds the quoted
        distance by more than 20% and more than 1 km, at the locked surge,
        with the ride fare capped at twice the quoted one.
        final_distance_km / final_duration_min are stored as telemetry and
        never price the ride.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_distance_km, final_duration_min, idempotency_key]
              properties:
                final_distance_km:
                  type: number
                final_duration_min:
                  type: integer
                idempotency_key:
                  type: string
      responses:
        '200':
          description: Trip completed; payment generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidePayment'

  /v1/rider/rides/{id}/payment/cash-confirm:
    post:
      summary: Captain confirms receipt of cash fare
      operationId: confirmCashPayment
      tags: [Captain]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash receipt confirmed

  /v1/rider/partners/me/online:
    post:
      summary: Transition captain to online status
      operationId: goOnline
      tags: [Captain]
      responses:
        '200':
          description: Captain is online

  /v1/rider/partners/me/offline:
    post:
      summary: Transition captain to offline status
      operationId: goOffline
      tags: [Captain]
      responses:
        '200':
          description: Captain is offline

  /v1/rider/partners/me/location:
    post:
      summary: Ingest captain GPS location telemetry
      operationId: updateLocation
      tags: [Captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                lng:
                  type: number
                speed_mps:
                  type: number
                heading:
                  type: number
                accuracy_meters:
                  type: number
                sequence:
                  type: integer
      responses:
        '200':
          description: Telemetry ingested

  /v1/rider/rides/{id}/sos:
    post:
      summary: Trigger emergency SOS alert
      operationId: triggerSOS
      tags: [Safety]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
                reason:
                  type: string
      responses:
        '201':
          description: SOS incident logged and dispatched

  /v1/rider/rides/{id}/share:
    post:
      summary: Create live trip sharing link
      operationId: createShareToken
      tags: [Safety]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Share link created
    delete:
      summary: Revoke active share links for ride
      operationId: revokeShareToken
      tags: [Safety]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Share links revoked

  /v1/rider/share/{token}:
    get:
      summary: Public redacted live trip view
      operationId: getSharedRide
      tags: [Public]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Redacted live ride view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRideView'

  # Admin console (admin-service tokens only; the legacy /v1/rider/admin/*
  # family serves the same handlers). Every call is audited. Permissions:
  # coupons -> rider:fares.manage, outstanding list -> rider:payments.read,
  # waive -> rider:payments.settle.
  /v1/rider/internal/admin/coupons:
    get:
      summary: List coupons
      operationId: adminListCoupons
      tags: [Admin]
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{"items": [Coupon]}'
    post:
      summary: Create a coupon
      operationId: adminCreateCoupon
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreate'
      responses:
        '201':
          description: Coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
  /v1/rider/internal/admin/coupons/redemptions:
    get:
      summary: List coupon redemptions
      operationId: adminListCouponRedemptions
      tags: [Admin]
      parameters:
        - { name: coupon_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '{"items": [{id, coupon_id, customer_user_id, ride_id, quote_id, discount_paise, status: reserved|applied|released}]}'
  /v1/rider/internal/admin/coupons/{id}:
    patch:
      summary: Update a coupon (partial)
      operationId: adminUpdateCoupon
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Coupon
  /v1/rider/internal/admin/coupons/{id}/deactivate:
    post:
      summary: Deactivate a coupon
      operationId: adminDeactivateCoupon
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Coupon
  /v1/rider/internal/admin/outstanding:
    get:
      summary: List customers' outstanding cancellation fees
      operationId: adminListOutstanding
      tags: [Admin]
      parameters:
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, settled, waived] } }
      responses:
        '200':
          description: '{"items": [CustomerOutstanding]}'
  /v1/rider/internal/admin/outstanding/{id}/waive:
    post:
      summary: Waive a pending cancellation fee
      operationId: adminWaiveOutstanding
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: CustomerOutstanding with status waived

  # --- Online ride payments (payments lane) -----------------------------------
  # A completed ride booked with upi / card is paid through payments-service
  # (application mopedu, reference type mopedu_ride). The intent binds a
  # payments intent and the app opens checkout with client_session; the
  # payment is marked paid ONLY when rider-service applies the signed
  # payment.succeeded event, so the app polls GET /payment until `paid`
  # (or `failed`, then retries or switches to cash). The callback route is
  # advisory and never changes the status.
  /v1/rider/rides/{id}/payment/intent:
    post:
      summary: Open (or re-open) the payment intent for a completed ride
      operationId: createRidePaymentIntent
      tags: [Rider]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: >-
            The intent for the ride's final total (fare_breakdown.total_paise).
            Idempotent per ride and method. Golden bytes: rider-service
            internal/http/testdata/contracts/payment_intent.json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          description: PAYMENT_METHOD_INVALID (method must be upi or card)
        '409':
          description: RIDE_NOT_COMPLETED | PAYMENT_NOT_ONLINE (cash ride) | PAYMENT_NOT_PENDING (already paid / refunded)
        '503':
          description: PAYMENTS_UNAVAILABLE | PAYMENTS_CHECKOUT_UNAVAILABLE
  /v1/rider/rides/{id}/payment:
    get:
      summary: Payment status of a ride (customer or assigned captain)
      operationId: getRidePayment
      tags: [Rider, Captain]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: >-
            Never asks payments-service; `paid` comes only from an applied
            signed event. Golden bytes: payment_status_paid.json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidePaymentStatus'
  /v1/rider/rides/{id}/payment/switch-to-cash:
    post:
      summary: Turn an unpaid online payment into a cash payment
      operationId: switchRidePaymentToCash
      tags: [Rider]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: RidePaymentStatus with method cash and status cash_pending; the captain then confirms with /payment/cash-confirm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RidePaymentStatus'
        '409':
          description: PAYMENT_ALREADY_PAID (never after paid) | PAYMENT_NOT_ONLINE | PAYMENT_NOT_PENDING
  /v1/rider/rides/{id}/payment/callback:
    post:
      summary: Relay the checkout callback for an ADVISORY signature check
      operationId: verifyRidePaymentCallback
      tags: [Rider]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_order_id, provider_payment_id, signature]
              properties:
                provider_order_id: { type: string }
                provider_payment_id: { type: string }
                signature: { type: string }
      responses:
        '200':
          description: '{verified, advisory: true, status} — status is the row''s, unchanged by this call'
        '409':
          description: PAYMENT_NO_INTENT
        '422':
          description: PAYMENT_CALLBACK_MISMATCH (a genuine signature for another ride or payer)
  /v1/rider/me/outstanding:
    get:
      summary: The customer's pending outstanding fees (payable directly)
      operationId: listMyOutstanding
      tags: [Rider]
      responses:
        '200':
          description: >-
            A plain array under data: [{id, ride_id, amount_paise, reason, status, created_at, ...}] —
            the pending rows no active ride has reserved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOutstanding'
  /v1/rider/me/outstanding/{id}/payment/intent:
    post:
      summary: Open the payment intent for one outstanding fee
      operationId: createOutstandingPaymentIntent
      tags: [Rider]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: PaymentIntent; the row becomes settled on the signed payment.succeeded event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '409':
          description: OUTSTANDING_NOT_PAYABLE

  # --- Admin: refunds, ride payments, fare windows, surge -----------------------
  /v1/rider/internal/admin/rides/{id}/refund:
    post:
      summary: Refund an online ride payment (rider:payments.settle)
      operationId: adminRefundRidePayment
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount_paise:
                  type: integer
                  format: int64
                  description: Omitted or 0 refunds the full remaining amount.
                reason:
                  type: string
      responses:
        '202':
          description: RideRefund with status accepted; it becomes refunded only from the payment.refunded event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideRefund'
        '409':
          description: REFUND_NOT_REFUNDABLE
        '422':
          description: REFUND_CASH_PAYMENT (cash disputes are an outstanding waiver or manual) | REFUND_EXCEEDS_REMAINING
  /v1/rider/internal/admin/refunds:
    get:
      summary: List refunds (rider:payments.read)
      operationId: adminListRefunds
      tags: [Admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, accepted, refunded, failed] } }
        - { name: ride_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{"items": [RideRefund]} — golden bytes: refund_list_row.json'
  /v1/rider/internal/admin/ride-payments:
    get:
      summary: List ride payments (rider:payments.read), keyset-paged
      operationId: adminListRidePayments
      tags: [Admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_cash_confirmation, pending, confirming, succeeded, failed, refunded, partially_refunded] } }
        - { name: method, in: query, schema: { type: string, enum: [cash, upi, card] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: '{"items": [RidePayment], "next_cursor": string (empty on the last page)}'
  /v1/rider/internal/admin/fare-windows:
    get:
      summary: List fare windows (rider:fares.manage)
      operationId: adminListFareWindows
      tags: [Admin]
      parameters:
        - { name: city_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '{"items": [FareWindow]}'
    post:
      summary: Create a fare window
      operationId: adminCreateFareWindow
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FareWindowCreate'
      responses:
        '201':
          description: FareWindow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareWindow'
  /v1/rider/internal/admin/fare-windows/{id}:
    patch:
      summary: Update a fare window (partial; vehicle_type "" clears it, clear_effective_to removes the end)
      operationId: adminUpdateFareWindow
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: FareWindow
  /v1/rider/internal/admin/fare-windows/{id}/deactivate:
    post:
      summary: Deactivate a fare window
      operationId: adminDeactivateFareWindow
      tags: [Admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: FareWindow with is_active false
  /v1/rider/internal/admin/surge:
    get:
      summary: Current demand state per vehicle type (rider:fares.manage)
      operationId: adminSurgeState
      tags: [Admin]
      parameters:
        - { name: city_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '{"city_id", "items": [{vehicle_type, requested, online, demand_bps, cap_bps}]}'

  # --- Captain onboarding and subscriptions (launch safety, 2026-09-18) -----
  # Nothing a captain does waits for a human, except a manually uploaded
  # document (the one fallback). Documents DigiLocker returns are verified
  # automatically; the selfie is compared server-side with the licence photo;
  # the partner is approved the moment Aadhaar, DL, selfie and one vehicle RC
  # are verified. The subscription is paid in the app through payments-service
  # and activated only by the signed payment.succeeded event.
  /v1/rider/partners/me/aadhaar/start:
    post:
      summary: Start the DigiLocker Aadhaar flow (PKCE state)
      operationId: startAadhaar
      tags: [Captain]
      responses:
        '200':
          description: The DigiLocker authorize URL and the one-shot state
          content:
            application/json:
              schema:
                type: object
                required: [digilocker_authorize_url, state]
                properties:
                  digilocker_authorize_url: { type: string }
                  state: { type: string }
  /v1/rider/partners/me/aadhaar/callback:
    post:
      summary: Complete the DigiLocker flow; records the Aadhaar and driving-licence documents as verified
      operationId: completeAadhaar
      tags: [Captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: >-
            The assertion is stored (no Aadhaar number ever). rider-service then pulls the Aadhaar and
            DL from DigiLocker (source digilocker, verified_by_actor auto, an audit row actor system /
            reason digilocker) and re-runs the approval evaluator. DIGILOCKER_MODE=mock (dev) returns
            verified data for every code, so the whole path is automatic on the dev stack.
          content:
            application/json:
              schema:
                type: object
                required: [verified, issued_at]
                properties:
                  verified: { type: boolean }
                  issued_at: { type: string, format: date-time }
        '403':
          description: state expired, invalid or not this partner's
  /v1/rider/partners/me/documents:
    post:
      summary: Upload a KYC document (the human fallback; the selfie is checked server-side)
      operationId: submitPartnerDocument
      tags: [Captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerDocumentSubmit'
      responses:
        '201':
          description: >-
            The document (source upload). profile_photo (the selfie) is compared with the DigiLocker
            licence photo through media-service: at or above MOPEDU_SELFIE_MIN_SIMILARITY (default 80)
            it is verified automatically (verified_by_actor auto, auto_check_detail); below it, or with
            media-service unavailable, it stays pending review — never auto-verified. Every other
            uploaded document stays pending for an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerDocument'
        '400':
          description: INVALID_REQUEST | SELFIE_MEDIA_REQUIRED (profile_photo without media_id)
    get:
      summary: The partner's documents
      operationId: listPartnerDocuments
      tags: [Captain]
      responses:
        '200':
          description: Every document, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerDocument'
  /v1/rider/partners/me/onboarding:
    get:
      summary: Approval state with the documents still waiting for a human
      operationId: getPartnerOnboarding
      tags: [Captain]
      responses:
        '200':
          description: approved | under_review (pending named) | incomplete (missing named) | blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
  /v1/rider/subscriptions/checkout:
    post:
      summary: Pay a subscription plan in the app (or take the free trial instantly)
      operationId: checkoutSubscription
      tags: [Captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCheckoutRequest'
      responses:
        '200':
          description: >-
            For a paid plan: a rider_partner_subscriptions row in status pending_payment (or the open
            one reused) and a payments-service intent (application mopedu, reference type
            mopedu_subscription, reference id = subscription_id, amount = the plan price in paise,
            idempotency subscription:<id>:<method>). The row activates ONLY from the signed
            payment.succeeded event; a wrong amount / currency / payer capture is a mismatch
            (reconciliation, nothing activated). A checkout while a period runs is a renewal: it
            starts where the current period ends, never today. For the trial plan (price 0): status
            trial, activated instantly, once per partner ever.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCheckout'
        '400':
          description: PAYMENT_METHOD_INVALID (method must be upi or card for a paid plan)
        '403':
          description: PARTNER_NOT_ELIGIBLE (suspended / blocked / rejected)
        '404':
          description: PLAN_NOT_FOUND
        '409':
          description: TRIAL_ALREADY_USED | PAYMENT_NOT_PENDING (the checkout changed; refresh)
        '503':
          description: PAYMENTS_UNAVAILABLE | PAYMENTS_CHECKOUT_UNAVAILABLE
  /v1/rider/subscriptions/me/payment:
    get:
      summary: Status of the latest subscription checkout
      operationId: getMySubscriptionPayment
      tags: [Captain]
      responses:
        '200':
          description: Never asks payments-service; paid comes only from the applied signed event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPaymentStatus'
        '404':
          description: no checkout yet
  /v1/rider/subscriptions/payment-proof:
    post:
      summary: Retired — payment proofs are no longer accepted
      operationId: submitSubscriptionPaymentProof
      deprecated: true
      tags: [Captain]
      responses:
        '410':
          description: SUBSCRIPTION_PROOF_GONE — pay in the app through POST /v1/rider/subscriptions/checkout
  /v1/rider/subscriptions/subscribe:
    post:
      summary: Legacy wallet subscription (wallet only)
      operationId: subscribeWallet
      tags: [Captain]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, payment_method, idempotency_key]
              properties:
                plan_id: { type: string, format: uuid }
                payment_method: { type: string, enum: [wallet], description: '"manual" is gone; upi and card go through /subscriptions/checkout (400 otherwise).' }
                idempotency_key: { type: string }
      responses:
        '200':
          description: The wallet debit and activation; a trial plan activates once per partner (409 TRIAL_ALREADY_USED after).
        '400':
          description: INVALID_REQUEST (upi / card / manual)

components:
  schemas:
    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
        country:
          type: string
        currency_code:
          type: string
        is_active:
          type: boolean

    ServiceabilityResponse:
      type: object
      properties:
        serviceable:
          type: boolean
        city_id:
          type: string
          format: uuid
        city_name:
          type: string
        supported_vehicle_types:
          type: array
          items:
            type: string

    EstimateRequest:
      type: object
      required: [pickup_lat, pickup_lng, drop_lat, drop_lng, city_id]
      properties:
        pickup_lat:
          type: number
        pickup_lng:
          type: number
        pickup_label:
          type: string
        drop_lat:
          type: number
        drop_lng:
          type: number
        drop_label:
          type: string
        vehicle_type:
          type: string
        city_id:
          type: string
          format: uuid
        coupon_code:
          type: string
          description: Case-insensitive. Refused with 422 CouponError.

    TaxLine:
      type: object
      properties:
        ref:
          type: string
          enum: [ride_fare, platform_fee, waiting_charge, previous_cancellation_fee, cancellation_fee]
        category:
          type: string
          description: PASSENGER_TRANSPORT_VIA_ECO (5%, s.9(5), SAC 996412) or PLATFORM_FEE (18%)
        sac:
          type: string
        rate_bps:
          type: integer
          format: int64
        taxable_paise:
          type: integer
          format: int64
        tax_paise:
          type: integer
          format: int64
        gross_paise:
          type: integer
          format: int64

    QuoteBreakdownPaise:
      type: object
      description: >-
        The itemised fare, stored verbatim on the quote and on the ride.
        ride_fare = base + distance + time + surge (+ minimum top-up);
        taxable_ride_fare = ride_fare - discount; total = taxable_ride_fare
        + platform_fee + waiting_charge + outstanding + tax. Tax lines sum to
        tax_paise. tax_note is always "adviser confirmation pending".
      properties:
        base_paise:
          type: integer
          format: int64
        distance_paise:
          type: integer
          format: int64
        time_paise:
          type: integer
          format: int64
        surge_paise:
          type: integer
          format: int64
        minimum_top_up_paise:
          type: integer
          format: int64
        ride_fare_paise:
          type: integer
          format: int64
        discount_paise:
          type: integer
          format: int64
        coupon_code:
          type: string
        coupon_id:
          type: string
        taxable_ride_fare_paise:
          type: integer
          format: int64
        platform_fee_paise:
          type: integer
          format: int64
        waiting_minutes:
          type: integer
        waiting_charge_paise:
          type: integer
          format: int64
        outstanding_paise:
          type: integer
          format: int64
          description: Previous cancellation fees charged on this ride
        outstanding_ids:
          type: array
          items:
            type: string
        toll_paise:
          type: integer
          format: int64
        tax_paise:
          type: integer
          format: int64
        tax_lines:
          type: array
          items:
            $ref: '#/components/schemas/TaxLine'
        tax_note:
          type: string
        surge_basis_points:
          type: integer
          format: int64
          description: Extra over the base fare, 2500 = x1.25. Window and demand never stack.
        surge_reason:
          type: string
          enum: [none, peak_hours, high_demand]
        window_name:
          type: string
        distance_meters:
          type: integer
        duration_seconds:
          type: integer
        total_paise:
          type: integer
          format: int64
        recomputed_from_track:
          type: boolean
        cap_applied:
          type: boolean
        fare_policy_version:
          type: integer

    QuoteOption:
      type: object
      properties:
        vehicle_type:
          type: string
        available:
          type: boolean
        pickup_eta_seconds:
          type: integer
        distance_meters:
          type: integer
        duration_seconds:
          type: integer
        currency:
          type: string
        total_paise:
          type: integer
          format: int64
        surge_bps:
          type: integer
          format: int64
        surge_reason:
          type: string
          enum: [none, peak_hours, high_demand]
        window_name:
          type: string
        discount_paise:
          type: integer
          format: int64
        coupon_code:
          type: string
        breakdown:
          $ref: '#/components/schemas/QuoteBreakdownPaise'

    QuoteSnapshotResponse:
      type: object
      properties:
        quote_id:
          type: string
        estimated_distance_km:
          type: number
        estimated_duration_min:
          type: number
        fare_estimate_paise:
          type: integer
          format: int64
        surge_multiplier:
          type: number
          description: Legacy, 1 + surge_bps / 10000
        surge_bps:
          type: integer
          format: int64
        surge_reason:
          type: string
          enum: [none, peak_hours, high_demand]
        window_name:
          type: string
        discount_paise:
          type: integer
          format: int64
        coupon_code:
          type: string
        outstanding_paise:
          type: integer
          format: int64
        tax_note:
          type: string
        vehicle_type:
          type: string
        eta_to_pickup_seconds:
          type: integer
        base_fare_inr:
          type: number
          description: Legacy INR views, derived from the paise
        per_km_inr:
          type: number
        per_minute_inr:
          type: number
        minimum_fare_inr:
          type: number
        fare_estimate_inr:
          type: number
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuoteOption'
        expires_at:
          type: string
          format: date-time

    CouponError:
      type: object
      description: >-
        Standard error envelope with a coupon code: COUPON_INVALID,
        COUPON_EXPIRED, COUPON_MIN_FARE, COUPON_FIRST_RIDE_ONLY,
        COUPON_USER_LIMIT_REACHED, COUPON_EXHAUSTED, COUPON_WRONG_CITY,
        COUPON_WRONG_VEHICLE, COUPONS_DISABLED.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string

    CouponCreate:
      type: object
      required: [code, discount_type]
      properties:
        code:
          type: string
          description: 3-32 chars, letters / digits / _ / -, stored upper-case, unique case-insensitively
        description:
          type: string
        discount_type:
          type: string
          enum: [flat, percent]
        discount_value_paise:
          type: integer
          format: int64
        percent_bps:
          type: integer
        max_discount_paise:
          type: integer
          format: int64
        min_fare_paise:
          type: integer
          format: int64
        city_id:
          type: string
          format: uuid
        vehicle_types:
          type: array
          items:
            type: string
        first_ride_only:
          type: boolean
        per_user_limit:
          type: integer
        total_limit:
          type: integer
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_active:
          type: boolean

    Coupon:
      allOf:
        - $ref: '#/components/schemas/CouponCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            used_count:
              type: integer
            created_by:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    CustomerOutstanding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_user_id:
          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
          description: The cancelled ride that produced the fee
        amount_paise:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [pending, settled, waived]
        settled_by_ride_id:
          type: string
          format: uuid
          description: The ride that charged (or reserved) it
        waived_by:
          type: string
          format: uuid
        waive_reason:
          type: string
        created_at:
          type: string
          format: date-time
        settled_at:
          type: string
          format: date-time

    CouponValidation:
      type: object
      properties:
        valid:
          type: boolean
        code:
          type: string
        description:
          type: string
        discount_type:
          type: string
          enum: [flat, percent]
        discount_value_paise:
          type: integer
          format: int64
        percent_bps:
          type: integer
        max_discount_paise:
          type: integer
          format: int64
        min_fare_paise:
          type: integer
          format: int64
        vehicle_types:
          type: array
          items:
            type: string
        first_ride_only:
          type: boolean

    CreateRideRequest:
      type: object
      required: [pickup, drop, vehicle_type]
      properties:
        quote_id:
          type: string
          format: uuid
        pickup:
          $ref: '#/components/schemas/Location'
        drop:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
        city_id:
          type: string
          format: uuid
        payment_method:
          type: string
          enum: [cash, upi, card]
          default: cash
          description: wallet is not a ride payment method (partner subscriptions only)
        idempotency_key:
          type: string

    Location:
      type: object
      required: [address, lat, lng]
      properties:
        address:
          type: string
        lat:
          type: number
        lng:
          type: number

    Ride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_user_id:
          type: string
          format: uuid
        partner_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        revision:
          type: integer
        vehicle_type:
          type: string
        status:
          type: string
        pickup_address:
          type: string
        pickup_lat:
          type: number
        pickup_lng:
          type: number
        drop_address:
          type: string
        drop_lat:
          type: number
        drop_lng:
          type: number
        estimated_fare:
          type: number
        final_fare_paise:
          type: integer
          format: int64
        fare_breakdown:
          $ref: '#/components/schemas/QuoteBreakdownPaise'
        cancellation_fee_paise:
          type: integer
          format: int64
          description: Owed by the customer when they cancel (or no-show) after assignment past the rule's free window
        payment_method:
          type: string
          enum: [cash, upi, card]
        otp:
          type: string
          description: Plaintext OTP shown only to rider once the captain has arrived (sealed at rest)
        requested_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RideReceipt:
      type: object
      properties:
        ride_id:
          type: string
          format: uuid
        customer_user_id:
          type: string
          format: uuid
        partner_id:
          type: string
          format: uuid
        vehicle_type:
          type: string
        status:
          type: string
        pickup_address:
          type: string
        drop_address:
          type: string
        distance_meters:
          type: integer
          description: Priced distance (quote, or tracked route when re-priced)
        duration_seconds:
          type: integer
        total_paise:
          type: integer
          format: int64
        surge_bps:
          type: integer
          format: int64
        surge_reason:
          type: string
          enum: [none, peak_hours, high_demand]
        discount_paise:
          type: integer
          format: int64
        coupon_code:
          type: string
        waiting_charge_paise:
          type: integer
          format: int64
        outstanding_paise:
          type: integer
          format: int64
        cancellation_fee_paise:
          type: integer
          format: int64
        tax_paise:
          type: integer
          format: int64
        tax_note:
          type: string
        payment_method:
          type: string
        payment_status:
          type: string
          description: Legacy row status; prefer payment.status.
        payment:
          allOf: [{ $ref: '#/components/schemas/ReceiptPayment' }]
          nullable: true
          description: The latest payment row (null before completion). Golden bytes with a partial refund receipt_partial_refund.json.
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptRefund'
        fare_breakdown:
          $ref: '#/components/schemas/QuoteBreakdownPaise'
        reported_distance_km:
          type: number
          description: Captain telemetry, never prices the ride
        reported_duration_min:
          type: number
        tracked_distance_m:
          type: integer
          description: Server-tracked route length (haversine hops, teleports ignored)
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    RideOffer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
        score:
          type: number
        distance_km:
          type: number
        expires_at:
          type: string
          format: date-time

    AcceptOfferResponse:
      type: object
      properties:
        ride_id:
          type: string
          format: uuid
        partner_id:
          type: string
          format: uuid
        status:
          type: string
        otp_expires_at:
          type: string
          format: date-time

    RidePayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ride_id:
          type: string
          format: uuid
        amount_paise:
          type: integer
          format: int64
        payment_method:
          type: string
          enum: [cash, upi, card]
        status:
          type: string
          enum: [pending_cash_confirmation, pending, confirming, succeeded, failed, refunded, partially_refunded]
        intent_id: { type: string, format: uuid, nullable: true }
        provider_reference: { type: string, nullable: true }
        refunded_paise: { type: integer, format: int64 }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        settled_at: { type: string, format: date-time, nullable: true }

    SharedRideView:
      type: object
      properties:
        ride_id:
          type: string
        status:
          type: string
        vehicle_type:
          type: string
        drop_address:
          type: string
        driver_first_name:
          type: string
        vehicle_registration:
          type: string
        eta_minutes:
          type: integer

    # --- Payments lane ---------------------------------------------------------
    PaymentIntentRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [upi, card]
    ClientSession:
      type: object
      description: What the app opens Razorpay Checkout with. key_id is the PUBLISHABLE key; nothing else is ever relayed.
      required: [provider, order_id, key_id]
      properties:
        provider: { type: string }
        order_id: { type: string }
        key_id: { type: string }
        merchant_display_name: { type: string }
    PaymentIntent:
      type: object
      required: [intent_id, amount_paise, currency, client_session, status]
      properties:
        intent_id: { type: string, format: uuid }
        amount_paise: { type: integer, format: int64 }
        currency: { type: string, enum: [INR] }
        client_session:
          allOf: [{ $ref: '#/components/schemas/ClientSession' }]
          nullable: true
          description: null only on local/dev with the stub gateway.
        status:
          type: string
          description: The intent's status, pending until paid.
    RidePaymentStatus:
      type: object
      required: [method, status, amount_paise, refunded_paise, intent_id, updated_at]
      properties:
        method: { type: string, enum: [cash, upi, card] }
        status:
          type: string
          enum: [cash_pending, cash_confirmed, pending, confirming, paid, failed, refunded, partially_refunded]
          description: >-
            cash_pending = pending_cash_confirmation; cash_confirmed = the captain confirmed; paid = a signed
            payment.succeeded event was applied (nothing else produces it); failed = retry or switch to cash.
        amount_paise: { type: integer, format: int64 }
        refunded_paise: { type: integer, format: int64 }
        intent_id: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }
    ReceiptPayment:
      type: object
      required: [method, status, amount_paise, refunded_paise]
      properties:
        method: { type: string, enum: [cash, upi, card] }
        status: { type: string, enum: [cash_pending, cash_confirmed, pending, confirming, paid, failed, refunded, partially_refunded] }
        amount_paise: { type: integer, format: int64 }
        refunded_paise: { type: integer, format: int64 }
    ReceiptRefund:
      type: object
      required: [id, amount_paise, status, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        amount_paise: { type: integer, format: int64 }
        status: { type: string, enum: [requested, accepted, refunded, failed] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    RideRefund:
      type: object
      description: >-
        A refund of an online ride payment (or of a cancellation fee paid directly): an admin's
        (rule_code discretionary) or one filed by rule with requested_by = the fixed system actor —
        captain_cancel (the captain / admin / system cancelled a ride the customer paid online: full
        amount), duplicate_capture (a second capture on another intent for a paid ride: the second
        capture back, plus reconciliation), cancellation_fee (a fee paid online whose cancellation is
        inside the free window or partner-caused). refunded only from the payment.refunded event.
      required: [id, ride_id, intent_id, amount_paise, reason, status, requested_by, rule_code, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        ride_id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid, nullable: true, description: The ride payment; absent for a refund of an outstanding fee. }
        outstanding_id: { type: string, format: uuid, nullable: true, description: The directly paid outstanding fee refunded (rule cancellation_fee). }
        intent_id: { type: string, format: uuid }
        amount_paise: { type: integer, format: int64 }
        reason: { type: string }
        status: { type: string, enum: [requested, accepted, refunded, failed] }
        requested_by: { type: string, format: uuid, description: The signed admin actor, or the fixed system actor for a rule refund. }
        rule_code: { type: string, enum: [discretionary, captain_cancel, duplicate_capture, cancellation_fee] }
        provider_reference: { type: string }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PartnerDocumentSubmit:
      type: object
      required: [document_type, file_url]
      properties:
        document_type: { type: string, enum: [aadhaar, pan, driving_license, profile_photo, police_verification, vehicle_rc, vehicle_insurance, pollution_certificate, permit, fitness_certificate, bank_proof, other] }
        document_number: { type: string, description: Never stored for aadhaar. }
        file_url: { type: string, description: 'The stored file; the captain app sends media://<media_id>.' }
        expires_at: { type: string, format: date-time }
        media_id: { type: string, format: uuid, description: The media-service id of the upload. Required for profile_photo (the selfie the face check compares with the licence photo). }
    PartnerDocument:
      type: object
      required: [id, partner_id, document_type, file_url, status, source, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        partner_id: { type: string, format: uuid }
        document_type: { type: string }
        document_number: { type: string }
        file_url: { type: string }
        status: { type: string, enum: [draft, pending, approved, rejected, expired] }
        rejection_reason: { type: string }
        expires_at: { type: string, format: date-time }
        source: { type: string, enum: [digilocker, upload], description: digilocker = fetched by rider-service and verified automatically; upload = the captain's file, reviewed by an admin (the selfie is checked server-side). }
        verified_by_actor: { type: string, description: '"auto" or the admin user id.' }
        verified_at: { type: string, format: date-time }
        media_id: { type: string, format: uuid }
        photo_media_id: { type: string, format: uuid, description: The DigiLocker document's photo (the DL photo the selfie is compared with). }
        auto_check_detail: { type: string, description: Why an automatic check verified, or left pending, the document. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OnboardingStatus:
      type: object
      required: [status, partner_status, pending, missing]
      properties:
        status:
          type: string
          enum: [approved, under_review, incomplete, blocked]
          description: under_review = a human is reviewing the documents in pending (uploaded by hand); incomplete = the documents in missing were never provided or were rejected.
        partner_status: { type: string, enum: [draft, pending_verification, approved, rejected, suspended, blocked, inactive] }
        pending: { type: array, items: { type: string }, description: Document kinds waiting for an admin (driving_license, profile_photo, vehicle_rc, ...). }
        missing: { type: array, items: { type: string } }
    SubscriptionCheckoutRequest:
      type: object
      required: [plan_code]
      properties:
        plan_code: { type: string, description: e.g. trial_7d, basic_199, plus_299 }
        method: { type: string, enum: [upi, card], description: Required for a paid plan; ignored for the trial. }
    SubscriptionCheckout:
      type: object
      required: [subscription_id, intent_id, amount_paise, currency, client_session, status]
      properties:
        subscription_id: { type: string, format: uuid }
        intent_id: { type: string, format: uuid, nullable: true, description: null for the trial. }
        amount_paise: { type: integer, format: int64 }
        currency: { type: string, enum: [INR] }
        client_session:
          allOf: [{ $ref: '#/components/schemas/ClientSession' }]
          nullable: true
          description: null for the trial, and on local/dev with the stub gateway.
        status: { type: string, enum: [pending_payment, trial], description: pending_payment until the signed capture activates the row. }
        expires_at: { type: string, format: date-time, description: The trial's end (trial only). }
    SubscriptionPaymentStatus:
      type: object
      required: [status, subscription_id, intent_id, amount_paise, expires_at, updated_at]
      properties:
        status:
          type: string
          enum: [pending, confirming, paid, failed]
          description: confirming = an intent is open and no signed capture was applied; paid = the payment.succeeded event was applied (nothing else produces it); failed = the captain checks out again.
        subscription_id: { type: string, format: uuid }
        intent_id: { type: string, format: uuid, nullable: true }
        amount_paise: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true, description: The paid period's end; null until paid. }
        updated_at: { type: string, format: date-time }
    FareWindowCreate:
      type: object
      required: [city_id, name, days_of_week, start_minute, end_minute, multiplier_bps]
      properties:
        city_id: { type: string, format: uuid }
        vehicle_type: { type: string, nullable: true, description: null applies to every vehicle type. }
        name: { type: string }
        days_of_week: { type: integer, minimum: 1, maximum: 127, description: Bitmask Mon=1 ... Sun=64. }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 0, maximum: 1440, description: Less than start_minute wraps past midnight. }
        multiplier_bps: { type: integer, format: int64, minimum: 10000, maximum: 30000 }
        priority: { type: integer }
        is_active: { type: boolean }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
    FareWindow:
      allOf:
        - $ref: '#/components/schemas/FareWindowCreate'
        - type: object
          required: [id, priority, is_active, effective_from, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
