{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "atpost-service.name" . }}
  labels:
    {{- include "atpost-service.labels" . | nindent 4 }}
spec:
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "atpost-service.selectorLabels" . | nindent 6 }}
    {{- if .Values.worker.enabled }}
    # Worker pods carry the same selector labels; without this the server's
    # budget counted them (lv-5). They have their own (worker-pdb.yaml).
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [worker]
    {{- end }}
{{- end }}
