{{- if .Values.worker.enabled }}
{{/*
Module 4 M4-P0-3 — the optional worker workload.

WHY THIS LIVES IN THE SHARED CHART

Only media-service needs a background worker today, but a dedicated media
chart would duplicate the ServiceAccount, ExternalSecret, labels and IRSA
wiring that every service already shares — four copies of the identity plumbing
that grants AWS access, which is the last thing worth duplicating.

The whole file is inside `if .Values.worker.enabled`, so a service that does not
opt in renders EXACTLY what it rendered before. That is asserted by a render
regression test rather than assumed.

WHY IT IS A SEPARATE DEPLOYMENT AND NOT A SECOND CONTAINER

The worker and the server fail, scale and roll independently. A transcode
backlog should scale the worker without adding HTTP replicas, and a crash-
looping worker must not take the API down with it. They also run different
images: the server image has no ffmpeg and does not contain the worker binary.

NO SERVICE, NO INGRESS, NO HPA BY DEFAULT

The worker takes no inbound traffic. Giving it a Service would publish an
endpoint nothing should call. Its /metrics port (worker.metrics) is scraped
through a PodMonitor, not a Service.

CLASSES (worker.variants, lv-4 / reels-4)

With worker.variants empty this renders ONE Deployment, <service>-worker, as
it always did. With entries it renders one Deployment per entry,
<service>-worker-<key>, from the same image: the worker block deep-merged with
the entry. media-service runs a short (reels) class and a long class this way,
each consuming only its own topic (MEDIA_TRANSCODE_CLASSES), so a reel never
shares CPU, scratch or a rollout with a multi-hour transcode.
*/}}
{{- range $w := include "atpost-service.workerList" . | fromYamlArray }}
{{- $v := $.Values.worker }}
{{- if $w.class }}
{{- $v = mergeOverwrite (deepCopy $.Values.worker) (deepCopy (index $.Values.worker.variants $w.class)) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- /* Distinct name so the Deployments cannot collide. */}}
  name: {{ $w.fullname }}
  labels:
    {{- include "atpost-service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    {{- if $w.class }}
    atpost.io/worker-class: {{ $w.class }}
    {{- end }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "atpost-service.workerSelectorLabels" (dict "root" $ "class" $w.class) | nindent 6 }}
      {{- /*
        The component label is part of the SELECTOR, not just metadata. Without
        it both Deployments would select the same pods and each would try to
        scale the other's replicas to its own count — a fight that looks like
        random pod churn. The class label does the same between worker classes.
      */}}
  strategy:
    {{- /*
      Recreate, not RollingUpdate. During a rolling update two generations of
      worker consume the same partitions; the consumer group rebalances twice
      and in-flight transcodes are abandoned mid-job. The worker is not
      latency-critical, so a brief gap is cheaper than duplicated media work.
    */}}
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "atpost-service.workerSelectorLabels" (dict "root" $ "class" $w.class) | nindent 8 }}
      annotations:
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* Same ServiceAccount, so the worker gets the SAME IRSA role as the
             service it belongs to and no broader AWS permission than that. */}}
      serviceAccountName: {{ include "atpost-service.serviceAccountName" $ }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      {{- /*
        ffmpeg writes multi-hundred-megabyte intermediates. The container
        filesystem is read-only and /tmp is an explicitly sized emptyDir, so a
        pathological input fills a bounded volume and kills one pod instead of
        filling the node's disk and evicting everything on it.
      */}}
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ $v.scratchSizeLimit }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $.Values.service.name }}-worker
          image: "{{ tpl $v.image.repository $ }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          {{- /* Optional: a worker binary shipped inside the server image
                 (dating-service's data-exporter). Unset renders nothing. */}}
          {{- with $v.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if $v.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ $v.metrics.port }}
              protocol: TCP
          {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          env:
            - name: TMPDIR
              value: /tmp
            {{- include "atpost-service.commonAndServiceEnv" $ | nindent 12 }}
            {{- if $v.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ $v.metrics.port | quote }}
            {{- end }}
            {{- /*
              REG-2: the pod's own grace period and scratch size, as the
              worker sees them (worker.limitsEnv; media-service only). The
              worker derives its SIGTERM drain window from
              MEDIA_WORKER_TERMINATION_GRACE_SECONDS (cmd/worker/drain.go:
              the grace minus a fifth, margin 5-60 s; 20 s when absent), so
              the drain always ends before the kubelet's SIGKILL. A key the
              worker env sets itself wins.
            */}}
            {{- if $v.limitsEnv }}
            {{- if not (hasKey $v.env "MEDIA_WORKER_TERMINATION_GRACE_SECONDS") }}
            - name: MEDIA_WORKER_TERMINATION_GRACE_SECONDS
              value: {{ int $v.terminationGracePeriodSeconds | quote }}
            {{- end }}
            {{- if not (hasKey $v.env "MEDIA_WORKER_SCRATCH_LIMIT_BYTES") }}
            - name: MEDIA_WORKER_SCRATCH_LIMIT_BYTES
              value: {{ include "atpost-service.quantityBytes" $v.scratchSizeLimit | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := $v.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- $ef := include "atpost-service.envFrom" $ }}
          {{- if $ef }}
          envFrom:
            {{- $ef | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- /*
            No readiness probe: the worker serves nothing, so readiness has no
            meaning and a probe would only add a way to be marked unready while
            working correctly. Liveness is opt-in because a naive one restarts
            a pod mid-transcode and guarantees the job never finishes.
          */}}
          {{- with $v.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
