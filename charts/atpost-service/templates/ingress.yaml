{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "atpost-service.name" . }}
  labels:
    {{- include "atpost-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if .backend }}
                {{- /* An ALB action instead of this service, e.g. the
                       bare-domain → app. redirect declared through an
                       alb.ingress.kubernetes.io/actions.<name> annotation:
                       backend: { serviceName: <name>, portName: use-annotation } */}}
                name: {{ .backend.serviceName }}
                port:
                  name: {{ .backend.portName | default "use-annotation" }}
                {{- else }}
                name: {{ include "atpost-service.name" $ }}
                port:
                  number: {{ $.Values.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
