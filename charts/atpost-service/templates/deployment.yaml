apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atpost-service.name" . }}
  labels:
    {{- include "atpost-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "atpost-service.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge one to allow zero-downtime rolling; never take more than
      # 25% offline at once. For 3-replica services that's ≤ 0 lost
      # capacity (rounded down) — fine, but bump to maxUnavailable: 1
      # for services with > 6 replicas to deploy faster.
      maxSurge: 1
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        {{- include "atpost-service.selectorLabels" . | nindent 8 }}
      annotations:
        # Re-rolls the pods when the externalSecret or any envFrom
        # secret changes. ArgoCD sets ConfigManagementPlugin or the
        # standard ESO controller emits events; we also annotate
        # with the image tag so rollback shows up cleanly in `kubectl
        # rollout history`.
        atpost.io/image-tag: {{ .Values.image.tag | quote }}
    spec:
      serviceAccountName: {{ include "atpost-service.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spread across AZs/nodes — avoids "all pods on one node, then
      # node OOMs" pattern. Best-effort (ScheduleAnyway) so initial
      # rollout doesn't block on a perfectly-balanced placement.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "atpost-service.selectorLabels" . | nindent 14 }}
      {{- if .Values.schemaDependencies }}
      # Cross-service schema ordering gate.
      #
      # A few services own tables that other services' migrations reference:
      # user-service owns `users`, media-service owns `media_assets`,
      # feed-service owns `user_preferences`. A service whose migrations touch
      # those cannot bootstrap until the owner has created them.
      #
      # Without this gate a fresh environment still CONVERGES — the dependent
      # service crash-loops until the owners finish — but it converges through
      # CrashLoopBackOff, which fires alarms and looks identical to a genuine
      # failure during every new-environment build. This turns "eventually
      # works, noisily" into "waits, quietly".
      #
      # It is a WAIT, not a migration runner: each service still owns and
      # applies its own schema. This only refuses to start the app container
      # until its declared parents exist, so no service ever creates another
      # service's tables.
      initContainers:
        - name: await-schema-dependencies
          image: {{ .Values.schemaDependencyImage | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              missing=""
              # Bounded: fail rather than hang forever, so a genuinely absent
              # owner surfaces as a pod failure with a named table instead of
              # an init container that waits until someone notices.
              deadline=$(( $(date +%s) + {{ .Values.schemaDependencyTimeoutSeconds }} ))
              while :; do
                missing=""
                for t in {{ join " " .Values.schemaDependencies }}; do
                  if ! psql "$POSTGRES_DSN" -tAc "SELECT to_regclass('$t') IS NOT NULL" 2>/dev/null | grep -q '^t$'; then
                    missing="$missing $t"
                  fi
                done
                [ -z "$missing" ] && break
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "timed out waiting for schema dependencies:$missing" >&2
                  echo "these tables are owned by other services; check they are deployed" >&2
                  exit 1
                fi
                echo "waiting for schema dependencies:$missing"
                sleep 5
              done
              echo "all schema dependencies present"
          envFrom:
            {{- range .Values.envFrom }}
            - {{ .kind }}Ref:
                name: {{ .name }}
            {{- end }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "atpost-service.name" . }}
            {{- end }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ tpl .Values.image.repository . }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # HTTP_PORT is wired from service.port so a port change is
            # a one-line override, not a two-line one.
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            {{- range .Values.envFrom }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if .Values.externalSecret.enabled }}
            # ESO mints a Secret named after the release; mount the
            # whole thing as env vars so secretKey names map to env
            # var names without extra wiring.
            - secretRef:
                name: {{ include "atpost-service.name" . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            # Run as a non-root UID. We pin runAsUser/runAsGroup (overridable
            # via .Values.securityContext) because the service images don't set
            # a USER, and runAsNonRoot=true alone + a root image makes the
            # kubelet refuse to start ("container has runAsNonRoot and image
            # will run as root"). Pinning the UID runs them non-root regardless.
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser | default 1000 }}
            runAsGroup: {{ .Values.securityContext.runAsGroup | default 1000 }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Empty-dir at /tmp because readOnlyRootFilesystem=true above
        # would otherwise break anything that writes a temp file.
        - name: tmp
          emptyDir: {}
